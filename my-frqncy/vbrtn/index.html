<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/my-frqncy/vbrtn/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VBRTN">
<meta name="theme-color" content="#0B1C3D">
<title>VBRTN · My FRQNCY</title>
<meta name="description" content="Your companion. Drawn from your design, your state, and what you said.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e18;
    --bg-card:#10162a;
    --bg-elev:#161d35;
    --ink:#f5f0e6;
    --ink-soft:#b9b3a3;
    --ink-dim:#7d7866;
    --gold:#C4973A;
    --gold-soft:#dcb15a;
    --gold-dim:#7a5d22;
    --rule:#1f2942;
    --r-md:14px;
    --t-fast:140ms ease;
    --t-slow:600ms cubic-bezier(.2,.6,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;display:flex;flex-direction:column}
  ::selection{background:var(--gold);color:var(--bg)}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-soft)}

  .shell{flex:1;max-width:620px;margin:0 auto;padding:32px 24px 80px;width:100%}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}
  .wordmark{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
  .topbar-nav{display:flex;gap:18px;font-size:12px;letter-spacing:.04em}
  .topbar-nav a{color:var(--ink-dim)}
  .topbar-nav a:hover{color:var(--gold)}

  /* ── morning open ────────────────────────────────────── */
  .morning{margin:48px 0 40px;text-align:center}
  .morning .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:16px;opacity:0;animation:fadeIn 800ms ease 200ms forwards}
  .morning h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:32px;line-height:1.3;color:var(--ink);margin:0;letter-spacing:-.005em;max-width:36ch;margin-left:auto;margin-right:auto;opacity:0;animation:fadeIn 800ms ease 500ms forwards}
  .morning .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--gold-soft);margin-top:18px;opacity:0;animation:fadeIn 800ms ease 1000ms forwards}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ── reflection input ────────────────────────────────── */
  .reflect{margin-bottom:40px;padding:24px;background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md)}
  .reflect .prompt{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--gold-soft);margin-bottom:12px}
  .reflect textarea{width:100%;background:transparent;border:none;color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.55;resize:vertical;min-height:60px;outline:none;padding:6px 0}
  .reflect textarea::placeholder{color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px}
  .reflect .actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
  .reflect .saved{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--gold);opacity:0;transition:opacity var(--t-slow)}
  .reflect .saved.in{opacity:1}
  .reflect .save-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 18px;border-radius:999px;font-size:13px;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:all var(--t-fast)}
  .reflect .save-btn:hover{background:var(--gold);color:var(--bg)}
  .reflect .save-btn:disabled{border-color:var(--rule);color:var(--ink-dim);cursor:not-allowed}

  /* ── companion thread ────────────────────────────────── */
  .thread{margin-bottom:40px;padding:22px;background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md)}
  .thread .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:16px}
  .thread-log{display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
  .msg{max-width:88%;line-height:1.55;animation:fadeIn 500ms ease forwards}
  .msg.user{align-self:flex-end;background:var(--bg-elev);border:1px solid var(--rule);color:var(--ink);padding:10px 14px;border-radius:14px 14px 4px 14px;font-size:14px;white-space:pre-wrap}
  .msg.vbrtn{align-self:flex-start;color:var(--gold-soft);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.5;white-space:pre-wrap}
  .msg.vbrtn.thinking{color:var(--ink-dim)}
  .thread-input{display:flex;gap:10px;align-items:flex-end;border-top:1px solid var(--rule);padding-top:14px}
  .thread-input textarea{flex:1;background:transparent;border:none;color:var(--ink);font-family:'Inter',sans-serif;font-size:15px;line-height:1.55;resize:none;min-height:24px;max-height:160px;outline:none;padding:4px 0}
  .thread-input textarea::placeholder{color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px}
  .thread-send{flex:none;background:transparent;border:1px solid var(--gold);color:var(--gold);width:40px;height:40px;border-radius:999px;font-size:17px;line-height:1;cursor:pointer;font-family:inherit;transition:all var(--t-fast)}
  .thread-send:hover{background:var(--gold);color:var(--bg)}
  .thread-send:disabled{border-color:var(--rule);color:var(--ink-dim);cursor:not-allowed}
  .thread-note{margin-top:12px;font-size:11px;color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px}
  .thread-privacy{margin-top:14px}
  .thread-privacy summary{cursor:pointer;list-style:none;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--ink-dim)}
  .thread-privacy summary::-webkit-details-marker{display:none}
  .thread-privacy summary .more{color:var(--gold-dim);text-decoration:underline;text-underline-offset:3px}
  .thread-privacy[open] summary .more{color:var(--gold)}
  .privacy-body{margin-top:12px;padding:16px;background:var(--bg-elev);border:1px solid var(--rule);border-radius:8px}
  .privacy-body p{font-size:13px;color:var(--ink-soft);margin:0 0 9px 0;line-height:1.55}
  .privacy-body p:last-child{margin-bottom:0}
  .privacy-body strong{color:var(--gold-soft);font-weight:500}

  /* ── recommendation trail ────────────────────────────── */
  .trail{margin-bottom:40px;padding:24px;background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md)}
  .trail .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .trail-intro{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;color:var(--gold-soft);margin:0 0 14px 0}
  .trail-item{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--rule)}
  .trail-item:hover .trail-name{color:var(--gold-soft)}
  .trail-kind{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
  .trail-name{display:block;color:var(--ink);font-size:16px;font-weight:500;transition:color var(--t-fast)}
  .trail-name .ext{color:var(--ink-dim);font-size:11px}
  .trail-why{display:block;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--ink-soft);margin-top:3px}
  .trail-more{margin-top:18px;background:transparent;border:1px solid var(--gold-dim);color:var(--gold-dim);padding:8px 16px;border-radius:999px;font-size:12px;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:all var(--t-fast)}
  .trail-more:hover{border-color:var(--gold);color:var(--gold)}
  .trail-empty{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--ink-dim);font-size:14px}

  /* ── modal-operator recovery ─────────────────────────── */
  .recovery{margin-bottom:40px;padding:24px;background:var(--bg-card);border:1px solid var(--gold-dim);border-radius:var(--r-md)}
  .recovery .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .recovery .echo{font-family:'Inter',sans-serif;font-size:14px;color:var(--ink-soft);margin-bottom:14px;padding:10px 14px;background:var(--bg-elev);border-left:2px solid var(--gold-dim);border-radius:0 4px 4px 0;line-height:1.5}
  .recovery .echo .quoted{color:var(--ink);font-style:italic}
  .recovery .question{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;line-height:1.45;color:var(--gold-soft);margin:0 0 14px 0}
  .recovery .rotate-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink-dim);letter-spacing:.06em}
  .recovery .rotate-btn{background:none;border:none;color:var(--gold-dim);font-size:11px;cursor:pointer;letter-spacing:.06em;font-family:inherit;text-decoration:underline;text-underline-offset:3px}
  .recovery .rotate-btn:hover{color:var(--gold)}

  /* ── what VBRTN sees ─────────────────────────────────── */
  .sees{margin-bottom:40px;padding:24px;background:transparent;border:1px solid var(--rule);border-radius:var(--r-md)}
  .sees .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .sees p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;line-height:1.55;color:var(--ink);margin:0 0 10px 0}
  .sees p:last-child{margin-bottom:0}

  /* ── room knows (stats) ──────────────────────────────── */
  .knows{margin-bottom:40px}
  .knows .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:18px;text-align:center}
  .knows-grid{display:grid;grid-template-columns:repeat(2, 1fr);gap:12px}
  .stat{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md);padding:18px}
  .stat .k{font-size:11px;letter-spacing:.06em;color:var(--ink-dim);text-transform:uppercase;margin-bottom:8px}
  .stat .v{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--gold);font-weight:500;line-height:1.1}
  .stat .v.small{font-size:18px;line-height:1.3}
  .stat .v.tiny{font-size:14px;font-family:'Inter',sans-serif;font-style:normal;color:var(--ink)}

  /* ── chart card ──────────────────────────────────────── */
  .chart{margin-bottom:40px;padding:24px;background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md)}
  .chart .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .chart dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
  .chart dt{font-size:11px;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase}
  .chart dd{margin:0 0 6px 0;font-size:14px;color:var(--ink)}
  .chart .note{margin-top:14px;font-size:12px;color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px}

  /* ── nav ─────────────────────────────────────────────── */
  .actions-row{display:flex;justify-content:center;gap:14px;margin-top:48px;flex-wrap:wrap}
  .btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:12px 24px;border-radius:999px;font-size:14px;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:all var(--t-fast);text-decoration:none;display:inline-block}
  .btn:hover{background:var(--gold);color:var(--bg)}
  .btn.primary{background:var(--gold);color:var(--bg)}
  .btn.primary:hover{background:var(--gold-soft)}
  .btn.ghost{border:none;color:var(--ink-dim)}
  .btn.ghost:hover{color:var(--gold);background:transparent}

  /* ── empty state ─────────────────────────────────────── */
  .empty{text-align:center;padding:80px 24px}
  .empty h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:34px;color:var(--ink);margin:0 0 16px 0;line-height:1.2}
  .empty p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:var(--gold-soft);line-height:1.55;max-width:42ch;margin:0 auto 32px}

  .foot{text-align:center;padding:40px 24px 24px;font-size:11px;color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.04em}
  .foot a{color:var(--gold-dim)}

  @media (max-width:480px){
    .shell{padding:24px 18px 60px}
    .morning h1{font-size:26px}
    .knows-grid{grid-template-columns:1fr}
  }

  /* Chat-first: the thread IS the surface. Everything else is reference,
     folded away until asked for. */
  .morning.compact{margin:0 0 14px;padding:0;border:none;background:none}
  .morning.compact h1{font-size:19px;line-height:1.4;margin:2px 0 0;font-weight:400}
  .morning.compact .sub{font-size:13px;margin-top:4px;opacity:.75}
  .thread .thread-log{min-height:52vh}
  .extras{margin-top:22px;border-top:1px solid var(--card-border,rgba(255,255,255,.08));padding-top:6px}
  .extras>summary{cursor:pointer;list-style:none;padding:12px 2px;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:8px}
  .extras>summary::-webkit-details-marker{display:none}
  .extras>summary::after{content:'\u2304';margin-left:auto;transition:transform .2s}
  .extras[open]>summary::after{transform:rotate(180deg)}
  .extras>summary:hover{color:var(--gold)}

  /* Sign in, inline — the installed app must never bounce you to a browser tab */
  .acct{display:flex;align-items:center;gap:10px}
  .acct-btn{background:transparent;border:1px solid var(--gold-dim,#5a4c2a);color:var(--gold,#d9c38a);
    font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
  .acct-btn:hover{background:rgba(217,195,138,.12)}
  .acct-who{font-size:11px;color:var(--ink-dim);max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet{position:fixed;inset:0;background:rgba(4,10,24,.86);display:flex;align-items:flex-end;
    justify-content:center;z-index:60;padding:0}
  .sheet-card{background:var(--card,#0f1b33);border:1px solid var(--card-border,rgba(255,255,255,.1));
    border-radius:14px 14px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));width:100%;max-width:520px}
  .sheet-card h2{font-family:'Cormorant Garamond',serif;font-size:22px;margin:0 0 4px;font-weight:400}
  .sheet-card p.lede{font-size:13px;color:var(--ink-dim);margin:0 0 16px;line-height:1.5}
  .sheet-card label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);margin:12px 0 5px}
  .sheet-card input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.04);
    border:1px solid var(--card-border,rgba(255,255,255,.14));border-radius:6px;color:var(--ink,#eef2f8);
    font:inherit;font-size:16px;padding:11px 12px}
  .sheet-card input:focus{outline:none;border-color:var(--gold-dim,#5a4c2a)}
  .sheet-actions{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap}
  .sheet-actions .btn{flex:1;min-width:120px;text-align:center;padding:11px 16px;font-size:14px}
  .sheet-msg{font-size:13px;margin-top:12px;line-height:1.5}
  .sheet-msg.err{color:#e8a0a0}
  .sheet-msg.ok{color:var(--gold-light,#d9c38a)}
  .sheet-alt{margin-top:14px;font-size:12px;color:var(--ink-dim);text-align:center}
  .sheet-alt button{background:none;border:none;color:var(--gold,#d9c38a);font:inherit;font-size:12px;
    text-decoration:underline;cursor:pointer;padding:0}

  /* Gene Keys spectrum in the design readout */
  .chart dt.gk-dt, .chart dd.gk-dd{grid-column:1 / -1}
  .chart dt.gk-dt{margin-top:6px}
  .gk-row{margin:0 0 7px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}
  .gk-row:last-child{margin-bottom:0}
  .gk-sphere{color:var(--gold-light,#d9c38a);white-space:nowrap}
  .gk-spec{opacity:.85}
  .gk-arrow{opacity:.5;padding:0 2px}

  /* A proposal VBRTN offers to the Sanctuary — never a silent write */
  .prop{border:1px solid var(--gold-dim,#5a4c2a);border-radius:3px;padding:12px 14px;margin:10px 0 4px;background:rgba(217,195,138,.05)}
  .prop-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:5px}
  .prop-title{font-style:italic;margin-bottom:10px;line-height:1.45}
  .prop-actions{display:flex;gap:8px;flex-wrap:wrap}
  .prop-btn{font:inherit;font-size:13px;padding:6px 13px;border-radius:3px;cursor:pointer;border:1px solid var(--gold-dim,#5a4c2a);background:transparent;color:inherit;transition:background .18s,border-color .18s}
  .prop-btn.yes{background:rgba(217,195,138,.14)}
  .prop-btn:hover{background:rgba(217,195,138,.22)}
  .prop-btn:disabled{opacity:.5;cursor:default}
  .prop-done{font-size:13px;opacity:.7;font-style:italic}

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
  }
</style>
<script src="/assets/frqncy-supabase.js"></script>
<script src="/assets/frqncy-vbrtn-store.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <!-- dynamic content -->
  </div>
  <footer class="foot">
    <div id="vbrtn-sync" style="margin-bottom:10px"></div>
    <a href="/my-frqncy/intake/">Intake</a> · <a href="/my-frqncy/dashboard/">Sanctuary</a>
  </footer>

<script>
(function(){
  'use strict';
  const STORE_KEY = 'frqncy:vbrtn:profile';
  const RECOVERY_ROTATION_KEY = 'frqncy:vbrtn:recoveryRotation';

  function loadProfile(){
    if(window.FRQNCYVbrtn) return window.FRQNCYVbrtn.load();
    try{
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveProfile(p){
    if(window.FRQNCYVbrtn){ window.FRQNCYVbrtn.save(p); return; }
    localStorage.setItem(STORE_KEY, JSON.stringify(p));
  }

  // The 64-key Gene Keys spectrum. Loaded as a module so the table lives in
  // exactly one place (my-frqncy/charts/gene-keys.js) instead of being copied
  // here and drifting. Until it resolves — and if it never does — every
  // consumer falls back to bare gate numbers rather than breaking.
  let GK = null;
  import('/my-frqncy/charts/gene-keys.js')
    .then(m => { GK = m; try{ paintGeneKeys(); }catch(e){} })
    .catch(() => {});

  // Send the spectrum, not just the gate number. A model handed "Life's Work 43"
  // and nothing else invents a Shadow for it, confidently; handed the names, it
  // speaks the person's actual keys.
  function resolvedGK(gk){
    if(!gk || gk._stub) return null;
    if(GK){
      const r = GK.resolveGeneKeys(gk);
      if(r) return r;
    }
    return { lifesWork:gk.lifesWork, evolution:gk.evolution, radiance:gk.radiance, purpose:gk.purpose };
  }

  function paintGeneKeys(){
    const cell = document.getElementById('gk-cell');
    if(!cell) return;
    const prof = loadProfile();
    const gk = prof && prof.design && prof.design.gk;
    if(!gk || gk._stub){ cell.textContent = '\u2014'; return; }
    const r = GK && GK.resolveGeneKeys(gk);
    if(!r){
      cell.textContent = [gk.lifesWork, gk.evolution, gk.radiance, gk.purpose].filter(v => v != null).join(' \u00b7 ');
      return;
    }
    cell.innerHTML = GK.SPHERES.filter(sp => r[sp.key]).map(sp => {
      const k = r[sp.key];
      return `<div class="gk-row"><span class="gk-sphere">${escapeHtml(k.label)} ${k.gate}</span> <span class="gk-spec">${escapeHtml(k.shadow)} <span class="gk-arrow">\u2192</span> ${escapeHtml(k.gift)} <span class="gk-arrow">\u2192</span> ${escapeHtml(k.siddhi)}</span></div>`;
    }).join('');
  }

  const shell = document.getElementById('shell');

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function cap(s){ if(!s) return s; return s[0].toUpperCase() + s.slice(1); }

  // ── Companion thread helpers ───────────────────────────
  // Privacy-safe slice sent to /api/companion. Stub design is dropped (never
  // feed random HD to the model); negative-trigger NAMES never leave the device.
  // Intake stores list answers as arrays and textarea answers as plain strings.
  // Everything downstream wants a list, so normalise here rather than at each use.
  function asList(v){
    if(Array.isArray(v)) return v.map(x => (x && typeof x === 'object') ? x.text : x).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim());
    if(typeof v === 'string' && v.trim()) return [v.trim()];
    return [];
  }

  // The Sanctuary holds the dream, the chief aims, the objectives and the
  // monthly goals. The companion is a coach — without these it is coaching
  // toward nothing. Read-only, compact, and it stays silent when empty.
  function sanctuaryGoals(){
    try{
      const raw = localStorage.getItem('frqncy.sanctuary.v1');
      if(!raw) return null;
      const s = JSON.parse(raw) || {};
      const clip = (v, n) => String(v == null ? '' : v).trim().slice(0, n);
      const aims = (Array.isArray(s.chiefAims) ? s.chiefAims : []).slice(0,3).map(a => {
        const name = clip(a && a.name, 120);
        if(!name) return null;
        const sc = (a && a.score) || {};
        return { name, current: typeof sc.current === 'number' ? sc.current : null,
                        target:  typeof sc.target  === 'number' ? sc.target  : null };
      }).filter(Boolean);
      const objectives = (Array.isArray(s.objectives) ? s.objectives : [])
        .slice(0,3).map(o => clip(o && o.title, 120)).filter(Boolean);
      const month = new Date().toISOString().slice(0,7);
      const thisMonth = (Array.isArray(s.goals) ? s.goals : [])
        .filter(g => g && g.month === month && !g.completed)
        .slice(0,5).map(g => clip(g.title, 120)).filter(Boolean);
      const dream = clip(s.dream, 300) || null;
      if(!dream && !aims.length && !objectives.length && !thisMonth.length) return null;
      return { dream, chiefAims: aims, objectives, thisMonth };
    }catch(e){ return null; }
  }

  function slimProfile(p){
    if(!p) return {};
    const hd = p.design && p.design.hd, gk = p.design && p.design.gk, astro = p.design && p.design.astro;
    const mo = (p.meta && p.meta.modalOperators) || {};
    const trig = p.triggers || {};
    return {
      rememberOne: p.rememberOne || null,
      goals: sanctuaryGoals(),
      hd:    (hd && hd.type && !hd._stub) ? { type:hd.type, strategy:hd.strategy, authority:hd.authority, profile:hd.profile } : null,
      gk:    resolvedGK(gk),
      astro: (astro && !astro._stub && astro.sun) ? { sun:astro.sun, moon:astro.moon, rising:astro.rising } : null,
      standing: {
        feeling: (p.standing && p.standing.recentFeeling) || null,
        texture: (p.standing && p.standing.texture) || null,
        desire:  (p.standing && p.standing.dominantDesire) || null,
        pull:    (p.standing && p.standing.pull) || null,
        threeYearTrue: (p.standing && p.standing.threeYearTrue) || null
      },
      meta: {
        toward_away: (p.meta && p.meta.toward_away) || null,
        internal_external: (p.meta && p.meta.internal_external) || null,
        options_procedures: (p.meta && p.meta.options_procedures) || null,
        general_specific: (p.meta && p.meta.general_specific) || null,
        sameness_difference: (p.meta && p.meta.sameness_difference) || null,
        convincer: (p.meta && p.meta.convincer) || null
      },
      modalOperators: {
        necessity:     asList(mo.necessity).slice(-3),
        impossibility: asList(mo.impossibility).slice(-3)
      },
      positiveTriggers: asList(trig.positive).slice(0, 5),
      music: asList(trig.music).slice(0, 5),
      place: trig.place || null,
      negativeTriggerCount: asList(trig.negative).length,
      baseline: {
        teachabilityIndex: (p.baseline && p.baseline.teachabilityIndex != null) ? p.baseline.teachabilityIndex : null,
        chiefAimDistance:  (p.baseline && p.baseline.chiefAimDistance != null) ? p.baseline.chiefAimDistance : null
      }
    };
  }

  // People write their remember-line as a whole sentence, punctuation and all.
  // Quote it rather than splicing it into ours, so it never double-punctuates.
  function asQuote(s){
    return String(s || '').trim().replace(/[.,;:!?\s]+$/, '');
  }

  function threadSeed(p){
    const r = asQuote(p.rememberOne), f = p.standing && p.standing.recentFeeling;
    if(r) return `You asked to be remembered as “${r}”. I'm here. What's moving in you right now?`;
    if(f) return `You've been carrying ${f}. I'm here, and I'm listening. Where do you want to begin?`;
    return `I'm here. Say what's true right now — one line, or many.`;
  }

  function getStoredThread(p){
    const inter = (p && p.history && p.history.interactions) || [];
    const out = [];
    inter.forEach(it => {
      if(it.kind === 'companion-user') out.push({ role:'user', content: it.text });
      else if(it.kind === 'companion-vbrtn') out.push({ role:'assistant', content: it.text });
    });
    return out.slice(-16);
  }

  // ── Recommendation trail (deterministic, traceable) ────
  const TRAIL_ROTATION_KEY = 'frqncy:vbrtn:trailRotation';
  let TRAIL_DATA = null;
  async function loadTrailData(){
    if(TRAIL_DATA) return TRAIL_DATA;
    const res = await fetch('./trail-data.json', { cache:'force-cache' });
    if(!res.ok) throw new Error('trail-data ' + res.status);
    TRAIL_DATA = await res.json();
    return TRAIL_DATA;
  }
  function getTrailRotation(){ const n = parseInt(localStorage.getItem(TRAIL_ROTATION_KEY) || '0', 10); return isNaN(n) ? 0 : n; }
  function setTrailRotation(n){ localStorage.setItem(TRAIL_ROTATION_KEY, String(n)); }

  function pickTrail(p, data, rot){
    const desire = (p.standing && p.standing.dominantDesire) || null;
    let candidates = (desire && data.desireMap[desire]) ? data.desireMap[desire].slice() : [];
    if(!candidates.length) candidates = Object.keys(data.topics);
    const books=[], musics=[], products=[], courses=[], topicCards=[];
    const seen = { b:new Set(), m:new Set(), p:new Set(), c:new Set() };
    candidates.forEach(slug => {
      const t = data.topics[slug];
      if(!t) return;
      topicCards.push({ slug, label:t.label, url:t.url });
      (t.books||[]).forEach(b => { if(!seen.b.has(b.name)){ seen.b.add(b.name); books.push(Object.assign({}, b, { topic:t.label })); } });
      (t.music||[]).forEach(m => { if(!seen.m.has(m.title)){ seen.m.add(m.title); musics.push(Object.assign({}, m, { topic:t.label })); } });
      (t.products||[]).forEach(pr => { if(!seen.p.has(pr.name)){ seen.p.add(pr.name); products.push(Object.assign({}, pr, { topic:t.label })); } });
      (t.courses||[]).forEach(c => { if(!seen.c.has(c.title)){ seen.c.add(c.title); courses.push(Object.assign({}, c, { topic:t.label })); } });
    });
    const at = (arr) => arr.length ? arr[rot % arr.length] : null;
    const candSet = new Set(candidates);
    const pref = data.practices.filter(pr => pr.topicSlug && candSet.has(pr.topicSlug));
    const practicePool = pref.length ? pref : data.practices;
    return {
      desire,
      topic: at(topicCards),
      practice: practicePool[rot % practicePool.length],
      book: at(books),
      music: at(musics),
      product: at(products),
      course: at(courses)
    };
  }

  function paintTrail(el, t){
    const desire = t.desire;
    const rows = [];
    const row = (kind, name, url, why, ext) => {
      if(!name) return;
      const target = ext ? ' target="_blank" rel="noopener"' : '';
      rows.push(`<a class="trail-item" href="${escapeHtml(url || '#')}"${target}>
        <span class="trail-kind">${escapeHtml(kind)}</span>
        <span class="trail-name">${escapeHtml(name)}${ext ? ' <span class="ext">↗</span>' : ''}</span>
        <span class="trail-why">${escapeHtml(why)}</span></a>`);
    };
    if(t.topic)    row('Where it lives', t.topic.label, t.topic.url, desire ? `Because you're reaching toward ${desire}. This is where it lives on FRQNCY.` : 'A place to begin on FRQNCY.', false);
    if(t.practice) row('A practice', t.practice.label, `/my-frqncy/practice/?practice=${encodeURIComponent(t.practice.slug)}`, t.practice.framing, false);
    if(t.book)     row('One book', t.book.name, t.book.url, `Shelved under ${t.book.topic}.`, !!t.book.external);
    if(t.music)    row('One piece of music', t.music.title, t.music.url, `${t.music.artist} — for ${t.music.topic}.`, true);
    if(t.product)  row('Something aligned', t.product.name, t.product.url, t.product.desc || `Aligned with ${t.product.topic}.`, !!t.product.external);
    if(t.course)   row('A course', t.course.title, t.course.url, `${t.course.free ? 'Free' : 'Member'} — in ${t.course.topic}.`, false);
    const intro = desire
      ? `For where you are — reaching toward ${escapeHtml(desire)}. One of each. Always one.`
      : `One of each, for where you are. Always one.`;
    el.innerHTML = `<div class="label">A trail VBRTN hands you</div>
      <p class="trail-intro">${intro}</p>
      ${rows.join('') || '<p class="trail-empty">Your trail fills in as your intake deepens.</p>'}
      <button class="trail-more" id="trailMore" type="button">Hand me another →</button>`;
    const more = document.getElementById('trailMore');
    if(more) more.addEventListener('click', ()=>{ setTrailRotation(getTrailRotation() + 1); renderTrail(loadProfile()); });
  }

  async function renderTrail(p){
    const el = document.getElementById('trailSection');
    if(!el || !p) return;
    let data;
    try{ data = await loadTrailData(); }
    catch(e){
      el.innerHTML = '<div class="label">A trail VBRTN hands you</div><p class="trail-empty">Your trail appears on the live site.</p>';
      return;
    }
    paintTrail(el, pickTrail(p, data, getTrailRotation()));
  }

  // ── Morning open generator ─────────────────────────────
  function generateMorningOpen(p){
    const hd = p.design?.hd;
    const feeling = p.standing?.recentFeeling;
    const desire = p.standing?.dominantDesire;
    const texture = p.standing?.texture;

    // Tier 1 — Design-aware (if HD type present)
    if(hd?.type){
      const designPrompts = {
        'Generator': [
          'What are you responding to today?',
          'Notice what your body says yes to before noon. Follow that.',
          'You are designed to wait, then move. What just arrived in front of you?'
        ],
        'Manifesting Generator': [
          'What are you responding to — and who needs to know your next move?',
          'Two engines today. Respond first, then inform.',
          'You will want to skip steps. The skipped step is where you go back for resistance.'
        ],
        'Projector': [
          'Who saw you yesterday? That is the room to be in today.',
          'Wait for the invitation. The invitation is closer than it looks.',
          'You see the others; today, let one of them see you back.'
        ],
        'Manifestor': [
          'What needs to be initiated this morning?',
          'Inform the people who will be affected. Then move.',
          'Your anger is information. Read it before you act on it.'
        ],
        'Reflector': [
          'What does the room feel like today? You are the room\'s instrument.',
          'No decisions today that cannot wait twenty-eight days.',
          'Watch the moon. Watch yourself in it.'
        ]
      };
      const arr = designPrompts[hd.type] || designPrompts['Generator'];
      // Deterministic pick — same prompt for same day
      const dayKey = new Date().toDateString();
      const idx = simpleHash(dayKey + hd.type) % arr.length;
      return { primary: arr[idx], sub: subForState(feeling, desire) };
    }

    // Tier 2 — State-aware (feeling + desire, no HD)
    if(feeling || desire){
      const primary = feeling
        ? feelingToMorningLine(feeling)
        : `You are reaching for more ${desire}. The first move today is a small one in that direction.`;
      return { primary, sub: desire && feeling ? `And: more ${desire}.` : null };
    }

    // Tier 3 — Texture-only
    if(texture){
      return { primary: textureToMorningLine(texture), sub: null };
    }

    return { primary: 'Begin where you are. Not where you should be.', sub: null };
  }

  function subForState(feeling, desire){
    if(feeling && desire) return `Carrying ${feeling}. Reaching for ${desire}.`;
    if(feeling) return `Today you are carrying ${feeling}. Notice it; do not argue with it.`;
    if(desire) return `Reaching for more ${desire}.`;
    return null;
  }

  function feelingToMorningLine(f){
    const lines = {
      tired: 'Tired is data. Today, the first move is to rest something you are not consciously carrying.',
      stressed: 'Stress is the body running ahead of itself. Slow the body first. The mind follows.',
      anxious: 'Anxiety is the body knowing something the mind has not yet named. Name one thing today.',
      overwhelmed: 'Overwhelm means inputs outran capacity. Cut one input today. That is the entire move.',
      sad: 'Sadness is grief that has not been formally introduced. Today, introduce it.',
      lonely: 'Loneliness is the body asking for a specific kind of contact. Notice which kind, before deciding what to do.',
      frustrated: 'Frustration is the body saying something is asking to be responded to, not initiated. What are you trying to start that needs you to wait?',
      angry: 'Anger is power that has not yet found its direction. Today, find the direction.',
      numb: 'Numb is the body saying "too much, too fast." Slow down. Today is small.',
      restless: 'Restless is asking. What is it asking for?',
      hopeful: 'Hope is unfinished — by design. What is the next finished thing?',
      curious: 'Curiosity pulls without pushing. Follow it for one move today.',
      excited: 'Excitement is desire that has not been disciplined. Both halves matter today.',
      grateful: 'Gratitude is the first frequency above survival. Notice you arrived there.',
      content: 'Content is rare. Stay in it longer than your mind wants to.',
      peaceful: 'Peace is rarely loud. The fact that you notice it is the proof.',
      alive: 'Alive is the baseline. What follows has to live up to it.'
    };
    return lines[f] || 'You are carrying something. The first move is to name it.';
  }

  function textureToMorningLine(t){
    const lines = {
      stride: 'You are in stride. Do not over-control it.',
      building: 'Slow building is the real kind. Today is one brick.',
      holding: 'You are holding it together. That is the work. Notice it.',
      surviving: 'Just getting through is its own strength. Today is small. That is enough.',
      'catching-breath': 'Today is for breath. The work asks for nothing.',
      restart: 'Starting over is choosing the form again. What are you choosing?',
      searching: 'Looking means you have not given up. Today, look in one specific place.',
      returning: 'Coming back is the one motion the door does not lock against.'
    };
    return lines[t] || 'Begin where you are.';
  }

  function simpleHash(s){
    let h = 0;
    for(let i=0;i<s.length;i++){ h = ((h<<5)-h) + s.charCodeAt(i); h |= 0; }
    return Math.abs(h);
  }

  // ── Insights derivation ───────────────────────────────
  function deriveInsights(p){
    const lines = [];
    const texture = p.standing?.texture;
    const feeling = p.standing?.recentFeeling;
    const desire = p.standing?.dominantDesire;

    if(texture && feeling){
      lines.push(`A person ${textureVerb(texture)}, whose recent state has been mostly ${feeling}.`);
    } else if(texture){
      lines.push(`A person ${textureVerb(texture)}.`);
    }
    if(desire) lines.push(`Reaching toward more ${desire}.`);
    if(p.design?.hd?.type && p.design.hd.strategy) lines.push(`A ${p.design.hd.type} by design — strategy: ${String(p.design.hd.strategy).toLowerCase()}.`);
    if(p.meta?.toward_away){
      const t = p.meta.toward_away === 'toward' ? 'reaches toward what it wants'
              : p.meta.toward_away === 'away' ? 'moves away from what it does not want'
              : 'paces between the two';
      lines.push(`Whose mind ${t}.`);
    }
    const doors = asList(p.triggers && p.triggers.positive);
    if(doors.length > 0){
      lines.push(`Doors back to self: ${doors.slice(0,2).join(', ').toLowerCase()}.`);
    }
    if(p.rememberOne) lines.push(`Asked to be remembered as: ${p.rememberOne}`);
    return lines.slice(0, 4);
  }

  function textureVerb(t){
    return {
      stride:'hitting their stride',
      building:'slowly building',
      holding:'holding it together',
      surviving:'just getting through',
      'catching-breath':'catching their breath',
      restart:'starting over',
      searching:'looking for what is next',
      returning:'coming back to themselves'
    }[t] || t;
  }

  // ── Modal-operator recovery ───────────────────────────
  const RECOVERY_NECESSITY = [
    { stem: 'What would happen if you did not?', frame: 'Recover the consequence.' },
    { stem: 'What would you choose if you were not supposed to?', frame: 'Shift from necessity to possibility.' },
    { stem: 'Whose voice is the "have to" in?', frame: 'Recover the locus of authority.' }
  ];
  const RECOVERY_IMPOSSIBILITY = [
    { stem: 'What stops you?', frame: 'Surface the specific constraint.' },
    { stem: 'What would happen if you did?', frame: 'Surface the feared consequence.' },
    { stem: 'What would have to be true for you to be able to?', frame: 'Open the conditions.' }
  ];

  function getRecoveryRotation(){
    try{ return JSON.parse(localStorage.getItem(RECOVERY_ROTATION_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function setRecoveryRotation(obj){ localStorage.setItem(RECOVERY_ROTATION_KEY, JSON.stringify(obj)); }

  function getCurrentRecovery(p){
    const nec = p.meta?.modalOperators?.necessity?.[0]?.text;
    const imp = p.meta?.modalOperators?.impossibility?.[0]?.text;
    if(!nec && !imp) return null;

    const rot = getRecoveryRotation();
    // Alternate: if both exist, pick the one that hasn't been rotated as much
    let kind;
    if(nec && imp){
      kind = (rot.lastKind === 'necessity') ? 'impossibility' : 'necessity';
    } else if(nec){
      kind = 'necessity';
    } else {
      kind = 'impossibility';
    }
    const arr = kind === 'necessity' ? RECOVERY_NECESSITY : RECOVERY_IMPOSSIBILITY;
    const idx = (rot[kind] || 0) % arr.length;
    const sentence = kind === 'necessity' ? nec : imp;
    return { kind, sentence, prompt: arr[idx].stem, frame: arr[idx].frame, idx };
  }

  function rotateRecovery(currentKind, currentIdx){
    const arr = currentKind === 'necessity' ? RECOVERY_NECESSITY : RECOVERY_IMPOSSIBILITY;
    const rot = getRecoveryRotation();
    rot[currentKind] = (currentIdx + 1) % arr.length;
    rot.lastKind = currentKind;
    setRecoveryRotation(rot);
    renderAll(loadProfile());
  }

  // ── Renderers ─────────────────────────────────────────

      renderEmpty();
      return;

    const morn = generateMorningOpen(p);
    const insights = deriveInsights(p);
    const recovery = getCurrentRecovery(p);

    const hd = p.design?.hd;
    const ti = p.baseline?.teachabilityIndex;
    const dist = p.baseline?.chiefAimDistance;
    const remember = p.rememberOne;

    let html = `

    if(ti != null) stats.push({ k:'Teachability', v: ti + ' / 100', small:false });
    if(dist != null) stats.push({ k:'Distance from the life you want', v: dist + ' / 10', small:false });

          <div class="label">The room knows</div>

      extra += `

          <div class="label">You asked the companion to remember</div>
          <p>${escapeHtml(remember)}</p>

    extra += `
      <div class="actions-row">
        <a class="btn primary" href="/my-frqncy/dashboard/">Open the Sanctuary →</a>
        <a class="btn ghost" href="/my-frqncy/intake/">Update intake</a>
      </div>
    `;
    if(extra){
      html += `<details class="extras"><summary>What VBRTN is working with</summary>${extra}</details>`;
    }

    shell.innerHTML = html;
    paintGeneKeys();
    acctInit();

    // ── Wire the companion thread ──────────────────────────
    const log = document.getElementById('threadLog');
    const inp = document.getElementById('threadInput');
    const sendBtn = document.getElementById('threadSend');

    const stored = getStoredThread(p);              // prior conversation, if any
    const seed = stored.length ? null : threadSeed(p);
    let sending = false;

    function addBubble(kind, text, opts){
      const div = document.createElement('div');
      div.className = 'msg ' + (kind === 'user' ? 'user' : 'vbrtn') + (opts && opts.thinking ? ' thinking' : '');
      div.textContent = text;
      log.appendChild(div);
      div.scrollIntoView({ block:'end', behavior:'smooth' });
      return div;
    }
    function autosize(){ inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 160) + 'px'; }

    if(seed) addBubble('vbrtn', seed);
    stored.forEach(m => addBubble(m.role === 'user' ? 'user' : 'vbrtn', m.content));

    inp.addEventListener('input', ()=>{ sendBtn.disabled = inp.value.trim().length === 0 || sending; autosize(); });
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if(!sendBtn.disabled) send(); }
    });
    sendBtn.addEventListener('click', send);

    // ── Chat → Sanctuary ────────────────────────────────────────
    // VBRTN could read the goals it was coaching toward but never update them,
    // so anything committed in conversation had to be re-typed by hand into a
    // second surface. Now it PROPOSES and the person taps to accept.
    //
    // It never writes on its own. An agent that silently edits your goals is a
    // manager, not a mirror — and a goal you did not choose is not yours.

    const uid = (pre) => pre + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    // Local date parts, matching the Sanctuary's own dateISO() — toISOString()
    // is UTC and would file an evening entry under tomorrow for anyone east of
    // Greenwich, which is where Orlando is.
    function dayNow(){
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    const monthNow = () => dayNow().slice(0,7);

    // Read-modify-write against whichever store is authoritative.
    // A signed-in person's Sanctuary lives in the cloud and the dashboard adopts
    // cloud state on load, so a localStorage-only write would silently vanish
    // the next time they opened it. Write both, cloud first for truth.
    async function sanctuaryWrite(mutate){
      let cloud = null;
      try{
        if(window.frqncy){
          await window.frqncy.ready;
          const user = await window.frqncy.auth.getUser();
          if(user) cloud = window.frqncy.sanctuaryStore(user);
        }
      }catch(e){ cloud = null; }

      let st = null;
      if(cloud){ try{ st = await cloud.getState(); }catch(e){ st = null; } }
      if(!st){
        try{ const raw = localStorage.getItem('frqncy.sanctuary.v1'); st = raw ? JSON.parse(raw) : null; }
        catch(e){ st = null; }
      }
      if(!st || typeof st !== 'object') st = {};
      if(!Array.isArray(st.goals))      st.goals = [];
      if(!Array.isArray(st.chiefAims))  st.chiefAims = [];
      if(!Array.isArray(st.objectives)) st.objectives = [];

      if(!mutate(st)) return false;

      try{ localStorage.setItem('frqncy.sanctuary.v1', JSON.stringify(st)); }catch(e){}
      if(cloud){ try{ await cloud.setState(st); }catch(e){ /* local write still stands */ } }
      return true;
    }

    function applyProposal(pr){
      return sanctuaryWrite(st => {
        if(pr.type === 'goal_add'){
          const month = monthNow();
          if(st.goals.some(g => g && g.title === pr.title && g.month === month)) return false;
          st.goals.push({ id: uid('goal'), objectiveId: null, title: pr.title,
                          month, completed: false, completedDate: null });
          return true;
        }
        if(pr.type === 'goal_complete'){
          const month = monthNow();
          const g = st.goals.find(x => x && x.title === pr.title && x.month === month && !x.completed);
          if(!g) return false;
          g.completed = true;
          g.completedDate = dayNow();
          return true;
        }
        if(pr.type === 'aim_progress'){
          const a = st.chiefAims.find(x => x && x.name === pr.name);
          if(!a) return false;
          if(!a.score || typeof a.score !== 'object') a.score = { current: null, target: null, history: [] };
          if(!Array.isArray(a.score.history)) a.score.history = [];
          a.score.history.push({ date: dayNow(), value: pr.current });
          a.score.current = pr.current;
          return true;
        }
        return false;
      });
    }

    function proposalCopy(pr){
      if(pr.type === 'goal_add')      return { label: 'Add to this month', body: pr.title, yes: 'Add it' };
      if(pr.type === 'goal_complete') return { label: 'Mark as done',      body: pr.title, yes: 'Mark done' };
      if(pr.type === 'aim_progress')  return { label: 'Update your score',
        body: pr.name + ' — ' + pr.current + (pr.target != null ? ' of ' + pr.target : ''), yes: 'Update' };
      return null;
    }

    function renderProposals(list){
      list.forEach(pr => {
        const copy = proposalCopy(pr);
        if(!copy) return;
        const card = document.createElement('div');
        card.className = 'prop';
        card.innerHTML = '<div class="prop-label">' + escapeHtml(copy.label) + '</div>' +
                         '<div class="prop-title">' + escapeHtml(copy.body) + '</div>' +
                         '<div class="prop-actions"></div>';
        const actions = card.querySelector('.prop-actions');
        const yes = document.createElement('button');
        yes.type = 'button'; yes.className = 'prop-btn yes'; yes.textContent = copy.yes;
        const no = document.createElement('button');
        no.type = 'button'; no.className = 'prop-btn'; no.textContent = 'Not now';
        actions.append(yes, no);

        yes.addEventListener('click', async () => {
          yes.disabled = true; no.disabled = true;
          const done = await applyProposal(pr);
          actions.innerHTML = '';
          const said = document.createElement('span');
          said.className = 'prop-done';
          said.textContent = done ? 'In your Sanctuary.' : 'It was already there.';
          actions.appendChild(said);
        });
        // "Not now" leaves no trace and no nagging — no badge, no backlog.
        no.addEventListener('click', () => { card.remove(); });

        log.appendChild(card);
        card.scrollIntoView({ block:'end', behavior:'smooth' });
      });
    }

    // Cheap client-side gate before spending a model call: either there is
    // something trackable to complete, or the sentence sounds like a commitment.
    const COMMIT_RE = /\b(i'?ll|i will|i'?m going to|i am going to|going to|i want to|i need to|tomorrow|tonight|this week|next week|by (?:mon|tue|wed|thu|fri|sat|sun)|finished|i'?ve done|i did|done|completed|shipped|wrote|launched)\b/i;

    async function maybeProposeSanctuary(userText, replyText){
      const goals = sanctuaryGoals();
      if(!goals && !COMMIT_RE.test(userText)) return;
      if(goals && !COMMIT_RE.test(userText)) return;
      try{
        const res = await fetch('/api/sanctuary-extract', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({
            messages: [{ role:'user', content:userText }, { role:'assistant', content:replyText }],
            goals: goals || {}
          })
        });
        const data = await res.json().catch(() => null);
        const list = data && Array.isArray(data.proposals) ? data.proposals : [];
        if(list.length) renderProposals(list);
      }catch(e){
        // Silent. The conversation matters more than the bookkeeping.
      }
    }

    async function send(){
      const text = inp.value.trim();
      if(!text || sending) return;
      sending = true; sendBtn.disabled = true;
      inp.value = ''; autosize();
      addBubble('user', text);

      // Persist the user turn + scan for modal operators (feeds the recovery card)
      const profile = loadProfile() || p;
      if(!profile.history) profile.history = { interactions: [], lastSeen:null, journalEntries:[], habitShape:{} };
      if(!profile.history.interactions) profile.history.interactions = [];
      profile.history.interactions.push({ at: Date.now(), kind:'companion-user', text });
      profile.history.lastSeen = Date.now();
      const detected = detectModalOperators(text);
      if(detected.length){
        if(!profile.meta) profile.meta = { modalOperators:{ necessity:[], impossibility:[] } };
        if(!profile.meta.modalOperators) profile.meta.modalOperators = { necessity:[], impossibility:[] };
        detected.forEach(d => {
          const mo = profile.meta.modalOperators;
          if(!Array.isArray(mo[d.kind])) mo[d.kind] = asList(mo[d.kind]).map(t => ({ text:t }));
          mo[d.kind].push({ text:d.match, at:Date.now(), source:'companion' });
        });
      }
      saveProfile(profile);

      // Payload: opener (only on a fresh thread) + prior turns + this turn
      const payload = [];
      if(seed && !stored.length) payload.push({ role:'assistant', content: seed });
      stored.forEach(m => payload.push({ role: m.role, content: m.content }));
      payload.push({ role:'user', content: text });

      const thinking = addBubble('vbrtn', '…', { thinking:true });
      try{
        const res = await fetch('/api/companion', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ profile: slimProfile(profile), messages: payload })
        });
        const data = await res.json().catch(()=>null);
        thinking.remove();
        const reply = data && data.response ? data.response : null;
        stored.push({ role:'user', content: text });
        if(reply){
          addBubble('vbrtn', reply);
          stored.push({ role:'assistant', content: reply });
          const pr = loadProfile() || profile;
          if(!pr.history) pr.history = { interactions: [] };
          if(!pr.history.interactions) pr.history.interactions = [];
          pr.history.interactions.push({ at: Date.now(), kind:'companion-vbrtn', text: reply });
          saveProfile(pr);
          maybeProposeSanctuary(text, reply);
        } else {
          addBubble('vbrtn', 'I went quiet for a moment. Say it once more?');
        }
      }catch(err){
        thinking.remove();
        stored.push({ role:'user', content: text });
        addBubble('vbrtn', "I can't reach you from here — this surface needs to be online. Open it on the live site (not from a file). Your words are saved.");
      }finally{
        sending = false;
        sendBtn.disabled = inp.value.trim().length === 0;
        inp.focus();
      }
    }

    // Render the recommendation trail (async — fills the placeholder)
    renderTrail(p);

    // Wire recovery rotation
    if(recovery){
      const rotateBtn = document.getElementById('rotateBtn');
      if(rotateBtn){
        rotateBtn.addEventListener('click', ()=> rotateRecovery(recovery.kind, recovery.idx));
      }
    }
  }

  function detectModalOperators(text){
    const found = [];
    const lower = text.toLowerCase();
    const necessityPatterns = [
      { re: /\bi\s+have\s+to\s+([^.,!?\n]+)/i, marker: 'I have to' },
      { re: /\bi\s+should\s+([^.,!?\n]+)/i, marker: 'I should' },
      { re: /\bi\s+must\s+([^.,!?\n]+)/i, marker: 'I must' },
      { re: /\bi\s+need\s+to\s+([^.,!?\n]+)/i, marker: 'I need to' },
      { re: /\bi\s+ought\s+to\s+([^.,!?\n]+)/i, marker: 'I ought to' }
    ];
    const impossibilityPatterns = [
      { re: /\bi\s+can'?t\s+([^.,!?\n]+)/i, marker: "I can't" },
      { re: /\bi\s+cannot\s+([^.,!?\n]+)/i, marker: 'I cannot' },
      { re: /\bi\s+won'?t\s+([^.,!?\n]+)/i, marker: "I won't" },
      { re: /\bi\s+couldn'?t\s+([^.,!?\n]+)/i, marker: "I couldn't" }
    ];
    necessityPatterns.forEach(p => {
      const m = text.match(p.re);
      if(m) found.push({ kind:'necessity', marker:p.marker, match: m[0].trim() });
    });
    impossibilityPatterns.forEach(p => {
      const m = text.match(p.re);
      if(m) found.push({ kind:'impossibility', marker:p.marker, match: m[0].trim() });
    });
    return found;
  }

  function renderEmpty(){
    shell.innerHTML = `
      <div class="topbar">
        <div class="wordmark">VBRTN</div>
      </div>
      <div class="empty">
        <h1>The companion does not yet know you.</h1>
        <p>VBRTN reads your intake to begin. About twelve minutes — twenty-five questions across three short sessions you can leave anytime.</p>
        <a class="btn primary" href="/my-frqncy/intake/">Begin the intake →</a>
      </div>
    `;
  }

  // ── Boot ─────────────────────────────────────────────
  renderAll(loadProfile());
  // Re-render when a cloud profile arrives after sign-in (e.g. a fresh device).
  // ── Signing in, without leaving the room ──────────────────────────
  // The intake lives in localStorage on whatever device answered it, so on a
  // second device VBRTN meets a stranger. Signing in is what carries the profile
  // across — the store already mirrors to the cloud and merges newest-wins; what
  // was missing was any way to sign in from here.
  //
  // It is a sheet on this page rather than a link to /social/login/ on purpose:
  // the installed app is scoped to /my-frqncy/, so sending someone to /social/
  // would bounce them out of the app into a browser tab mid-task.
  function acctRender(user){
    const slot = document.getElementById('acctSlot');
    if(!slot) return;
    slot.innerHTML = '';
    if(user){
      const who = document.createElement('span');
      who.className = 'acct-who';
      who.textContent = user.email || 'signed in';
      const out = document.createElement('button');
      out.type='button'; out.className='acct-btn'; out.textContent='Sign out';
      out.addEventListener('click', async () => {
        try{ await window.frqncy.auth.signOut(); }catch(e){}
        acctRender(null);
      });
      slot.append(who, out);
    } else {
      const b = document.createElement('button');
      b.type='button'; b.className='acct-btn'; b.textContent='Sign in';
      b.addEventListener('click', openSignIn);
      slot.appendChild(b);
    }
  }

  function openSignIn(){
    if(document.getElementById('vbrtnSheet')) return;
    const wrap = document.createElement('div');
    wrap.className = 'sheet'; wrap.id = 'vbrtnSheet';
    wrap.innerHTML = `
      <div class="sheet-card" role="dialog" aria-modal="true" aria-label="Sign in">
        <h2>Bring your profile with you</h2>
        <p class="lede">Your intake lives on the device that answered it. Sign in and it follows you — this phone, your laptop, the same conversation.</p>
        <label for="acEmail">Email</label>
        <input id="acEmail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com">
        <label for="acPass">Password</label>
        <input id="acPass" type="password" autocomplete="current-password" placeholder="Your password">
        <div class="sheet-actions">
          <button class="btn primary" id="acGo" type="button">Sign in</button>
          <button class="btn ghost" id="acClose" type="button">Not now</button>
        </div>
        <div class="sheet-msg" id="acMsg"></div>
        <div class="sheet-alt">No password, or forgotten it? <button id="acMagic" type="button">Email me a sign-in link</button></div>
      </div>`;
    document.body.appendChild(wrap);
    const email = wrap.querySelector('#acEmail');
    const pass  = wrap.querySelector('#acPass');
    const msg   = wrap.querySelector('#acMsg');
    const go    = wrap.querySelector('#acGo');
    const close = () => wrap.remove();
    const say = (t, cls) => { msg.className = 'sheet-msg ' + (cls||''); msg.textContent = t; };

    wrap.querySelector('#acClose').addEventListener('click', close);
    wrap.addEventListener('click', (e) => { if(e.target === wrap) close(); });

    if(!window.frqncy){
      say('This surface needs to be online to sign in. Your profile is safe on this device either way.', 'err');
      go.disabled = true;
    }

    go.addEventListener('click', async () => {
      const em = (email.value||'').trim(), pw = pass.value||'';
      if(!em || !pw){ say('Both fields, then.', 'err'); return; }
      go.disabled = true; say('Signing in…');
      try{
        await window.frqncy.ready;
        const r = await window.frqncy.auth.signIn({ email: em, password: pw });
        if(r && r.error) throw new Error(r.error.message || 'Sign in failed');
        say('Signed in. Pulling your profile…', 'ok');
        // The store attaches on the auth event, merges newest-wins, then fires
        // onSync -> renderAll. Close once that has had a moment to land.
        setTimeout(() => { close(); acctRender({ email: em }); }, 1400);
      }catch(err){
        go.disabled = false;
        say((err && err.message) ? err.message : 'That did not work. Check the address and password.', 'err');
      }
    });

    wrap.querySelector('#acMagic').addEventListener('click', async () => {
      const em = (email.value||'').trim();
      if(!em){ say('Put your email in first and I will send the link there.', 'err'); return; }
      try{
        await window.frqncy.ready;
        const r = await window.frqncy.auth.signInMagic(em);
        if(r && r.error) throw new Error(r.error.message || 'Could not send it');
        say('Sent. Open the link on THIS phone so it signs in here.', 'ok');
      }catch(err){
        say((err && err.message) ? err.message : 'Could not send the link.', 'err');
      }
    });

    setTimeout(() => email.focus(), 60);
  }

  // Paint the account control on first render and whenever auth changes.
  function acctInit(){
    acctRender(null);
    if(!window.frqncy) return;
    window.frqncy.ready
      .then(() => window.frqncy.auth.getUser())
      .then(u => acctRender(u))
      .catch(() => {});
    if(typeof window.frqncy.onAuth === 'function'){
      window.frqncy.onAuth((u) => { acctRender(u); });
    }
  }

  if(window.FRQNCYVbrtn) window.FRQNCYVbrtn.onSync(function(){ renderAll(loadProfile()); acctInit(); });
})();
</script>
</body>
</html>
