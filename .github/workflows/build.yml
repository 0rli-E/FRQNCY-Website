name: Build site

# Triggers on any content or generator change
on:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'people.json'
      - 'books.json'
      - 'orgs.json'
      - 'media.json'
      - 'places.json'
      - 'generate.js'
      - 'build-kb.js'
      - 'build-og.js'

# Needed so the bot commit + push step can write back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full-depth checkout so the bot can commit + push without shallow-clone issues
          fetch-depth: 0
          # Use the built-in token (now with write permissions from the block above)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp for OG image generation
        run: npm install sharp

      - name: Rebuild AI knowledge base
        run: node build-kb.js

      - name: Generate OG images
        run: node build-og.js

      - name: Rebuild v2 pages
        run: node generate.js

      - name: Commit all generated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include everything generate.js regenerates from the beds so the
          # committed tree matches what the generator produces.
          git add v2/ people/ books/ orgs/ media/ places/ \
                  functions/api/_kb.js sitemap.xml search.json og-image.png \
                  entities.json resources.json
          git diff --staged --quiet || git commit -m "chore: rebuild site assets from content.json [skip ci]"
          git push
