name: Build site

# Triggers on any content or generator change
on:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'people.json'
      - 'books.json'
      - 'orgs.json'
      - 'media.json'
      - 'music.json'
      - 'places.json'
      - 'aligned-goods.json'
      - 'courses.json'
      - 'generate.js'
      - 'build-kb.js'
      - 'build-og.js'

# Needed so the bot commit + push step can write back to the repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Full-depth checkout so the bot can commit + push without shallow-clone issues
          fetch-depth: 0
          # Use the built-in token (now with write permissions from the block above)
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp for OG image generation
        run: npm install sharp

      - name: Rebuild AI knowledge base
        run: node build-kb.js

      - name: Generate OG images
        run: node build-og.js

      - name: Rebuild v2 pages (legacy generator from content.json)
        run: node generate.js

      # Layer 2/3 generator — runs AFTER generate.js so it has the final
      # word on v2/<slug>/index.html for any topic with a data/topics/
      # YAML brief. Skips LOCKED_TOPICS (water, music, channeling, etc.).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Apply Layer-2/3 topic-page generator (overrides legacy output)
        run: |
          python3 scripts/draft_all_topics.py
          python3 scripts/generate_topic_page.py --all

      - name: Commit all generated assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Include everything generate.js regenerates from the beds so the
          # committed tree matches what the generator produces.
          git add v2/ people/ books/ orgs/ media/ music/ places/ \
                  functions/api/_kb.js sitemap.xml search.json og-image.png \
                  entities.json resources.json
          git diff --staged --quiet || git commit -m "chore: rebuild site assets from content.json [skip ci]"
          git push
