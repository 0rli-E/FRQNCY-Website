name: Auto-grow nightly

# Drafts content additions for human review. Nothing here auto-merges.
# Per scripts/auto-grow/README.md and proposals/AUTO-GROW-LOOPS-V0.md.

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC daily
  workflow_dispatch: {}

jobs:
  draft-suggestions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Domain coverage report (lead loop, structural)
        run: node scripts/auto-grow/domain-coverage.mjs

      - name: Domain coverage LLM enrichment (v0.1)
        run: node scripts/auto-grow/domain-coverage-enrich.mjs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FRQNCY_ENRICH_MODEL: 'google/gemini-2.5-flash'

      - name: Resource suggestions from recent NRG posts
        run: node scripts/auto-grow/resource-suggest.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DAYS_BACK: '7'

      - name: Video ingestion from Watch playlist channels
        run: node scripts/auto-grow/video-ingest.mjs

      - name: Refresh Bluesky reply counts on cross-posted NRG posts
        # Live-data step — writes counts directly to Supabase via service-role.
        # Output JSON (scripts/auto-grow/output/bluesky-counts.json) is just a
        # summary for human review; nothing in resources.json or content/
        # changes here, so the PR step below picks up only the summary.
        run: node scripts/auto-grow/bluesky-counts-refresh.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BSKY_BATCH_LIMIT: '200'

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'auto-grow: nightly domain-coverage + resource + video + bsky-counts'
          title: 'auto-grow nightly: review and merge selectively'
          body: |
            Drafted by `scripts/auto-grow/`. Read
            `scripts/auto-grow/output/domain-coverage.md` first — that's
            the structural surface (domains by coverage, pillars by
            primary-tag, orphan flags). Then review the resource and
            video JSON. The `bluesky-counts.json` summary is a side-effect
            log — counts were already written live to Supabase by the
            refresh step. Merge selectively — nothing here is
            auto-applied to source.

            Per `proposals/AUTO-GROW-LOOPS-V0.md`. The harness drafts;
            humans decide.
          branch: auto-grow/nightly
          delete-branch: true
          add-paths: scripts/auto-grow/output/
