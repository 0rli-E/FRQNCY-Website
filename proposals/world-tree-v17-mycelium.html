    // ===== LAYOUT COMPUTATION =====
    let CW = window.innerWidth;
    let CH = window.innerHeight;
    const GROUND_Y_RATIO = 0.62;

    const nodeMap = {}; // id -> {x, y, node}
    let initialPositions = null; // store for proportional resize

    function computeLayout(w, h) {
      const groundY = h * GROUND_Y_RATIO;

      const cores   = HOME_NODES.filter(n => n.type === 'core');
      const mains   = HOME_NODES.filter(n => n.type === 'main');
      const clusters = HOME_NODES.filter(n => n.type === 'cluster');
      const topics  = HOME_NODES.filter(n => n.type === 'topic' || n.type === 'subcluster');

      const positions = {};

      // Core: at ground line center
      cores.forEach(n => {
        positions[n.id] = { x: w * 0.50, y: groundY };
      });

      // Mains: below ground, spread
      mains.forEach((n, i) => {
        const count = mains.length;
        const xFrac = 0.50 + (i / (count - 1) - 0.5) * 0.60;
        const yFrac = GROUND_Y_RATIO + 0.06 + (i % 2) * 0.10 + Math.random() * 0.05;
        positions[n.id] = {
          x: w * Math.max(0.08, Math.min(0.92, xFrac)) + (Math.random() - 0.5) * 30,
          y: h * Math.min(0.90, yFrac)
        };
      });

      // Clusters: above ground, mid-canopy
      clusters.forEach((n, i) => {
        const count = clusters.length;
        const xFrac = 0.50 + (i / (count - 1) - 0.5) * 0.84;
        const yFrac = 0.28 + (i % 3) * 0.07 + Math.random() * 0.04;
        positions[n.id] = {
          x: w * Math.max(0.05, Math.min(0.95, xFrac)),
          y: h * Math.min(GROUND_Y_RATIO - 0.04, yFrac)
        };
      });

      // Topics: above ground, upper canopy — arrange in rows
      const topicRows = 5;
      topics.forEach((n, i) => {
        const count = topics.length;
        const row = i % topicRows;
        const col = Math.floor(i / topicRows);
        const totalCols = Math.ceil(count / topicRows);
        const xFrac = 0.05 + (col / (totalCols - 1 || 1)) * 0.90;
        const yFrac = 0.03 + (row / (topicRows - 1)) * 0.22;
        positions[n.id] = {
          x: w * Math.max(0.03, Math.min(0.97, xFrac)) + (Math.random() - 0.5) * 20,
          y: h * yFrac + (Math.random() - 0.5) * 8
        };
      });

      return positions;
    }

    function initPositions() {
      const pos = computeLayout(CW, CH);
      HOME_NODES.forEach(n => {
        nodeMap[n.id] = { x: pos[n.id].x, y: pos[n.id].y, node: n };
      });
      initialPositions = {};
      Object.keys(nodeMap).forEach(id => {
        initialPositions[id] = { xR: nodeMap[id].x / CW, yR: nodeMap[id].y / CH };
      });

    // ===== BUILD BRANCH PATHS =====
    const branchPaths = []; // {src, tgt, el}

    function isUnderground(id) {
      const n = nodeMap[id];
      if (!n) return false;
      return n.y > CH * GROUND_Y_RATIO;
    }

    function curvePath(x1, y1, x2, y2) {
      const cpx = (x1 + x2) / 2;
      const cpy = Math.min(y1, y2) - Math.abs(x2 - x1) * 0.25 - 20;
      return 'M' + x1 + ',' + y1 + ' Q' + cpx + ',' + cpy + ' ' + x2 + ',' + y2;
    }

    function buildPaths() {
      // Remove existing paths
      const pathGroup = svgEl.querySelector('#path-group');
      if (pathGroup) pathGroup.remove();
      branchPaths.length = 0;

      const groundY = CH * GROUND_Y_RATIO;
      const pg = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      pg.setAttribute('id', 'path-group');

      HOME_RAW_LINKS.forEach(pair => {
        const [srcId, tgtId] = pair;
        const s = nodeMap[srcId], t = nodeMap[tgtId];
        if (!s || !t) return;

        const srcUnder = s.y > groundY;
        const tgtUnder = t.y > groundY;

        const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        el.setAttribute('fill', 'none');
        el.setAttribute('d', curvePath(s.x, s.y, t.x, t.y));

        if (srcUnder && tgtUnder) {
          // Both underground: mycelium thread
          el.setAttribute('stroke', 'rgba(200,220,255,0.55)');
          el.setAttribute('stroke-width', '0.8');
          el.setAttribute('stroke-dasharray', '4,3');
        } else if (!srcUnder && !tgtUnder) {
          // Both above ground: bark style
          el.setAttribute('stroke', 'rgba(60,50,40,0.45)');
          el.setAttribute('stroke-width', '1.2');
        } else {
          // Crossing ground line: medium style
          el.setAttribute('stroke', 'rgba(130,120,100,0.35)');
          el.setAttribute('stroke-width', '1.0');
        }

        pg.appendChild(el);
        branchPaths.push({ src: srcId, tgt: tgtId, el });
      });

      // Insert path group before node group
      const nodeGroup = svgEl.querySelector('#node-group');
      if (nodeGroup) {
        svgEl.insertBefore(pg, nodeGroup);
      } else {
        svgEl.appendChild(pg);
      }
    }

    function updatePaths(id) {
      branchPaths.forEach(bp => {
        if (bp.src !== id && bp.tgt !== id) return;
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        bp.el.setAttribute('d', curvePath(s.x, s.y, t.x, t.y));
      });
    }

    // ===== BUILD NODES =====
    let nodeElements = {}; // id -> g element

    function buildNodes() {
      const ng = svgEl.querySelector('#node-group');
      if (ng) ng.remove();
      nodeElements = {};

      const groundY = CH * GROUND_Y_RATIO;
      const nGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      nGroup.setAttribute('id', 'node-group');

      HOME_NODES.forEach(n => {
        const nm = nodeMap[n.id];
        if (!nm) return;

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('data-id', n.id);
        g.setAttribute('transform', 'translate(' + nm.x + ',' + nm.y + ')');
        g.style.cursor = 'grab';

        const isUnder = nm.y > groundY;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');

        if (n.type === 'core') {
          circle.setAttribute('r', '28');
          circle.setAttribute('fill', '#FFFFFF');
          circle.setAttribute('opacity', '0.97');
          g.setAttribute('filter', 'url(#core-glow)');
        } else if (n.type === 'main') {
          circle.setAttribute('r', '16');
          circle.setAttribute('fill', '#FFFFFF');
          circle.setAttribute('opacity', '0.88');
          g.setAttribute('filter', 'url(#myco-glow)');
        } else if (n.type === 'cluster') {
          circle.setAttribute('r', '12');
          circle.setAttribute('fill', '#F0E8C0');
          circle.setAttribute('opacity', '0.80');
          g.setAttribute('filter', 'url(#soft-glow)');
        } else if (n.type === 'subcluster') {
          circle.setAttribute('r', '10');
          circle.setAttribute('fill', '#E8DEB0');
          circle.setAttribute('opacity', '0.75');
          g.setAttribute('filter', 'url(#soft-glow)');

          circle.setAttribute('r', '6');
          circle.setAttribute('fill', '#E8DEB0');
          circle.setAttribute('opacity', '0.65');

          cp1xR: 0.50 + Math.cos(angle) * 0.15,
          cp1yR: GROUND_Y_RATIO + 0.10 + Math.random() * 0.08,
          cp2xR: 0.50 + Math.cos(angle) * 0.30 + (Math.random() - 0.5) * 0.08,
          cp2yR: GROUND_Y_RATIO + 0.20 + Math.random() * 0.10,
          endXR: 0.50 + (Math.random() - 0.5) * 0.70,
          endYR: 0.88 + Math.random() * 0.07,
          lw: 0.5 + Math.random() * 0.5
        });
      }
      return threads;
    })();

    function drawBackground() {
      const groundY = CH * GROUND_Y_RATIO;

      // Above ground: dark forest night sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, groundY);
      skyGrad.addColorStop(0, '#04080C');
      skyGrad.addColorStop(1, '#081018');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, CW, groundY);

      // Below ground: deep earth
      const earthGrad = ctx.createLinearGradient(0, groundY, 0, CH);
      earthGrad.addColorStop(0, '#100A04');
      earthGrad.addColorStop(0.5, '#140C05');
      earthGrad.addColorStop(1, '#180E06');
      ctx.fillStyle = earthGrad;
      ctx.fillRect(0, groundY, CW, CH - groundY);

      // Horizontal soil texture bands
      for (let band = 0; band < 6; band++) {
        const bandY = groundY + (CH - groundY) * (band / 6 + 0.08);
        const bandGrad = ctx.createLinearGradient(0, bandY - 3, 0, bandY + 3);
        bandGrad.addColorStop(0, 'rgba(30,18,8,0)');
        bandGrad.addColorStop(0.5, 'rgba(30,18,8,0.15)');
        bandGrad.addColorStop(1, 'rgba(30,18,8,0)');
        ctx.fillStyle = bandGrad;
        ctx.fillRect(0, bandY - 3, CW, 6);
      }

      // Ground line band
      const grd = ctx.createLinearGradient(0, CH * 0.60, 0, CH * 0.64);
      grd.addColorStop(0, 'rgba(40,30,15,0)');
      grd.addColorStop(0.5, 'rgba(40,30,15,0.8)');
      grd.addColorStop(1, 'rgba(40,30,15,0)');
      ctx.fillStyle = grd;
      ctx.fillRect(0, CH * 0.60, CW, CH * 0.04);

      // Core glow bloom on canvas at ground line
      const coreX = nodeMap['frqncy'] ? nodeMap['frqncy'].x : CW * 0.5;
      const coreY = nodeMap['frqncy'] ? nodeMap['frqncy'].y : CH * GROUND_Y_RATIO;
      const bloom = ctx.createRadialGradient(coreX, coreY, 10, coreX, coreY, 90);
      bloom.addColorStop(0, 'rgba(255,255,255,0.12)');
      bloom.addColorStop(0.4, 'rgba(220,230,255,0.06)');
      bloom.addColorStop(1, 'rgba(200,220,255,0)');
      ctx.fillStyle = bloom;
      ctx.beginPath();
      ctx.arc(coreX, coreY, 90, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawTreeSilhouette() {
      ctx.strokeStyle = 'rgba(80,60,40,0.4)';
      treeBranches.forEach(function(b) {
        const x1 = b[0] * CW, y1 = b[1] * CH;
        const x2 = b[2] * CW, y2 = b[3] * CH;
        const cpx = (x1 + x2) / 2 + (Math.random() - 0.5) * 20;
        const cpy = Math.min(y1, y2) - 10;
        // Width tapers toward tips
        const dist = Math.sqrt((x2-x1)*(x2-x1)+(y2-y1)*(y2-y1));
        ctx.lineWidth = Math.max(0.4, 2.0 - dist / 150);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cpx, cpy, x2, y2);
        ctx.stroke();
      });
    }

    function drawMushroomCaps(t) {
      mushCaps.forEach(function(m) {
        const x = m.xR * CW;
        const y = m.yR * CH;
        const pulse = 0.85 + 0.15 * Math.sin(t * 0.6 + m.xR * 10);
        const r = m.r * pulse;

        // Stem
        ctx.strokeStyle = 'rgba(180,160,120,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y + r * 0.4);
        ctx.lineTo(x, y + r * 0.4 + m.stemH);
        ctx.stroke();

        // Cap (half ellipse)
        ctx.fillStyle = 'rgba(240,232,180,0.08)';
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.55, 0, Math.PI, 0);
        ctx.fill();

        // Cap outline
        ctx.strokeStyle = 'rgba(240,232,180,0.18)';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * 0.55, 0, Math.PI, 0);
        ctx.stroke();

        // Bioluminescent glow
        const glowGrad = ctx.createRadialGradient(x, y - r * 0.2, 1, x, y, r * 1.2);
        glowGrad.addColorStop(0, 'rgba(220,255,200,0.06)');
        glowGrad.addColorStop(1, 'rgba(200,255,180,0)');
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.ellipse(x, y, r * 1.2, r * 0.8, 0, Math.PI * 2, 0);
        ctx.fill();
      });
    }

    function drawRootThreads() {
      const coreX = nodeMap['frqncy'] ? nodeMap['frqncy'].x : CW * 0.5;
      const coreY = nodeMap['frqncy'] ? nodeMap['frqncy'].y : CH * GROUND_Y_RATIO;
      ctx.strokeStyle = 'rgba(200,210,255,0.25)';
      rootThreads.forEach(function(r) {
        ctx.lineWidth = r.lw;
        ctx.beginPath();
        ctx.moveTo(coreX, coreY);
        ctx.bezierCurveTo(
          r.cp1xR * CW, r.cp1yR * CH,
          r.cp2xR * CW, r.cp2yR * CH,
          r.endXR * CW, r.endYR * CH
        );
        ctx.stroke();
      });
    }

    function updateAndDrawSpores() {
      const groundY = CH * GROUND_Y_RATIO;
      ctx.fillStyle = 'rgba(255,255,255,1)';
      spores.forEach(function(s) {
        s.x += s.vx;
        s.y += s.vy;
        if (s.y < 0) {
          s.y = groundY;
          s.x = Math.random() * CW;
        }
        if (s.x < 0) s.x = CW;
        if (s.x > CW) s.x = 0;
        ctx.globalAlpha = s.opacity * 0.6;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawMycoParticles() {
      for (let i = mycoParticles.length - 1; i >= 0; i--) {
        const p = mycoParticles[i];
        p.prog += p.speed;
        if (p.prog >= 1) { mycoParticles.splice(i, 1); continue; }
        const cpx = (p.x1 + p.x2) / 2;
        const cpy = Math.min(p.y1, p.y2) - Math.abs(p.x2 - p.x1) * 0.25 - 20;
        const t = p.prog;
        const px = (1-t)*(1-t)*p.x1 + 2*(1-t)*t*cpx + t*t*p.x2;
        const py = (1-t)*(1-t)*p.y1 + 2*(1-t)*t*cpy + t*t*p.y2;
        const fade = Math.min(t * 5, 1) * Math.min((1 - t) * 5, 1);
        ctx.fillStyle = 'rgba(220,230,255,' + (0.85 * fade).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(px, py, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function animate(ts) {
      requestAnimationFrame(animate);
      frameTs = ts;
      const t = ts * 0.001;

      ctx.clearRect(0, 0, CW, CH);

      drawBackground();
      drawTreeSilhouette();
      updateAndDrawSpores();
      drawMycoParticles();
      drawRootThreads();
      drawMushroomCaps(t);

      // Spawn mycelium particles periodically
      if (ts - lastParticleSpawn > 200) {
        spawnMycoParticle();
        lastParticleSpawn = ts;
      }
    }

    // ===== RESIZE =====
    function handleResize() {
      const oldCW = CW, oldCH = CH;
      CW = window.innerWidth;
      CH = window.innerHeight;

      resizeCanvas();
      setSVGSize();

      // Reposition nodes proportionally
      if (initialPositions) {
        HOME_NODES.forEach(function(n) {
          const ip = initialPositions[n.id];
          if (ip && nodeMap[n.id]) {
            nodeMap[n.id].x = ip.xR * CW;
            nodeMap[n.id].y = ip.yR * CH;
          }
        });
        // Update initial fractions with new positions
        Object.keys(nodeMap).forEach(function(id) {
          initialPositions[id] = { xR: nodeMap[id].x / CW, yR: nodeMap[id].y / CH };
        });
      }

      spores = makeSpores();
      buildPaths();
      buildNodes();
    }

    window.addEventListener('resize', handleResize);

    // ===== INIT =====
    resizeCanvas();
    setSVGSize();
    buildDefs();
    initPositions();
    buildPaths();
    buildNodes();
    requestAnimationFrame(animate);

  })();
  </script>
</body>
</html>
