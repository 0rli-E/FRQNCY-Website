// ─── SETUP ──────────────────────────────────────────────────────────────────
const SVG_NS = 'http://www.w3.org/2000/svg';
const wrap = document.getElementById('wrap');
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');
const svgEl = document.getElementById('tree-svg');
const pCanvas = document.getElementById('particle-canvas');
const pCtx = pCanvas.getContext('2d');
const tip = document.getElementById('tip');

let CW, CH, cx, cy;

function resize() {
  CW = wrap.clientWidth;
  CH = wrap.clientHeight;
  cx = CW / 2;
  cy = CH / 2;
  bgCanvas.width = CW;
  bgCanvas.height = CH;
  pCanvas.width = CW;
  pCanvas.height = CH;
  svgEl.setAttribute('viewBox', `0 0 ${CW} ${CH}`);
  drawBackground();
  if (Object.keys(nodeMap).length > 0) rebuildSVG();
}

// ─── BACKGROUND ─────────────────────────────────────────────────────────────
let stars = [];

function initStars() {
  stars = [];
  // 500 stars biased toward upper half
  for (let i = 0; i < 500; i++) {
    const bias = Math.random() < 0.65 ? Math.random() * 0.55 : Math.random();
    stars.push({
      x: Math.random() * CW,
      y: bias * CH,
      r: Math.random() < 0.7 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.4 + 0.6,
      a: Math.random() * 0.5 + 0.2,
      twinkle: Math.random() * Math.PI * 2,
      twinkleSpeed: (Math.random() * 0.02 + 0.005)
    });
  }
}

function drawBackground() {
  const g = bgCtx.createRadialGradient(cx, CH * 0.35, 0, cx, CH * 0.35, Math.max(CW, CH) * 0.9);
  g.addColorStop(0, '#040A18');
  g.addColorStop(0.4, '#020808');
  g.addColorStop(0.75, '#020406');
  g.addColorStop(1, '#010304');
  bgCtx.fillStyle = g;
  bgCtx.fillRect(0, 0, CW, CH);

  // Water surface at CH*0.78
  const waterY = CH * 0.78;
  const wg = bgCtx.createLinearGradient(0, waterY - 2, 0, waterY + 60);
  wg.addColorStop(0, 'rgba(60,80,140,0.18)');
  wg.addColorStop(0.3, 'rgba(30,45,90,0.10)');
  wg.addColorStop(1, 'rgba(5,8,20,0)');
  bgCtx.fillStyle = wg;
  bgCtx.fillRect(0, waterY - 2, CW, CH - waterY + 2);

  // Water line shimmer
  bgCtx.save();
  bgCtx.globalAlpha = 0.22;
  bgCtx.strokeStyle = 'rgba(130,165,240,0.4)';
  bgCtx.lineWidth = 1;
  bgCtx.beginPath();
  bgCtx.moveTo(0, waterY);
  bgCtx.lineTo(CW, waterY);
  bgCtx.stroke();
  bgCtx.restore();

  // Moon reflection at CH*0.88
  const moonRefY = CH * 0.88;
  const moonRefX = CW * 0.78;
  const mrg = bgCtx.createRadialGradient(moonRefX, moonRefY, 0, moonRefX, moonRefY, 55);
  mrg.addColorStop(0, 'rgba(210,230,255,0.07)');
  mrg.addColorStop(0.4, 'rgba(160,190,240,0.04)');
  mrg.addColorStop(1, 'rgba(100,130,200,0)');
  bgCtx.fillStyle = mrg;
  bgCtx.beginPath();
  bgCtx.ellipse(moonRefX, moonRefY, 40, 18, 0, 0, Math.PI * 2);
  bgCtx.fill();

  drawStars(0);
  drawMoon();
  drawCrownGlow();
  drawRootGlow();
}

function drawStars(t) {
  stars.forEach(s => {
    const a = s.a + Math.sin(s.twinkle + t * s.twinkleSpeed) * 0.18;
    bgCtx.save();
    bgCtx.globalAlpha = Math.max(0.05, a);
    bgCtx.fillStyle = '#B4D2FF';
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.restore();
  });
}

function drawMoon() {
  const mx = CW * 0.78;
  const my = CH * 0.12;
  const mr = 60;

  // Outer glow halo layers
  [[120, 0.035], [90, 0.06], [70, 0.10]].forEach(([rad, alpha]) => {
    const hg = bgCtx.createRadialGradient(mx, my, mr * 0.6, mx, my, rad);
    hg.addColorStop(0, `rgba(200,220,255,${alpha})`);
    hg.addColorStop(1, 'rgba(100,130,210,0)');
    bgCtx.fillStyle = hg;
    bgCtx.beginPath();
    bgCtx.arc(mx, my, rad, 0, Math.PI * 2);
    bgCtx.fill();
  });

  // Moon disk
  const mg = bgCtx.createRadialGradient(mx - 12, my - 12, 0, mx, my, mr);
  mg.addColorStop(0, '#F0F6FF');
  mg.addColorStop(0.35, '#D8E8FF');
  mg.addColorStop(0.7, '#B0C8F0');
  mg.addColorStop(1, '#8098C8');
  bgCtx.fillStyle = mg;
  bgCtx.beginPath();
  bgCtx.arc(mx, my, mr, 0, Math.PI * 2);
  bgCtx.fill();

  // Subtle crater-like shading
  bgCtx.save();
  bgCtx.globalAlpha = 0.08;
  bgCtx.fillStyle = '#405080';
  bgCtx.beginPath();
  bgCtx.arc(mx + 18, my + 8, 14, 0, Math.PI * 2);
  bgCtx.fill();
  bgCtx.beginPath();
  bgCtx.arc(mx - 20, my + 18, 8, 0, Math.PI * 2);
  bgCtx.fill();
  bgCtx.restore();
}

function drawCrownGlow() {
  const cg = bgCtx.createRadialGradient(cx, CH * 0.22, 0, cx, CH * 0.22, CW * 0.48);
  cg.addColorStop(0, 'rgba(100,130,200,0.10)');
  cg.addColorStop(0.5, 'rgba(60,85,150,0.04)');
  cg.addColorStop(1, 'rgba(20,30,70,0)');
  bgCtx.fillStyle = cg;
  bgCtx.fillRect(0, 0, CW, CH * 0.6);
}

function drawRootGlow() {
  const rg = bgCtx.createRadialGradient(cx, CH * 0.85, 0, cx, CH * 0.85, CW * 0.35);
  rg.addColorStop(0, 'rgba(15,8,40,0.35)');
  rg.addColorStop(0.6, 'rgba(10,5,25,0.15)');
  rg.addColorStop(1, 'rgba(5,2,12,0)');
  bgCtx.fillStyle = rg;
  bgCtx.fillRect(0, CH * 0.65, CW, CH * 0.35);
}

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
const nodeMap = {};

function computeLayout() {
  // Build lookup
  NODES.forEach(n => {
    if (!nodeMap[n.id]) nodeMap[n.id] = { id: n.id, label: n.label, type: n.type, r: n.r, x: 0, y: 0 };
  });

  // Core
  nodeMap['frqncy'].x = cx;
  nodeMap['frqncy'].y = CH * 0.42;

  // Main nodes: arranged in a semi-circle above/around the core
  const mainNodes = NODES.filter(n => n.type === 'main');
  const mainCount = mainNodes.length;
  mainNodes.forEach((n, i) => {
    const frac = (i + 0.5) / mainCount;
    const angle = Math.PI + frac * Math.PI; // top arc: from left to right going above
    const rx = CW * 0.26;
    const ry = CH * 0.14;
    nodeMap[n.id].x = cx + Math.cos(angle) * rx;
    nodeMap[n.id].y = CH * 0.42 + Math.sin(angle) * ry;
  });

  // Clusters: spread wide and high — the weeping crown
  const clusterNodes = NODES.filter(n => n.type === 'cluster');
  const clusterCount = clusterNodes.length;
  clusterNodes.forEach((n, i) => {
    const frac = i / (clusterCount - 1);
    const angle = Math.PI * 0.08 + frac * Math.PI * 0.84; // top-arc, wide spread
    // Vary height to look natural — outer clusters slightly lower
    const distFromCenter = Math.abs(frac - 0.5) * 2;
    const baseY = CH * 0.12;
    const yVar = distFromCenter * CH * 0.10;
    const rx = CW * 0.44;
    const ry = CH * 0.22;
    nodeMap[n.id].x = cx + Math.cos(Math.PI - angle) * rx;
    nodeMap[n.id].y = baseY + yVar + Math.sin(angle) * ry * 0.3;
  });

  // Topics: hang DOWN below their cluster parents
  // Build parent map for topics
  const clusterChildren = {};
  LINKS.forEach(([src, tgt]) => {
    const srcNode = nodeMap[src];
    const tgtNode = nodeMap[tgt];
    if (!srcNode || !tgtNode) return;
    const srcType = srcNode.type;
    const tgtType = tgtNode.type;
    if ((srcType === 'cluster' || srcType === 'subcluster') && (tgtType === 'topic' || tgtType === 'subcluster')) {
      if (!clusterChildren[src]) clusterChildren[src] = [];
      clusterChildren[src].push(tgt);
    }
  });

  // Position topics below clusters in hanging tendrils
  Object.entries(clusterChildren).forEach(([clusterId, children]) => {
    const parent = nodeMap[clusterId];
    if (!parent) return;
    const count = children.length;
    children.forEach((childId, i) => {
      const child = nodeMap[childId];
      if (!child) return;
      // Already positioned subclusters keep their relative arrangement
      if (child.type === 'subcluster') {
        const frac = (i + 0.5) / count;
        const spread = Math.min(count * 22, CW * 0.18);
        child.x = parent.x + (frac - 0.5) * spread;
        child.y = CH * 0.55 + Math.random() * CH * 0.04;
        return;
      }
      const frac = (i + 0.5) / count;
      const spread = Math.min(count * 20, CW * 0.20);
      // Slight x drift from parent
      child.x = parent.x + (frac - 0.5) * spread + (Math.random() - 0.5) * 18;
      // Vertical: hang between 0.52 and 0.80
      const depthFrac = (i % 3) / 2;
      child.y = CH * 0.52 + depthFrac * CH * 0.28 + Math.random() * CH * 0.04;
    });
  });

  // Also position any topics linked directly from main nodes (not clusters)
  LINKS.forEach(([src, tgt]) => {
    const s = nodeMap[src], t = nodeMap[tgt];
    if (!s || !t) return;
    if (s.type === 'main' && (t.type === 'topic' || t.type === 'subcluster') && t.x === 0) {
      t.x = s.x + (Math.random() - 0.5) * 80;
      t.y = CH * 0.58 + Math.random() * CH * 0.18;
    }
  });

  // Subclusters second pass: position their children
  const subclusterChildren = {};
  LINKS.forEach(([src, tgt]) => {
    const s = nodeMap[src], t = nodeMap[tgt];
    if (!s || !t) return;
    if (s.type === 'subcluster' && t.type === 'topic') {
      if (!subclusterChildren[src]) subclusterChildren[src] = [];
      subclusterChildren[src].push(tgt);
    }
  });
  Object.entries(subclusterChildren).forEach(([scId, children]) => {
    const parent = nodeMap[scId];
    if (!parent) return;
    const count = children.length;
    children.forEach((childId, i) => {
      const child = nodeMap[childId];
      if (!child) return;
      const frac = (i + 0.5) / count;
      const spread = count * 22;
      child.x = parent.x + (frac - 0.5) * spread;
      child.y = parent.y + 35 + Math.random() * 30;
    });
  });

  // Clamp all positions to safe canvas bounds
  Object.values(nodeMap).forEach(n => {
    const pad = n.r + 12;
    n.x = Math.max(pad, Math.min(CW - pad, n.x || cx));
    n.y = Math.max(pad, Math.min(CH - pad, n.y || CH * 0.5));
  });
}

// ─── LINK LEVEL DETECTION ────────────────────────────────────────────────────
function getLinkLevel(srcId, tgtId) {
  const s = nodeMap[srcId], t = nodeMap[tgtId];
  if (!s || !t) return 'default';
  const st = s.type, tt = t.type;
  if ((st === 'cluster' || st === 'subcluster') && (tt === 'topic' || tt === 'subcluster')) return 'cluster-to-topic';
  if (st === 'main' && tt === 'cluster') return 'main-to-cluster';
  if (st === 'core') return 'core-to-main';
  if ((st === 'topic' || st === 'subcluster') && (tt === 'topic' || tt === 'subcluster')) return 'topic-to-topic';
  return 'default';
}

// ─── WEEP CURVE ──────────────────────────────────────────────────────────────
function weepCurve(x1, y1, x2, y2, level) {
  if (level === 'cluster-to-topic') {
    // Source is cluster (high), target is topic (low) — arc up then droop down
    const cpx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * 0.06;
    const cpy = Math.min(y1, y2) - 45;
    return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
  }
  if (level === 'core-to-main') {
    const cpx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * 0.12;
    const cpy = (y1 + y2) / 2 - Math.abs(x1 - x2) * 0.18;
    return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
  }
  if (level === 'main-to-cluster') {
    // Main nodes are mid-height, clusters are high — curve upward to clusters
    const cpx = (x1 + x2) / 2;
    const cpy = (y1 + y2) / 2 - Math.abs(x1 - x2) * 0.12 - 20;
    return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
  }
  if (level === 'topic-to-topic') {
    const cpx = (x1 + x2) / 2;
    const cpy = Math.min(y1, y2) - 20;
    return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
  }
  // Default gentle arc
  const cpx = (x1 + x2) / 2 + (cx - (x1 + x2) / 2) * 0.08;
  const cpy = (y1 + y2) / 2 - Math.abs(x1 - x2) * 0.08 - 10;
  return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
}

// ─── SVG HELPERS ─────────────────────────────────────────────────────────────
function mkSVG(tag, attrs = {}, parent) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

// ─── DEFS ────────────────────────────────────────────────────────────────────
function buildDefs() {
  const defs = mkSVG('defs', {}, svgEl);

  // ── Gradients ──
  // Core moonlight gradient
  const coreGrad = mkSVG('radialGradient', { id: 'grad-core', cx: '40%', cy: '35%', r: '65%' }, defs);
  [['0%','#D0E0FF'],['38%','#8090C0'],['100%','#203060']].forEach(([off, col]) => {
    mkSVG('stop', { offset: off, 'stop-color': col }, coreGrad);
  });

  // Main node gradient
  const mainGrad = mkSVG('radialGradient', { id: 'grad-main', cx: '38%', cy: '32%', r: '68%' }, defs);
  [['0%','#0E1220'],['100%','#060810']].forEach(([off, col]) => {
    mkSVG('stop', { offset: off, 'stop-color': col }, mainGrad);
  });

  // Cluster gradient
  const clustGrad = mkSVG('radialGradient', { id: 'grad-cluster', cx: '38%', cy: '32%', r: '68%' }, defs);
  [['0%','#101828'],['100%','#080C1A']].forEach(([off, col]) => {
    mkSVG('stop', { offset: off, 'stop-color': col }, clustGrad);
  });

  // Topic gradient
  const topicGrad = mkSVG('radialGradient', { id: 'grad-topic', cx: '38%', cy: '32%', r: '68%' }, defs);
  [['0%','#0A1420'],['100%','#04080F']].forEach(([off, col]) => {
    mkSVG('stop', { offset: off, 'stop-color': col }, topicGrad);
  });

  // Subcluster gradient
  const subGrad = mkSVG('radialGradient', { id: 'grad-subcluster', cx: '38%', cy: '32%', r: '68%' }, defs);
  [['0%','#0C1424'],['100%','#060A14']].forEach(([off, col]) => {
    mkSVG('stop', { offset: off, 'stop-color': col }, subGrad);
  });

  // ── Filters ──
  // Core glow filter
  const coreFilter = mkSVG('filter', { id: 'f-core', x: '-60%', y: '-60%', width: '220%', height: '220%' }, defs);
  const fgc = mkSVG('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: '6', result: 'blur' }, coreFilter);
  const fmc = mkSVG('feMerge', {}, coreFilter);
  mkSVG('feMergeNode', { in: 'blur' }, fmc);
  mkSVG('feMergeNode', { in: 'SourceGraphic' }, fmc);

  // Node rim glow
  const rimFilter = mkSVG('filter', { id: 'f-rim', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  mkSVG('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: '3', result: 'blur' }, rimFilter);
  const fmr = mkSVG('feMerge', {}, rimFilter);
  mkSVG('feMergeNode', { in: 'blur' }, fmr);
  mkSVG('feMergeNode', { in: 'SourceGraphic' }, fmr);

  // Branch glow
  const branchFilter = mkSVG('filter', { id: 'f-branch', x: '-20%', y: '-20%', width: '140%', height: '140%' }, defs);
  mkSVG('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: '1.5' }, branchFilter);

  // Decorative root filter
  const rootFilter = mkSVG('filter', { id: 'f-root', x: '-10%', y: '-10%', width: '120%', height: '120%' }, defs);
  mkSVG('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: '2' }, rootFilter);

  return defs;
}

// ─── BRANCH RENDERING ────────────────────────────────────────────────────────
const branchPaths = [];
let branchGroup, nodeGroup, rootGroup;

function buildBranchStyle(level) {
  if (level === 'core-to-main') return {
    stroke: 'rgba(80,100,160,0.65)',
    strokeW: '2.2',
    glow: 'rgba(100,130,200,0.22)',
    glowW: '5'
  };
  if (level === 'main-to-cluster') return {
    stroke: 'rgba(60,80,140,0.50)',
    strokeW: '1.6',
    glow: 'rgba(80,110,180,0.16)',
    glowW: '4'
  };
  if (level === 'cluster-to-topic') return {
    stroke: 'rgba(50,65,120,0.38)',
    strokeW: '1.1',
    glow: 'rgba(70,95,160,0.12)',
    glowW: '3'
  };
  if (level === 'topic-to-topic') return {
    stroke: 'rgba(45,55,100,0.28)',
    strokeW: '0.9',
    glow: null,
    glowW: '2'
  };
  return {
    stroke: 'rgba(55,70,130,0.40)',
    strokeW: '1.3',
    glow: 'rgba(75,100,170,0.14)',
    glowW: '3.5'
  };
}

function buildBranches() {
  branchPaths.length = 0;
  while (branchGroup.firstChild) branchGroup.removeChild(branchGroup.firstChild);

  LINKS.forEach(([srcId, tgtId]) => {
    const s = nodeMap[srcId], t = nodeMap[tgtId];
    if (!s || !t) return;
    const level = getLinkLevel(srcId, tgtId);
    const style = buildBranchStyle(level);
    const d = weepCurve(s.x, s.y, t.x, t.y, level);

    const els = [];

    // Glow layer
    if (style.glow) {
      const glowPath = mkSVG('path', {
        d, fill: 'none',
        stroke: style.glow,
        'stroke-width': style.glowW,
        'stroke-linecap': 'round',
        filter: 'url(#f-branch)'
      }, branchGroup);
      els.push(glowPath);
    }

    // Main branch
    const mainPath = mkSVG('path', {
      d, fill: 'none',
      stroke: style.stroke,
      'stroke-width': style.strokeW,
      'stroke-linecap': 'round',
    }, branchGroup);
    els.push(mainPath);

    branchPaths.push({ src: srcId, tgt: tgtId, level, els });
  });
}

function updatePaths(id) {
  branchPaths.forEach(bp => {
    if (bp.src !== id && bp.tgt !== id) return;
    const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
    if (!s || !t) return;
    const d = weepCurve(s.x, s.y, t.x, t.y, bp.level);
    bp.els.forEach(el => el.setAttribute('d', d));
  });
}

// ─── DECORATIVE ROOTS ────────────────────────────────────────────────────────
function buildRoots() {
  while (rootGroup.firstChild) rootGroup.removeChild(rootGroup.firstChild);

  const core = nodeMap['frqncy'];
  const rootY = CH * 0.92;
  const rootCount = 7;

  for (let i = 0; i < rootCount; i++) {
    const frac = (i + 0.5) / rootCount;
    const angle = (frac - 0.5) * 1.1;
    const endX = core.x + Math.sin(angle) * CW * 0.22;
    const cpx1 = core.x + Math.sin(angle) * CW * 0.04;
    const cpy1 = core.y + (rootY - core.y) * 0.35;
    const cpx2 = core.x + Math.sin(angle) * CW * 0.14;
    const cpy2 = core.y + (rootY - core.y) * 0.72;

    const d = `M${core.x},${core.y + core.r * 0.7} C${cpx1},${cpy1} ${cpx2},${cpy2} ${endX},${rootY}`;
    const w = 2.2 - i * 0.18;

    // Glow
    mkSVG('path', {
      d, fill: 'none',
      stroke: 'rgba(40,30,80,0.30)',
      'stroke-width': (w + 2).toString(),
      'stroke-linecap': 'round',
      filter: 'url(#f-root)'
    }, rootGroup);

    // Main root
    mkSVG('path', {
      d, fill: 'none',
      stroke: 'rgba(50,65,100,0.45)',
      'stroke-width': w.toString(),
      'stroke-linecap': 'round',
    }, rootGroup);
  }
}

// ─── NODE RENDERING ──────────────────────────────────────────────────────────
function gradientId(type) {
  if (type === 'core') return 'url(#grad-core)';
  if (type === 'main') return 'url(#grad-main)';
  if (type === 'cluster') return 'url(#grad-cluster)';
  if (type === 'subcluster') return 'url(#grad-subcluster)';
  return 'url(#grad-topic)';
}

function strokeColor(type) {
  if (type === 'core') return 'rgba(200,220,255,0.75)';
  if (type === 'main') return 'rgba(110,140,210,0.55)';
  if (type === 'cluster') return 'rgba(80,105,175,0.50)';
  if (type === 'subcluster') return 'rgba(90,115,185,0.48)';
  return 'rgba(150,180,230,0.60)';
}

function strokeWidth(type) {
  if (type === 'core') return '2.5';
  if (type === 'main') return '1.8';
  if (type === 'cluster') return '1.5';
  return '1.2';
}

function labelColor(type) {
  if (type === 'core') return 'rgba(210,230,255,0.95)';
  if (type === 'main') return 'rgba(170,195,240,0.90)';
  if (type === 'cluster') return 'rgba(140,170,220,0.85)';
  if (type === 'subcluster') return 'rgba(130,160,215,0.82)';
  return 'rgba(110,145,205,0.80)';
}

function fontSize(type) {
  if (type === 'core') return '13';
  if (type === 'main') return '9.5';
  if (type === 'cluster') return '8';
  if (type === 'subcluster') return '7.5';
  return '6.5';
}

function buildNodes() {
  while (nodeGroup.firstChild) nodeGroup.removeChild(nodeGroup.firstChild);

  // Sort: core last (on top), then main, cluster, topic first
  const order = ['topic', 'subcluster', 'cluster', 'main', 'core'];
  const sorted = [...NODES].sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type));

  sorted.forEach(nd => {
    const n = nodeMap[nd.id];
    if (!n) return;

    const g = mkSVG('g', {
      'data-id': nd.id,
      transform: `translate(${n.x},${n.y})`,
      style: 'cursor: grab'
    }, nodeGroup);

    // Glow halo for core and main
    if (nd.type === 'core' || nd.type === 'main') {
      const haloR = n.r * (nd.type === 'core' ? 1.9 : 1.6);
      const haloGrad = nd.type === 'core' ? 'rgba(130,160,220,0.18)' : 'rgba(90,115,185,0.12)';
      mkSVG('circle', {
        cx: '0', cy: '0', r: haloR.toString(),
        fill: haloGrad,
        filter: 'url(#f-rim)'
      }, g);
    }

    // Rim highlight arc (top-left)
    if (nd.type !== 'topic') {
      mkSVG('circle', {
        cx: '0', cy: '0', r: n.r.toString(),
        fill: 'none',
        stroke: nd.type === 'core' ? 'rgba(220,235,255,0.20)' : 'rgba(140,170,230,0.12)',
        'stroke-width': nd.type === 'core' ? '6' : '4',
        filter: 'url(#f-rim)'
      }, g);
    }

    // Main circle
    mkSVG('circle', {
      cx: '0', cy: '0', r: n.r.toString(),
      fill: gradientId(nd.type),
      stroke: strokeColor(nd.type),
      'stroke-width': strokeWidth(nd.type)
    }, g);

    // Inner highlight crescent
    if (nd.type === 'core' || nd.type === 'main' || nd.type === 'cluster') {
      const hlr = n.r * 0.7;
      mkSVG('circle', {
        cx: (-n.r * 0.22).toString(),
        cy: (-n.r * 0.22).toString(),
        r: hlr.toString(),
        fill: 'rgba(200,220,255,0.04)',
        stroke: 'none'
      }, g);
    }

    // Label
    const labelY = nd.type === 'core' ? n.r + 16 :
                   nd.type === 'main' ? n.r + 13 :
                   nd.type === 'cluster' ? n.r + 12 :
                   nd.type === 'subcluster' ? n.r + 11 :
                   n.r + 10;

    const txt = mkSVG('text', {
      x: '0',
      y: labelY.toString(),
      'text-anchor': 'middle',
      'font-size': fontSize(nd.type),
      'font-family': 'system-ui, -apple-system, sans-serif',
      'letter-spacing': nd.type === 'core' ? '0.15em' : '0.08em',
      'font-weight': nd.type === 'core' ? '300' : '300',
      fill: labelColor(nd.type),
      style: 'pointer-events: none; text-transform: uppercase;'
    }, g);
    txt.textContent = nd.label;
  });
}

// ─── FULL REBUILD ─────────────────────────────────────────────────────────────
function rebuildSVG() {
  computeLayout();
  buildRoots();
  buildBranches();
  buildNodes();
}

// ─── DRAG ────────────────────────────────────────────────────────────────────
let dragging = null;

svgEl.addEventListener('pointerdown', e => {
  const g = e.target.closest('g[data-id]');
  if (!g) return;
  dragging = g.dataset.id;
  g.style.cursor = 'grabbing';
  svgEl.setPointerCapture(e.pointerId);
  e.preventDefault();
}, { passive: false });

svgEl.addEventListener('pointermove', e => {
  if (!dragging) return;
  const rect = svgEl.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const nx = (e.clientX - rect.left) * scaleX;
  const ny = (e.clientY - rect.top) * scaleY;
  nodeMap[dragging].x = nx;
  nodeMap[dragging].y = ny;
  const g = document.querySelector(`g[data-id="${dragging}"]`);
  if (g) g.setAttribute('transform', `translate(${nx},${ny})`);
  updatePaths(dragging);
  if (dragging === 'frqncy') buildRoots();
});

svgEl.addEventListener('pointerup', e => {
  if (dragging) {
    const g = document.querySelector(`g[data-id="${dragging}"]`);
    if (g) g.style.cursor = 'grab';
  }
  dragging = null;
});

// ─── TOOLTIP ──────────────────────────────────────────────────────────────────
svgEl.addEventListener('mousemove', e => {
  const g = e.target.closest('g[data-id]');
  if (g) {
    tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px';
    tip.style.top = (e.clientY - 20) + 'px';
    const n = nodeMap[g.dataset.id];
    if (n) tip.textContent = n.label;
  } else {
    tip.style.display = 'none';
  }
});

svgEl.addEventListener('mouseleave', () => { tip.style.display = 'none'; });

// ─── PARTICLES ───────────────────────────────────────────────────────────────
const particles = [];

function initParticles() {
  particles.length = 0;
  // Create particles for each branch
  LINKS.forEach(([srcId, tgtId]) => {
    const s = nodeMap[srcId], t = nodeMap[tgtId];
    if (!s || !t) return;
    // Only some branches get particles
    if (Math.random() > 0.55) return;
    particles.push({
      src: srcId,
      tgt: tgtId,
      t: Math.random(),
      speed: (Math.random() * 0.003 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
      size: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.5 + 0.25
    });
  });
}

function quadPoint(x1, y1, cpx, cpy, x2, y2, t) {
  const mt = 1 - t;
  return {
    x: mt * mt * x1 + 2 * mt * t * cpx + t * t * x2,
    y: mt * mt * y1 + 2 * mt * t * cpy + t * t * y2
  };
}

function getControlPoint(s, t_node, level) {
  if (level === 'cluster-to-topic') {
    const cpx = (s.x + t_node.x) / 2 + (cx - (s.x + t_node.x) / 2) * 0.06;
    const cpy = Math.min(s.y, t_node.y) - 45;
    return { cpx, cpy };
  }
  if (level === 'core-to-main') {
    const cpx = (s.x + t_node.x) / 2 + (cx - (s.x + t_node.x) / 2) * 0.12;
    const cpy = (s.y + t_node.y) / 2 - Math.abs(s.x - t_node.x) * 0.18;
    return { cpx, cpy };
  }
  if (level === 'main-to-cluster') {
    const cpx = (s.x + t_node.x) / 2;
    const cpy = (s.y + t_node.y) / 2 - Math.abs(s.x - t_node.x) * 0.12 - 20;
    return { cpx, cpy };
  }
  if (level === 'topic-to-topic') {
    const cpx = (s.x + t_node.x) / 2;
    const cpy = Math.min(s.y, t_node.y) - 20;
    return { cpx, cpy };
  }
  const cpx = (s.x + t_node.x) / 2 + (cx - (s.x + t_node.x) / 2) * 0.08;
  const cpy = (s.y + t_node.y) / 2 - Math.abs(s.x - t_node.x) * 0.08 - 10;
  return { cpx, cpy };
}

function animateParticles(time) {
  pCtx.clearRect(0, 0, CW, CH);

  particles.forEach(p => {
    const s = nodeMap[p.src], t = nodeMap[p.tgt];
    if (!s || !t) return;

    // Advance
    p.t += p.speed;
    if (p.t > 1) p.t = 0;
    if (p.t < 0) p.t = 1;

    const level = getLinkLevel(p.src, p.tgt);
    const { cpx, cpy } = getControlPoint(s, t, level);
    const pos = quadPoint(s.x, s.y, cpx, cpy, t.x, t.y, Math.max(0, Math.min(1, p.t)));

    // Draw moonbeam wisp
    pCtx.save();
    pCtx.globalAlpha = p.alpha * (0.7 + 0.3 * Math.sin(time * 0.002 + p.t * 6));
    const grad = pCtx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, p.size * 3);
    grad.addColorStop(0, 'rgba(180,210,255,0.75)');
    grad.addColorStop(1, 'rgba(120,160,230,0)');
    pCtx.fillStyle = grad;
    pCtx.beginPath();
    pCtx.arc(pos.x, pos.y, p.size * 3, 0, Math.PI * 2);
    pCtx.fill();
    pCtx.restore();
  });

  requestAnimationFrame(animateParticles);
}

// ─── ANIMATED BACKGROUND (stars twinkle) ─────────────────────────────────────
let lastBgTime = 0;
function animateBg(t) {
  if (t - lastBgTime > 80) {
    lastBgTime = t;
    bgCtx.clearRect(0, 0, CW, CH);
    drawBackground();
    drawStars(t);
  }
  requestAnimationFrame(animateBg);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function init() {
  // Clear SVG
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  buildDefs();

  rootGroup = mkSVG('g', { id: 'roots' }, svgEl);
  branchGroup = mkSVG('g', { id: 'branches' }, svgEl);
  nodeGroup = mkSVG('g', { id: 'nodes' }, svgEl);

  // Initialize nodeMap
  NODES.forEach(n => {
    nodeMap[n.id] = { id: n.id, label: n.label, type: n.type, r: n.r, x: 0, y: 0 };
  });

  resize();
  initStars();
  drawBackground();
  computeLayout();
  buildRoots();
  buildBranches();
  buildNodes();
  initParticles();
  requestAnimationFrame(animateParticles);
  requestAnimationFrame(animateBg);
}

window.addEventListener('resize', () => {
  resize();
  initStars();
  initParticles();
});

init();
</script>
</body>
</html>
