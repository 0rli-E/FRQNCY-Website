.tip-type  { font-size: 10px; letter-spacing: 0.12em; opacity: 0.55; text-transform: uppercase; }

<script>
/* ═══════════════════════════════════════════════════════════════════
   FRQNCY World Tree — Cosmic Yggdrasil v1
   Palette:   navy  #0B1C3D/#081530 background
              gold  #C4973A/#F4DC88→#A06818 core
              deep blue  #3062C8→#081640 clusters
              bark brown #3D1F0A / #5C3015 / #7B4522
              ochre      #8B6914
              cosmic purple-black #1A0A2E
   ═══════════════════════════════════════════════════════════════════ */

// ─── PALETTE ──────────────────────────────────────────────────────────────────
const PAL = {

  ochre: '#8B6914',

// ─── DOMAIN DATA ─────────────────────────────────────────────────────────────
// 8 branches — matches the base version exactly
const BRANCHES = [

    ]
  },
  {

    ]
  },
  {
    id:'d-arts', label:'Arts & Culture', desc:'Expression of the human spirit',
    color:'#FF9E4A',
    topics:[
      {id:'t-music',  label:'Music',        desc:'Sound as meaning'},
      {id:'t-visual', label:'Visual Art',   desc:'Form and pigment'},

      {id:'t-poetry', label:'Poetry',       desc:'Language distilled'},
      {id:'t-story',  label:'Storytelling', desc:'The oldest technology'},
      {id:'t-archit', label:'Architecture', desc:'Space made sacred'},
    ]
  },
  {
    id:'d-nature', label:'Nature & Cosmos', desc:'The living systems of existence',
    color:'#4CAF50',
    topics:[
      {id:'t-forests',  label:'Forests',           desc:'Ancient wood networks'},
      {id:'t-oceans',   label:'Oceans',             desc:'Blue memory of Earth'},
      {id:'t-cosmos',   label:'Stars & Planets',   desc:'Celestial neighbors'},
      {id:'t-climate',  label:'Climate',            desc:'Planetary breath'},
      {id:'t-biodivers',label:'Biodiversity',       desc:'The fullness of life'},
      {id:'t-cycles',   label:'Seasons & Cycles',  desc:'Time\'s spiral rhythms'},
    ]
  },
  {
    id:'d-money', label:'Money', desc:'Capital, crypto, and the new financial layer',
    color:'#FFD166',
    topics:[
      {id:'t-crypto',  label:'Cryptocurrency', desc:'Digital value networks'},

    ]
  },
  {
    id:'d-wellbeing', label:'Well-being', desc:'Healing and wholeness',
    color:'#F15BB5',
    topics:[
      {id:'t-meditation',label:'Meditation',      desc:'Stillness as practice'},
      {id:'t-breathwork',label:'Breathwork',       desc:'Breath as gateway'},
      {id:'t-soundheal', label:'Sound Healing',   desc:'Frequency as medicine'},
      {id:'t-yoga',      label:'Yoga',             desc:'Union of body and mind'},

    ]
  },
  {
    id:'d-society', label:'Society', desc:'Collective human systems',
    color:'#FF6B6B',
    topics:[
      {id:'t-governance',label:'Governance',           desc:'Collective decision making'},
      {id:'t-indigenous',label:'Indigenous Wisdom',    desc:'Ancestral knowing'},
      {id:'t-collective',label:'Collective Intelligence',desc:'Group mind emergence'},
      {id:'t-peace',     label:'Peace Building',       desc:'Conflict into harmony'},
      {id:'t-socialmov', label:'Social Movements',     desc:'Change at scale'},
      {id:'t-community', label:'Community',             desc:'Belonging as foundation'},
    ]
  },
];

// ─── CANVAS / SVG ────────────────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');
const svgEl    = document.getElementById('tree-svg');

// ─── Vanilla SVG helpers (no D3 dependency) ───────────────────────────────────
const _NS = 'http://www.w3.org/2000/svg';
function _mk(tag, attrs, parent) {
  const el = document.createElementNS(_NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  if (parent) parent.appendChild(el);
  return el;
}

let CW, CH, cx, cy;
let builtNodes = [], builtLinks = [], particles = [];
let lastSpawn = 0, lastBifrost = 0;
let hoveredId = null;

// ─── STARS (realm-aware density) ─────────────────────────────────────────────
const STARS = [];
for (let i = 0; i < 320; i++) {
  const ry = Math.pow(Math.random(), 1.6); // bias toward top (sky realm)
  const brightness = ry < 0.5 ? 0.12 + Math.random() * 0.45 : 0.05 + Math.random() * 0.18;
  STARS.push({
    rx:    Math.random(),
    ry:    ry,
    r:     Math.random() * 1.4 + 0.15,
    base:  brightness,
    phase: Math.random() * Math.PI * 2,
    speed: 0.4 + Math.random() * 1.2,
    blue:  ry < 0.35, // upper stars slightly bluer
  });
}

// ─── RUNIC MARKS (pre-computed angles for the trunk ring) ─────────────────────
const RUNE_ANGLES = [];
for (let i = 0; i < 24; i++) RUNE_ANGLES.push(i / 24 * Math.PI * 2);

// ─── CUBIC BEZIER HELPER ─────────────────────────────────────────────────────
function cubicBezierPoint(x1,y1, cx1,cy1, cx2,cy2, x2,y2, t) {
  const mt = 1 - t;
  return {
    x: mt*mt*mt*x1 + 3*mt*mt*t*cx1 + 3*mt*t*t*cx2 + t*t*t*x2,
    y: mt*mt*mt*y1 + 3*mt*mt*t*cy1 + 3*mt*t*t*cy2 + t*t*t*y2,
  };
}

// ─── SERPENTINE PATH (sinusoidal wobble via cubic bezier offsets) ─────────────
// Generates a cubic bezier d-string with snake-like control points
function serpentinePath(x1,y1, x2,y2, wobble, direction) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx = -dy/len, ny = dx/len; // normal

  // Two control points offset in opposite directions to create S-curve
  const t1 = 0.35, t2 = 0.65;
  const sign1 = direction;
  const sign2 = -direction;

  const cp1x = x1 + dx*t1 + nx*wobble*sign1;
  const cp1y = y1 + dy*t1 + ny*wobble*sign1;
  const cp2x = x1 + dx*t2 + nx*wobble*sign2;
  const cp2y = y1 + dy*t2 + ny*wobble*sign2;

  return {
    d: `M${x1},${y1} C${cp1x},${cp1y} ${cp2x},${cp2y} ${x2},${y2}`,
    cp1x, cp1y, cp2x, cp2y
  };
}

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
function buildLayout() {
  const dim    = Math.min(CW, CH);
  const R1     = dim * 0.245;  // domain radius
  const R2     = dim * 0.445;  // topic radius
  const N      = BRANCHES.length;
  const SPREAD = Math.PI * 0.30;

  builtNodes = [];
  builtLinks = [];
  particles  = [];

  const core = {
    id:'frqncy', label:'FRQNCY', type:'core', r:54,
    desc:'The living network of consciousness', x:cx, y:cy
  };
  builtNodes.push(core);

  BRANCHES.forEach((branch, bi) => {
    const baseAngle = (bi / N) * Math.PI * 2 - Math.PI / 2;

    const dx = cx + Math.cos(baseAngle) * R1;
    const dy = cy + Math.sin(baseAngle) * R1;

    // Serpentine direction alternates per branch
    const wobble1 = R1 * 0.22;
    const dir1 = (bi % 2 === 0) ? 1 : -1;
    const trunk = serpentinePath(cx, cy, dx, dy, wobble1, dir1);

    const domainNode = {
      id: branch.id, label: branch.label, type:'cluster', r:25,
      desc: branch.desc, x:dx, y:dy, angle: baseAngle,
      branchColor: branch.color,
      cp1x: trunk.cp1x, cp1y: trunk.cp1y,
      cp2x: trunk.cp2x, cp2y: trunk.cp2y,
    };
    builtNodes.push(domainNode);
    builtLinks.push({
      source: core, target: domainNode, level:0,
      cp1x: trunk.cp1x, cp1y: trunk.cp1y,
      cp2x: trunk.cp2x, cp2y: trunk.cp2y,
      color: branch.color, dir: dir1
    });

    const nt = branch.topics.length;
    branch.topics.forEach((topic, ti) => {
      const tAngle = baseAngle - SPREAD/2 + (ti / (nt - 1 || 1)) * SPREAD;
      const tx = cx + Math.cos(tAngle) * R2;
      const ty = cy + Math.sin(tAngle) * R2;

      const wobble2 = Math.sqrt((tx-dx)*(tx-dx)+(ty-dy)*(ty-dy)) * 0.14;
      const dir2 = ((ti + bi) % 2 === 0) ? 1 : -1;
      const branch2 = serpentinePath(dx, dy, tx, ty, wobble2, dir2);

      const topicNode = {
        id: topic.id, label: topic.label, type:'topic', r:13,
        desc: topic.desc || '',
        x:tx, y:ty, angle: tAngle,
        branchColor: branch.color,
        cp1x: branch2.cp1x, cp1y: branch2.cp1y,
        cp2x: branch2.cp2x, cp2y: branch2.cp2y,
      };
      builtNodes.push(topicNode);
      builtLinks.push({
        source: domainNode, target: topicNode, level:1,
        cp1x: branch2.cp1x, cp1y: branch2.cp1y,
        cp2x: branch2.cp2x, cp2y: branch2.cp2y,
        color: branch.color, dir: dir2
      });
    });
  });
}

// ─── SVG RENDERING (vanilla DOM — no external dependencies) ──────────────────
function renderSVG() {
  // Clear
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  const defs = _mk('defs', {}, svgEl);

  // Node gradients
  [
    { id:'g-core',    c1:'#F4DC88', c2:'#A06818' },
    { id:'g-cluster', c1:'#3062C8', c2:'#081640' },
    { id:'g-topic',   c1:'#213E88', c2:'#060E24' },
  ].forEach(g => {
    const gr = _mk('radialGradient', {id: g.id, cx:'38%', cy:'30%'}, defs);
    _mk('stop', {offset:'0%',   'stop-color': g.c1}, gr);
    _mk('stop', {offset:'100%', 'stop-color': g.c2}, gr);
  });

  // Glow filters
  function mkGlow(id, x, y, w, h, std) {
    const f = _mk('filter', {id, x, y, width: w, height: h}, defs);
    _mk('feGaussianBlur', {stdDeviation: std, result:'blur'}, f);
    const m = _mk('feMerge', {}, f);
    _mk('feMergeNode', {in:'blur'}, m);
    _mk('feMergeNode', {in:'SourceGraphic'}, m);
  }
  mkGlow('glow-core',    '-80%','-80%','260%','260%', 10);
  mkGlow('glow-topic',   '-60%','-60%','220%','220%', 5);
  mkGlow('glow-cluster', '-50%','-50%','200%','200%', 7);

  // ── Runic ring ─────────────────────────────────────────────────────────────
  const runicG = _mk('g', {class:'runic-ring', transform:`translate(${cx},${cy})`}, svgEl);

  _mk('circle', {r:110, fill:'none', stroke:'rgba(139,105,20,0.10)', 'stroke-width':1.5, 'stroke-dasharray':'3,8'}, runicG);
  _mk('circle', {r:90,  fill:'none', stroke:'rgba(196,151,58,0.14)', 'stroke-width':1,   'stroke-dasharray':'1,6'}, runicG);
  _mk('circle', {r:75,  fill:'none', stroke:'rgba(92,48,21,0.22)',   'stroke-width':2.5, 'stroke-dasharray':'6,5'}, runicG);

  RUNE_ANGLES.forEach((angle, i) => {
    const isLong = i % 3 === 0;
    const r0 = 75, r1 = r0 - (isLong ? 12 : 6);
    const x0 = Math.cos(angle)*r0, y0 = Math.sin(angle)*r0;
    const x1c = Math.cos(angle)*r1, y1c = Math.sin(angle)*r1;
    _mk('line', {x1:x0, y1:y0, x2:x1c, y2:y1c,
      stroke: isLong ? 'rgba(196,151,58,0.45)' : 'rgba(139,105,20,0.28)',
      'stroke-width': isLong ? 1.5 : 0.8}, runicG);
    if (isLong) {
      const px = -Math.sin(angle)*4, py = Math.cos(angle)*4;
      const mx = Math.cos(angle)*(r0-5), my = Math.sin(angle)*(r0-5);
      _mk('line', {x1:mx-px, y1:my-py, x2:mx+px, y2:my+py,
        stroke:'rgba(196,151,58,0.38)', 'stroke-width':0.9}, runicG);
    }
  });

  for (let i = 0; i < 8; i++) {
    const a = i/8 * Math.PI*2;
    _mk('line', {
      x1:Math.cos(a)*30, y1:Math.sin(a)*30,
      x2:Math.cos(a)*70, y2:Math.sin(a)*70,
      stroke:'rgba(139,105,20,0.18)', 'stroke-width':0.7}, runicG);
  }

  // ── Branch paths ──────────────────────────────────────────────────────────
  const branchG = _mk('g', {class:'branches'}, svgEl);

  builtLinks.filter(l => l.level === 0).forEach(link => {
    const s = link.source, t = link.target;
    const d = `M${s.x},${s.y} C${link.cp1x},${link.cp1y} ${link.cp2x},${link.cp2y} ${t.x},${t.y}`;
    _mk('path', {d, fill:'none', stroke:'rgba(61,31,10,0.65)',   'stroke-width':11, 'stroke-linecap':'round'}, branchG);
    _mk('path', {d, fill:'none', stroke:'rgba(92,48,21,0.70)',   'stroke-width':7,  'stroke-linecap':'round'}, branchG);
    _mk('path', {d, fill:'none', stroke:'rgba(139,105,20,0.28)', 'stroke-width':2,  'stroke-linecap':'round'}, branchG);
  });

  builtLinks.filter(l => l.level === 1).forEach(link => {
    const s = link.source, t = link.target;
    const d = `M${s.x},${s.y} C${link.cp1x},${link.cp1y} ${link.cp2x},${link.cp2y} ${t.x},${t.y}`;
    const col = link.color;
    _mk('path', {d, fill:'none', stroke:'rgba(61,31,10,0.42)', 'stroke-width':4, 'stroke-linecap':'round'}, branchG);
    _mk('path', {d, fill:'none', stroke:`${col}44`,            'stroke-width':2, 'stroke-linecap':'round'}, branchG);
    _mk('path', {d, fill:'none', stroke:`${col}18`,            'stroke-width':5, 'stroke-linecap':'round'}, branchG);
  });

  // ── Nodes ─────────────────────────────────────────────────────────────────
  const nodeG = _mk('g', {class:'nodes'}, svgEl);
  const tip = document.getElementById('nm-tooltip');
  const nodeEls = []; // for hover dim/restore

  builtNodes.forEach(node => {
    const g = _mk('g', {class:'node', transform:`translate(${node.x},${node.y})`, 'data-id': node.id}, nodeG);
    g.style.cursor = 'pointer';
    nodeEls.push({ el: g, node });

    if (node.type === 'topic') {
      _mk('circle', {r: node.r * 2.8, fill:'none',
        stroke: node.branchColor + '2A', 'stroke-width':8, filter:'url(#glow-topic)'}, g);
      _mk('circle', {r: node.r * 1.8, fill: node.branchColor + '12', stroke:'none'}, g);
    }
    if (node.type === 'cluster') {
      _mk('circle', {r: node.r * 2.4, fill: node.branchColor + '18',
        stroke: node.branchColor + '30', 'stroke-width':3, filter:'url(#glow-cluster)'}, g);
    }

    const fillRef  = node.type === 'core' ? 'url(#g-core)' : node.type === 'cluster' ? 'url(#g-cluster)' : 'url(#g-topic)';
    const strokeC  = node.type === 'core' ? '#E0C06A' : node.type === 'cluster' ? (node.branchColor + 'AA') : '#1A3A8F';
    const strokeW  = node.type === 'core' ? 2.5 : node.type === 'cluster' ? 1.5 : 1;
    const circAttr = {r: node.r, fill: fillRef, stroke: strokeC, 'stroke-width': strokeW};
    if (node.type === 'core') circAttr.filter = 'url(#glow-core)';
    _mk('circle', circAttr, g);

    if (node.type !== 'dot') {
      const txt = _mk('text', {
        'text-anchor':'middle', 'dominant-baseline':'central',
        fill: node.type === 'core' ? '#0A1220' : node.type === 'cluster' ? '#E8C97D' : 'rgba(172,202,255,0.88)',
        'font-family': node.type === 'core' ? 'Cormorant,Georgia,serif' : "'Jost',sans-serif",
        'font-size':    node.type === 'core' ? '15px' : node.type === 'cluster' ? '9.5px' : '8px',
        'font-weight':  node.type === 'core' ? '500' : '300',
        'letter-spacing': node.type === 'core' ? '0.18em' : '0.04em',
        'pointer-events':'none',
      }, g);
      if (node.type === 'topic' && node.label.length > 14) {
        const words = node.label.split(' ');
        const mid = Math.ceil(words.length / 2);
        const ts1 = _mk('tspan', {x:0, dy:'-0.5em'}, txt); ts1.textContent = words.slice(0, mid).join(' ');
        const ts2 = _mk('tspan', {x:0, dy:'1em'},    txt); ts2.textContent = words.slice(mid).join(' ');
      } else {
        txt.textContent = node.label;
      }
    }

    // Hover handlers
    g.addEventListener('mouseover', (e) => {
      hoveredId = node.id;
      if (tip) {
        tip.querySelector('.tip-title').textContent = node.label;
        const typeLabel = {core:'FRQNCY Core', cluster:'Domain', topic:'Topic'}[node.type] || '';
        tip.querySelector('.tip-type').innerHTML =
          `<span class="tip-dot" style="background:${node.branchColor || '#C4973A'}"></span>` +
          (node.desc ? node.desc + ' · ' : '') + typeLabel;
        tip.style.opacity = '1';
      }
      nodeEls.forEach(({el, node: n}) => {
        if (n.id === node.id || n.id === 'frqncy') { el.style.opacity = '1'; return; }
        if (node.type === 'core') { el.style.opacity = '0.4'; return; }
        const connected = builtLinks.some(l =>
          (l.source.id === node.id && l.target.id === n.id) ||
          (l.target.id === node.id && l.source.id === n.id));
        el.style.opacity = connected ? '1' : '0.18';
      });
    });
    g.addEventListener('mousemove', (e) => {
      if (tip) { tip.style.left = (e.clientX + 18) + 'px'; tip.style.top = (e.clientY - 18) + 'px'; }
    });
    g.addEventListener('mouseout', () => {
      hoveredId = null;
      if (tip) tip.style.opacity = '0';
      nodeEls.forEach(({el}) => el.style.opacity = '1');
    });
  });
}

// ─── PARTICLE SYSTEM ─────────────────────────────────────────────────────────
function spawnParticle() {
  if (particles.length > 220 || !builtLinks.length) return;
  const link = builtLinks[Math.floor(Math.random() * builtLinks.length)];
  const isBifrost = link.level === 1 && Math.random() < 0.25;
  const isReverse = Math.random() < 0.15; // occasionally reverse flow

  particles.push({
    sx: isReverse ? link.target.x : link.source.x,
    sy: isReverse ? link.target.y : link.source.y,
    cp1x: isReverse ? link.cp2x : link.cp1x,
    cp1y: isReverse ? link.cp2y : link.cp1y,
    cp2x: isReverse ? link.cp1x : link.cp2x,
    cp2y: isReverse ? link.cp1y : link.cp2y,
    tx: isReverse ? link.source.x : link.target.x,
    ty: isReverse ? link.source.y : link.target.y,
    prog: 0,
    speed: 0.006 + Math.random() * 0.010,
    level: link.level,
    isBifrost,
    bifrostColor: PAL.bifrost[Math.floor(Math.random() * PAL.bifrost.length)],
    branchColor: link.color,
  });
}

// ─── BACKGROUND RENDER ───────────────────────────────────────────────────────
function drawBackground(ts) {
  // Three-realm gradient
  const bgGr = bgCtx.createLinearGradient(0, 0, 0, CH);
  bgGr.addColorStop(0,    '#06091A');     // deep sky void
  bgGr.addColorStop(0.12, '#0B1040');     // upper stars realm
  bgGr.addColorStop(0.35, '#0A1C3E');
  bgGr.addColorStop(0.50, '#081530');     // middle world
  bgGr.addColorStop(0.65, '#090E22');
  bgGr.addColorStop(0.80, '#0D0A18');     // root realm blending purple
  bgGr.addColorStop(0.90, '#120820');     // Niflheim purple-black
  bgGr.addColorStop(1,    '#1A0A2E');     // deepest roots
  bgCtx.fillStyle = bgGr;
  bgCtx.fillRect(0, 0, CW, CH);

  // Nebula haze in upper third (cosmic dust)
  const nebulaGr = bgCtx.createRadialGradient(cx*0.6, CH*0.12, 0, cx*0.6, CH*0.18, CW*0.38);
  nebulaGr.addColorStop(0,   'rgba(48,62,200,0.07)');
  nebulaGr.addColorStop(0.5, 'rgba(26,10,46,0.04)');
  nebulaGr.addColorStop(1,   'rgba(0,0,0,0)');
  bgCtx.fillStyle = nebulaGr;
  bgCtx.fillRect(0, 0, CW, CH);

  const nebulaGr2 = bgCtx.createRadialGradient(cx*1.5, CH*0.08, 0, cx*1.5, CH*0.15, CW*0.30);
  nebulaGr2.addColorStop(0,   'rgba(155,93,229,0.06)');
  nebulaGr2.addColorStop(0.6, 'rgba(26,10,46,0.03)');
  nebulaGr2.addColorStop(1,   'rgba(0,0,0,0)');
  bgCtx.fillStyle = nebulaGr2;
  bgCtx.fillRect(0, 0, CW, CH);

  // Root realm earthy haze (lower quarter)
  const rootGr = bgCtx.createRadialGradient(cx, CH*0.92, 0, cx, CH*0.95, CW*0.50);
  rootGr.addColorStop(0,   'rgba(61,31,10,0.18)');
  rootGr.addColorStop(0.5, 'rgba(26,10,46,0.08)');
  rootGr.addColorStop(1,   'rgba(0,0,0,0)');
  bgCtx.fillStyle = rootGr;
  bgCtx.fillRect(0, 0, CW, CH);
}

function drawStars(ts) {
  const t = ts * 0.00042;
  STARS.forEach(s => {
    const a = s.base * (0.60 + 0.40 * Math.sin(t * s.speed + s.phase));
    const col = s.blue ? `rgba(180,210,255,${a.toFixed(2)})` : `rgba(255,255,255,${a.toFixed(2)})`;
    bgCtx.fillStyle = col;
    bgCtx.beginPath();
    bgCtx.arc(s.rx * CW, s.ry * CH, s.r, 0, Math.PI*2);
    bgCtx.fill();
  });
}

function drawGlows() {
  if (!builtNodes.length) return;

  // Topic glows (per-branch color)
  builtNodes.filter(n => n.type === 'topic').forEach(n => {
    const col = n.branchColor || '#3062C8';
    const hexToRgb = hex => {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return [r,g,b];
    };
    const [r,g,b] = hexToRgb(col);
    const gr = bgCtx.createRadialGradient(n.x, n.y, n.r, n.x, n.y, n.r*4.5);
    gr.addColorStop(0,    `rgba(${r},${g},${b},0.14)`);
    gr.addColorStop(0.45, `rgba(${r},${g},${b},0.04)`);
    gr.addColorStop(1,    `rgba(${r},${g},${b},0)`);
    bgCtx.fillStyle = gr;
    bgCtx.beginPath();
    bgCtx.arc(n.x, n.y, n.r*4.5, 0, Math.PI*2);
    bgCtx.fill();
  });

  // Domain cluster glows (deep blue)
  builtNodes.filter(n => n.type === 'cluster').forEach(n => {
    const gr = bgCtx.createRadialGradient(n.x, n.y, n.r*0.5, n.x, n.y, n.r*3.0);
    gr.addColorStop(0, 'rgba(48,98,200,0.20)');
    gr.addColorStop(1, 'rgba(48,98,200,0)');
    bgCtx.fillStyle = gr;
    bgCtx.beginPath();
    bgCtx.arc(n.x, n.y, n.r*3.0, 0, Math.PI*2);
    bgCtx.fill();
  });

  // Core gold glow
  const core = builtNodes.find(n => n.type === 'core');
  if (core) {
    const gr = bgCtx.createRadialGradient(core.x, core.y, core.r*0.5, core.x, core.y, core.r*4.5);
    gr.addColorStop(0,   'rgba(196,151,58,0.32)');
    gr.addColorStop(0.4, 'rgba(139,105,20,0.12)');
    gr.addColorStop(0.7, 'rgba(92,48,21,0.05)');
    gr.addColorStop(1,   'rgba(196,151,58,0)');
    bgCtx.fillStyle = gr;
    bgCtx.beginPath();
    bgCtx.arc(core.x, core.y, core.r*4.5, 0, Math.PI*2);
    bgCtx.fill();

    // Trunk bark rings on canvas
    bgCtx.save();
    bgCtx.globalAlpha = 0.28;
    bgCtx.strokeStyle = PAL.bark1;
    bgCtx.lineWidth = 16;
    bgCtx.beginPath();
    bgCtx.arc(core.x, core.y, core.r + 20, 0, Math.PI*2);
    bgCtx.stroke();
    bgCtx.lineWidth = 8;
    bgCtx.strokeStyle = PAL.bark0;
    bgCtx.beginPath();
    bgCtx.arc(core.x, core.y, core.r + 34, 0, Math.PI*2);
    bgCtx.stroke();
    bgCtx.lineWidth = 3;
    bgCtx.strokeStyle = PAL.ochre + '44';
    bgCtx.setLineDash([5,9]);
    bgCtx.beginPath();
    bgCtx.arc(core.x, core.y, core.r + 48, 0, Math.PI*2);
    bgCtx.stroke();
    bgCtx.setLineDash([]);
    bgCtx.restore();
  }
}

function drawParticles(ts) {
  if (ts - lastSpawn > 110) { spawnParticle(); lastSpawn = ts; }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.prog += p.speed;
    if (p.prog >= 1) { particles.splice(i, 1); continue; }

    const pt = cubicBezierPoint(p.sx, p.sy, p.cp1x, p.cp1y, p.cp2x, p.cp2y, p.tx, p.ty, p.prog);
    const fade = Math.min(p.prog*5, 1) * Math.min((1-p.prog)*5, 1);

    if (p.level === 0) {
      // Gold particles on trunk branches
      bgCtx.fillStyle = `rgba(240,210,95,${(0.90*fade).toFixed(2)})`;
      bgCtx.beginPath();
      bgCtx.arc(pt.x, pt.y, 2.4, 0, Math.PI*2);
      bgCtx.fill();
      // Tiny glow halo
      const halo = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 8);
      halo.addColorStop(0, `rgba(240,210,95,${(0.25*fade).toFixed(2)})`);
      halo.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = halo;
      bgCtx.beginPath();
      bgCtx.arc(pt.x, pt.y, 8, 0, Math.PI*2);
      bgCtx.fill();
    } else if (p.isBifrost) {
      // Rainbow Bifröst particles on outer branches
      const col = p.bifrostColor;
      const hex = col.replace('#','');
      const r = parseInt(hex.slice(0,2),16), g2 = parseInt(hex.slice(2,4),16), b = parseInt(hex.slice(4,6),16);
      bgCtx.fillStyle = `rgba(${r},${g2},${b},${(0.85*fade).toFixed(2)})`;
      bgCtx.beginPath();
      bgCtx.arc(pt.x, pt.y, 2.0, 0, Math.PI*2);
      bgCtx.fill();
      const halo2 = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 10);
      halo2.addColorStop(0, `rgba(${r},${g2},${b},${(0.20*fade).toFixed(2)})`);
      halo2.addColorStop(1, 'rgba(0,0,0,0)');
      bgCtx.fillStyle = halo2;
      bgCtx.beginPath();
      bgCtx.arc(pt.x, pt.y, 10, 0, Math.PI*2);
      bgCtx.fill();
    } else {
      // Standard branch-colored particles
      const col = p.branchColor || '#3062C8';
      const hexP = col.replace('#','');
      const r = parseInt(hexP.slice(0,2),16), g2 = parseInt(hexP.slice(2,4),16), b = parseInt(hexP.slice(4,6),16);
      bgCtx.fillStyle = `rgba(${r},${g2},${b},${(0.65*fade).toFixed(2)})`;
      bgCtx.beginPath();
      bgCtx.arc(pt.x, pt.y, 1.4, 0, Math.PI*2);
      bgCtx.fill();
    }
  }
}

// ─── MAIN RENDER LOOP ────────────────────────────────────────────────────────
function render(ts) {
  requestAnimationFrame(render);
  bgCtx.clearRect(0, 0, CW, CH);
  drawBackground(ts);
  drawStars(ts);
  drawGlows();
  drawParticles(ts);
}

// ─── RESIZE & BOOT ───────────────────────────────────────────────────────────
function resize() {
  CW = bgCanvas.width  = window.innerWidth;
  CH = bgCanvas.height = window.innerHeight;
  cx = CW / 2;
  cy = CH / 2;
  buildLayout();
  renderSVG();
}

window.addEventListener('resize', () => { clearTimeout(resize._t); resize._t = setTimeout(resize, 120); }, {passive:true});

resize();
requestAnimationFrame(render);
</script>
</body>
