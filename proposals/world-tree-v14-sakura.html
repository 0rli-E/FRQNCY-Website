    // ===== LAYOUT CALCULATION =====
    const nodeMap = {}; // id -> {x, y, label, type, desc}

      // Cluster nodes — y range 0.18–0.38, x spread ±CW*0.44
      clusterNodes.forEach((n, i) => {
        const t = i / (clusterNodes.length - 1);
        const x = CW * 0.50 + (t - 0.5) * 2 * CW * 0.44;
        const yOff = Math.sin(t * Math.PI) * 0.08;
        const y = CH * (0.30 - yOff);
        nodeMap[n.id] = { x, y };
      });

      // Subclusters — between cluster and topic zones
      subclusters.forEach((n, i) => {
        const t = i / Math.max(subclusters.length - 1, 1);
        const x = CW * 0.60 + (t - 0.5) * 2 * CW * 0.28;
        const y = CH * 0.20;
        nodeMap[n.id] = { x, y };
      });

      // Topic nodes — distributed across top zone
      topicNodes.forEach((n, i) => {
        const t = i / (topicNodes.length - 1);
        const x = CW * 0.50 + (t - 0.5) * 2 * CW * 0.48;
        const rowCount = 4;
        const row = i % rowCount;
        const y = CH * (0.06 + row * 0.07);
        nodeMap[n.id] = { x, y };
      });

      // Copy metadata
      HOME_NODES.forEach(n => {
        if (nodeMap[n.id]) {
          nodeMap[n.id].label = n.label;
          nodeMap[n.id].type = n.type;
          nodeMap[n.id].desc = n.desc || '';

    calcLayout();

    // ===== PETALS =====
    const PETAL_COLORS = ['#FFB7C5','#FF8FA3','#FFCDD5','#FFAAB8'];
    const petals = Array.from({length: 120}, () => ({

      y: Math.random() * CH,

      vy: Math.random() * 0.6 + 0.3,
      rot: Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.03,

    // ===== LANTERNS =====
    const lanterns = Array.from({length: 4}, (_, i) => ({
      x: CW * (0.15 + i * 0.22),
      y: CH * (0.5 + Math.random() * 0.4),
      vy: -(Math.random() * 0.18 + 0.08),

    // ===== BRANCH PATHS =====
    // Build path elements in SVG
    const pathsLayer = document.createElementNS('http://www.w3.org/2000/svg','g');

    const nodesLayer = document.createElementNS('http://www.w3.org/2000/svg','g');

    svgEl.appendChild(nodesLayer);

    const branchPaths = [];

    function curvePath(x1, y1, x2, y2) {
      const cpx = (x1 + x2) / 2;
      const cpy = Math.min(y1, y2) - Math.abs(x2 - x1) * 0.3 - 30;
      return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
    }

    function getLinkStyle(src, tgt) {
      const sType = nodeMap[src] ? nodeMap[src].type : 'topic';
      const tType = nodeMap[tgt] ? nodeMap[tgt].type : 'topic';
      const isMain = sType === 'core' || tType === 'core' || sType === 'main' || tType === 'main';
      const isCluster = !isMain && (sType === 'cluster' || tType === 'cluster' || sType === 'subcluster' || tType === 'subcluster');
      if (isMain) return { stroke: 'rgba(220,120,150,0.75)', width: 2.5 };
      if (isCluster) return { stroke: 'rgba(168,80,100,0.55)', width: 1.5 };
      return { stroke: 'rgba(200,100,130,0.30)', width: 1 };
    }

    HOME_RAW_LINKS.forEach(pair => {
      const [src, tgt] = pair;
      if (!nodeMap[src] || !nodeMap[tgt]) return;
      const style = getLinkStyle(src, tgt);
      const pathEl = document.createElementNS('http://www.w3.org/2000/svg','path');
      pathEl.setAttribute('fill','none');
      pathEl.setAttribute('stroke', style.stroke);
      pathEl.setAttribute('stroke-width', style.width);
      pathEl.setAttribute('stroke-linecap','round');
      const s = nodeMap[src], t = nodeMap[tgt];
      pathEl.setAttribute('d', curvePath(s.x, s.y, t.x, t.y));
      pathsLayer.appendChild(pathEl);
      branchPaths.push({ src, tgt, el: pathEl });
    });

    function updatePaths(id) {
      branchPaths.forEach(bp => {
        if (bp.src !== id && bp.tgt !== id) return;
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        bp.el.setAttribute('d', curvePath(s.x, s.y, t.x, t.y));
      });
    }

    // ===== SVG NODES =====
    const svgGroups = {};

    function nodeRadius(type) {
      if (type === 'core') return 28;
      if (type === 'main') return 18;
      if (type === 'cluster') return 13;
      if (type === 'subcluster') return 11;
      return 7;
    }

    function nodeFill(type) {
      if (type === 'core') return '#FFFFFF';
      if (type === 'main') return 'url(#grad-main)';
      if (type === 'cluster') return 'url(#grad-cluster)';
      if (type === 'subcluster') return 'url(#grad-subcluster)';
      return 'url(#grad-topic)';
    }

    // Gradients
    const gradDefs = [
      {id:'grad-main', c1:'#C42060', c2:'#8B1A3A'},

    gradDefs.forEach(g => {

        text.setAttribute('font-family','sans-serif');

    // ===== DRAG =====

    // ===== CANVAS ANIMATION =====
    function drawBackground() {

    function drawMoon() {
      const mx = CW * 0.12;
      const my = CH * 0.10;
      const mr = 70;

      // Outer glow
      const moonGlow = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 2.8);
      moonGlow.addColorStop(0, 'rgba(255,220,230,0.18)');
      moonGlow.addColorStop(0.5, 'rgba(255,200,215,0.06)');
      moonGlow.addColorStop(1, 'rgba(255,183,197,0)');
      ctx.fillStyle = moonGlow;
      ctx.beginPath();
      ctx.arc(mx, my, mr * 2.8, 0, Math.PI * 2);
      ctx.fill();

      // Moon body
      const moonBody = ctx.createRadialGradient(mx - mr * 0.2, my - mr * 0.2, 0, mx, my, mr);
      moonBody.addColorStop(0, 'rgba(255,248,252,0.95)');
      moonBody.addColorStop(0.6, 'rgba(255,230,240,0.88)');
      moonBody.addColorStop(1, 'rgba(240,200,215,0.75)');
      ctx.fillStyle = moonBody;
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.fill();

      // Subtle rim
      ctx.strokeStyle = 'rgba(255,183,197,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, Math.PI * 2);
      ctx.stroke();
    }

    function updatePetals(ts) {
      petals.forEach(p => {
        p.x += p.vx + Math.sin(ts * 0.0005 + p.rot) * 0.3;
        p.y += p.vy;
        p.rot += p.rotV;
        if (p.y > CH + 20) { p.y = -10; p.x = Math.random() * CW; }
        if (p.x < -20) p.x = CW + 10;
        if (p.x > CW + 20) p.x = -10;
      });
    }

    function drawPetals() {
      petals.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.ellipse(0, 0, p.size * 1.4, p.size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      ctx.globalAlpha = 1;
    }

    function updateLanterns(ts) {
      lanterns.forEach(l => {
        l.y += l.vy;
        l.x += l.vx + Math.sin(ts * 0.0004 + l.phase) * 0.1;
        if (l.y < -40) {
          l.y = CH + 20;
          l.x = Math.random() * CW * 0.8 + CW * 0.1;
        }
      });
    }

    function drawLanterns(ts) {
      lanterns.forEach(l => {
        const pulse = 0.8 + 0.2 * Math.sin(ts * 0.001 + l.phase);
        // Glow
        const lg = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 3);
        lg.addColorStop(0, `rgba(255,160,80,${l.opacity * pulse * 0.5})`);
        lg.addColorStop(1, 'rgba(255,160,80,0)');
        ctx.fillStyle = lg;
        ctx.beginPath();
        ctx.arc(l.x, l.y, l.r * 3, 0, Math.PI * 2);
        ctx.fill();

        // Body
        ctx.fillStyle = `rgba(255,160,80,${l.opacity * pulse})`;
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, l.r * 0.7, l.r, 0, 0, Math.PI * 2);
        ctx.fill();

        // Warm core
        ctx.fillStyle = `rgba(255,220,140,${l.opacity * pulse * 0.8})`;
        ctx.beginPath();
        ctx.ellipse(l.x, l.y - l.r * 0.1, l.r * 0.35, l.r * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawTrunk() {
      const tx = CW * 0.50;
      const ty1 = CH * 0.60;
      const ty2 = CH * 0.73;
      const w = 14;
      ctx.strokeStyle = 'rgba(42,26,31,0.9)';
      ctx.lineWidth = w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      // Slight taper via two strokes
      ctx.moveTo(tx, ty1);
      ctx.bezierCurveTo(tx - 4, ty1 + (ty2 - ty1) * 0.3, tx + 4, ty1 + (ty2 - ty1) * 0.7, tx, ty2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(58,32,48,0.6)';
      ctx.lineWidth = w * 0.4;
      ctx.beginPath();
      ctx.moveTo(tx - 2, ty1 + 4);
      ctx.bezierCurveTo(tx - 3, ty1 + (ty2 - ty1) * 0.35, tx + 2, ty1 + (ty2 - ty1) * 0.65, tx - 1, ty2);
      ctx.stroke();
    }

    function drawRoots() {
      const cx = CW * 0.50;
      const cy = CH * 0.60;
      const ry = CH * 0.92;

      const rootDefs = [
        { cp1x: cx - CW*0.18, cp1y: cy + CH*0.12, cp2x: cx - CW*0.26, cp2y: ry - CH*0.06, ex: cx - CW*0.22, ey: ry, w: 5 },
        { cp1x: cx - CW*0.10, cp1y: cy + CH*0.15, cp2x: cx - CW*0.14, cp2y: ry - CH*0.04, ex: cx - CW*0.12, ey: ry, w: 4 },
        { cp1x: cx - CW*0.04, cp1y: cy + CH*0.18, cp2x: cx - CW*0.05, cp2y: ry - CH*0.03, ex: cx - CW*0.04, ey: ry, w: 6 },
        { cp1x: cx + CW*0.02, cp1y: cy + CH*0.18, cp2x: cx + CW*0.01, cp2y: ry - CH*0.03, ex: cx + CW*0.02, ey: ry, w: 6 },
        { cp1x: cx + CW*0.10, cp1y: cy + CH*0.15, cp2x: cx + CW*0.15, cp2y: ry - CH*0.04, ex: cx + CW*0.13, ey: ry, w: 4 },
        { cp1x: cx + CW*0.20, cp1y: cy + CH*0.12, cp2x: cx + CW*0.27, cp2y: ry - CH*0.06, ex: cx + CW*0.24, ey: ry, w: 3 },
      ];

      rootDefs.forEach(rd => {
        ctx.strokeStyle = 'rgba(42,26,31,0.75)';
        ctx.lineWidth = rd.w;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, cy + CH * 0.04);
        ctx.bezierCurveTo(rd.cp1x, rd.cp1y, rd.cp2x, rd.cp2y, rd.ex, rd.ey);
        ctx.stroke();
      });
    }

    // ===== RESIZE =====
    function handleResize() {
      const oldCW = CW, oldCH = CH;
      CW = window.innerWidth;
      CH = window.innerHeight;
      canvas.width = CW;
      canvas.height = CH;
      svgEl.setAttribute('width', CW);
      svgEl.setAttribute('height', CH);

      // Proportionally reposition all nodes
      const scaleX = CW / oldCW;
      const scaleY = CH / oldCH;
      HOME_NODES.forEach(n => {
        if (!nodeMap[n.id]) return;
        nodeMap[n.id].x *= scaleX;
        nodeMap[n.id].y *= scaleY;
        if (svgGroups[n.id]) {
          svgGroups[n.id].setAttribute('transform',
            `translate(${nodeMap[n.id].x},${nodeMap[n.id].y})`);
        }
      });

      branchPaths.forEach(bp => {
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        bp.el.setAttribute('d', curvePath(s.x, s.y, t.x, t.y));
      });

      petals.forEach(p => {
        p.x = (p.x / oldCW) * CW;
        p.y = (p.y / oldCH) * CH;
      });
      lanterns.forEach(l => {
        l.x = (l.x / oldCW) * CW;
        l.y = (l.y / oldCH) * CH;
      });
    }

    window.addEventListener('resize', handleResize);

    // ===== ANIMATION LOOP =====
    function frame(ts) {
      requestAnimationFrame(frame);
      ctx.clearRect(0, 0, CW, CH);
      drawBackground();
      drawMoon();
      updatePetals(ts);
      drawPetals();
      updateLanterns(ts);
      drawLanterns(ts);
      drawTrunk();
      drawRoots();
    }

    requestAnimationFrame(frame);
  })();
  </script>
</body>
