      ["d-energy","t-renewable"],["d-energy","t-solar"],["d-energy","t-wind"],["d-energy","t-geothermal"],
      ["d-energy","t-storage"],["d-energy","t-bioenergy"],["d-energy","t-gridtech"],["d-energy","t-energypolicy"],
      ["d-food","t-regenfarm"],["d-food","t-permaculture"],["d-food","t-foodsystems"],["d-food","t-urbanfarm"],
      ["d-food","t-fermentation"],["d-food","t-foodsov"],["d-food","t-cuisine"],["d-food","t-aquaculture"],
      ["d-play","t-sports"],["d-play","t-gaming"],["d-play","t-outdoor"],["d-play","t-esports"],
      ["d-play","t-leisure"],["d-play","t-humor"],["d-play","t-festivals"],["d-play","t-playcreat"],
      ["t-energypolicy","t-governance"],["t-gridtech","t-systems"],["t-storage","t-gridtech"],
      ["t-language","t-story"],["t-journalism","t-socialmov"],["t-nvc","t-peace"],
      ["t-socialmedia","t-collective"],["t-dialogue","t-peace"],["t-broadcasting","t-journalism"],
      ["t-sports","t-movement"],["t-festivals","t-community"],["t-gaming","t-ai"],
      ["t-esports","t-gaming"],["t-playcreat","t-cocreate"],["t-outdoor","t-ecology"],
      ["t-leisure","t-mentalhlth"],["t-humor","t-story"],
      ["t-quantum","t-oneness"],["t-quantum","t-vibration"],
      ["t-neuro","t-meditation"],["t-neuro","t-psych"],
      ["t-psych","t-mentalhlth"],["t-psych","t-somatic"],
      ["t-bio","t-ecology"],["t-genetics","t-biotech"],["t-med","t-mentalhlth"],
      ["t-ai","t-systems"],["t-ai","t-collective"],["t-ai","t-futuretech"],
      ["t-blockchain","t-defi"],["t-blockchain","t-dao"],
      ["t-web3","t-decentral"],["t-web3","t-dao"],
      ["fund","t-blockchain"],["fund","t-defi"],["fund","t-web3"],["fund","t-dao"],["fund","t-conscap"],
      ["t-music","t-soundheal"],["t-music","t-vibration"],
      ["t-sacredgeo","t-merkaba"],["t-sacredgeo","t-dims"],["t-sacredgeo","t-math"],
      ["t-astrology","t-cycles"],["t-cosmos","t-astrophys"],
      ["t-indigenous","t-saclaw"],["t-indigenous","t-ecology"],["t-indigenous","t-story"]
    ];

    // ===== SETUP =====
    const canvas = document.getElementById('canvas');
    const svgEl = document.getElementById('svg');
    const tooltip = document.getElementById('tooltip');
    const tipLabel = tooltip.querySelector('.tip-label');
    const tipType = tooltip.querySelector('.tip-type');
    const ctx = canvas.getContext('2d');

    let CW = window.innerWidth;
    let CH = window.innerHeight;

    function resize() {
      CW = window.innerWidth;
      CH = window.innerHeight;
      canvas.width = CW;
      canvas.height = CH;
      canvas.style.width = CW + 'px';
      canvas.style.height = CH + 'px';
      svgEl.setAttribute('width', CW);
      svgEl.setAttribute('height', CH);
      svgEl.setAttribute('viewBox', '0 0 ' + CW + ' ' + CH);
    }
    resize();

    // ===== NODE POSITIONS =====
    const nodeMap = {}; // id -> {x, y}

    function computeLayout() {
      const core = HOME_NODES.filter(n => n.type === 'core');
      const mains = HOME_NODES.filter(n => n.type === 'main');
      const clusters = HOME_NODES.filter(n => n.type === 'cluster');
      const topics = HOME_NODES.filter(n => n.type === 'topic');

      // Core
      core.forEach(n => {
        nodeMap[n.id] = { x: CW * 0.50, y: CH * 0.60 };
      });

      // Main nodes — spread evenly across x at mid height
      mains.forEach((n, i) => {
        const t = mains.length > 1 ? i / (mains.length - 1) : 0.5;
        nodeMap[n.id] = {
          x: CW * 0.22 + t * CW * 0.56,
          y: CH * (0.42 + (i % 2 === 0 ? 0 : 0.07))
        };
      });

      // Cluster nodes
      clusters.forEach((n, i) => {
        const t = clusters.length > 1 ? i / (clusters.length - 1) : 0.5;
        nodeMap[n.id] = {
          x: CW * 0.06 + t * CW * 0.88,
          y: CH * (0.18 + (i % 3 === 0 ? 0 : i % 3 === 1 ? 0.08 : 0.16))
        };
      });

      // Topic nodes
      topics.forEach((n, i) => {
        const t = topics.length > 1 ? i / (topics.length - 1) : 0.5;
        nodeMap[n.id] = {
          x: CW * 0.02 + t * CW * 0.96,
          y: CH * (0.06 + (i % 5) * 0.055)
        };
      });
    }

    computeLayout();

    // Store original normalized positions for resize
    const normMap = {};
    function saveNorm() {
      HOME_NODES.forEach(n => {
        if (nodeMap[n.id]) {
          normMap[n.id] = { nx: nodeMap[n.id].x / CW, ny: nodeMap[n.id].y / CH };
        }
      });
    }
    saveNorm();

    function applyNorm() {
      HOME_NODES.forEach(n => {
        if (normMap[n.id]) {
          nodeMap[n.id] = { x: normMap[n.id].nx * CW, y: normMap[n.id].ny * CH };
        }
      });
    }

    // ===== SVG DEFS =====
    const ns = 'http://www.w3.org/2000/svg';

    const defs = document.createElementNS(ns, 'defs');
    svgEl.appendChild(defs);

    // Bio-glow filters
    function makeGlowFilter(id, stdDev, color, opacity) {
      const filter = document.createElementNS(ns, 'filter');
      filter.setAttribute('id', id);
      filter.setAttribute('x', '-80%');
      filter.setAttribute('y', '-80%');
      filter.setAttribute('width', '360%');
      filter.setAttribute('height', '360%');

      const flood = document.createElementNS(ns, 'feFlood');
      flood.setAttribute('flood-color', color);
      flood.setAttribute('flood-opacity', opacity);
      flood.setAttribute('result', 'colored');

      const comp = document.createElementNS(ns, 'feComposite');
      comp.setAttribute('in', 'colored');
      comp.setAttribute('in2', 'SourceGraphic');
      comp.setAttribute('operator', 'in');
      comp.setAttribute('result', 'tinted');

      const blur = document.createElementNS(ns, 'feGaussianBlur');
      blur.setAttribute('in', 'tinted');
      blur.setAttribute('stdDeviation', stdDev);
      blur.setAttribute('result', 'blur');

      const merge = document.createElementNS(ns, 'feMerge');
      const mn1 = document.createElementNS(ns, 'feMergeNode');
      mn1.setAttribute('in', 'blur');
      const mn2 = document.createElementNS(ns, 'feMergeNode');
      mn2.setAttribute('in', 'SourceGraphic');
      merge.appendChild(mn1);
      merge.appendChild(mn2);

      filter.appendChild(flood);
      filter.appendChild(comp);
      filter.appendChild(blur);
      filter.appendChild(merge);
      defs.appendChild(filter);
    }

    makeGlowFilter('glow-core', '14', '#20FF80', '1');
    makeGlowFilter('glow-main', '8', '#20C060', '1');
    makeGlowFilter('glow-cluster', '6', '#18A050', '0.9');
    makeGlowFilter('glow-topic', '5', '#10C060', '1');

    // Radial gradients
    function makeRadialGrad(id, c1, c2) {
      const grad = document.createElementNS(ns, 'radialGradient');
      grad.setAttribute('id', id);
      grad.setAttribute('cx', '40%');
      grad.setAttribute('cy', '35%');
      const s1 = document.createElementNS(ns, 'stop');
      s1.setAttribute('offset', '0%');
      s1.setAttribute('stop-color', c1);
      const s2 = document.createElementNS(ns, 'stop');
      s2.setAttribute('offset', '100%');
      s2.setAttribute('stop-color', c2);
      grad.appendChild(s1);
      grad.appendChild(s2);
      defs.appendChild(grad);
    }

    makeRadialGrad('grad-core', '#E8FFF0', '#80FFB0');
    makeRadialGrad('grad-main', '#20A050', '#0D3A1A');
    makeRadialGrad('grad-cluster', '#1A8040', '#0A3015');
    makeRadialGrad('grad-topic', '#30D080', '#1A6040');

    // ===== BRANCH PATHS (SVG) =====
    const pathLayer = document.createElementNS(ns, 'g');
    pathLayer.setAttribute('id', 'paths');
    svgEl.appendChild(pathLayer);

    const branchPaths = [];

    function curvePath(x1, y1, x2, y2) {
      const cpx = (x1 + x2) / 2;
      const cpy = Math.min(y1, y2) - Math.abs(x2 - x1) * 0.3 - 30;
      return 'M' + x1 + ',' + y1 + ' Q' + cpx + ',' + cpy + ' ' + x2 + ',' + y2;
    }

    function getNodeType(id) {
      const n = HOME_NODES.find(n => n.id === id);
      return n ? n.type : 'topic';
    }

    HOME_RAW_LINKS.forEach(pair => {
      const src = pair[0], tgt = pair[1];
      const srcType = getNodeType(src);
      const tgtType = getNodeType(tgt);
      const isCoreLink = srcType === 'core' || tgtType === 'core';
      const isMainLink = srcType === 'main' || tgtType === 'main';

      let baseStroke, glowStroke, baseWidth, glowWidth;
      if (isCoreLink) {
        baseStroke = 'rgba(20,100,40,0.7)';
        glowStroke = 'rgba(30,200,100,0.6)';
        baseWidth = 2.5;
        glowWidth = 4;
      } else if (isMainLink) {
        baseStroke = 'rgba(15,80,30,0.6)';
        glowStroke = 'rgba(30,200,100,0.4)';
        baseWidth = 1.8;
        glowWidth = 3;
      } else {
        baseStroke = 'rgba(20,60,25,0.5)';
        glowStroke = 'rgba(30,200,100,0.25)';
        baseWidth = 1;
        glowWidth = 2;
      }

      const s = nodeMap[src], t = nodeMap[tgt];
      if (!s || !t) return;
      const d = curvePath(s.x, s.y, t.x, t.y);

      const basePath = document.createElementNS(ns, 'path');
      basePath.setAttribute('d', d);
      basePath.setAttribute('fill', 'none');
      basePath.setAttribute('stroke', baseStroke);
      basePath.setAttribute('stroke-width', baseWidth);
      basePath.setAttribute('stroke-linecap', 'round');
      pathLayer.appendChild(basePath);

      const glowPath = document.createElementNS(ns, 'path');
      glowPath.setAttribute('d', d);
      glowPath.setAttribute('fill', 'none');
      glowPath.setAttribute('stroke', glowStroke);
      glowPath.setAttribute('stroke-width', glowWidth);
      glowPath.setAttribute('stroke-linecap', 'round');
      glowPath.setAttribute('opacity', '0.6');
      pathLayer.appendChild(glowPath);

      branchPaths.push({ src, tgt, els: [basePath, glowPath] });
    });

    // ===== NODE GROUPS (SVG) =====
    const nodeLayer = document.createElementNS(ns, 'g');
    nodeLayer.setAttribute('id', 'nodes');
    svgEl.appendChild(nodeLayer);

    const nodeEls = {}; // id -> g element

    HOME_NODES.forEach(n => {
      const pos = nodeMap[n.id];
      if (!pos) return;

      const g = document.createElementNS(ns, 'g');
      g.setAttribute('data-id', n.id);
      g.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');
      g.style.cursor = 'grab';

      let r, fillGrad, filterId, strokeColor, strokeW;

      if (n.type === 'core') {
        r = 28; fillGrad = 'grad-core'; filterId = 'glow-core';
        strokeColor = '#80FFB0'; strokeW = 2.5;
      } else if (n.type === 'main') {
        r = 17; fillGrad = 'grad-main'; filterId = 'glow-main';
        strokeColor = '#20A050'; strokeW = 1.5;
      } else if (n.type === 'cluster') {
        r = 12; fillGrad = 'grad-cluster'; filterId = 'glow-cluster';
        strokeColor = '#18805A'; strokeW = 1;
      } else {
        r = 6; fillGrad = 'grad-topic'; filterId = 'glow-topic';
        strokeColor = '#30D880'; strokeW = 0.8;
      }

      const circle = document.createElementNS(ns, 'circle');
      circle.setAttribute('r', r);
      circle.setAttribute('fill', 'url(#' + fillGrad + ')');
      circle.setAttribute('stroke', strokeColor);
      circle.setAttribute('stroke-width', strokeW);
      circle.setAttribute('filter', 'url(#' + filterId + ')');
      g.appendChild(circle);

      // Label
      if (n.type !== 'topic') {
        const text = document.createElementNS(ns, 'text');
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.setAttribute('pointer-events', 'none');
        text.setAttribute('fill', n.type === 'core' ? '#020D05' : '#D0FFE0');
        text.setAttribute('font-family', "'Courier New', monospace");
        text.setAttribute('font-size', n.type === 'core' ? '9' : n.type === 'main' ? '7' : '6');
        text.setAttribute('font-weight', n.type === 'core' ? 'bold' : '500');
        text.setAttribute('letter-spacing', n.type === 'core' ? '0.12em' : '0.06em');
        text.textContent = n.label;
        g.appendChild(text);
      }

      nodeLayer.appendChild(g);
      nodeEls[n.id] = g;
    });

    // ===== DRAG =====
    let dragging = null;

    function updatePaths(id) {
      branchPaths.forEach(bp => {
        if (bp.src !== id && bp.tgt !== id) return;
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        const d = curvePath(s.x, s.y, t.x, t.y);
        bp.els.forEach(e => e.setAttribute('d', d));
      });
    }

    svgEl.addEventListener('pointerdown', e => {
      const g = e.target.closest('g[data-id]');
      if (!g) return;
      dragging = g.dataset.id;
      g.style.cursor = 'grabbing';
      svgEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    }, { passive: false });

    svgEl.addEventListener('pointermove', e => {
      if (!dragging) return;
      const r = svgEl.getBoundingClientRect();
      nodeMap[dragging].x = e.clientX - r.left;
      nodeMap[dragging].y = e.clientY - r.top;
      const g = nodeEls[dragging];
      if (g) g.setAttribute('transform', 'translate(' + nodeMap[dragging].x + ',' + nodeMap[dragging].y + ')');
      updatePaths(dragging);
      // Update norm
      if (normMap[dragging]) {
        normMap[dragging].nx = nodeMap[dragging].x / CW;
        normMap[dragging].ny = nodeMap[dragging].y / CH;
      }
    });

    svgEl.addEventListener('pointerup', e => {
      if (dragging && nodeEls[dragging]) nodeEls[dragging].style.cursor = 'grab';
      dragging = null;
    });

    // ===== TOOLTIP =====
    svgEl.addEventListener('mouseover', e => {
      const g = e.target.closest('g[data-id]');
      if (!g) return;
      const id = g.dataset.id;
      const node = HOME_NODES.find(n => n.id === id);
      if (!node) return;
      tipLabel.textContent = node.label;
      const typeLabel = { core: 'FRQNCY CORE', main: 'PILLAR', cluster: 'DOMAIN', topic: 'TOPIC' }[node.type] || 'NODE';
      tipType.textContent = (node.desc ? node.desc + ' · ' : '') + typeLabel;
      tooltip.style.opacity = '1';
    });

    svgEl.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    });

    svgEl.addEventListener('mouseout', e => {
      const g = e.target.closest('g[data-id]');
      if (g && !g.contains(e.relatedTarget)) {
        tooltip.style.opacity = '0';
      }
    });

    // ===== FIREFLIES =====
    const fireflies = Array.from({ length: 80 }, () => ({
      x: Math.random() * CW,
      y: Math.random() * CH * 0.75,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.3,
      pulse: Math.random() * Math.PI * 2,
      pulseSpeed: 0.02 + Math.random() * 0.04,
      size: 1.5 + Math.random() * 2
    }));

    // ===== MIST =====
    let mistOffset = [0, 0, 0];

    // ===== CANOPY BLOBS =====
    const canopyBlobs = Array.from({ length: 7 }, (_, i) => ({
      x: CW * (0.05 + i * 0.14),
      y: CH * (0.02 + Math.random() * 0.06),
      rx: CW * (0.08 + Math.random() * 0.07),
      ry: CH * (0.05 + Math.random() * 0.04)
    }));

    // ===== ANIMATION LOOP =====
    let lastTs = 0;

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, CH);
      grad.addColorStop(0, '#020D05');
      grad.addColorStop(0.4, '#031208');
      grad.addColorStop(0.7, '#04180A');
      grad.addColorStop(1, '#041A08');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, CW, CH);
    }

    function drawCanopy() {
      ctx.save();
      ctx.globalAlpha = 0.85;
      canopyBlobs.forEach(b => {
        const bx = b.x % CW;
        const grad = ctx.createRadialGradient(bx, b.y, 0, bx, b.y, Math.max(b.rx, b.ry));
        grad.addColorStop(0, 'rgba(4,24,8,0.95)');
        grad.addColorStop(0.6, 'rgba(3,16,6,0.85)');
        grad.addColorStop(1, 'rgba(2,12,4,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(bx, b.y, b.rx, b.ry, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawMist(ts) {
      const speeds = [0.2, -0.15, 0.1];
      const opacities = [0.08, 0.06, 0.05];
      const ys = [CH * 0.30, CH * 0.50, CH * 0.70];

      speeds.forEach((spd, i) => {
        mistOffset[i] = (mistOffset[i] + spd) % CW;
        const off = mistOffset[i];
        const h = CH * 0.06;

        ctx.save();
        ctx.globalAlpha = opacities[i];
        const grad = ctx.createLinearGradient(0, ys[i] - h, 0, ys[i] + h);
        grad.addColorStop(0, 'rgba(20,60,30,0)');
        grad.addColorStop(0.5, 'rgba(20,60,30,0.2)');
        grad.addColorStop(1, 'rgba(20,60,30,0)');
        ctx.fillStyle = grad;

        // Draw two tiles to create seamless scroll
        ctx.fillRect(off - CW, ys[i] - h, CW, h * 2);
        ctx.fillRect(off, ys[i] - h, CW, h * 2);
        ctx.restore();
      });
    }

    function drawFireflies(ts) {
      fireflies.forEach(f => {
        f.pulse += f.pulseSpeed;
        f.x += f.vx;
        f.y += f.vy;

        // Bounce
        if (f.x < 0) { f.x = 0; f.vx = Math.abs(f.vx); }
        if (f.x > CW) { f.x = CW; f.vx = -Math.abs(f.vx); }
        if (f.y < 0) { f.y = 0; f.vy = Math.abs(f.vy); }
        if (f.y > CH * 0.75) { f.y = CH * 0.75; f.vy = -Math.abs(f.vy); }

        const opacity = ((Math.sin(f.pulse) + 1) / 2) * 0.8 + 0.1;

        // Outer glow
        ctx.save();
        ctx.globalAlpha = opacity * 0.15;
        const glow = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.size * 6);
        glow.addColorStop(0, 'rgba(100,255,160,1)');
        glow.addColorStop(1, 'rgba(100,255,160,0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size * 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Mid glow
        ctx.save();
        ctx.globalAlpha = opacity * 0.35;
        ctx.fillStyle = 'rgba(128,255,153,1)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size * 2.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Core dot
        ctx.save();
        ctx.globalAlpha = opacity;
        ctx.fillStyle = 'rgba(200,255,220,1)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    function drawTrunk() {
      const tx = CW * 0.50;
      const ty1 = CH * 0.60;
      const ty2 = CH * 0.73;

      ctx.save();
      const grad = ctx.createLinearGradient(tx - 10, ty1, tx + 10, ty2);
      grad.addColorStop(0, 'rgba(26,42,16,0.95)');
      grad.addColorStop(0.5, 'rgba(18,30,10,0.9)');
      grad.addColorStop(1, 'rgba(14,22,8,0.85)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(tx - 6, ty1);
      ctx.lineTo(tx + 6, ty1);
      ctx.lineTo(tx + 10, ty2);
      ctx.lineTo(tx - 10, ty2);
      ctx.closePath();
      ctx.fill();

      // Bioluminescent vein on trunk
      ctx.strokeStyle = 'rgba(20,180,80,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(tx, ty1);
      ctx.lineTo(tx, ty2);
      ctx.stroke();
      ctx.restore();
    }

    function drawRoots() {
      const tx = CW * 0.50;
      const ty = CH * 0.73;
      const rootY = CH * 0.92;
      const spread = CW * 0.26;

      const rootConfigs = [
        { dx: -spread,      width: 8, bioOpacity: 0.15 },
        { dx: -spread*0.6,  width: 6, bioOpacity: 0.12 },
        { dx: -spread*0.25, width: 5, bioOpacity: 0.13 },
        { dx: 0,            width: 7, bioOpacity: 0.18 },
        { dx: spread*0.25,  width: 5, bioOpacity: 0.13 },
        { dx: spread*0.6,   width: 6, bioOpacity: 0.12 },
        { dx: spread,       width: 8, bioOpacity: 0.15 }
      ];

      rootConfigs.forEach(rc => {
        const ex = tx + rc.dx;
        const cpx = tx + rc.dx * 0.4;
        const cpy = ty + (rootY - ty) * 0.5;

        // Base root
        ctx.save();
        ctx.strokeStyle = 'rgba(26,42,16,0.9)';
        ctx.lineWidth = rc.width;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.quadraticCurveTo(cpx, cpy, ex, rootY);
        ctx.stroke();
        ctx.restore();

        // Bioluminescent overlay
        ctx.save();
        ctx.strokeStyle = 'rgba(20,180,80,' + rc.bioOpacity + ')';
        ctx.lineWidth = rc.width * 0.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.quadraticCurveTo(cpx, cpy, ex, rootY);
        ctx.stroke();
        ctx.restore();
      });
    }

    function animate(ts) {
      requestAnimationFrame(animate);

      ctx.clearRect(0, 0, CW, CH);

      drawBackground();
      drawCanopy();
      drawMist(ts);
      drawFireflies(ts);
      drawTrunk();
      drawRoots();

      lastTs = ts;
    }

    requestAnimationFrame(animate);

    // ===== RESIZE =====
    window.addEventListener('resize', () => {
      resize();
      applyNorm();

      // Reposition all nodes
      HOME_NODES.forEach(n => {
        const pos = nodeMap[n.id];
        if (!pos) return;
        const g = nodeEls[n.id];
        if (g) g.setAttribute('transform', 'translate(' + pos.x + ',' + pos.y + ')');
      });

      // Update all paths
      branchPaths.forEach(bp => {
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        const d = curvePath(s.x, s.y, t.x, t.y);
        bp.els.forEach(e => e.setAttribute('d', d));
      });

      // Update canopy blobs proportionally
      canopyBlobs.forEach((b, i) => {
        b.x = CW * (0.05 + i * 0.14);
        b.y = CH * 0.04;
        b.rx = CW * 0.09;
        b.ry = CH * 0.06;
      });
    });

  })();
  </script>
</body>
