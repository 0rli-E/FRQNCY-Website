<script>
/* ── Minimal D3 shim (no CDN needed) ──────────────────────────── */
const d3 = (function(){
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  function mk(tag) { return document.createElementNS(NS, tag); }

  class Sel {
    constructor(els, par) {
      this._els = (Array.isArray(els) ? els : els ? [els] : []).filter(Boolean);
      this._par = par || null;
      this._dat = null;
    }
    attr(k, v) {
      this._els.forEach((el, i) => {
        const val = typeof v === 'function' ? v(el.__d3d__, i) : v;
        if (val == null) el.removeAttribute(k);
        else el.setAttribute(k, String(val));
      });
      return this;
    }
    style(k, v) {
      this._els.forEach((el, i) => {
        const val = typeof v === 'function' ? v(el.__d3d__, i) : v;
        if (val == null) el.style.removeProperty(k);
        else el.style.setProperty(k, String(val));
      });
      return this;
    }
    text(v) {
      this._els.forEach(el => {
        el.textContent = typeof v === 'function' ? v(el.__d3d__) : v;
      });
      return this;
    }
    append(tag) {
      const ch = this._els.map(el => {
        const c = mk(tag);
        c.__d3d__ = el.__d3d__;
        el.appendChild(c);
        return c;
      });
      return new Sel(ch, this._els[0] || this._par);
    }
    on(type, fn) {
      const t = type.split('.')[0];
      this._els.forEach(el => el.addEventListener(t, e => fn.call(el, e, el.__d3d__)));
      return this;
    }
    each(fn) {
      this._els.forEach((el, i) => fn.call(el, el.__d3d__, i));
      return this;
    }
    filter(fn) {
      const kept = this._els.filter((el, i) =>
        typeof fn === 'function' ? fn(el.__d3d__, i) : el.matches(fn));
      return new Sel(kept, this._par);
    }
    remove() {
      this._els.forEach(el => el.parentNode && el.parentNode.removeChild(el));
      this._els = [];
      return this;
    }
    selectAll(sel) {
      const found = [];
      this._els.forEach(el => found.push(...el.querySelectorAll(sel)));
      return new Sel(found, this._els[0] || null);
    }
    data(arr) { this._dat = arr; return this; }
    join(tag) {
      const data = this._dat || [], parent = this._par;
      if (!parent) return this;
      this._els.forEach(el => el.parentNode && el.parentNode.removeChild(el));
      const created = data.map((d, i) => {
        const el = mk(tag);
        el.__d3d__ = d;
        parent.appendChild(el);
        return el;
      });
      return new Sel(created, parent);
    }
    node() { return this._els[0] || null; }
    nodes() { return this._els; }
  }

  function select(target) {
    let el = typeof target === 'string' ? document.querySelector(target) : target;
    if (el && el.__d3d__ === undefined) el.__d3d__ = null;
    return new Sel(el ? [el] : [], el ? el.parentNode : null);
  }
  function selectAll(sel) {
    const els = [...document.querySelectorAll(sel)];
    return new Sel(els, document.body);
  }
  return { select, selectAll };
})();
/* ── end shim ─────────────────────────────────────────────────── */
</script>
<script>

           coral pink accents, gold core (kept from original)

      {id:"t-meditation",label:"Meditation"},

    ]
  },
  {
    id:"d-society", label:"Society", desc:"Collective human systems",
    color:"#38BDF8",
    topics:[
      {id:"t-governance",label:"Governance"},
      {id:"t-indigenous",label:"Indigenous Wisdom"},
      {id:"t-collective",label:"Collective Intelligence"},
      {id:"t-peace",     label:"Peace Building"},
      {id:"t-socialmov", label:"Social Movements"},
      {id:"t-community", label:"Community"},
    ]
  },
];

// ─── CANVAS / SVG SETUP ───────────────────────────────────────────────────────
const bgCanvas  = document.getElementById('bg-canvas');
const bgCtx     = bgCanvas.getContext('2d');
const topCanvas = document.getElementById('top-canvas');
const topCtx    = topCanvas.getContext('2d');
const svgEl     = document.getElementById('tree-svg');
const svg       = d3.select(svgEl);

let CW, CH, cx, cy;
let builtNodes = [], builtLinks = [], particles = [];
let branchPaths = []; // {el, sx, sy, cpx, cpy, tx, ty, baseAngle, waveAmp}
let lastSpawn = 0;
let startTime = performance.now();

// ─── MARINE SNOW ─────────────────────────────────────────────────────────────
const SNOW = Array.from({length: 60}, () => ({
  rx: Math.random(),
  y:  Math.random() * 1.2,   // start anywhere including below screen
  r:  Math.random() * 1.2 + 0.3,
  speed: 0.00008 + Math.random() * 0.00018,
  drift: (Math.random() - 0.5) * 0.00006,
  alpha: Math.random() * 0.28 + 0.06,
  phase: Math.random() * Math.PI * 2,
}));

// ─── JELLYFISH ───────────────────────────────────────────────────────────────
const JELLIES = Array.from({length: 7}, (_, i) => ({
  rx: 0.05 + Math.random() * 0.90,
  ry: 0.10 + Math.random() * 0.80,
  size: 28 + Math.random() * 55,
  speed: 0.00012 + Math.random() * 0.00022,
  driftX: (Math.random() - 0.5) * 0.00010,
  phase: Math.random() * Math.PI * 2,
  pulseSpeed: 0.0008 + Math.random() * 0.001,
  hue: [0,210,170,300,190,150,220][i], // degrees for hsla
  alpha: 0.04 + Math.random() * 0.06,
}));

// ─── RESIZE ──────────────────────────────────────────────────────────────────
function resize() {
  CW = bgCanvas.width  = topCanvas.width  = window.innerWidth;
  CH = bgCanvas.height = topCanvas.height = window.innerHeight;
  cx = CW / 2;
  cy = CH / 2;
  buildLayout();
  renderSVG();
}
window.addEventListener('resize', resize, { passive: true });

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
function buildLayout() {
  const dim   = Math.min(CW, CH);
  const R1    = dim * 0.24;
  const R2    = dim * 0.44;
  const N     = BRANCHES.length;
  const SPREAD = Math.PI * 0.30;

  builtNodes  = [];
  builtLinks  = [];
  particles   = [];
  branchPaths = [];

  const core = { id:"frqncy", label:"FRQNCY", type:"core", r:52,
                 desc:"The living network of consciousness", x:cx, y:cy };
  builtNodes.push(core);

  BRANCHES.forEach((branch, bi) => {
    const baseAngle = (bi / N) * Math.PI * 2 - Math.PI / 2;

    const dx = cx + Math.cos(baseAngle) * R1;
    const dy = cy + Math.sin(baseAngle) * R1;

    const perpX = -Math.sin(baseAngle), perpY = Math.cos(baseAngle);
    const curve = R1 * 0.20 * ((bi % 2 === 0) ? 1 : -1);

    const domainNode = {
      id: branch.id, label: branch.label, type:"cluster", r:24,
      desc: branch.desc, x: dx, y: dy, color: branch.color,
      baseAngle: baseAngle,
      cpx: (cx + dx)/2 + perpX * curve,
      cpy: (cy + dy)/2 + perpY * curve
    };
    builtNodes.push(domainNode);
    builtLinks.push({
      source: core, target: domainNode, level: 0,
      cpx: domainNode.cpx, cpy: domainNode.cpy,
      color: branch.color, baseAngle: baseAngle,
    });

    const nt = branch.topics.length;
    branch.topics.forEach((topic, ti) => {
      const tAngle = baseAngle - SPREAD/2 + (ti / (nt - 1 || 1)) * SPREAD;
      const tx = cx + Math.cos(tAngle) * R2;
      const ty = cy + Math.sin(tAngle) * R2;

      const tdx = tx - dx, tdy = ty - dy;
      const tdist = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
      const tperpX = -tdy/tdist, tperpY = tdx/tdist;
      const tcurve = tdist * 0.15 * ((ti % 2 === 0) ? 1 : -1);

      const topicNode = {
        id: topic.id, label: topic.label, type:"topic", r:13,
        x: tx, y: ty, color: branch.color,
        cpx: (dx + tx)/2 + tperpX * tcurve,
        cpy: (dy + ty)/2 + tperpY * tcurve
      };
      builtNodes.push(topicNode);
      builtLinks.push({
        source: domainNode, target: topicNode, level: 1,
        cpx: topicNode.cpx, cpy: topicNode.cpy,
        color: branch.color,
        ti: ti,
      });
    });
  });
}

// ─── WAVE HELPERS ────────────────────────────────────────────────────────────
// Computes a sinusoidal offset for a control point, creating tentacle-wave
function waveOffset(baseVal, amplitude, freq, phase, ts) {
  return baseVal + amplitude * Math.sin(freq * ts * 0.001 + phase);
}

// Returns animated SVG path d-string for a quadratic bezier with waving CP
function animatedPath(sx, sy, cpx, cpy, tx, ty, waveAmp, wavePhase, ts) {
  const perpX = -(ty - sy) / (Math.sqrt((tx-sx)**2+(ty-sy)**2)||1);
  const perpY =  (tx - sx) / (Math.sqrt((tx-sx)**2+(ty-sy)**2)||1);
  const wave  = waveAmp * Math.sin(0.72 * ts * 0.001 + wavePhase);
  const wcpx  = cpx + perpX * wave;
  const wcpy  = cpy + perpY * wave;
  return `M${sx},${sy} Q${wcpx},${wcpy} ${tx},${ty}`;
}

function quadBezierPoint(x1,y1,cpx,cpy,x2,y2,t) {
  const mt = 1-t;
  return {
    x: mt*mt*x1 + 2*mt*t*cpx + t*t*x2,
    y: mt*mt*y1 + 2*mt*t*cpy + t*t*y2,
  };
}

// Parse hex color to rgb components
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

// ─── SVG ─────────────────────────────────────────────────────────────────────
function renderSVG() {
  svg.selectAll('*').remove();

  const defs = svg.append('defs');

  // Core: gold center + teal outer gradient
  const gCore = defs.append('radialGradient').attr('id','g-core').attr('cx','38%').attr('cy','30%');
  gCore.append('stop').attr('offset','0%').attr('stop-color','#F4DC88');
  gCore.append('stop').attr('offset','60%').attr('stop-color','#A06818');
  gCore.append('stop').attr('offset','100%').attr('stop-color','#03302A');

  // Domain nodes: teal radial
  BRANCHES.forEach((b, bi) => {
    const col = hexToRgb(b.color);
    const gd = defs.append('radialGradient').attr('id',`g-domain-${bi}`).attr('cx','38%').attr('cy','30%');
    gd.append('stop').attr('offset','0%').attr('stop-color',b.color);
    gd.append('stop').attr('offset','100%').attr('stop-color',`rgb(${Math.round(col.r*0.1)},${Math.round(col.g*0.1)},${Math.round(col.b*0.1)})`);
  });

  // Topic nodes: dark with slight tint
  BRANCHES.forEach((b, bi) => {
    const col = hexToRgb(b.color);
    const gt = defs.append('radialGradient').attr('id',`g-topic-${bi}`).attr('cx','38%').attr('cy','30%');
    gt.append('stop').attr('offset','0%').attr('stop-color',`rgba(${col.r},${col.g},${col.b},0.9)`);
    gt.append('stop').attr('offset','100%').attr('stop-color',`rgb(${Math.round(col.r*0.04)},${Math.round(col.g*0.04)},${Math.round(col.b*0.04)})`);
  });

  // Bloom filter for nodes
  const bloom = defs.append('filter').attr('id','bloom').attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
  bloom.append('feGaussianBlur').attr('stdDeviation','7').attr('result','blur');
  const bm = bloom.append('feMerge');
  bm.append('feMergeNode').attr('in','blur');
  bm.append('feMergeNode').attr('in','SourceGraphic');

  // Soft glow filter for branches
  const branchGlow = defs.append('filter').attr('id','branch-glow').attr('x','-30%').attr('y','-30%').attr('width','160%').attr('height','160%');
  branchGlow.append('feGaussianBlur').attr('stdDeviation','3.5').attr('result','blur');
  const bgm = branchGlow.append('feMerge');
  bgm.append('feMergeNode').attr('in','blur');
  bgm.append('feMergeNode').attr('in','SourceGraphic');

  // Core pulse filter
  const coreFilter = defs.append('filter').attr('id','core-glow').attr('x','-120%').attr('y','-120%').attr('width','340%').attr('height','340%');
  coreFilter.append('feGaussianBlur').attr('stdDeviation','14').attr('result','blur');
  const cgm = coreFilter.append('feMerge');
  cgm.append('feMergeNode').attr('in','blur');
  cgm.append('feMergeNode').attr('in','SourceGraphic');

  // Branch group (paths will be animated each frame via JS)
  const branchG = svg.append('g').attr('class','branches');

  builtLinks.forEach((link, li) => {
    const col   = link.color || '#00E5CC';
    const rgb   = hexToRgb(col);
    const isMain = link.level === 0;
    const strokeAlpha = isMain ? 0.55 : 0.35;
    const strokeWidth = isMain ? 3.5 : 1.6;

    // Glowing duplicate path (wider, lower opacity) for tube effect
    const glowPath = branchG.append('path')
      .attr('fill','none')
      .attr('stroke', `rgba(${rgb.r},${rgb.g},${rgb.b},${isMain ? 0.12 : 0.08})`)
      .attr('stroke-width', isMain ? 18 : 8)
      .attr('stroke-linecap','round')
      .attr('filter','url(#branch-glow)');

    const mainPath = branchG.append('path')
      .attr('fill','none')
      .attr('stroke', `rgba(${rgb.r},${rgb.g},${rgb.b},${strokeAlpha})`)
      .attr('stroke-width', strokeWidth)
      .attr('stroke-linecap','round');

    const waveAmp  = isMain ? 18 : 10;
    const wavePhase = li * 0.61;

    branchPaths.push({
      glowEl: glowPath.node(),
      mainEl: mainPath.node(),
      sx: link.source.x, sy: link.source.y,
      cpx: link.cpx, cpy: link.cpy,
      tx: link.target.x, ty: link.target.y,
      waveAmp, wavePhase,
    });
  });

  // Nodes
  const nodeG = svg.append('g').attr('class','nodes');

  // Build branch index for each node
  const branchIndexOf = {};
  BRANCHES.forEach((b,bi) => {
    branchIndexOf[b.id] = bi;
    b.topics.forEach(t => { branchIndexOf[t.id] = bi; });
  });

  const groups = nodeG.selectAll('g.node')
    .data(builtNodes)
    .join('g')
    .attr('class','node')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('cursor','pointer');

  // Domain nodes: jellyfish-body glow ring
  groups.filter(d => d.type === 'cluster')
    .append('circle')
    .attr('r', d => d.r * 3.5)
    .attr('fill', 'none')
    .attr('stroke', d => d.color || '#00E5CC')
    .attr('stroke-width', 1)
    .attr('opacity', 0.18)
    .attr('filter','url(#bloom)');

  // Topic nodes: bioluminescent halo
  groups.filter(d => d.type === 'topic')
    .append('circle')
    .attr('r', d => d.r * 2.8)
    .attr('fill', d => {
      const col = hexToRgb(d.color || '#00E5CC');
      return `rgba(${col.r},${col.g},${col.b},0.04)`;
    })
    .attr('stroke', d => d.color || '#00E5CC')
    .attr('stroke-width', 0.8)
    .attr('opacity', 0.3)
    .attr('filter','url(#bloom)');

  // Core outer rings (decorative pulse rings, will be animated via JS class)
  const coreRings = groups.filter(d => d.type === 'core');
  [3.8, 2.8, 1.8].forEach((mult, ri) => {
    coreRings.append('circle')
      .attr('r', d => d.r * mult)
      .attr('fill','none')
      .attr('stroke','rgba(0,229,204,0.18)')
      .attr('stroke-width', ri === 0 ? 1 : ri === 1 ? 1.5 : 2)
      .attr('class', `core-ring core-ring-${ri}`);
  });

  // Main node circles
  groups.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d => {
      if (d.type === 'core') return 'url(#g-core)';
      const bi = branchIndexOf[d.id];
      if (d.type === 'cluster') return bi !== undefined ? `url(#g-domain-${bi})` : '#0A4A5A';
      return bi !== undefined ? `url(#g-topic-${bi})` : '#031520';
    })
    .attr('stroke', d =>
      d.type === 'core'    ? '#E0C06A' :
      d.type === 'cluster' ? (d.color || '#00E5CC') :
      (d.color || '#00E5CC'))
    .attr('stroke-width', d => d.type === 'core' ? 2.5 : d.type === 'cluster' ? 1.5 : 0.8)
    .attr('stroke-opacity', d => d.type === 'core' ? 1 : 0.7)
    .attr('filter', d => d.type === 'core' ? 'url(#core-glow)' : null);

  // Labels
  groups.filter(d => d.type !== 'dot')
    .append('text')
    .attr('text-anchor','middle')
    .attr('dominant-baseline','central')
    .attr('fill', d =>
      d.type === 'core'    ? '#0A1220' :
      d.type === 'cluster' ? (d.color || '#00FFE1') :
      'rgba(220,255,250,0.82)')
    .attr('font-family', d =>
      d.type === 'core' ? 'Cormorant,Georgia,serif' : "'Jost',sans-serif")
    .attr('font-size', d =>
      d.type === 'core' ? '15px' : d.type === 'cluster' ? '9px' : '7.5px')
    .attr('font-weight', d => d.type === 'core' ? '500' : d.type === 'cluster' ? '400' : '300')
    .attr('letter-spacing', d => d.type === 'core' ? '0.18em' : '0.04em')
    .attr('pointer-events','none')
    .each(function(d) {
      const el = d3.select(this);
      if (d.type !== 'core' && d.label.length > 14) {
        const words = d.label.split(' ');
        const mid = Math.ceil(words.length / 2);
        el.append('tspan').attr('x',0).attr('dy','-0.5em').text(words.slice(0,mid).join(' '));
        el.append('tspan').attr('x',0).attr('dy','1em').text(words.slice(mid).join(' '));
      } else {
        el.text(d.label);
      }
    });

  // Tooltip interaction
  const tip = document.getElementById('nm-tooltip');
  groups
    .on('mouseover', (e,d) => {
      if (!tip) return;
      tip.querySelector('.tip-title').textContent = d.label;
      tip.querySelector('.tip-type').textContent =
        d.desc || ({core:'FRQNCY Core',cluster:'Domain',topic:'Topic'}[d.type] || '');
      tip.style.opacity = '1';
    })
    .on('mousemove', ev => {
      if (!tip) return;
      tip.style.left = (ev.clientX + 16) + 'px';
      tip.style.top  = (ev.clientY - 16) + 'px';
    })
    .on('mouseout', () => { if (tip) tip.style.opacity = '0'; });
}

// ─── PARTICLE SYSTEM ─────────────────────────────────────────────────────────
function spawnParticle(ts) {
  if (particles.length > 200 || !builtLinks.length) return;
  const link = builtLinks[Math.floor(Math.random() * builtLinks.length)];
  const col  = link.color || '#00E5CC';
  const rgb  = hexToRgb(col);
  particles.push({
    sx: link.source.x, sy: link.source.y,
    cpx: link.cpx,     cpy: link.cpy,
    tx: link.target.x, ty: link.target.y,
    prog: 0, speed: 0.005 + Math.random() * 0.008,
    level: link.level,
    r: link.level === 0 ? 2.4 : 1.5,
    rgb,
    wavePhase: Math.random() * Math.PI * 2,
  });
}

// ─── JELLYFISH DRAW ──────────────────────────────────────────────────────────
function drawJelly(ctx, jx, jy, size, pulse, alpha, hue) {
  ctx.save();
  ctx.globalAlpha = alpha;

  // Bell body
  const bellH = size * (0.55 + pulse * 0.12);
  const bellW = size * (1.0 - pulse * 0.08);
  ctx.beginPath();
  ctx.ellipse(jx, jy, bellW, bellH, 0, Math.PI, Math.PI * 2);
  const bellGrad = ctx.createRadialGradient(jx, jy - bellH*0.3, 0, jx, jy, bellW);
  bellGrad.addColorStop(0, `hsla(${hue},100%,72%,0.55)`);
  bellGrad.addColorStop(0.5, `hsla(${hue},80%,50%,0.28)`);
  bellGrad.addColorStop(1,   `hsla(${hue},60%,30%,0.0)`);
  ctx.fillStyle = bellGrad;
  ctx.fill();

  // Bell rim
  ctx.beginPath();
  ctx.ellipse(jx, jy, bellW, size * 0.08, 0, 0, Math.PI * 2);
  ctx.strokeStyle = `hsla(${hue},100%,80%,0.4)`;
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Tentacles
  const tentN = 7;
  for (let ti = 0; ti < tentN; ti++) {
    const tx2 = jx + (ti - (tentN-1)/2) * (bellW*1.8 / tentN);
    const tentLen = size * (1.4 + pulse * 0.3) * (0.7 + (ti%3)*0.15);
    ctx.beginPath();
    ctx.moveTo(tx2, jy);
    // Wavy tentacle using cubic bezier
    const wave1 = Math.sin(pulse * Math.PI * 3 + ti) * size * 0.2;
    const wave2 = Math.cos(pulse * Math.PI * 2.5 + ti*0.7) * size * 0.15;
    ctx.bezierCurveTo(
      tx2 + wave1, jy + tentLen * 0.33,
      tx2 + wave2, jy + tentLen * 0.66,
      tx2 - wave1 * 0.5, jy + tentLen
    );
    const tentGrad = ctx.createLinearGradient(tx2, jy, tx2, jy + tentLen);
    tentGrad.addColorStop(0,   `hsla(${hue},100%,70%,0.5)`);
    tentGrad.addColorStop(0.5, `hsla(${hue},90%,60%,0.25)`);
    tentGrad.addColorStop(1,   `hsla(${hue},80%,50%,0.0)`);
    ctx.strokeStyle = tentGrad;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  ctx.restore();
}

// ─── RENDER LOOP ─────────────────────────────────────────────────────────────
let pageVisible = !document.hidden;
document.addEventListener('visibilitychange', () => { pageVisible = !document.hidden; });

function render(ts) {
  requestAnimationFrame(render);
  if (!pageVisible) return;

  const elapsed = (ts - startTime) * 0.001; // seconds

  // ── BACKGROUND CANVAS ──────────────────────────────────────────────────────
  bgCtx.clearRect(0, 0, CW, CH);

  // Deep ocean gradient: dark at bottom, lighter at "horizon" (upper third)
  const horizonY = CH * 0.35;
  const bgGr = bgCtx.createLinearGradient(0, CH, 0, 0);
  bgGr.addColorStop(0,   '#010508');
  bgGr.addColorStop(0.3, '#010D1A');
  bgGr.addColorStop(0.6, '#021626');
  bgGr.addColorStop(1,   '#031D35');
  bgCtx.fillStyle = bgGr;
  bgCtx.fillRect(0, 0, CW, CH);

  // Subtle abyssal purple zone at very bottom
  const abyssGr = bgCtx.createLinearGradient(0, CH, 0, CH * 0.7);
  abyssGr.addColorStop(0,   'rgba(13,6,36,0.6)');
  abyssGr.addColorStop(1,   'rgba(13,6,36,0)');
  bgCtx.fillStyle = abyssGr;
  bgCtx.fillRect(0, 0, CW, CH);

  // ── JELLYFISH in background ────────────────────────────────────────────────
  JELLIES.forEach(j => {
    j.ry -= j.speed;
    j.rx += j.driftX;
    if (j.ry < -0.25) { j.ry = 1.15; j.rx = 0.05 + Math.random() * 0.90; }
    if (j.rx < 0) j.rx = 1; if (j.rx > 1) j.rx = 0;

    const jx = j.rx * CW;
    const jy = j.ry * CH;
    const pulse = 0.5 + 0.5 * Math.sin(elapsed * j.pulseSpeed * 1000 + j.phase);
    drawJelly(bgCtx, jx, jy, j.size, pulse, j.alpha, j.hue);
  });

  // ── MARINE SNOW ────────────────────────────────────────────────────────────
  SNOW.forEach(s => {
    // Drift upward
    s.y -= s.speed;
    if (s.y < -0.05) { s.y = 1.05; s.rx = Math.random(); }
    // Gentle horizontal drift
    const sx = (s.rx + Math.sin(elapsed * 0.12 + s.phase) * 0.008) * CW;
    const sy = s.y * CH;
    bgCtx.globalAlpha = s.alpha * (0.6 + 0.4 * Math.sin(elapsed * 0.8 + s.phase));
    bgCtx.fillStyle = '#E0FAFA';
    bgCtx.beginPath();
    bgCtx.arc(sx, sy, s.r, 0, Math.PI * 2);
    bgCtx.fill();
    bgCtx.globalAlpha = 1;
  });

  // ── NODE HALOS on background canvas ───────────────────────────────────────
  if (builtNodes.length) {
    const core = builtNodes.find(n => n.type === 'core');

    // Core hydrothermal vent glow — pulsing rings
    if (core) {
      // Main glow
      const coreGr = bgCtx.createRadialGradient(core.x, core.y, core.r*0.5, core.x, core.y, core.r*4.5);
      coreGr.addColorStop(0,   'rgba(196,151,58,0.28)');
      coreGr.addColorStop(0.3, 'rgba(0,229,204,0.18)');
      coreGr.addColorStop(0.6, 'rgba(0,229,204,0.06)');
      coreGr.addColorStop(1,   'rgba(0,229,204,0)');
      bgCtx.fillStyle = coreGr;
      bgCtx.beginPath();
      bgCtx.arc(core.x, core.y, core.r*4.5, 0, Math.PI*2);
      bgCtx.fill();

      // Expanding pulse rings
      [0, 0.33, 0.66].forEach((offset, ri) => {
        const phase = ((elapsed * 0.5) + offset) % 1;
        const ringR = core.r * (1.5 + phase * 3.5);
        const ringAlpha = 0.25 * (1 - phase);
        bgCtx.strokeStyle = `rgba(0,229,204,${ringAlpha.toFixed(3)})`;
        bgCtx.lineWidth = 1.5 - phase;
        bgCtx.beginPath();
        bgCtx.arc(core.x, core.y, ringR, 0, Math.PI*2);
        bgCtx.stroke();
      });
    }

    // Domain node glows
    builtNodes.filter(n => n.type === 'cluster').forEach(n => {
      const rgb = hexToRgb(n.color || '#00E5CC');
      const pulse = 0.7 + 0.3 * Math.sin(elapsed * 0.9 + n.x * 0.01);
      const gr = bgCtx.createRadialGradient(n.x, n.y, n.r*0.5, n.x, n.y, n.r*3.2);
      gr.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${(0.28*pulse).toFixed(3)})`);
      gr.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
      bgCtx.fillStyle = gr;
      bgCtx.beginPath();
      bgCtx.arc(n.x, n.y, n.r*3.2, 0, Math.PI*2);
      bgCtx.fill();
    });

    // Topic node soft halos
    builtNodes.filter(n => n.type === 'topic').forEach(n => {
      const rgb = hexToRgb(n.color || '#00E5CC');
      const pulse = 0.6 + 0.4 * Math.sin(elapsed * 1.3 + n.y * 0.015);
      const gr = bgCtx.createRadialGradient(n.x, n.y, n.r*0.8, n.x, n.y, n.r*3.8);
      gr.addColorStop(0, `rgba(${rgb.r},${rgb.g},${rgb.b},${(0.14*pulse).toFixed(3)})`);
      gr.addColorStop(1, `rgba(${rgb.r},${rgb.g},${rgb.b},0)`);
      bgCtx.fillStyle = gr;
      bgCtx.beginPath();
      bgCtx.arc(n.x, n.y, n.r*3.8, 0, Math.PI*2);
      bgCtx.fill();
    });
  }

  if (!builtNodes.length) return;

  // ── ANIMATE BRANCH PATHS (SVG tentacle wave) ───────────────────────────────
  branchPaths.forEach((bp, i) => {
    const d = animatedPath(bp.sx, bp.sy, bp.cpx, bp.cpy, bp.tx, bp.ty,
                           bp.waveAmp, bp.wavePhase + i * 0.4, ts);
    bp.glowEl.setAttribute('d', d);
    bp.mainEl.setAttribute('d', d);
  });

  // ── TOP CANVAS: Particles ──────────────────────────────────────────────────
  topCtx.clearRect(0, 0, CW, CH);

  if (ts - lastSpawn > 110) { spawnParticle(ts); lastSpawn = ts; }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.prog += p.speed;
    if (p.prog >= 1) { particles.splice(i,1); continue; }

    // Use the animated control point (approximate — use stored link cpx/cpy)
    const pt = quadBezierPoint(p.sx, p.sy, p.cpx, p.cpy, p.tx, p.ty, p.prog);
    const fade = Math.min(p.prog*5, 1) * Math.min((1-p.prog)*5, 1);
    const {r,g,b} = p.rgb;

    // Outer glow
    topCtx.fillStyle = `rgba(${r},${g},${b},${(0.18*fade).toFixed(3)})`;
    topCtx.beginPath();
    topCtx.arc(pt.x, pt.y, p.r * 3.5, 0, Math.PI*2);
    topCtx.fill();

    // Core dot
    topCtx.fillStyle = `rgba(${r},${g},${b},${(0.95*fade).toFixed(3)})`;
    topCtx.beginPath();
    topCtx.arc(pt.x, pt.y, p.r, 0, Math.PI*2);
    topCtx.fill();

    // Bright center
    topCtx.fillStyle = `rgba(255,255,255,${(0.6*fade).toFixed(3)})`;
    topCtx.beginPath();
    topCtx.arc(pt.x, pt.y, p.r * 0.45, 0, Math.PI*2);
    topCtx.fill();
  }
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
resize();
requestAnimationFrame(render);
</script>
</body>
