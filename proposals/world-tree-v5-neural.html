// ─── CANVAS / SVG SETUP ───────────────────────────────────────────────────────
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');
const svgEl    = document.getElementById('tree-svg');
const svg      = d3.select(svgEl);

let CW, CH, cx, cy;
let builtNodes = [], builtLinks = [];
let particles  = [];
let burstQueue = [];  // {link, burstSize, burstDelay, fired}
let lastBurst  = 0;

// Resting background neurons
let bgNeurons = [];

// Per-domain hover flash state
let hoveredDomainId = null;

const FLASH_DURATION = 600; // ms

function resize() {
  CW = bgCanvas.width  = window.innerWidth;
  CH = bgCanvas.height = window.innerHeight;
  cx = CW / 2;
  cy = CH / 2;
  buildLayout();
  buildBgNeurons();
  renderSVG();
}
window.addEventListener('resize', resize, { passive: true });

// ─── LAYOUT ──────────────────────────────────────────────────────────────────
function buildLayout() {
  const dim  = Math.min(CW, CH);
  const R1   = dim * 0.24;    // domain (soma) radius
  const R2   = dim * 0.43;    // topic (synaptic terminal) radius
  const N    = BRANCHES.length;
  const SPREAD = Math.PI * 0.30; // topic arc half-span

  builtNodes = [];
  builtLinks = [];
  particles  = [];
  burstQueue = [];

  // Core soma
  const core = {
    id:"frqncy", label:"FRQNCY", type:"core", r:52,
    desc:"The living network of consciousness", x:cx, y:cy
  };
  builtNodes.push(core);

  BRANCHES.forEach((branch, bi) => {
    const baseAngle = (bi / N) * Math.PI * 2 - Math.PI / 2;

    const dx = cx + Math.cos(baseAngle) * R1;
    const dy = cy + Math.sin(baseAngle) * R1;

    // Axon path: multi-segment jagged approach
    // We build 2 intermediate waypoints for jagged axon feel
    const axonSegs = buildAxonSegments(cx, cy, dx, dy, baseAngle, 0.3);

    const domainNode = {
      id: branch.id, label: branch.label, type:"cluster", r:24,
      desc: branch.desc, x: dx, y: dy,
      branchColor: branch.color,
      axonSegs,   // array of {x,y} waypoints from core to domain
    };
    builtNodes.push(domainNode);
    builtLinks.push({
      source: core, target: domainNode, level: 0,
      branchColor: branch.color,
      segs: axonSegs,
    });

    const nt = branch.topics.length;
    branch.topics.forEach((topic, ti) => {
      const tAngle = baseAngle - SPREAD/2 + (ti / (nt - 1 || 1)) * SPREAD;
      const tx = cx + Math.cos(tAngle) * R2;
      const ty = cy + Math.sin(tAngle) * R2;

      // Dendrite path: jagged segments from domain to topic
      const dendSegs = buildAxonSegments(dx, dy, tx, ty, tAngle, 0.22);

      const topicNode = {
        id: topic.id, label: topic.label, type:"topic", r:11,
        x: tx, y: ty,
        branchColor: branch.color,
        domainId: branch.id,
        dendSegs,
      };
      builtNodes.push(topicNode);
      builtLinks.push({
        source: domainNode, target: topicNode, level: 1,
        branchColor: branch.color,
        domainId: branch.id,
        segs: dendSegs,
      });
    });
  });
}

// Build jagged multi-segment path (axon style) between two points
// Returns array of {x,y} points: [start, wp1, wp2?, end]
function buildAxonSegments(x1, y1, x2, y2, baseAngle, jitter) {
  const pts = [{x:x1, y:y1}];
  const dx = x2 - x1, dy = y2 - y1;
  const dist = Math.sqrt(dx*dx + dy*dy);

  // 2 intermediate waypoints for the jagged look
  // Perpendicular offset for each — alternating sign
  const perpX = -Math.sin(baseAngle);
  const perpY  = Math.cos(baseAngle);

  const t1 = 0.33 + (Math.random() - 0.5) * 0.10;
  const t2 = 0.66 + (Math.random() - 0.5) * 0.10;

  const off1 = dist * jitter * ((Math.random() > 0.5 ? 1 : -1)) * (0.5 + Math.random() * 0.5);
  const off2 = dist * jitter * ((Math.random() > 0.5 ? 1 : -1)) * (0.5 + Math.random() * 0.5);

  pts.push({
    x: x1 + dx*t1 + perpX*off1,
    y: y1 + dy*t1 + perpY*off1,
  });
  pts.push({
    x: x1 + dx*t2 + perpX*off2,
    y: y1 + dy*t2 + perpY*off2,
  });

  // Optional fork: add a tiny forking branch stub off wp1 (visual only, drawn in SVG)
  pts.push({x:x2, y:y2});
  return pts;
}

// Sample a point along a polyline path (segs array) at progress t∈[0,1]
function samplePolyline(segs, t) {
  const n = segs.length - 1;
  if (n <= 0) return segs[0] || {x:0,y:0};
  const seg = Math.min(Math.floor(t * n), n - 1);
  const lt  = (t * n) - seg;
  const a   = segs[seg], b = segs[seg+1];
  return { x: a.x + (b.x-a.x)*lt, y: a.y + (b.y-a.y)*lt };
}

// ─── BACKGROUND RESTING NEURONS ───────────────────────────────────────────────
function buildBgNeurons() {
  bgNeurons = [];
  for (let i = 0; i < 15; i++) {
    bgNeurons.push({
      x: Math.random() * CW,
      y: Math.random() * CH,
      r: 1.5 + Math.random() * 2.5,
      phase: Math.random() * Math.PI * 2,
      speed: 0.4 + Math.random() * 0.6,
      baseA: 0.06 + Math.random() * 0.08,

}

// ─── SVG ─────────────────────────────────────────────────────────────────────
function renderSVG() {
  svg.selectAll('*').remove();

  const defs = svg.append('defs');

  // Gradients
  // Core soma: gold
  const gCore = defs.append('radialGradient').attr('id','g-core').attr('cx','38%').attr('cy','30%');
  gCore.append('stop').attr('offset','0%').attr('stop-color', C.gold1);
  gCore.append('stop').attr('offset','100%').attr('stop-color', C.gold2);

  // Domain soma: electric blue
  const gDom = defs.append('radialGradient').attr('id','g-domain').attr('cx','38%').attr('cy','30%');
  gDom.append('stop').attr('offset','0%').attr('stop-color', C.domBlue1);
  gDom.append('stop').attr('offset','100%').attr('stop-color', C.domBlue2);

  // Topic synaptic terminal: deep purple-blue
  const gTop = defs.append('radialGradient').attr('id','g-topic').attr('cx','38%').attr('cy','30%');
  gTop.append('stop').attr('offset','0%').attr('stop-color', C.topicBlue1);
  gTop.append('stop').attr('offset','100%').attr('stop-color', C.topicBlue2);

  // Glow filter for domain somas
  const fDom = defs.append('filter').attr('id','f-domain-glow')
    .attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
  fDom.append('feGaussianBlur').attr('stdDeviation','7').attr('result','blur');
  const fDomM = fDom.append('feMerge');
  fDomM.append('feMergeNode').attr('in','blur');
  fDomM.append('feMergeNode').attr('in','SourceGraphic');

  // Glow filter for synaptic terminals (topics)
  const fTop = defs.append('filter').attr('id','f-synapse-glow')
    .attr('x','-100%').attr('y','-100%').attr('width','300%').attr('height','300%');
  fTop.append('feGaussianBlur').attr('stdDeviation','4').attr('result','blur');
  const fTopM = fTop.append('feMerge');
  fTopM.append('feMergeNode').attr('in','blur');
  fTopM.append('feMergeNode').attr('in','SourceGraphic');

  // Core outer glow filter
  const fCore = defs.append('filter').attr('id','f-core-glow')
    .attr('x','-80%').attr('y','-80%').attr('width','260%').attr('height','260%');
  fCore.append('feGaussianBlur').attr('stdDeviation','12').attr('result','blur');
  const fCoreM = fCore.append('feMerge');
  fCoreM.append('feMergeNode').attr('in','blur');
  fCoreM.append('feMergeNode').attr('in','SourceGraphic');

  // ── Axon / dendrite paths ──
  const branchG = svg.append('g').attr('class','branches');

  builtLinks.forEach(link => {
    const segs = link.segs;
    const color = link.branchColor;

    if (link.level === 0) {
      // Main axon: thicker, electric blue/color
      const d = segsToPolyPath(segs);
      branchG.append('path')
        .attr('d', d)
        .attr('fill', 'none')
        .attr('stroke', hexAlpha(color, 0.55))
        .attr('stroke-width', 1.8)
        .attr('stroke-linecap', 'round')
        .attr('stroke-linejoin', 'round');

      // Fork stubs off the first waypoint
      drawForkStubs(branchG, segs, color, 0.32, 22, 0.30);
    } else {
      // Dendrite: thinner, subtler
      const d = segsToPolyPath(segs);
      branchG.append('path')
        .attr('d', d)
        .attr('fill', 'none')
        .attr('stroke', hexAlpha(color, 0.30))
        .attr('stroke-width', 0.9)
        .attr('stroke-linecap', 'round')
        .attr('stroke-linejoin', 'round');

      // Fork stubs off midpoint
      drawForkStubs(branchG, segs, color, 0.50, 14, 0.20);
    }
  });

  // ── Nodes ──
  const nodeG = svg.append('g').attr('class','nodes');
  const groups = nodeG.selectAll('g.node')
    .data(builtNodes)
    .join('g')
    .attr('class','node')
    .attr('transform', d => `translate(${d.x},${d.y})`)
    .style('cursor','pointer');

  // Domain soma dendrite spikes (SVG lines radiating outward)
  groups.filter(d => d.type === 'cluster')
    .each(function(d) {
      const g = d3.select(this);
      const N_SPIKES = 14;
      const color = d.branchColor || C.electricBlue;
      for (let i = 0; i < N_SPIKES; i++) {
        const angle = (i / N_SPIKES) * Math.PI * 2 + (Math.random() * 0.15);
        const len   = 20 + Math.random() * 14;
        const x2    = Math.cos(angle) * (d.r + len);
        const y2    = Math.sin(angle) * (d.r + len);
        const x1    = Math.cos(angle) * d.r;
        const y1    = Math.sin(angle) * d.r;
        g.append('line')
          .attr('x1', x1).attr('y1', y1)
          .attr('x2', x2).attr('y2', y2)
          .attr('stroke', hexAlpha(color, 0.45))
          .attr('stroke-width', 0.7)
          .attr('stroke-linecap', 'round');
        // optional tiny tip dot
        g.append('circle')
          .attr('cx', x2).attr('cy', y2).attr('r', 0.8)
          .attr('fill', hexAlpha(color, 0.5));
      }
    });

  // Topic outer bright point glow ring
  groups.filter(d => d.type === 'topic')
    .append('circle')
    .attr('r', d => d.r * 2.2)
    .attr('fill', 'none')
    .attr('stroke', d => hexAlpha(d.branchColor || C.electricBlue, 0.18))
    .attr('stroke-width', 3)
    .attr('filter', 'url(#f-synapse-glow)');

  // Domain soma outer glow ring
  groups.filter(d => d.type === 'cluster')
    .append('circle')
    .attr('r', d => d.r * 1.6)
    .attr('fill', 'none')
    .attr('stroke', d => hexAlpha(d.branchColor || C.electricBlue, 0.25))
    .attr('stroke-width', 1.2)
    .attr('filter', 'url(#f-domain-glow)');

  // Main node fill circles
  groups.append('circle')
    .attr('r', d => d.r)
    .attr('fill', d =>
      d.type === 'core'    ? 'url(#g-core)'   :
      d.type === 'cluster' ? 'url(#g-domain)' :
      'url(#g-topic)')
    .attr('stroke', d =>
      d.type === 'core'    ? '#E0C06A' :
      d.type === 'cluster' ? hexAlpha(d.branchColor || C.electricBlue, 0.80) :
      hexAlpha(d.branchColor || C.electricBlue, 0.40))
    .attr('stroke-width', d =>
      d.type === 'core'    ? 2.5 :
      d.type === 'cluster' ? 1.5 :
      0.8);

  // Topic bright center dot (synaptic bright point)
  groups.filter(d => d.type === 'topic')
    .append('circle')
    .attr('r', 2.2)
    .attr('fill', d => hexAlpha(d.branchColor || C.synapticCyan, 0.90));

  // Labels
  groups.filter(d => d.type !== 'dot')
    .append('text')
    .attr('text-anchor','middle')
    .attr('dominant-baseline','central')
    .attr('fill', d =>
      d.type === 'core'    ? '#0A1220' :
      d.type === 'cluster' ? C.neuralWhite :
      'rgba(140,180,255,0.85)')
    .attr('font-family', d =>
      d.type === 'core' ? 'Cormorant,Georgia,serif' : "'Jost',sans-serif")
    .attr('font-size', d =>
      d.type === 'core' ? '15px' :
      d.type === 'cluster' ? '9px' :
      '7.5px')
    .attr('font-weight', d =>
      d.type === 'core' ? '500' :
      d.type === 'cluster' ? '400' :
      '300')
    .attr('letter-spacing', d =>
      d.type === 'core' ? '0.18em' :
      d.type === 'cluster' ? '0.08em' :
      '0.04em')
    .attr('pointer-events','none')
    .each(function(d) {
      const el = d3.select(this);
      const label = d.label;
      if ((d.type === 'topic' || d.type === 'cluster') && label.length > 12) {
        const words = label.split(' ');
        const mid   = Math.ceil(words.length / 2);
        el.append('tspan').attr('x',0).attr('dy','-0.55em').text(words.slice(0,mid).join(' '));
        el.append('tspan').attr('x',0).attr('dy','1.1em').text(words.slice(mid).join(' '));
      } else {
        el.text(label);
      }
    });

  // ── Hover interactions ──
  const tip = document.getElementById('nm-tooltip');

  groups
    .on('mouseover', function(e, d) {
      if (!tip) return;
      tip.querySelector('.tip-title').textContent = d.label;
      tip.querySelector('.tip-type').textContent =
        (d.desc || '') + (d.desc ? '  ·  ' : '') +
        ({core:'MASTER NEURON', cluster:'CELL BODY · DOMAIN', topic:'SYNAPTIC TERMINAL'}[d.type] || '');
      tip.style.opacity = '1';

      // Flash connected topic nodes if hovering a domain
      if (d.type === 'cluster') {
        hoveredDomainId = d.id;
        flashNodes = new Set(
          builtNodes
            .filter(n => n.type === 'topic' && n.domainId === d.id)
            .map(n => n.id)
        );
        flashStartTime = performance.now();
        // Dim non-connected nodes
        groups.style('opacity', n => {
          if (n.id === d.id) return 1;
          if (n.type === 'core') return 0.8;
          if (n.domainId === d.id || n.id === d.id) return 1;
          return 0.08;
        });
      } else if (d.type === 'core') {
        groups.style('opacity', 1);
        hoveredDomainId = null;
        flashNodes = new Set();
      } else if (d.type === 'topic') {
        hoveredDomainId = null;
        flashNodes = new Set();
        groups.style('opacity', n => {
          if (n.id === d.id || n.id === d.domainId || n.type === 'core') return 1;
          return 0.08;
        });
      }
    })
    .on('mousemove', function(e) {
      if (!tip) return;
      tip.style.left = (e.clientX + 16) + 'px';
      tip.style.top  = (e.clientY - 16) + 'px';
    })
    .on('mouseout', function() {
      if (tip) tip.style.opacity = '0';
      groups.style('opacity', 1);
      hoveredDomainId = null;
      flashNodes = new Set();
    });
}

// Build an SVG polyline path string from segments array
function segsToPolyPath(segs) {
  if (!segs || !segs.length) return '';
  let d = `M${segs[0].x},${segs[0].y}`;
  for (let i = 1; i < segs.length; i++) {
    d += ` L${segs[i].x},${segs[i].y}`;
  }
  return d;
}

// Draw forking stub lines off a waypoint along the path
function drawForkStubs(g, segs, color, tPos, stubLen, alpha) {
  if (!segs || segs.length < 2) return;
  const pt   = samplePolyline(segs, tPos);
  const ptB  = samplePolyline(segs, tPos + 0.12);
  const dx   = ptB.x - pt.x, dy = ptB.y - pt.y;
  const dist = Math.sqrt(dx*dx + dy*dy) || 1;
  const nx   = -dy/dist, ny = dx/dist; // perpendicular

  // Two fork directions
  [-1, 1].forEach(sign => {
    const ang = sign * (0.6 + Math.random() * 0.4);
    const ex  = pt.x + (nx * Math.cos(ang) - ny * Math.sin(ang)) * stubLen;
    const ey  = pt.y + (nx * Math.sin(ang) + ny * Math.cos(ang)) * stubLen;
    // add sub-fork
    const subLen = stubLen * 0.45;
    const subAng = sign * (0.3 + Math.random() * 0.3);
    const fx  = ex + (nx * Math.cos(subAng) - ny * Math.sin(subAng)) * subLen * sign;
    const fy  = ey + (nx * Math.sin(subAng) + ny * Math.cos(subAng)) * subLen * sign;

    g.append('line')
      .attr('x1', pt.x).attr('y1', pt.y)
      .attr('x2', ex).attr('y2', ey)
      .attr('stroke', hexAlpha(color, alpha))
      .attr('stroke-width', 0.6)
      .attr('stroke-linecap', 'round');

    g.append('line')
      .attr('x1', ex).attr('y1', ey)
      .attr('x2', fx).attr('y2', fy)
      .attr('stroke', hexAlpha(color, alpha * 0.6))
      .attr('stroke-width', 0.4)
      .attr('stroke-linecap', 'round');
  });
}

// Convert hex + alpha → rgba string
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ─── PARTICLE / BURST SYSTEM ──────────────────────────────────────────────────
// Bursts: 3-5 particles fired rapidly in succession along a link, then pause

function scheduleBurst() {
  // Pick a random link
  if (!builtLinks.length) return;
  const link = builtLinks[Math.floor(Math.random() * builtLinks.length)];
  const burstSize = 3 + Math.floor(Math.random() * 3); // 3–5
  const baseSpeed = link.level === 0
    ? (0.005 + Math.random() * 0.006)
    : (0.008 + Math.random() * 0.008);

  for (let i = 0; i < burstSize; i++) {
    burstQueue.push({
      link,
      delay: i * 60,        // ms between each in burst
      speed: baseSpeed + Math.random() * 0.002,
      fired: false,
      fireAt: performance.now() + i * 60,
    });
  }
}

function spawnFromQueue(now) {
  for (let i = burstQueue.length - 1; i >= 0; i--) {
    const b = burstQueue[i];
    if (b.fired) { burstQueue.splice(i,1); continue; }
    if (now >= b.fireAt) {
      b.fired = true;
      if (particles.length < 300) {
        const link = b.link;
        particles.push({
          segs:   link.segs,
          prog:   0,
          speed:  b.speed,
          level:  link.level,
          color:  link.branchColor,
        });
      }
      burstQueue.splice(i,1);
    }
  }
}

// ─── NEURAL GRID (background) ─────────────────────────────────────────────────
// Draw a faint dot-grid at startup (cached to offscreen canvas for perf)
let gridCanvas = null;
function buildGridCanvas() {
  gridCanvas = document.createElement('canvas');
  gridCanvas.width  = CW;
  gridCanvas.height = CH;
  const gc = gridCanvas.getContext('2d');

  const SPACING = 28;
  gc.fillStyle = C.gridDot;
  for (let x = 0; x < CW; x += SPACING) {
    for (let y = 0; y < CH; y += SPACING) {
      // Tiny dot at grid intersection
      gc.beginPath(); gc.arc(x, y, 0.8, 0, Math.PI*2); gc.fill();
    }
  }
  // Faint random connecting lines between nearby dots (sparse network feel)
  gc.strokeStyle = 'rgba(10,132,255,0.018)';
  gc.lineWidth   = 0.5;
  const cols = Math.floor(CW / SPACING);
  const rows = Math.floor(CH / SPACING);
  for (let col = 0; col < cols; col++) {
    for (let row = 0; row < rows; row++) {
      if (Math.random() < 0.22) {
        const x1 = col*SPACING, y1 = row*SPACING;
        const n = Math.random();
        let x2, y2;
        if (n < 0.33)      { x2=x1+SPACING; y2=y1; }
        else if (n < 0.66) { x2=x1; y2=y1+SPACING; }
        else               { x2=x1+SPACING; y2=y1+SPACING; }
        gc.beginPath(); gc.moveTo(x1,y1); gc.lineTo(x2,y2); gc.stroke();
      }
    }
  }
}

// ─── RENDER LOOP ─────────────────────────────────────────────────────────────
function render(ts) {
  requestAnimationFrame(render);
  bgCtx.clearRect(0, 0, CW, CH);

  // Solid dark background
  bgCtx.fillStyle = C.bg;
  bgCtx.fillRect(0, 0, CW, CH);

  // Neural grid
  if (gridCanvas) bgCtx.drawImage(gridCanvas, 0, 0);

  // Resting background neurons with pulsing halos
  const t = ts * 0.001;
  bgNeurons.forEach(n => {
    const pulse = 0.5 + 0.5 * Math.sin(t * n.speed + n.phase);
    const a = n.baseA * pulse;
    // halo
    const hg = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 8);
    hg.addColorStop(0, `rgba(10,132,255,${(a*0.8).toFixed(3)})`);
    hg.addColorStop(0.4,`rgba(0,200,255,${(a*0.3).toFixed(3)})`);
    hg.addColorStop(1,  'rgba(0,200,255,0)');
    bgCtx.fillStyle = hg;
    bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r*8, 0, Math.PI*2); bgCtx.fill();
    // core dot
    bgCtx.fillStyle = `rgba(0,200,255,${(a*2.5).toFixed(3)})`;
    bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r, 0, Math.PI*2); bgCtx.fill();
  });

  if (!builtNodes.length) { requestAnimationFrame(render); return; }

  const now = performance.now();

  // ── Canvas-side node glows ──
  builtNodes.forEach(n => {
    if (n.x == null) return;
    if (n.type === 'core') {
      // Gold soma glow
      const g = bgCtx.createRadialGradient(n.x, n.y, n.r*0.5, n.x, n.y, n.r*3.6);
      g.addColorStop(0,   'rgba(196,151,58,0.32)');
      g.addColorStop(0.4, 'rgba(196,151,58,0.10)');
      g.addColorStop(1,   'rgba(196,151,58,0)');
      bgCtx.fillStyle = g;
      bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r*3.6, 0, Math.PI*2); bgCtx.fill();
      // Electric ring pulse
      const ringPulse = 0.5 + 0.5 * Math.sin(t * 1.2);
      bgCtx.strokeStyle = `rgba(244,220,136,${(0.10 * ringPulse).toFixed(3)})`;
      bgCtx.lineWidth = 1.5;
      bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r + 12 + ringPulse*8, 0, Math.PI*2); bgCtx.stroke();
      bgCtx.strokeStyle = `rgba(10,132,255,${(0.06 * ringPulse).toFixed(3)})`;
      bgCtx.lineWidth = 1;
      bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r + 26 + ringPulse*12, 0, Math.PI*2); bgCtx.stroke();
    } else if (n.type === 'cluster') {
      const color = n.branchColor || C.electricBlue;
      const rgb   = hexToRgb(color);
      const g = bgCtx.createRadialGradient(n.x, n.y, n.r*0.4, n.x, n.y, n.r*2.8);
      g.addColorStop(0, `rgba(${rgb},0.22)`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      bgCtx.fillStyle = g;
      bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r*2.8, 0, Math.PI*2); bgCtx.fill();
    } else if (n.type === 'topic') {
      // Flash effect when domain is hovered
      let isFlashing = false;
      if (flashNodes.has(n.id)) {
        const elapsed = now - flashStartTime;
        if (elapsed < FLASH_DURATION) {
          isFlashing = true;
          const flashA = Math.sin((elapsed / FLASH_DURATION) * Math.PI);
          const fg = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r*4);
          fg.addColorStop(0,  `rgba(232,244,255,${(0.7*flashA).toFixed(3)})`);
          fg.addColorStop(0.4,`rgba(0,200,255,${(0.3*flashA).toFixed(3)})`);
          fg.addColorStop(1,  'rgba(0,200,255,0)');
          bgCtx.fillStyle = fg;
          bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r*4, 0, Math.PI*2); bgCtx.fill();
        } else {
          flashNodes.delete(n.id);
        }
      }
      if (!isFlashing) {
        const color = n.branchColor || C.electricBlue;
        const rgb   = hexToRgb(color);
        const g = bgCtx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r*3);
        g.addColorStop(0, `rgba(${rgb},0.10)`);
        g.addColorStop(1, `rgba(${rgb},0)`);
        bgCtx.fillStyle = g;
        bgCtx.beginPath(); bgCtx.arc(n.x, n.y, n.r*3, 0, Math.PI*2); bgCtx.fill();
      }
    }
  });

  // ── Schedule bursts ──
  if (now - lastBurst > 380 + Math.random() * 700) {
    scheduleBurst();
    lastBurst = now;
  }
  spawnFromQueue(now);

  // ── Draw particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.prog += p.speed;
    if (p.prog >= 1) { particles.splice(i,1); continue; }

    const pt   = samplePolyline(p.segs, p.prog);
    const fade = Math.min(p.prog*6, 1) * Math.min((1-p.prog)*6, 1);

    if (p.level === 0) {
      // Axon particle — electric blue/color with white-hot core
      const color = p.color || C.electricBlue;
      const rgb   = hexToRgb(color);
      // outer glow
      const pg = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 5);
      pg.addColorStop(0,  `rgba(${rgb},${(0.65*fade).toFixed(3)})`);
      pg.addColorStop(1,  `rgba(${rgb},0)`);
      bgCtx.fillStyle = pg;
      bgCtx.beginPath(); bgCtx.arc(pt.x, pt.y, 5, 0, Math.PI*2); bgCtx.fill();
      // bright core
      bgCtx.fillStyle = `rgba(255,250,224,${(0.92*fade).toFixed(3)})`;
      bgCtx.beginPath(); bgCtx.arc(pt.x, pt.y, 1.5, 0, Math.PI*2); bgCtx.fill();
    } else {
      // Dendrite particle — softer, cyan
      const color = p.color || C.synapticCyan;
      const rgb   = hexToRgb(color);
      const pg = bgCtx.createRadialGradient(pt.x, pt.y, 0, pt.x, pt.y, 3.5);
      pg.addColorStop(0, `rgba(${rgb},${(0.50*fade).toFixed(3)})`);
      pg.addColorStop(1, `rgba(${rgb},0)`);
      bgCtx.fillStyle = pg;
      bgCtx.beginPath(); bgCtx.arc(pt.x, pt.y, 3.5, 0, Math.PI*2); bgCtx.fill();
      bgCtx.fillStyle = `rgba(232,244,255,${(0.80*fade).toFixed(3)})`;
      bgCtx.beginPath(); bgCtx.arc(pt.x, pt.y, 1.0, 0, Math.PI*2); bgCtx.fill();
    }
  }
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `${r},${g},${b}`;
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
resize();
buildGridCanvas();
requestAnimationFrame(render);
</script>
</body>
