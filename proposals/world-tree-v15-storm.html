    // ===== LAYOUT COMPUTATION =====
    let CW = window.innerWidth;
    let CH = window.innerHeight;

    // Categorize nodes by type
    const coreNode = HOME_NODES.find(n => n.type === 'core');
    const mainNodes = HOME_NODES.filter(n => n.type === 'main');
    const clusterNodes = HOME_NODES.filter(n => n.type === 'cluster');
    const topicNodes = HOME_NODES.filter(n => n.type === 'topic' || n.type === 'subcluster');

    // nodeMap: id -> {x, y, origFracX, origFracY}
    const nodeMap = {};

    function computeLayout() {
      // Core
      nodeMap['frqncy'] = { x: CW * 0.50, y: CH * 0.60, fracX: 0.50, fracY: 0.60 };

      // Main nodes — y range CH*0.42–0.62, x spread ±CW*0.28
      mainNodes.forEach((n, i) => {
        const count = mainNodes.length;
        const t = count === 1 ? 0.5 : i / (count - 1);
        const fx = 0.50 - 0.28 + t * 0.56;
        const fy = 0.42 + (i % 2 === 0 ? 0 : 0.06) + (Math.sin(i * 1.2) * 0.04);
        nodeMap[n.id] = { x: CW * fx, y: CH * fy, fracX: fx, fracY: fy };
      });

      // Cluster nodes — y range CH*0.18–0.40, x spread ±CW*0.44
      clusterNodes.forEach((n, i) => {
        const count = clusterNodes.length;
        const t = count === 1 ? 0.5 : i / (count - 1);
        const fx = 0.50 - 0.44 + t * 0.88;
        const row = Math.floor(i / 8);
        const fy = 0.18 + row * 0.12 + (i % 2 === 0 ? 0 : 0.05);
        nodeMap[n.id] = { x: CW * fx, y: CH * Math.min(fy, 0.40), fracX: fx, fracY: Math.min(fy, 0.40) };
      });

      // Topic nodes — y range CH*0.06–0.36, x spread ±CW*0.48
      topicNodes.forEach((n, i) => {
        const count = topicNodes.length;
        const t = count === 1 ? 0.5 : i / (count - 1);
        const fx = 0.50 - 0.48 + t * 0.96;
        const row = Math.floor(i / 18);
        const fy = 0.06 + row * 0.075 + (i % 3 === 0 ? 0 : i % 3 === 1 ? 0.025 : 0.05);
        nodeMap[n.id] = { x: CW * fx, y: CH * Math.min(fy, 0.36), fracX: fx, fracY: Math.min(fy, 0.36) };
      });
    }

    // ===== BRANCH PATHS =====
    function curvePath(x1, y1, x2, y2) {
      const cpx = (x1 + x2) / 2;
      const cpy = Math.min(y1, y2) - Math.abs(x2 - x1) * 0.3 - 30;
      return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
    }

    // Paths group (behind nodes)
    const pathsGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    // Build branch paths registry
    const branchPaths = []; // {src, tgt, base: SVGPath, highlight: SVGPath}

    function getStrokeParams(srcId, tgtId) {
      const sNode = HOME_NODES.find(n => n.id === srcId);
      const tNode = HOME_NODES.find(n => n.id === tgtId);
      const sType = sNode ? sNode.type : 'topic';
      const tType = tNode ? tNode.type : 'topic';
      if (sType === 'core' || tType === 'core') {
        return { baseWidth: 2.5, hlWidth: 1.2 };
      } else if (sType === 'main' || tType === 'main') {
        return { baseWidth: 1.8, hlWidth: 0.9 };
      } else if (sType === 'cluster' || tType === 'cluster') {
        return { baseWidth: 1.2, hlWidth: 0.6 };
      } else {
        return { baseWidth: 0.8, hlWidth: 0.4 };
      }
    }

    HOME_RAW_LINKS.forEach(pair => {
      const [srcId, tgtId] = pair;
      const s = nodeMap[srcId], t = nodeMap[tgtId];
      if (!s || !t) return;
      const d = curvePath(s.x, s.y, t.x, t.y);
      const params = getStrokeParams(srcId, tgtId);

      // Base path
      const basePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      basePath.setAttribute('d', d);
      basePath.setAttribute('fill', 'none');
      basePath.setAttribute('stroke', 'rgba(26,37,64,0.6)');
      basePath.setAttribute('stroke-width', params.baseWidth);
      basePath.setAttribute('pointer-events', 'none');
      pathsGroup.appendChild(basePath);

      // Electric highlight path
      const hlPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hlPath.setAttribute('d', d);
      hlPath.setAttribute('fill', 'none');
      hlPath.setAttribute('stroke', 'rgba(100,180,255,0.45)');
      hlPath.setAttribute('stroke-width', params.hlWidth);
      hlPath.setAttribute('pointer-events', 'none');
      hlPath.setAttribute('filter', 'url(#path-glow)');
      pathsGroup.appendChild(hlPath);

      branchPaths.push({ src: srcId, tgt: tgtId, base: basePath, highlight: hlPath });
    });

    function updatePaths(id) {
      branchPaths.forEach(bp => {
        if (bp.src !== id && bp.tgt !== id) return;
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        const d = curvePath(s.x, s.y, t.x, t.y);
        bp.base.setAttribute('d', d);
        bp.highlight.setAttribute('d', d);
      });
    }

    // ===== NODE RENDERING (SVG) =====
    const nodesGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    nodesGroup.setAttribute('id', 'nodes-group');
    svgEl.appendChild(nodesGroup);

    const nodeEls = {}; // id -> g element

    function getNodeFill(n) {
      switch (n.type) {
        case 'core': return '#FFFFFF';
        case 'main': return '#1A3A6A';
        case 'cluster': return '#152A50';

      switch (n.type) {

        default: return 'rgba(60,120,180,0.35)';

      switch (n.type) {
        case 'core': return 'url(#core-glow)';
        case 'main': return 'url(#electric-glow)';

    function getNodeRadius(n) {
      switch (n.type) {

    // ===== TRUNK AND ROOTS (canvas) =====
    function drawTrunkAndRoots() {

      ctx.stroke();
      ctx.restore();

      // Roots — 6 bezier curves spreading downward
      const rootsBase = CH * 0.92;
      const rootData = [
        { ex: cx - CW * 0.26, ey: rootsBase, cp1x: cx - CW * 0.05, cp1y: trunkBase + 20, cp2x: cx - CW * 0.18, cp2y: rootsBase - 40, w: 8 },
        { ex: cx - CW * 0.18, ey: rootsBase - 20, cp1x: cx - CW * 0.03, cp1y: trunkBase + 15, cp2x: cx - CW * 0.12, cp2y: rootsBase - 50, w: 6 },
        { ex: cx - CW * 0.09, ey: rootsBase + 5, cp1x: cx - CW * 0.01, cp1y: trunkBase + 10, cp2x: cx - CW * 0.05, cp2y: rootsBase - 30, w: 4 },
        { ex: cx + CW * 0.09, ey: rootsBase, cp1x: cx + CW * 0.02, cp1y: trunkBase + 10, cp2x: cx + CW * 0.05, cp2y: rootsBase - 30, w: 4 },
        { ex: cx + CW * 0.18, ey: rootsBase - 15, cp1x: cx + CW * 0.04, cp1y: trunkBase + 15, cp2x: cx + CW * 0.12, cp2y: rootsBase - 45, w: 6 },
        { ex: cx + CW * 0.26, ey: rootsBase, cp1x: cx + CW * 0.06, cp1y: trunkBase + 20, cp2x: cx + CW * 0.18, cp2y: rootsBase - 40, w: 8 }
      ];

      rootData.forEach((rd, i) => {
        ctx.save();
        ctx.strokeStyle = 'rgba(26,30,40,0.9)';
        ctx.lineWidth = rd.w;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(cx, trunkBase);
        ctx.bezierCurveTo(rd.cp1x, rd.cp1y, rd.cp2x, rd.cp2y, rd.ex, rd.ey);
        ctx.stroke();

        // Electric vein on roots
        ctx.strokeStyle = 'rgba(40,100,180,0.1)';
        ctx.lineWidth = rd.w * 0.25;
        ctx.beginPath();
        ctx.moveTo(cx, trunkBase);
        ctx.bezierCurveTo(rd.cp1x, rd.cp1y, rd.cp2x, rd.cp2y, rd.ex, rd.ey);
        ctx.stroke();
        ctx.restore();
      });
    }

    // ===== CLOUDS (canvas) =====
    function drawClouds(ts) {
      const cx = CW * 0.50;
      const cloudData = [
        { x: cx * 0.35, y: CH * 0.04, rx: CW * 0.22, ry: CH * 0.08 },
        { x: cx * 1.1,  y: CH * 0.06, rx: CW * 0.28, ry: CH * 0.09 },
        { x: cx * 0.72, y: CH * 0.02, rx: CW * 0.18, ry: CH * 0.06 },
        { x: cx * 1.45, y: CH * 0.05, rx: CW * 0.20, ry: CH * 0.07 }
      ];

      cloudData.forEach(c => {
        ctx.save();
        ctx.globalAlpha = 0.65;
        const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, Math.max(c.rx, c.ry));
        grad.addColorStop(0, 'rgba(8,12,22,0.85)');
        grad.addColorStop(0.7, 'rgba(6,10,18,0.6)');
        grad.addColorStop(1, 'rgba(4,6,14,0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    // ===== MAIN ANIMATION LOOP =====
    function animate(ts) {
      requestAnimationFrame(animate);

      // 1. Clear
      ctx.clearRect(0, 0, CW, CH);

      // 2. Storm gradient background
      const bg = ctx.createLinearGradient(0, 0, 0, CH);
      bg.addColorStop(0, '#04060A');
      bg.addColorStop(0.4, '#060A14');
      bg.addColorStop(0.75, '#080C18');
      bg.addColorStop(1, '#0A1020');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CW, CH);

      // Subtle purple tint in upper-left
      const purp = ctx.createRadialGradient(CW * 0.15, CH * 0.15, 0, CW * 0.15, CH * 0.15, CW * 0.45);
      purp.addColorStop(0, 'rgba(30,10,50,0.25)');
      purp.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = purp;
      ctx.fillRect(0, 0, CW, CH);

      // 3. Clouds
      drawClouds(ts);

      // 4. Rain
      updateRain();
      drawRain();

      // 5. Lightning flash
      const now = Date.now();
      if (now > nextFlash) {
        flashAlpha = 0.3;
        nextFlash = now + 4000 + Math.random() * 4000;
      }
      if (flashAlpha > 0) {
        ctx.fillStyle = `rgba(200,220,255,${flashAlpha.toFixed(3)})`;
        ctx.fillRect(0, 0, CW, CH);
        flashAlpha = Math.max(0, flashAlpha - 0.02);
      }

      // 6. Trunk and Roots
      drawTrunkAndRoots();

      // 7. Subtle electric bloom under core
      const cx = CW * 0.50, cy = CH * 0.60;
      const bloom = ctx.createRadialGradient(cx, cy, 0, cx, cy, 90);
      bloom.addColorStop(0, 'rgba(100,180,255,0.18)');
      bloom.addColorStop(0.5, 'rgba(60,120,220,0.06)');
      bloom.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = bloom;
      ctx.beginPath();
      ctx.arc(cx, cy, 90, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(animate);

    // ===== RESIZE HANDLER =====
    window.addEventListener('resize', () => {
      const oldCW = CW, oldCH = CH;
      CW = window.innerWidth;
      CH = window.innerHeight;
      canvas.width = CW;
      canvas.height = CH;
      svgEl.setAttribute('width', CW);
      svgEl.setAttribute('height', CH);

      // Reposition nodes proportionally
      HOME_NODES.forEach(n => {
        const pos = nodeMap[n.id];
        if (!pos) return;
        pos.x = pos.x * (CW / oldCW);
        pos.y = pos.y * (CH / oldCH);
        const g = nodeEls[n.id];
        if (g) g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
      });

      // Update all paths
      HOME_NODES.forEach(n => updatePaths(n.id));

      // Re-init rain for new size
      initRain();
    }, { passive: true });

  })();
  </script>
</body>
