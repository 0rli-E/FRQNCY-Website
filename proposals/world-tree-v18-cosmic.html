    // ===== LAYOUT COMPUTATION =====
    let CW = window.innerWidth;
    let CH = window.innerHeight;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const svgEl = document.getElementById('svg');
    const linksLayer = document.getElementById('links-layer');
    const nodesLayer = document.getElementById('nodes-layer');
    const tooltip = document.getElementById('tooltip');

    // Separate nodes by type
    const coreNode = HOME_NODES.find(n => n.type === 'core');
    const mainNodes = HOME_NODES.filter(n => n.type === 'main');
    const clusterNodes = HOME_NODES.filter(n => n.type === 'cluster');
    const topicNodes = HOME_NODES.filter(n => n.type === 'topic');

    // nodeMap: id -> {x, y, type, label, desc}
    const nodeMap = {};

    function computeLayout() {
      // Core
      nodeMap['frqncy'] = { x: CW * 0.50, y: CH * 0.60, type: 'core', label: 'FRQNCY', desc: 'The living network of consciousness' };

      // Main nodes: arc around core, y range 0.42–0.62
      mainNodes.forEach((n, i) => {
        const t = i / mainNodes.length;
        const angle = Math.PI * 1.15 + t * Math.PI * 0.7; // spread across top arc
        const rx = CW * 0.30;
        const ry = CH * 0.14;
        const cx = CW * 0.50;
        const cy = CH * 0.56;
        nodeMap[n.id] = {
          x: cx + Math.cos(angle) * rx,
          y: cy - Math.abs(Math.sin(angle)) * ry,
          type: n.type, label: n.label, desc: n.desc
        };
      });

      // Cluster nodes: y range 0.18–0.40
      clusterNodes.forEach((n, i) => {
        const t = i / (clusterNodes.length - 1);
        nodeMap[n.id] = {
          x: CW * 0.06 + t * CW * 0.88,
          y: CH * 0.22 + Math.sin(t * Math.PI) * CH * 0.12,
          type: n.type, label: n.label, desc: n.desc
        };
      });

      // Topic nodes: y range 0.04–0.30, spread full width
      topicNodes.forEach((n, i) => {
        const t = i / (topicNodes.length - 1);
        const rowCount = 5;
        const row = i % rowCount;
        const col = Math.floor(i / rowCount);
        const totalCols = Math.ceil(topicNodes.length / rowCount);
        const colT = col / Math.max(totalCols - 1, 1);
        const rowT = row / (rowCount - 1);
        nodeMap[n.id] = {
          x: CW * 0.03 + colT * CW * 0.94,
          y: CH * 0.04 + rowT * CH * 0.14,
          type: n.type, label: n.label, desc: n.desc
        };
      });

      // Fill any missing nodes
      HOME_NODES.forEach(n => {
        if (!nodeMap[n.id]) nodeMap[n.id] = { x: CW * 0.5, y: CH * 0.5, type: n.type, label: n.label, desc: n.desc };
      });
    }

    // ===== OFFSCREEN TREE SILHOUETTE CANVAS =====
    let offscreen = null;

    function drawBranch(bctx, x, y, angle, len, depth, seed) {
      if (depth === 0 || len < 3) return;
      const dx = Math.cos(angle) * len;
      const dy = -Math.abs(Math.sin(angle)) * len;
      const x2 = x + dx;
      const y2 = y + dy;
      bctx.beginPath();
      bctx.moveTo(x, y);
      bctx.lineTo(x2, y2);
      bctx.lineWidth = Math.max(depth * 0.65, 0.5);
      bctx.strokeStyle = `rgba(20,15,10,${0.08 + depth * 0.06})`;
      bctx.stroke();
      const spread = 0.35 + (seed % 7) * 0.02;
      drawBranch(bctx, x2, y2, angle - spread + (seed % 3) * 0.05, len * 0.70, depth - 1, seed + 1);
      drawBranch(bctx, x2, y2, angle + spread - (seed % 5) * 0.03, len * 0.65, depth - 1, seed + 3);
    }

    function buildOffscreenTree() {
      offscreen = document.createElement('canvas');
      offscreen.width = CW;
      offscreen.height = CH;
      const bctx = offscreen.getContext('2d');

      const tx = CW * 0.50;
      const ty = CH * 0.60;

      // Draw trunk on offscreen
      const tgrad = bctx.createLinearGradient(tx - 18, ty, tx + 18, ty + CH * 0.14);
      tgrad.addColorStop(0, 'rgba(22,16,10,0.9)');
      tgrad.addColorStop(1, 'rgba(10,8,4,0.6)');
      bctx.fillStyle = tgrad;
      bctx.beginPath();
      bctx.moveTo(tx - 18, ty);
      bctx.quadraticCurveTo(tx - 22, ty + CH * 0.07, tx - 14, ty + CH * 0.14);
      bctx.lineTo(tx + 14, ty + CH * 0.14);
      bctx.quadraticCurveTo(tx + 22, ty + CH * 0.07, tx + 18, ty);
      bctx.closePath();
      bctx.fill();

      // Decorative branches (upper portion)
      // Main trunk up
      drawBranch(bctx, tx, ty, Math.PI / 2, 90, 7, 1);
      // Left side branches
      drawBranch(bctx, tx, ty, Math.PI / 2 + 0.4, 75, 6, 5);
      drawBranch(bctx, tx - CW*0.05, ty + CH*0.03, Math.PI / 2 + 0.55, 65, 5, 9);
      drawBranch(bctx, tx - CW*0.10, ty + CH*0.05, Math.PI / 2 + 0.7, 55, 5, 13);
      // Right side branches
      drawBranch(bctx, tx, ty, Math.PI / 2 - 0.4, 75, 6, 7);
      drawBranch(bctx, tx + CW*0.05, ty + CH*0.03, Math.PI / 2 - 0.55, 65, 5, 11);
      drawBranch(bctx, tx + CW*0.10, ty + CH*0.05, Math.PI / 2 - 0.7, 55, 5, 15);
    }

    // Gradients
    function makeRadGrad(id, c1, c2) {
      const g = document.createElementNS('http://www.w3.org/2000/svg','radialGradient');
      g.setAttribute('id', id);
      g.setAttribute('cx','35%'); g.setAttribute('cy','30%');
      const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s1.setAttribute('offset','0%'); s1.setAttribute('stop-color', c1);
      const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
      s2.setAttribute('offset','100%'); s2.setAttribute('stop-color', c2);
      g.appendChild(s1); g.appendChild(s2);
      defs.appendChild(g);
    }
    makeRadGrad('grad-core','#FFEF90','#B07818');
    makeRadGrad('grad-main','#142050','#0A1535');
    makeRadGrad('grad-cluster','#2A1050','#1A0A35');
    makeRadGrad('grad-topic','#C8A040','#90680A');

    // ===== BRANCH PATHS =====
    const branchPaths = []; // {src, tgt, els:[pathEl, pathEl]}

    function curvePath(x1, y1, x2, y2) {
      const cpx = (x1 + x2) / 2;
      const cpy = Math.min(y1, y2) - Math.abs(x2 - x1) * 0.3 - 30;
      return `M${x1},${y1} Q${cpx},${cpy} ${x2},${y2}`;
    }

    function linkStroke(srcType, tgtType) {
      if (srcType === 'core' || tgtType === 'core' || srcType === 'main' || tgtType === 'main') {
        return { base: 'rgba(10,8,4,0.4)', glow: 'rgba(255,200,80,0.5)', w: 2.5 };
      }
      if (srcType === 'cluster' || tgtType === 'cluster') {
        return { base: 'rgba(8,5,16,0.35)', glow: 'rgba(200,150,50,0.35)', w: 1.5 };
      }
      return { base: 'rgba(5,3,8,0.2)', glow: 'rgba(150,100,30,0.2)', w: 0.8 };
    }

    function buildSVG() {
      linksLayer.innerHTML = '';
      nodesLayer.innerHTML = '';
      branchPaths.length = 0;

      // Build links
      HOME_RAW_LINKS.forEach(([srcId, tgtId]) => {
        const s = nodeMap[srcId];
        const t = nodeMap[tgtId];
        if (!s || !t) return;
        const style = linkStroke(s.type, t.type);
        const d = curvePath(s.x, s.y, t.x, t.y);

        const pathBase = document.createElementNS('http://www.w3.org/2000/svg','path');
        pathBase.setAttribute('d', d);
        pathBase.setAttribute('fill','none');
        pathBase.setAttribute('stroke', style.base);
        pathBase.setAttribute('stroke-width', style.w * 1.5);
        pathBase.setAttribute('pointer-events','none');

        const pathGlow = document.createElementNS('http://www.w3.org/2000/svg','path');
        pathGlow.setAttribute('d', d);
        pathGlow.setAttribute('fill','none');
        pathGlow.setAttribute('stroke', style.glow);
        pathGlow.setAttribute('stroke-width', style.w);
        pathGlow.setAttribute('pointer-events','none');

        linksLayer.appendChild(pathBase);
        linksLayer.appendChild(pathGlow);
        branchPaths.push({ src: srcId, tgt: tgtId, els: [pathBase, pathGlow] });
      });

      // Build nodes
      HOME_NODES.forEach(n => {
        const pos = nodeMap[n.id];
        if (!pos) return;

        const g = document.createElementNS('http://www.w3.org/2000/svg','g');
        g.setAttribute('data-id', n.id);
        g.setAttribute('transform', `translate(${pos.x},${pos.y})`);
        g.style.cursor = 'grab';

        if (n.type === 'core') {
          // Outer bloom
          const bloom = document.createElementNS('http://www.w3.org/2000/svg','circle');
          bloom.setAttribute('r','60');
          bloom.setAttribute('fill','rgba(255,200,60,0.08)');
          bloom.setAttribute('pointer-events','none');
          g.appendChild(bloom);

          const bloom2 = document.createElementNS('http://www.w3.org/2000/svg','circle');
          bloom2.setAttribute('r','42');
          bloom2.setAttribute('fill','rgba(255,200,60,0.12)');
          bloom2.setAttribute('pointer-events','none');
          g.appendChild(bloom2);

          const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
          circ.setAttribute('r','32');
          circ.setAttribute('fill','url(#grad-core)');
          circ.setAttribute('stroke','rgba(255,220,100,0.9)');
          circ.setAttribute('stroke-width','2.5');
          circ.setAttribute('filter','url(#cosmic-glow)');
          g.appendChild(circ);

          const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('dominant-baseline','central');
          txt.setAttribute('fill','#0A0806');
          txt.setAttribute('font-size','13');
          txt.setAttribute('font-family','Georgia,serif');
          txt.setAttribute('letter-spacing','0.2em');
          txt.setAttribute('font-weight','600');
          txt.setAttribute('pointer-events','none');
          txt.textContent = 'FRQNCY';
          g.appendChild(txt);

        } else if (n.type === 'main') {
          const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
          circ.setAttribute('r','18');
          circ.setAttribute('fill','url(#grad-main)');
          circ.setAttribute('stroke','rgba(180,140,60,0.8)');
          circ.setAttribute('stroke-width','1.5');
          circ.setAttribute('filter','url(#main-glow)');
          g.appendChild(circ);

          const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('dominant-baseline','central');
          txt.setAttribute('fill','rgba(220,200,150,0.95)');
          txt.setAttribute('font-size','8.5');
          txt.setAttribute('font-family','Georgia,serif');
          txt.setAttribute('letter-spacing','0.06em');
          txt.setAttribute('pointer-events','none');
          txt.textContent = n.label;
          g.appendChild(txt);

        } else if (n.type === 'cluster') {
          const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
          circ.setAttribute('r','13');
          circ.setAttribute('fill','url(#grad-cluster)');
          circ.setAttribute('stroke','rgba(160,100,200,0.6)');
          circ.setAttribute('stroke-width','1.2');
          circ.setAttribute('filter','url(#cluster-glow)');
          g.appendChild(circ);

          const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('dominant-baseline','central');
          txt.setAttribute('fill','rgba(200,170,120,0.9)');
          txt.setAttribute('font-size','7');
          txt.setAttribute('font-family','Arial,sans-serif');
          txt.setAttribute('letter-spacing','0.04em');
          txt.setAttribute('pointer-events','none');
          // Wrap long labels
          const words = n.label.split(' ');
          if (words.length > 2) {
            const mid = Math.ceil(words.length / 2);
            const t1 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
            t1.setAttribute('x','0'); t1.setAttribute('dy','-0.5em');
            t1.textContent = words.slice(0, mid).join(' ');
            const t2 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
            t2.setAttribute('x','0'); t2.setAttribute('dy','1em');
            t2.textContent = words.slice(mid).join(' ');
            txt.appendChild(t1); txt.appendChild(t2);
          } else {
            txt.textContent = n.label;
          }
          g.appendChild(txt);

        } else {
          // Topic — star constellation point
          // 4-point star behind
          const star = document.createElementNS('http://www.w3.org/2000/svg','polygon');
          const sp = 5.5, si = 2.2;
          const pts = [
            `0,${-sp}`, `${si},${-si}`, `${sp},0`, `${si},${si}`,
            `0,${sp}`, `${-si},${si}`, `${-sp},0`, `${-si},${-si}`
          ].join(' ');
          star.setAttribute('points', pts);
          star.setAttribute('fill','rgba(200,160,60,0.15)');
          star.setAttribute('pointer-events','none');
          g.appendChild(star);

          const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
          circ.setAttribute('r','5');
          circ.setAttribute('fill','url(#grad-topic)');
          circ.setAttribute('stroke','rgba(255,200,80,0.4)');
          circ.setAttribute('stroke-width','0.8');
          g.appendChild(circ);

          // Label below
          const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
          txt.setAttribute('text-anchor','middle');
          txt.setAttribute('y','13');
          txt.setAttribute('fill','rgba(180,150,80,0.7)');
          txt.setAttribute('font-size','6');
          txt.setAttribute('font-family','Arial,sans-serif');
          txt.setAttribute('letter-spacing','0.03em');
          txt.setAttribute('pointer-events','none');
          txt.textContent = n.label.length > 16 ? n.label.slice(0, 14) + '…' : n.label;
          g.appendChild(txt);
        }

        nodesLayer.appendChild(g);
      });
    }

    function updatePaths(id) {
      branchPaths.forEach(bp => {
        if (bp.src !== id && bp.tgt !== id) return;
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        const d = curvePath(s.x, s.y, t.x, t.y);
        bp.els.forEach(e => e.setAttribute('d', d));
      });
    }

    // ===== DRAG =====
    let dragging = null;

    svgEl.addEventListener('pointerdown', e => {
      const g = e.target.closest('g[data-id]');
      if (!g) return;
      dragging = g.dataset.id;
      g.style.cursor = 'grabbing';
      svgEl.setPointerCapture(e.pointerId);
      e.preventDefault();
    }, { passive: false });

    svgEl.addEventListener('pointermove', e => {
      if (!dragging) return;
      const r = svgEl.getBoundingClientRect();
      nodeMap[dragging].x = e.clientX - r.left;
      nodeMap[dragging].y = e.clientY - r.top;
      const g = document.querySelector(`g[data-id="${dragging}"]`);
      if (g) g.setAttribute('transform', `translate(${nodeMap[dragging].x},${nodeMap[dragging].y})`);
      updatePaths(dragging);
    });

    svgEl.addEventListener('pointerup', e => {
      if (dragging) {
        const g = document.querySelector(`g[data-id="${dragging}"]`);
        if (g) g.style.cursor = 'grab';
        dragging = null;
      }
    });

    // ===== TOOLTIP =====
    svgEl.addEventListener('mouseover', e => {
      const g = e.target.closest('g[data-id]');
      if (!g || dragging) return;
      const id = g.dataset.id;
      const n = HOME_NODES.find(n => n.id === id);
      if (!n) return;
      tooltip.querySelector('.tip-label').textContent = n.label;
      tooltip.querySelector('.tip-desc').textContent = n.desc || ({core:'FRQNCY CORE', main:'PILLAR', cluster:'DOMAIN', topic:'TOPIC'}[n.type] || '');
      tooltip.style.opacity = '1';
    });

    svgEl.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 14) + 'px';
    });

    svgEl.addEventListener('mouseout', e => {
      const g = e.target.closest('g[data-id]');
      if (g) tooltip.style.opacity = '0';
    });

    // ===== RESIZE =====
    function onResize() {
      const oldCW = CW, oldCH = CH;
      CW = window.innerWidth;
      CH = window.innerHeight;
      canvas.width = CW;
      canvas.height = CH;
      svgEl.setAttribute('width', CW);
      svgEl.setAttribute('height', CH);

      const scaleX = CW / oldCW;
      const scaleY = CH / oldCH;

      // Reposition nodes proportionally
      Object.keys(nodeMap).forEach(id => {
        nodeMap[id].x *= scaleX;
        nodeMap[id].y *= scaleY;
        const g = document.querySelector(`g[data-id="${id}"]`);
        if (g) g.setAttribute('transform', `translate(${nodeMap[id].x},${nodeMap[id].y})`);
      });

      // Rebuild static tree silhouette
      buildOffscreenTree();

      // Rebuild stars for new dimensions
      buildStars();

      // Update all paths
      branchPaths.forEach(bp => {
        const s = nodeMap[bp.src], t = nodeMap[bp.tgt];
        if (!s || !t) return;
        const d = curvePath(s.x, s.y, t.x, t.y);
        bp.els.forEach(e => e.setAttribute('d', d));
      });

      // Reposition sap particles
      sapParticles.forEach(p => resetSap(p));
    }

    // ===== ANIMATION LOOP =====
    let lastFrame = 0;

    function drawRoots(c) {
      const tx = CW * 0.50;
      const ty = CH * 0.60;
      const rootDefs = [
        { dx: -CW*0.26, width: 10 },
        { dx: -CW*0.18, width: 8 },
        { dx: -CW*0.09, width: 6 },
        { dx: CW*0.00,  width: 7 },
        { dx: CW*0.09,  width: 6 },
        { dx: CW*0.18,  width: 8 },
        { dx: CW*0.26,  width: 10 }
      ];
      rootDefs.forEach((rd, i) => {
        const endX = tx + rd.dx;
        const endY = CH * 0.93;
        const cp1x = tx + rd.dx * 0.3;
        const cp1y = ty + CH * 0.15;
        const cp2x = endX + (Math.random() - 0.5) * 40;
        const cp2y = endY - CH * 0.08;

        // Taper
        const steps = 20;
        for (let s = 0; s < steps; s++) {
          const t0 = s / steps;
          const t1 = (s + 1) / steps;

          function bezierPoint(t) {
            const mt = 1 - t;
            return {
              x: mt*mt*mt*tx + 3*mt*mt*t*cp1x + 3*mt*t*t*cp2x + t*t*t*endX,
              y: mt*mt*mt*ty + 3*mt*mt*t*cp1y + 3*mt*t*t*cp2y + t*t*t*endY
            };
          }

          const p0 = bezierPoint(t0);
          const p1 = bezierPoint(t1);
          const w = rd.width * (1 - t0 * 0.85);

          c.beginPath();
          c.moveTo(p0.x, p0.y);
          c.lineTo(p1.x, p1.y);
          c.lineWidth = w;
          c.strokeStyle = `rgba(16,12,8,${0.95 - t0 * 0.4})`;
          c.stroke();
        }
      });
    }

    function animate(ts) {
      requestAnimationFrame(animate);

      // Clear
      ctx.clearRect(0, 0, CW, CH);

      // Deep space background
      ctx.fillStyle = '#000005';
      ctx.fillRect(0, 0, CW, CH);

      // Nebula blobs
      const n1 = ctx.createRadialGradient(CW*0.25, CH*0.18, 0, CW*0.25, CH*0.18, CW*0.35);
      n1.addColorStop(0, 'rgba(80,20,120,0.15)');
      n1.addColorStop(1, 'rgba(80,20,120,0)');
      ctx.fillStyle = n1;
      ctx.fillRect(0, 0, CW, CH);

      const n2 = ctx.createRadialGradient(CW*0.75, CH*0.12, 0, CW*0.75, CH*0.12, CW*0.30);
      n2.addColorStop(0, 'rgba(20,80,120,0.12)');
      n2.addColorStop(1, 'rgba(20,80,120,0)');
      ctx.fillStyle = n2;
      ctx.fillRect(0, 0, CW, CH);

      const n3 = ctx.createRadialGradient(CW*0.50, CH*0.30, 0, CW*0.50, CH*0.30, CW*0.22);
      n3.addColorStop(0, 'rgba(120,80,20,0.08)');
      n3.addColorStop(1, 'rgba(120,80,20,0)');
      ctx.fillStyle = n3;
      ctx.fillRect(0, 0, CW, CH);

      // Stars with twinkling
      const t = ts * 0.001;
      stars.forEach(s => {
        s.twinkle += s.twinkleSpeed;
        const opacity = s.baseOpacity + Math.sin(s.twinkle) * 0.2;
        ctx.fillStyle = s.color.replace('#', 'rgba(').replace(/(..)(..)(..)/, (_, r, g, b) => {
          return `rgba(${parseInt(r,16)},${parseInt(g,16)},${parseInt(b,16)},${opacity.toFixed(2)})`;
        });
        // Simpler approach:
        ctx.globalAlpha = Math.max(0, Math.min(1, opacity));
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Shooting star
      const now = Date.now();
      if (!shootingStar && now > nextShoot) {
        shootingStar = {
          x: Math.random() * CW * 0.8,
          y: Math.random() * CH * 0.3,
          vx: 8 + Math.random() * 6,
          vy: 3 + Math.random() * 3,
          alpha: 1
        };
        nextShoot = now + 3000 + Math.random() * 4000;
      }
      if (shootingStar) {
        const tailX = shootingStar.x - shootingStar.vx * 6;
        const tailY = shootingStar.y - shootingStar.vy * 6;
        const sg = ctx.createLinearGradient(tailX, tailY, shootingStar.x, shootingStar.y);
        sg.addColorStop(0, `rgba(255,255,240,0)`);
        sg.addColorStop(1, `rgba(255,255,255,${shootingStar.alpha.toFixed(2)})`);
        ctx.strokeStyle = sg;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(shootingStar.x, shootingStar.y);
        ctx.stroke();
        shootingStar.x += shootingStar.vx;
        shootingStar.y += shootingStar.vy;
        shootingStar.alpha -= 0.025;
        if (shootingStar.alpha <= 0 || shootingStar.x > CW + 100 || shootingStar.y > CH * 0.5) {
          shootingStar = null;
        }
      }

      // Composite static tree silhouette
      if (offscreen) {
        ctx.globalAlpha = 0.85;
        ctx.drawImage(offscreen, 0, 0);
        ctx.globalAlpha = 1;
      }

      // Golden sap particles
      sapParticles.forEach(p => {
        p.life += p.speed;
        if (p.life > 1) resetSap(p);
        p.x += p.vx;
        p.y += p.vy;
        const opacity = (1 - p.life) * 0.8;
        // Color: gold to white
        const r = Math.round(255);
        const g2 = Math.round(208 + p.life * 47);
        const b = Math.round(96 + p.life * 159);
        ctx.globalAlpha = opacity;
        ctx.fillStyle = `rgb(${r},${g2},${b})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;

      // Roots
      drawRoots(ctx);

      // Trunk glow overlay (canvas)
      const tx = CW * 0.50;
      const ty = CH * 0.60;
      const tglow = ctx.createRadialGradient(tx, ty + CH*0.05, 0, tx, ty + CH*0.05, 60);
      tglow.addColorStop(0, 'rgba(40,28,16,0.4)');
      tglow.addColorStop(1, 'rgba(40,28,16,0)');
      ctx.fillStyle = tglow;
      ctx.beginPath();
      ctx.ellipse(tx, ty + CH*0.07, 30, 70, 0, 0, Math.PI*2);
      ctx.fill();

      lastFrame = ts;
    }

    // ===== INIT =====
    function init() {
      canvas.width = CW;
      canvas.height = CH;
      svgEl.setAttribute('width', CW);
      svgEl.setAttribute('height', CH);

      computeLayout();
      buildOffscreenTree();
      buildStars();
      buildSapParticles();
      buildSVG();

      window.addEventListener('resize', onResize, { passive: true });
      requestAnimationFrame(animate);
    }

    init();

  })();
  </script>
</body>
</html>
