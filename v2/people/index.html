<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1C3D;--navy-mid:#0D2451;--gold:#C4973A;--gold-light:#E0C06A;
  --text:#C8D8F0;--text-dim:#7090B8;--card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.08);--accent:#C4973A;
}
html,body{background:var(--navy);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;line-height:1.6}
a{text-decoration:none}

/* NAV */
nav.snav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(11,28,61,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 clamp(1.25rem,4vw,2.5rem);height:56px;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.snav-left{display:flex;align-items:center;gap:1.75rem;min-width:0;overflow:hidden}
.snav-logo{font-family:'Cormorant',serif;font-size:1.1rem;letter-spacing:0.28em;color:#fff;text-transform:uppercase;text-decoration:none;flex-shrink:0;opacity:0.85;transition:opacity .2s}
.snav-logo:hover{opacity:1}
.snav-badge{font-size:0.55rem;letter-spacing:0.18em;color:var(--gold);border:1px solid currentColor;padding:1px 6px;border-radius:2px;vertical-align:middle;margin-left:4px;opacity:0.8}
.breadcrumb{font-size:0.7rem;letter-spacing:0.06em;color:var(--text-dim);display:flex;align-items:center;gap:0.35rem;white-space:nowrap}
.breadcrumb a{color:var(--text-dim);transition:color .2s}
.breadcrumb a:hover{color:var(--text)}
.breadcrumb .sep{opacity:0.25}
.snav-right{display:flex;align-items:center;gap:1rem;flex-shrink:0}
.snav-link{font-size:0.64rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);transition:color .2s;white-space:nowrap}
.snav-link:hover{color:var(--text)}
.snav-back{font-size:0.68rem;letter-spacing:0.1em;color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);padding:5px 14px;border-radius:2px;transition:all .2s;text-decoration:none;flex-shrink:0;white-space:nowrap}
.snav-back:hover{color:var(--text);border-color:rgba(255,255,255,0.28)}

/* HERO */
.hero{margin-top:56px;padding:clamp(3rem,7vw,5rem) clamp(1.25rem,5vw,2.5rem) clamp(2rem,4vw,3.5rem);text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(196,151,58,0.12) 0%,transparent 65%);pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.6rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';display:block;width:20px;height:1px;background:currentColor;opacity:0.4}
.hero h1{font-family:'Cormorant',serif;font-size:clamp(2.4rem,6vw,4.5rem);font-weight:300;color:#fff;line-height:1.08;margin-bottom:1.2rem}
.hero-desc{max-width:560px;margin:0 auto;font-size:0.88rem;color:var(--text-dim);font-weight:300;line-height:1.75}

/* FILTER TABS */
.filter-bar{max-width:1080px;margin:0 auto;padding:0 clamp(1.25rem,5vw,2.5rem);display:flex;gap:0.4rem;flex-wrap:wrap;margin-bottom:2rem}
.ftab{font-size:0.64rem;letter-spacing:0.14em;text-transform:uppercase;padding:5px 14px;border:1px solid rgba(255,255,255,0.1);border-radius:2px;cursor:pointer;color:var(--text-dim);background:none;transition:all .2s;font-family:'Jost',sans-serif}
.ftab:hover{border-color:rgba(255,255,255,0.22);color:var(--text)}
.ftab.active{border-color:var(--gold);color:var(--gold);background:rgba(196,151,58,0.06)}

/* GRID */
main{max-width:1080px;margin:0 auto;padding:0 clamp(1.25rem,5vw,2.5rem) 7rem}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem}

/* PERSON CARD */
.pcard{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:6px;
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .25s,transform .25s,background .25s;
  text-decoration:none;color:var(--text);
}
.pcard:hover{border-color:rgba(255,255,255,0.18);transform:translateY(-3px);background:rgba(255,255,255,0.06)}

.pcard-top{
  position:relative;padding:2rem 1.6rem 0;
  display:flex;align-items:center;gap:1.2rem;
}
.pcard-avatar{
  width:72px;height:72px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant',serif;font-size:1.6rem;font-weight:400;color:#fff;
  background:linear-gradient(135deg,rgba(196,151,58,0.3),rgba(74,122,232,0.25));
  border:2px solid rgba(196,151,58,0.4);
  overflow:hidden;
}
.pcard-avatar img{width:100%;height:100%;object-fit:cover}
.pcard-identity{flex:1;min-width:0}
.pcard-name{font-family:'Cormorant',serif;font-size:1.45rem;font-weight:400;color:#fff;line-height:1.15;margin-bottom:0.25rem}
.pcard-origin{font-size:0.68rem;color:var(--text-dim);letter-spacing:0.04em}
.pcard-tags{display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.4rem}
.ptag{font-size:0.5rem;letter-spacing:0.16em;text-transform:uppercase;padding:2px 8px;border-radius:2px;border:1px solid rgba(196,151,58,0.35);color:var(--gold);background:rgba(196,151,58,0.06)}

.pcard-body{padding:1.2rem 1.6rem 1.4rem;flex:1;display:flex;flex-direction:column;gap:0.6rem}
.pcard-desc{font-size:0.8rem;color:var(--text-dim);line-height:1.65}
.pcard-known{font-size:0.72rem;color:var(--text);line-height:1.5}
.pcard-known strong{font-weight:400;color:var(--gold);font-size:0.6rem;letter-spacing:0.14em;text-transform:uppercase;display:block;margin-bottom:0.25rem}

.pcard-footer{
  margin-top:auto;padding:0.9rem 1.6rem;
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.pcard-link{font-size:0.64rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);transition:opacity .2s;white-space:nowrap}
.pcard:hover .pcard-link{opacity:0.8}
.pcard-domain-tag{font-size:0.52rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim)}
.pcard-links{display:flex;gap:0.75rem;align-items:center;flex-wrap:wrap}
.pcard-yt{font-size:0.6rem;letter-spacing:0.1em;color:#FF4040;border:1px solid rgba(255,64,64,0.3);padding:3px 10px;border-radius:2px;transition:all .2s;display:inline-flex;align-items:center;gap:4px}
.pcard-yt:hover{background:rgba(255,64,64,0.08);border-color:#FF4040;opacity:1}
.pcard-watch{font-size:0.6rem;letter-spacing:0.1em;color:var(--accent);border:1px solid rgba(196,151,58,0.3);padding:3px 10px;border-radius:2px;transition:all .2s}
.pcard-watch:hover{background:rgba(196,151,58,0.08);border-color:var(--gold);opacity:1}

/* FOOTER */
footer{border-top:1px solid rgba(255,255,255,0.05);padding:2.5rem clamp(1.25rem,5vw,2.5rem);text-align:center}
.footer-inner{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.footer-logo{font-family:'Cormorant',serif;font-size:1rem;letter-spacing:0.25em;color:rgba(255,255,255,0.3);text-transform:uppercase}
.footer-links{display:flex;gap:1.5rem}
.footer-links a{font-size:0.68rem;letter-spacing:0.1em;color:var(--text-dim);text-transform:uppercase;transition:color .2s}
.footer-links a:hover{color:var(--text)}

@media(max-width:600px){
  .people-grid{grid-template-columns:1fr}
  .pcard-top{flex-direction:column;text-align:center;padding:1.8rem 1.4rem 0}
  .pcard-tags{justify-content:center}
  .filter-bar{justify-content:center}
  .footer-inner{flex-direction:column;text-align:center}
}
</style>

<nav class="snav">

<section class="hero">
  <div class="hero-eyebrow">Directory</div>
  <h1>People</h1>
  <p class="hero-desc">The teachers, thinkers, healers, and builders shaping the frontier of consciousness. These are the voices the FRQNCY network points to.</p>
</section>

<div class="filter-bar" id="filter-bar"></div>

<main>
  <div class="people-grid" id="grid"></div>
</main>

<footer>
  <div class="footer-inner">
    <span class="footer-logo">FRQNCY</span>
    <div class="footer-links">
      <a href="../explore.html">Explore</a>
      <a href="../watch/index.html">Watch</a>
      <a href="../courses/index.html">Courses</a>
      <a href="../../index.html">Main site</a>
    </div>
  </div>
</footer>

<script>
const PEOPLE = [
  {
    name: "Osho",
    aka: "Bhagwan Shree Rajneesh",
    origin: "India · 1931–1990",
    domains: ["Spirituality", "Meditation", "Philosophy"],
    desc: "One of the most provocative and widely-read spiritual teachers of the 20th century. Osho challenged organized religion, championed individual freedom, and built a global movement around meditation, awareness, and the celebration of life.",
    known: "Dynamic Meditation, discourse series on Zen, Tao, Sufism, and Tantra, the Rajneesh movement, and over 600 published books synthesizing Eastern mysticism with Western psychology.",
    link: "https://www.osho.com",
    linkLabel: "osho.com",
    youtube: "https://www.youtube.com/@OSHO",
    watchFilter: "t-osho",
    initials: "OS",
    accent: "#E85D3A"
  },
  {
    name: "Sadhguru",
    aka: "Jaggi Vasudev",
    origin: "India · b. 1957",
    domains: ["Yoga", "Spirituality", "Ecology"],
    desc: "Mystic, yogi, and founder of the Isha Foundation. Sadhguru has brought classical yoga and inner engineering to a global audience of hundreds of millions, blending ancient wisdom with modern pragmatism and a disarming sense of humor.",
    known: "Inner Engineering program, Dhyanalinga consecration, Save Soil movement, Isha Yoga Center, bestselling books, and one of the most-watched spiritual voices on YouTube.",
    link: "https://isha.sadhguru.org",
    linkLabel: "isha.sadhguru.org",
    youtube: "https://www.youtube.com/@Sadhguru",
    watchFilter: "t-sadhguru",
    initials: "SG",
    accent: "#4A7AE8"
  },
  {
    name: "Kevin Trudeau",
    aka: "",
    origin: "United States · b. 1963",
    domains: ["Self-Mastery", "Manifestation", "Hidden Knowledge"],
    desc: "Author, speaker, and controversial figure in the world of self-development and alternative knowledge. Trudeau has dedicated decades to sharing information about manifestation, the law of attraction, and systems of knowledge he argues are deliberately kept from the public.",
    known: "\"Natural Cures They Don't Want You to Know About\", \"Your Wish Is Your Command\" audio series, teachings on the law of attraction, the Brotherhood, and secret societies' role in knowledge suppression.",
    link: "https://kevintrudeau.com",
    linkLabel: "kevintrudeau.com",
    youtube: "https://www.youtube.com/@KevinTrudeauShow",
    watchFilter: "t-trudeau",
    initials: "KT",
    accent: "#D4A843"
  },
  {
    name: "Sai Maa",
    aka: "Her Holiness Sai Maa Lakshmi Devi",
    origin: "Mauritius · France",
    domains: ["Enlightenment", "Energy Healing", "Neuroscience"],
    desc: "A spiritual master and humanitarian who bridges ancient Vedic wisdom with modern neuroscience. Sai Maa teaches practices for awakening, brain enlightenment, and the direct experience of divine consciousness.",
    known: "Awakened Life program, brain enlightenment practices, Sai Maa Foundation humanitarian work, teachings on Kundalini and Diksha, and international retreats integrating science and spirituality.",
    link: "https://www.saimaa.com",
    linkLabel: "saimaa.com",
    youtube: "https://www.youtube.com/results?search_query=Sai+Maa+Lakshmi+Devi",
    watchFilter: "t-saimaa",
    initials: "SM",
    accent: "#9B59B6"
  },
  {
    name: "Gary Spivey",
    aka: "",
    origin: "United States",
    domains: ["Psychic", "Healing", "Consciousness"],
    desc: "Psychic, healer, and spiritual teacher known for his energy readings and healing sessions. Gary Spivey has spent decades helping people through psychic guidance, energy work, and spiritual counseling, reaching millions through media appearances and live events.",
    known: "Psychic readings and energy healings, media appearances on national television, live healing events, teachings on spiritual awareness and energetic transformation.",
    link: "https://www.garyspivey.com",
    linkLabel: "garyspivey.com",
    youtube: "https://www.youtube.com/@GarySpivey",
    watchFilter: "t-garyspivey",
    initials: "GS",
    accent: "#1ABC9C"
  }
];

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Build filter tabs
const allDomains = [...new Set(PEOPLE.flatMap(p => p.domains))].sort();
const filterBar = document.getElementById('filter-bar');
const allBtn = document.createElement('button');
allBtn.className = 'ftab active';
allBtn.dataset.filter = 'all';
allBtn.textContent = 'All';
filterBar.appendChild(allBtn);
for (const d of allDomains) {
  const btn = document.createElement('button');
  btn.className = 'ftab';
  btn.dataset.filter = d;
  btn.textContent = d;
  filterBar.appendChild(btn);
}

// Filter logic
filterBar.addEventListener('click', e => {
  const btn = e.target.closest('.ftab');
  if (!btn) return;
  filterBar.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const f = btn.dataset.filter;
  document.querySelectorAll('.pcard').forEach(card => {
    const domains = card.dataset.domains.split(',');
    card.style.display = (f === 'all' || domains.includes(f)) ? '' : 'none';
  });
});

// Build cards
const grid = document.getElementById('grid');
for (const p of PEOPLE) {
  const card = document.createElement('div');
  card.className = 'pcard';
  card.dataset.domains = p.domains.join(',');

  const tagsHtml = p.domains.map(d => `<span class="ptag">${esc(d)}</span>`).join('');
  const akaLine = p.aka ? `<div class="pcard-origin">${esc(p.aka)}</div>` : '';

  card.innerHTML = `
    <div class="pcard-top">
      <div class="pcard-avatar" style="border-color:${p.accent}60;background:linear-gradient(135deg,${p.accent}30,${p.accent}15)">
        <span>${esc(p.initials)}</span>
      </div>
      <div class="pcard-identity">
        <div class="pcard-name">${esc(p.name)}</div>
        ${akaLine}
        <div class="pcard-origin">${esc(p.origin)}</div>
        <div class="pcard-tags">${tagsHtml}</div>
      </div>
    </div>
    <div class="pcard-body">
      <div class="pcard-desc">${esc(p.desc)}</div>
      <div class="pcard-known">
        <strong>Known for</strong>
        ${esc(p.known)}
      </div>
    </div>
    <div class="pcard-footer">
      <div class="pcard-links">
        <a href="${esc(p.link)}" target="_blank" rel="noopener noreferrer" class="pcard-link">${esc(p.linkLabel)} →</a>
        ${p.youtube ? `<a href="${esc(p.youtube)}" target="_blank" rel="noopener noreferrer" class="pcard-yt">▶ YouTube</a>` : ''}
        ${p.watchFilter ? `<a href="../watch/index.html#${esc(p.watchFilter)}" class="pcard-watch">Watch on FRQNCY</a>` : ''}
      </div>
    </div>
  `;
  grid.appendChild(card);
}
</script>
</body>
