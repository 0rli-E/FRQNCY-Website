    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root { --navy:#0B1C3D; --navy-mid:#0D2451; --gold:#C4973A; --gold-light:#E8C97D; --font-display:'Cormorant',Georgia,serif; --font-body:'Jost',sans-serif; }

    #ui-overlay { position:fixed; top:68px; left:50%; transform:translateX(-50%); z-index:5; text-align:center; pointer-events:none; }
    #ui-overlay h1 { font-family:var(--font-display); font-size:clamp(20px,2.5vw,30px); font-weight:300; letter-spacing:0.35em; color:var(--gold); }
    #ui-overlay p  { font-size:10px; letter-spacing:0.2em; color:rgba(255,255,255,0.3); margin-top:5px; }
    #back-btn {

    #node-count { position:fixed; bottom:28px; right:28px; z-index:5; font-size:10px; letter-spacing:0.12em; color:rgba(255,255,255,0.18); }

    /* =====================

    @media (max-width: 640px) {

      .leg-dot {
        flex-shrink: 0;

      /* Back button: More accessible on mobile */
      #back-btn {
        top: 16px;
        left: 16px;
        font-size: 9px;
        letter-spacing: 0.2em;
        padding: 8px 16px;

      /* Node count: Hide on very small screens */
      #node-count {
        display: none;
      }

      /* Tooltip: Reposition to avoid cutoff on mobile */
      #tooltip {
        position: fixed;
        max-width: 160px;
        bottom: auto;
        top: auto;
        padding: 8px 12px;
        font-size: 11px;
      }
      #tooltip .tip-title {
        font-size: 14px;
        margin-bottom: 2px;
      }
      #tooltip .tip-type {
        font-size: 8px;

      }

      /* Map: Ensure it fills the screen properly */
      #fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #map-svg {
        position: fixed;

      }

      /* Reduce node sizes on mobile for clarity */
      #map-svg circle {
        /* Will be overridden by JavaScript but CSS fallback */
        opacity: 0.8;
      }
      #map-svg circle.clickable {
        cursor: pointer;
      }

        font-size: 10px;

    }

    @media (max-width: 480px) {
      /* Extra small screens: Further adjustments */

      }

<script>
/* ──────────── NETWORK DATA — loaded from explore-data.json ──────────── */
let NODES = [];
let LINKS = [];
let NODE_URL = {};

fetch('./explore-data.json', {cache: 'no-cache'})
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    NODES = data.nodes;
    LINKS = data.links.map(([s, t]) => ({source: s, target: t}));
    NODE_URL = data.node_urls;
    initMap();
  })
  .catch(err => {
    console.error('Could not load explore-data.json — the map cannot render without it.', err);
    const msg = document.createElement('div');
    msg.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-family:Jost,sans-serif;text-align:center;z-index:9999;';
    msg.innerHTML = '<p>Could not load the map data.</p><p style="opacity:.6;font-size:0.8rem;">Check console for details.</p>';
    document.body.appendChild(msg);
  });

function initMap() {
/* ── Embedded mode: hide standalone UI chrome when inside an iframe ── */
const isEmbedded = (()=>{ try{ return window.self !== window.top; }catch(e){ return true; } })();
if(isEmbedded){
  ['back-btn','legend','ui-overlay','node-count'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.style.display='none';
  });
  var enav=document.querySelector('.explore-nav'); if(enav) enav.style.display='none';
}

/* ──────────── CANVAS ──────────── */
const canvas=document.getElementById('fx');
const ctx=canvas.getContext('2d');
function resizeCanvas(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

/* Background stars */
const STARS=[];
for(let i=0;i<120;i++) STARS.push({
  x:Math.random()*innerWidth, y:Math.random()*innerHeight,
  r:Math.random()*1.3+0.2, base:Math.random()*0.45+0.08, phase:Math.random()*Math.PI*2
});

/* ──────────── SVG / D3 ──────────── */
const W=innerWidth, H=innerHeight;
const svg=d3.select('#map-svg');
const defs=d3.select('#svg-defs');

[
  {id:'g-core',    c1:'#F4DC88',c2:'#A06818'},
  {id:'g-main',    c1:'#5A8AFF',c2:'#122878'},
  {id:'g-cluster', c1:'#3062C8',c2:'#081640'},
  {id:'g-topic',   c1:'#213E88',c2:'#060E24'},
].forEach(g=>{
  const gr=defs.append('radialGradient').attr('id',g.id).attr('cx','38%').attr('cy','30%');
  gr.append('stop').attr('offset','0%').attr('stop-color',g.c1);
  gr.append('stop').attr('offset','100%').attr('stop-color',g.c2);
});

let zoomState={x:0,y:0,k:1};
const zoomG=svg.append('g');
svg.call(d3.zoom()
  .scaleExtent([0.1,4])
  /* Don't pan when the event starts on a node — that's a drag */
  .filter(event=>event.type==='wheel'||!event.target.closest('.node'))
  .on('zoom',e=>{
    zoomG.attr('transform',e.transform);
    zoomState=e.transform;
  }));

const sim=d3.forceSimulation(NODES)
  .force('link',d3.forceLink(LINKS).id(d=>d.id)
    .distance(d=>{
      const s=d.source.type||'topic',t=d.target.type||'topic';
      if(s==='core'||t==='core') return (t==='main'||s==='main')?210:258;
      if(s==='main'||t==='main') return 178;
      if(s==='cluster'||t==='cluster') return (t==='topic'||s==='topic')?112:148;
      return 84;
    })
    .strength(d=>{
      const s=d.source.type||'topic',t=d.target.type||'topic';
      if(s==='core'||t==='core') return 0.55;
      return 0.38;
    })
  )
  .force('charge',d3.forceManyBody().strength(d=>{
    switch(d.type){
      case 'core': return -1600; case 'main': return -750;
      case 'cluster': return -400; default: return -130;
    }
  }).theta(0.9))
  .force('center',d3.forceCenter(W/2,H/2).strength(0.04))
  .force('collide',d3.forceCollide(d=>d.r+8).strength(0.6).iterations(1))
  .alphaDecay(0.03).velocityDecay(0.45);

/* Node map for fast canvas lookup */
const nodeById={};
NODES.forEach(n=>{ nodeById[n.id]=n; });

/* ──────────── 1000 HUMAN STARS (canvas-only, no simulation) ──────────── */
// Anchor each star to a topic or cluster node with a random offset.
// Position = anchor.x + offsetX, anchor.y + offsetY each frame — zero cost.
const topicPool=NODES.filter(n=>n.type==='topic'||n.type==='cluster');

function srand(seed){ let x=seed; return ()=>{ x=((x^(x<<13))^(x>>7)^(x<<17))>>>0; return (x%100000)/100000; }; }

const HUMANS=[];
for(let i=0;i<1000;i++){
  const rnd=srand(i*31337+i*i+1);
  // Bias toward topics (more spread across leaves)
  const anchor=topicPool[Math.floor(rnd()*topicPool.length)];
  const dist=anchor.r + 8 + rnd()*55;   // cluster near but not inside node
  const angle=rnd()*Math.PI*2;
  HUMANS.push({
    anchorId: anchor.id,
    ox: Math.cos(angle)*dist,
    oy: Math.sin(angle)*dist,
    r: 0.7 + rnd()*0.8,           // 0.7–1.5px — tiny but visible
    baseAlpha: 0.55 + rnd()*0.40, // 0.55–0.95 — bright enough to be distinct from bg stars
    phase: rnd()*Math.PI*2,
    speed: 1.4 + rnd()*1.2,      // twinkle speed
    // store a second anchor for the faint connection line (same as anchor for simplicity)
    lineAlpha: 0.04 + rnd()*0.06,
    showLine: rnd()<0.45,         // only ~45% have visible lines (reduces clutter)
  });
}

/* ── SVG nodes (no dot nodes here) ── */
const nodeG=zoomG.append('g');
const nodeSel=nodeG.selectAll('g.node').data(NODES).join('g').attr('class','node').style('cursor','pointer');

nodeSel.append('circle')
  .attr('r',d=>d.r)
  .attr('fill',d=>d.type==='cluster'?'url(#g-cluster)':d.type==='topic'?'url(#g-topic)':`url(#g-${d.type})`)
  .attr('stroke',d=>d.type==='core'?'#E0C06A':d.type==='main'?'#4A7AE8':d.type==='cluster'?'#2952B3':'#1A3A8F')
  .attr('stroke-width',d=>d.type==='core'?2.5:1);

nodeSel.filter(d=>d.type!=='dot').append('text')
  .attr('text-anchor','middle').attr('dominant-baseline','central')
  .attr('fill',d=>d.type==='core'?'#0A1220':d.type==='main'?'#FFFFFF':d.type==='cluster'?'#E8C97D':'rgba(172,202,255,0.88)')
  .attr('font-family',d=>(d.type==='core'||d.type==='main')?'Cormorant,Georgia,serif':"'Jost',sans-serif")
  .attr('font-size',d=>d.type==='core'?'15px':d.type==='main'?'10.5px':d.type==='cluster'?'9.5px':'8px')
  .attr('font-weight',d=>d.type==='core'?'500':'300')
  .attr('letter-spacing',d=>d.type==='core'?'0.18em':'0.04em')
  .attr('pointer-events','none')
  .each(function(d){
    const el=d3.select(this);
    if(d.type==='topic'&&d.label.length>14){
      const w=d.label.split(' '),m=Math.ceil(w.length/2);
      el.append('tspan').attr('x',0).attr('dy','-0.5em').text(w.slice(0,m).join(' '));
      el.append('tspan').attr('x',0).attr('dy','1em').text(w.slice(m).join(' '));
    } else { el.text(d.label); }
  });

let wasDragged=false;
nodeSel.call(d3.drag()
  /* subject: map node position into screen space so drag tracks correctly under any zoom */
  .subject((event,d)=>{
    const t=d3.zoomTransform(svg.node());
    return {x:d.x*t.k+t.x, y:d.y*t.k+t.y};
  })
  .on('start',(e,d)=>{ wasDragged=false; if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
  .on('drag', (e,d)=>{
    wasDragged=true;
    const t=d3.zoomTransform(svg.node());
    d.fx=(e.x-t.x)/t.k;
    d.fy=(e.y-t.y)/t.k;
  })
  .on('end',  (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
);

sim.on('tick',()=>{ nodeSel.attr('transform',d=>`translate(${d.x},${d.y})`); });

/* ── Hover ── */
const tip=document.getElementById('tooltip');
let hoveredNodeIds=null;
let searchMatches=new Set();

nodeSel
  .on('mouseover',(e,d)=>{
    const conn=new Set([d.id]);
    LINKS.forEach(l=>{
      const s=typeof l.source==='object'?l.source.id:l.source;
      const t=typeof l.target==='object'?l.target.id:l.target;
      if(s===d.id) conn.add(t); if(t===d.id) conn.add(s);
    });
    hoveredNodeIds=conn;
    nodeSel.style('opacity',n=>conn.has(n.id)?1:0.05);
    tip.querySelector('.tip-title').textContent=d.label;
    const typeLabel={core:'FRQNCY CORE',main:'PILLAR',cluster:'DOMAIN',topic:'TOPIC'}[d.type]||'';
    const clickHint=NODE_URL[d.id]?' · click to explore':'';
    tip.querySelector('.tip-type').textContent=(d.desc||'')+' · '+typeLabel+clickHint;
    tip.style.opacity=1;
  })
  .on('mousemove',e=>{ tip.style.left=(e.clientX+18)+'px'; tip.style.top=(e.clientY-14)+'px'; })
  .on('mouseout',()=>{
    tip.style.opacity=0;
    hoveredNodeIds=null;
    // Restore search filter state or full opacity if no search active
    if(searchMatches.size>0){
      nodeSel.style('opacity',n=>searchMatches.has(n.id)?1:0.05);
    } else {
      nodeSel.style('opacity',1);
    }
  })
  .style('cursor',d=>NODE_URL[d.id]?'pointer':'default');

/* ── Search functionality ── */
const searchBar=document.getElementById('search-bar');
const searchCount=document.getElementById('search-count');
const searchResults=document.getElementById('search-results');

// Load rich search indexes (topics + resources)
let SEARCH_INDEX=[];
let RESOURCE_INDEX=[];
fetch('../search.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(data=>{ SEARCH_INDEX=data; }).catch(()=>{ /* search will use graph-only fallback */ });
fetch('../resources.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); }).then(data=>{ RESOURCE_INDEX=data; }).catch(()=>{});

function scoreMatch(item, q){
  let score=0;
  const label=item.label.toLowerCase();
  const desc=(item.desc||'').toLowerCase();
  const picks=item.picks.join(' ').toLowerCase();
  const domain=item.domain.toLowerCase();
  if(label===q) score+=100;
  else if(label.startsWith(q)) score+=60;
  else if(label.includes(q)) score+=40;
  if(desc.includes(q)) score+=20;
  if(picks.includes(q)) score+=15;
  if(domain.includes(q)) score+=10;
  return score;
}

function scoreResource(r, q){
  let score=0;
  const name=(r.name||'').toLowerCase();
  const desc=(r.desc||'').toLowerCase();
  const topic=(r.topicLabel||'').toLowerCase();
  const type=(r.type||'').toLowerCase();
  // Weight resources slightly below topics so topic matches surface on top.
  if(name===q) score+=90;
  else if(name.startsWith(q)) score+=55;
  else if(name.includes(q)) score+=35;
  if(desc.includes(q)) score+=15;
  if(topic.includes(q)) score+=8;
  if(type===q) score+=8;
  return score;
}

function renderResultsPanel(topicMatches, resourceMatches){
  if(!topicMatches.length && !resourceMatches.length){
    searchResults.innerHTML='<div class="sr-empty">NO MATCHES FOUND</div>';
    searchResults.classList.add('visible');
    return;
  }
  const topicHtml=topicMatches.map(item=>`
    <a class="sr-item" href="${item.url}">
      <div class="sr-dot" style="background:${item.accent}"></div>
      <div class="sr-body">
        <div class="sr-label">${item.label}</div>
        <div class="sr-meta">${item.pillar} &nbsp;·&nbsp; ${item.domain}</div>
        ${item.desc?`<div class="sr-desc">${item.desc}</div>`:''}
        ${item.picks.length?`<div class="sr-picks">✦ ${item.picks.slice(0,3).join('  ·  ')}</div>`:''}
      </div>
    </a>`).join('');
  const resHtml=resourceMatches.map(r=>`
    <a class="sr-item" href="${r.url}" target="_blank" rel="noopener noreferrer">
      <div class="sr-dot" style="background:#888"></div>
      <div class="sr-body">
        <div class="sr-label">${r.name}</div>
        <div class="sr-meta">${(r.type||'resource')} &nbsp;·&nbsp; ${r.topicLabel||''}</div>
        ${r.desc?`<div class="sr-desc">${r.desc}</div>`:''}
      </div>
    </a>`).join('');
  const sep=(topicMatches.length && resourceMatches.length)
    ? '<div class="sr-empty" style="opacity:0.5;font-size:0.6rem;padding:0.5rem 1rem">RESOURCES</div>'
    : '';
  searchResults.innerHTML=topicHtml + sep + resHtml;
  searchResults.classList.add('visible');
}

function updateSearchFilter(){
  const query=searchBar.value.toLowerCase().trim();

  if(!query){
    searchMatches.clear();
    nodeSel.style('opacity',1);
    nodeSel.style('filter','none');
    searchCount.textContent='';
    searchCount.classList.remove('active');
    searchResults.classList.remove('visible');
    return;
  }

  // Rich search over search.json index
  const richMatches=SEARCH_INDEX
    .map(item=>({ item, score:scoreMatch(item,query) }))
    .filter(({score})=>score>0)
    .sort((a,b)=>b.score-a.score)
    .map(({item})=>item);

  // Resource search over resources.json
  const resourceMatches=RESOURCE_INDEX
    .map(r=>({ r, score:scoreResource(r,query) }))
    .filter(({score})=>score>0)
    .sort((a,b)=>b.score-a.score)
    .map(({r})=>r);

  // Sync graph node highlighting (by label only for graph nodes)
  searchMatches.clear();
  NODES.forEach(n=>{
    if(n.label.toLowerCase().includes(query)) searchMatches.add(n.id);
  });
  // Also highlight graph nodes that match rich search slugs
  richMatches.forEach(item=>{
    NODES.forEach(n=>{ if(n.id===item.id||n.id===item.slug) searchMatches.add(n.id); });
  });
  // And graph nodes corresponding to topics of matched resources
  const topicSlugsHit=new Set(resourceMatches.map(r=>r.topicSlug).filter(Boolean));
  if(topicSlugsHit.size){
    SEARCH_INDEX.forEach(item=>{
      if(topicSlugsHit.has(item.slug)){
        NODES.forEach(n=>{ if(n.id===item.id) searchMatches.add(n.id); });
      }
    });
  }

  nodeSel.style('opacity',n=>searchMatches.has(n.id)?1:0.05);
  nodeSel.style('filter',n=>searchMatches.has(n.id)?'drop-shadow(0 0 8px rgba(196,151,58,0.4))':'none');

  const tCount=richMatches.length;
  const rCount=resourceMatches.length;
  const parts=[];
  if(tCount) parts.push(`${tCount} topic${tCount!==1?'s':''}`);
  if(rCount) parts.push(`${rCount} resource${rCount!==1?'s':''}`);
  searchCount.textContent=parts.join(' · ') || 'no matches';
  searchCount.classList.add('active');

  // Show results panel — top 8 of each
  renderResultsPanel(richMatches.slice(0,8), resourceMatches.slice(0,8));
}

searchBar.addEventListener('input',updateSearchFilter);

// Close results panel when clicking outside
document.addEventListener('click',e=>{
  if(!searchBar.contains(e.target)&&!searchResults.contains(e.target)){
    if(searchBar.value.trim()) return; // keep open if query active
    searchResults.classList.remove('visible');
  }
});

// Close on Escape
searchBar.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    searchBar.value='';
    updateSearchFilter();
    searchBar.blur();
  }
});

// Add click handler that respects search filter
nodeSel.on('click',(event,d)=>{
  if(wasDragged){ wasDragged=false; return; }
  if(event.defaultPrevented) return;
  if(searchMatches.size>0 && !searchMatches.has(d.id)) return;
  event.stopPropagation();
  const url=NODE_URL[d.id];
  if(url) window.location.assign(url);
});

/* ──────────── RENDER LOOP (canvas) ──────────── */
const particles=[];
let dashOff=0, lastMajor=0, lastDotPulse=0;

const regLinks=LINKS;
/* majorLinks filter runs lazily at render time: d3.forceLink resolves l.source/target
   from string IDs into node objects on first tick — if we filter now, source is still a string. */
function getMajorLinks(){
  return LINKS.filter(l=>{
    const s=typeof l.source==='object'?l.source.type:null;
    const t=typeof l.target==='object'?l.target.type:null;
    return s==='core'||s==='main'||t==='core'||t==='main';
  });
}

function spawnParticle(fromDot){
  if(fromDot){
    // Pick a random human and send pulse toward its anchor
    const h=HUMANS[Math.floor(Math.random()*HUMANS.length)];
    const a=nodeById[h.anchorId];
    if(!a||a.x===undefined) return;
    const hx=a.x+h.ox, hy=a.y+h.oy;
    const fwd=Math.random()>0.4;
    particles.push({x1:fwd?hx:a.x, y1:fwd?hy:a.y, x2:fwd?a.x:hx, y2:fwd?a.y:hy,
      prog:0, speed:0.013+Math.random()*0.01, isDot:true});
  } else {
    const ml=getMajorLinks();
    if(!ml.length) return;
    const l=ml[Math.floor(Math.random()*ml.length)];
    const s=l.source,t=l.target;
    if(!s||!t||typeof s!=='object'||s.x===undefined) return;
    particles.push({x1:s.x,y1:s.y,x2:t.x,y2:t.y,
      prog:0, speed:0.009+Math.random()*0.006, isDot:false});
  }
}

function render(ts){
  requestAnimationFrame(render);
  const CW=canvas.width, CH=canvas.height;
  ctx.clearRect(0,0,CW,CH);

  /* Background stars */
  const t=ts*0.0007;
  for(let i=0;i<STARS.length;i++){
    const s=STARS[i];
    const a=s.base*(0.65+0.35*Math.sin(t+s.phase));
    ctx.fillStyle=`rgba(255,255,255,${a.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }

  /* Spawn particles */
  if(ts-lastMajor>320){ spawnParticle(false); lastMajor=ts; }
  if(ts-lastDotPulse>90){ spawnParticle(true); lastDotPulse=ts; }  // frequent for humans

  /* Apply zoom transform */
  const {x:zx,y:zy,k:zk}=zoomState;
  ctx.save();
  ctx.translate(zx,zy); ctx.scale(zk,zk);

  /* ── Network links (batched by tier) ── */
  ctx.setLineDash([]);

  ctx.strokeStyle='rgba(196,151,58,0.42)'; ctx.lineWidth=1.8;
  ctx.beginPath();
  regLinks.forEach(l=>{
    const s=l.source,t_=l.target;
    if(!s||!t_||s.x===undefined) return;
    if(s.type!=='core'&&t_.type!=='core') return;
    if(hoveredNodeIds&&!hoveredNodeIds.has(s.id)&&!hoveredNodeIds.has(t_.id)) return;
    ctx.moveTo(s.x,s.y); ctx.lineTo(t_.x,t_.y);
  });
  ctx.stroke();

  ctx.strokeStyle='rgba(74,122,232,0.25)'; ctx.lineWidth=1.1;
  ctx.beginPath();
  regLinks.forEach(l=>{
    const s=l.source,t_=l.target;
    if(!s||!t_||s.x===undefined) return;
    if((s.type!=='main'&&t_.type!=='main')||(s.type==='core'||t_.type==='core')) return;
    if(hoveredNodeIds&&!hoveredNodeIds.has(s.id)&&!hoveredNodeIds.has(t_.id)) return;
    ctx.moveTo(s.x,s.y); ctx.lineTo(t_.x,t_.y);
  });
  ctx.stroke();

  ctx.strokeStyle='rgba(41,82,179,0.13)'; ctx.lineWidth=0.55;
  ctx.beginPath();
  regLinks.forEach(l=>{
    const s=l.source,t_=l.target;
    if(!s||!t_||s.x===undefined) return;
    if(s.type==='core'||t_.type==='core'||s.type==='main'||t_.type==='main') return;
    if(hoveredNodeIds&&!hoveredNodeIds.has(s.id)&&!hoveredNodeIds.has(t_.id)) return;
    ctx.moveTo(s.x,s.y); ctx.lineTo(t_.x,t_.y);
  });
  ctx.stroke();

  /* ── Node glows (canvas radial, no SVG filter) ── */
  NODES.forEach(n=>{
    if(!n.x) return;
    if(n.type==='core'){
      const g=ctx.createRadialGradient(n.x,n.y,n.r*0.6,n.x,n.y,n.r*2.4);
      g.addColorStop(0,'rgba(196,151,58,0.2)'); g.addColorStop(1,'rgba(196,151,58,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*2.4,0,Math.PI*2); ctx.fill();
    } else if(n.type==='main'){
      const g=ctx.createRadialGradient(n.x,n.y,n.r*0.5,n.x,n.y,n.r*1.9);
      g.addColorStop(0,'rgba(74,122,232,0.16)'); g.addColorStop(1,'rgba(74,122,232,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(n.x,n.y,n.r*1.9,0,Math.PI*2); ctx.fill();
    }
  });

  /* ── 1000 human stars ── */
  // Connection threads — batch into one path per opacity band to avoid per-line strokeStyle calls
  const lineGroups = [{a:0.10,lines:[]},{a:0.07,lines:[]},{a:0.04,lines:[]}];
  for(let i=0;i<HUMANS.length;i++){
    const h=HUMANS[i];
    if(!h.showLine) continue;
    const a=nodeById[h.anchorId];
    if(!a||a.x===undefined) continue;
    if(hoveredNodeIds&&!hoveredNodeIds.has(h.anchorId)) continue;
    const hx=a.x+h.ox, hy=a.y+h.oy;
    const g = h.lineAlpha > 0.08 ? lineGroups[0] : h.lineAlpha > 0.055 ? lineGroups[1] : lineGroups[2];
    g.lines.push(hx,hy,a.x,a.y);
  }
  ctx.lineWidth=0.4;
  lineGroups.forEach(g=>{
    if(!g.lines.length) return;
    ctx.strokeStyle=`rgba(190,215,255,${g.a})`;
    ctx.beginPath();
    for(let j=0;j<g.lines.length;j+=4){ ctx.moveTo(g.lines[j],g.lines[j+1]); ctx.lineTo(g.lines[j+2],g.lines[j+3]); }
    ctx.stroke();
  });

  // Star bodies — two-pass: soft outer glow then bright core
  // Pass 1: glow halos (larger radius, low alpha) — drawn first so cores sit on top
  for(let i=0;i<HUMANS.length;i++){
    const h=HUMANS[i];
    const a=nodeById[h.anchorId];
    if(!a||a.x===undefined) continue;
    const hx=a.x+h.ox, hy=a.y+h.oy;
    const twinkle=0.55+0.45*Math.sin(ts*0.001*h.speed+h.phase);
    const dimmed=hoveredNodeIds&&!hoveredNodeIds.has(h.anchorId);
    const alpha=dimmed?0.02:h.baseAlpha*twinkle;
    // Soft halo
    ctx.fillStyle=`rgba(220,235,255,${(alpha*0.25).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(hx,hy,h.r*3.5,0,Math.PI*2); ctx.fill();
  }
  // Pass 2: bright core dots
  for(let i=0;i<HUMANS.length;i++){
    const h=HUMANS[i];
    const a=nodeById[h.anchorId];
    if(!a||a.x===undefined) continue;
    const hx=a.x+h.ox, hy=a.y+h.oy;
    const twinkle=0.55+0.45*Math.sin(ts*0.001*h.speed+h.phase);
    const dimmed=hoveredNodeIds&&!hoveredNodeIds.has(h.anchorId);
    const alpha=dimmed?0.04:h.baseAlpha*twinkle;
    ctx.fillStyle=`rgba(255,255,255,${alpha.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(hx,hy,h.r,0,Math.PI*2); ctx.fill();
  }

  /* ── Particles ── */
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.prog+=p.speed;
    if(p.prog>=1){ particles.splice(i,1); continue; }
    const px=p.x1+(p.x2-p.x1)*p.prog;
    const py=p.y1+(p.y2-p.y1)*p.prog;
    const fade=Math.min(p.prog*5,1)*Math.min((1-p.prog)*5,1);
    ctx.fillStyle=p.isDot
      ?`rgba(210,230,255,${(0.75*fade).toFixed(2)})`
      :`rgba(240,210,95,${(0.9*fade).toFixed(2)})`;
    ctx.beginPath(); ctx.arc(px,py,p.isDot?1.0:2.0,0,Math.PI*2); ctx.fill();
  }

  ctx.restore();
}

requestAnimationFrame(render);
} // end initMap
</script>
</body>
</html>
