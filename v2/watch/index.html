<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1C3D;--navy-mid:#0D2451;--gold:#C4973A;--gold-light:#E0C06A;
  --text:#C8D8F0;--text-dim:#7090B8;--card-bg:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.08);--accent:#4A7AE8;--accent-glow:rgba(74,122,232,0.12);
}
html,body{background:var(--navy);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{opacity:0.8}

/* ── NAV ─────────────────────────────────────────────────────────── */
nav.snav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:rgba(11,28,61,0.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,0.06);
  padding:0 clamp(1.25rem,4vw,2.5rem);height:56px;
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
}
.snav-left{display:flex;align-items:center;gap:1.75rem;min-width:0;overflow:hidden}
.snav-logo{font-family:'Cormorant',serif;font-size:1.1rem;letter-spacing:0.28em;color:#fff;text-transform:uppercase;text-decoration:none;flex-shrink:0;opacity:0.85;transition:opacity .2s}
.snav-logo:hover{opacity:1}
.breadcrumb{font-size:0.7rem;letter-spacing:0.06em;color:var(--text-dim);display:flex;align-items:center;gap:0.35rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.breadcrumb a{color:var(--text-dim);transition:color .2s}
.breadcrumb a:hover{color:var(--text)}
.breadcrumb .sep{opacity:0.25}
.snav-right{display:flex;align-items:center;gap:1rem;flex-shrink:0}
.snav-link{font-size:0.64rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-dim);transition:color .2s;white-space:nowrap}
.snav-link:hover{color:var(--text);opacity:1}
.snav-back{font-size:0.68rem;letter-spacing:0.1em;color:var(--text-dim);border:1px solid rgba(255,255,255,0.1);padding:5px 14px;border-radius:2px;transition:all .2s;text-decoration:none;flex-shrink:0;white-space:nowrap}
.snav-back:hover{color:var(--text);border-color:rgba(255,255,255,0.28);opacity:1}

/* ── HERO ─────────────────────────────────────────────────────────── */
.hero{margin-top:56px;padding:clamp(2.5rem,6vw,4.5rem) clamp(1.25rem,5vw,2.5rem) clamp(1.5rem,3vw,2.5rem);text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% -10%,var(--accent-glow) 0%,transparent 65%);pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:0.5rem;font-size:0.6rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--accent);margin-bottom:1rem}
.hero-eyebrow::before,.hero-eyebrow::after{content:'';display:block;width:20px;height:1px;background:currentColor;opacity:0.4}
.hero h1{font-family:'Cormorant',serif;font-size:clamp(2.2rem,5vw,4rem);font-weight:300;color:#fff;line-height:1.08;margin-bottom:0.9rem}
.hero-desc{max-width:480px;margin:0 auto;font-size:0.86rem;color:var(--text-dim);font-weight:300;line-height:1.7}

/* ── CONTROLS ─────────────────────────────────────────────────────── */
.controls{max-width:1080px;margin:0 auto;padding:0 clamp(1.25rem,5vw,2.5rem) 1.5rem;display:flex;flex-direction:column;gap:0.9rem}
.search-row{display:flex;gap:0.75rem;align-items:center}
.search-wrap{flex:1;position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:0.3;pointer-events:none;flex-shrink:0}
#search{
  width:100%;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:2px;
  padding:10px 16px 10px 38px;
  color:#fff;font-family:'Jost',sans-serif;font-size:0.82rem;font-weight:300;letter-spacing:0.05em;
  outline:none;transition:border-color .2s;
}
#search::placeholder{color:rgba(255,255,255,0.25)}
#search:focus{border-color:rgba(255,255,255,0.22)}
.result-count{font-size:0.7rem;letter-spacing:0.06em;color:var(--text-dim);white-space:nowrap;min-width:72px;text-align:right}

.filter-row{display:flex;gap:0.4rem;flex-wrap:wrap;align-items:center}
.filter-label{font-size:0.56rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--text-dim);margin-right:0.25rem;flex-shrink:0}
.ftab{
  font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;
  padding:4px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:2px;
  cursor:pointer;color:var(--text-dim);background:none;transition:all .2s;font-family:'Jost',sans-serif;
  white-space:nowrap;
}
.ftab:hover{border-color:rgba(255,255,255,0.22);color:var(--text)}
.ftab.active{border-color:var(--accent);color:var(--accent);background:rgba(74,122,232,0.07)}
.ftab.picks-tab.active{border-color:var(--gold);color:var(--gold);background:rgba(196,151,58,0.07)}
.ftab.picks-tab{color:var(--gold);border-color:rgba(196,151,58,0.35)}
.ftab.picks-tab:hover{border-color:var(--gold);background:rgba(196,151,58,0.05)}

/* ── GRID ─────────────────────────────────────────────────────────── */
main{max-width:1080px;margin:0 auto;padding:0 clamp(1.25rem,5vw,2.5rem) 7rem}
.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1.25rem}

/* ── SKELETON ─────────────────────────────────────────────────────── */
.skeleton{background:var(--card-bg);border:1px solid var(--card-border);border-radius:4px;overflow:hidden;animation:shimmer 1.4s ease infinite}
.skeleton-thumb{width:100%;aspect-ratio:16/9;background:rgba(255,255,255,0.06)}
.skeleton-body{padding:0.9rem 1rem}
.skeleton-line{height:10px;border-radius:4px;background:rgba(255,255,255,0.06);margin-bottom:8px}
.skeleton-line.short{width:55%}
.skeleton-line.xshort{width:35%}
@keyframes shimmer{0%{opacity:1}50%{opacity:0.5}100%{opacity:1}}

/* ── VIDEO CARD ───────────────────────────────────────────────────── */
.vcard{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:4px;
  overflow:hidden;cursor:pointer;
  transition:border-color .22s,transform .22s,background .22s;
  display:flex;flex-direction:column;
}
.vcard:hover{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.06);transform:translateY(-2px)}
.vcard:active{transform:translateY(0);transition-duration:.1s}
.vthumb{position:relative;width:100%;aspect-ratio:16/9;background:#0a1428;overflow:hidden;flex-shrink:0}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.vcard:hover .vthumb img{transform:scale(1.04)}

/* Play overlay — always dim, button visible; brightens on hover */
.vplay{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.22);transition:background .2s;
}
.vcard:hover .vplay{background:rgba(0,0,0,0.38)}
.vplay-btn{
  width:48px;height:48px;border-radius:50%;
  background:rgba(255,255,255,0.18);backdrop-filter:blur(4px);
  border:1.5px solid rgba(255,255,255,0.35);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .2s;
}
.vcard:hover .vplay-btn{background:rgba(255,255,255,0.28);transform:scale(1.08)}
.vplay-btn svg{width:18px;height:18px;fill:#fff;margin-left:3px}

.vdur{
  position:absolute;bottom:8px;right:8px;
  background:rgba(0,0,0,0.78);color:#fff;
  font-family:'Jost',sans-serif;font-size:0.6rem;letter-spacing:0.04em;
  padding:2px 7px;border-radius:2px;
}
.vpick{
  position:absolute;top:8px;left:8px;
  background:rgba(196,151,58,0.92);color:#0B1C3D;
  font-family:'Jost',sans-serif;font-size:0.46rem;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;
  padding:2px 7px;border-radius:2px;
}
.vinfo{padding:0.9rem 1rem 1rem;flex:1;display:flex;flex-direction:column;gap:0.25rem}
.vtopic{font-size:0.52rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--accent)}
.vtitle{font-family:'Cormorant',serif;font-size:1.08rem;font-weight:400;color:#fff;line-height:1.25}
.vchannel{font-size:0.68rem;color:var(--text-dim)}
.vdesc-card{font-size:0.72rem;color:var(--text-dim);line-height:1.5;margin-top:0.2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vprov{position:absolute;bottom:6px;left:6px;font-family:'Jost',sans-serif;font-size:0.46rem;letter-spacing:0.12em;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.vthumb-fallback{width:100%;height:100%}
.vplay-ext{opacity:0.92}
.vplay-btn-ext{border-style:dashed}

/* ── EMPTY ─────────────────────────────────────────────────────────── */
.empty{text-align:center;padding:5rem 2rem;grid-column:1/-1}
.empty-icon{font-size:2rem;margin-bottom:1rem;opacity:0.3}
.empty p{color:var(--text-dim);font-size:0.86rem;line-height:1.75}

/* ── MODAL ─────────────────────────────────────────────────────────── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,12,28,0.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .25s;padding:1.25rem;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{
  width:100%;max-width:880px;
  background:#0c1e42;border:1px solid rgba(255,255,255,0.1);border-radius:6px;
  overflow:hidden;transform:translateY(12px) scale(0.98);transition:transform .25s;
  display:flex;flex-direction:column;max-height:92vh;
}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1)}
.modal-player{width:100%;aspect-ratio:16/9;background:#000;flex-shrink:0}
.modal-player iframe{width:100%;height:100%;border:none;display:block}
.modal-footer{padding:1.1rem 1.4rem;display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;border-top:1px solid rgba(255,255,255,0.07)}
.modal-meta{flex:1;min-width:0}
.modal-topic{font-size:0.53rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);margin-bottom:0.3rem}
.modal-title{font-family:'Cormorant',serif;font-size:1.3rem;font-weight:400;color:#fff;line-height:1.2;margin-bottom:0.2rem}
.modal-channel{font-size:0.7rem;color:var(--text-dim);margin-bottom:0.5rem}
.modal-desc{font-size:0.78rem;color:var(--text-dim);line-height:1.6}
.modal-close{
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  cursor:pointer;width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:1rem;line-height:1;transition:all .2s;
}
.modal-close:hover{color:#fff;background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.22)}
/* Embed error fallback (Error 153 / embedding disabled / file://) */
.modal-embed-error{
  display:none;width:100%;aspect-ratio:16/9;background:#080f20;
  flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;
  text-align:center;padding:2rem;
}
.modal-embed-error.visible{display:flex}
.modal-embed-error svg{opacity:0.3}
.modal-embed-error p{font-size:0.82rem;color:var(--text-dim);line-height:1.6;max-width:340px}
.modal-embed-error a{
  display:inline-flex;align-items:center;gap:0.5rem;
  font-size:0.72rem;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--accent);border:1px solid rgba(74,122,232,0.35);
  padding:9px 20px;border-radius:2px;transition:all .2s;text-decoration:none;
}
.modal-embed-error a:hover{background:rgba(74,122,232,0.12);border-color:var(--accent);opacity:1}

/* ── RESPONSIVE ─────────────────────────────────────────────────────── */
@media(max-width:640px){
  .video-grid{grid-template-columns:1fr 1fr;gap:0.75rem}
  .snav-right .snav-link{display:none}
  .result-count{display:none}
  .modal-overlay{padding:0}
  .modal-box{border-radius:0;max-height:100vh;border:none}
}
@media(max-width:420px){
  .video-grid{grid-template-columns:1fr}
}
</style>
</head>

k":true,"topicId":"t-soundheal","topicLabel":"Sound Healing"},{"id":"v-ai-1","youtube_id":"aircAruvnKk","title":"But What Is a Neural Network?","channel":"3Blue1Brown","duration":"19 min","desc":"The clearest visual explanation of how neural networks actually work.","frqncy_pick":true,"topicId":"t-ai","topicLabel":"AI & Technology"},{"id":"v-sacgeo-1","youtube_id":"kkGeOWYOFoA","title":"Sacred Geometry — The Language of Light","channel":"Spirit Science","duration":"25 min","desc":"An exploration of the geometric patterns underlying all of nature.","frqncy_pick":true,"topicId":"t-sacredgeo","topicLabel":"Sacred Geometry"},{"id":"v-vib-1","youtube_id":"Q3oItpVa9fs","title":"Cymatics — Bringing Matter to Life with Sound","channel":"Ted-Ed","duration":"5 min","desc":"Watch sound waves made visible through patterns in matter.","frqncy_pick":true,"topicId":"t-vibration","topicLabel":"Vibration"},{"id":"v-med-2","youtube_id":"qyvDE6XTJOQ","title":"The Science Behind Mindfulness Meditation","channel":"Big Think","duration":"14 min","desc":"What neuroscience reveals about how meditation changes the brain.","frqncy_pick":false,"topicId":"t-meditation","topicLabel":"Meditation"},{"id":"v-quant-2","youtube_id":"p-MNSLsjjdo","title":"Quantum Mechanics — The Double Slit Experiment","channel":"Veritasium","duration":"8 min","desc":"The experiment that reveals the strangeness at the heart of quantum reality.","frqncy_pick":false,"topicId":"t-quantum","topicLabel":"Quantum Physics"}];

const TOPIC_LABELS = {
  't-meditation':'Meditation','t-quantum':'Quantum Physics','t-neuro':'Neuroscience',
  't-breathwork':'Breathwork','t-manifestation':'Manifestation','t-plantmed':'Plant Medicine',
  't-soundheal':'Sound Healing','t-quantum-grammar':'Quantum Grammar','t-ai':'AI & Technology',
  't-sacredgeo':'Sacred Geometry','t-vibration':'Vibration','t-saclaw':'Sacred Law'
};

// ── Provider registry (mirrors providers.json) ──────────────────
const PROVIDERS = {
  youtube: {
    embeddable: true,
    color: '#FF4040',
    name: 'YouTube',
    embedUrl:  id => `https://www.youtube.com/embed/${id}?autoplay=1&rel=0&modestbranding=1`,
    thumbUrl:  id => `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
    watchUrl:  id => `https://www.youtube.com/watch?v=${id}`
  },
  vimeo: {
    embeddable: true,
    color: '#1AB7EA',
    name: 'Vimeo',
    embedUrl:  id => `https://player.vimeo.com/video/${id}?autoplay=1&color=C4973A&title=0&byline=0&portrait=0`,
    thumbUrl:  id => null,
    watchUrl:  id => `https://vimeo.com/${id}`
  },
  gaia: {
    embeddable: false,
    color: '#5C9E8E',
    name: 'Gaia',
    embedUrl:  id => null,
    thumbUrl:  id => null,
    watchUrl:  id => `https://www.gaia.com/video/${id}`
  }
};

function getProvider(v)  { return PROVIDERS[v.provider || 'youtube'] || PROVIDERS.youtube; }
function getVideoId(v)   { return v.video_id || v.youtube_id || ''; }
function getThumbUrl(v)  {
  if (v.thumbnail) return v.thumbnail;
  const p = getProvider(v);
  const id = getVideoId(v);
  return p.thumbUrl(id) || '';
}
function getEmbedUrl(v) {
  const p = getProvider(v);
  if (!p.embeddable) return '';
  return p.embedUrl(getVideoId(v)) || '';
}
function getWatchUrl(v) {
  const p = getProvider(v);
  return p.watchUrl(getVideoId(v));
}

let allVideos = [];
let activeFilter = 'all';
let searchQuery = '';

/* ── Init ── */
async function init() {
  showSkeletons(8);

  // Use inlined data immediately (works on file:// and as offline fallback).
  // Then try to refresh from the server in case videos.json was updated
  // without re-running generate-watch.js.
  const useData = (flat) => {
    allVideos.length = 0;
    for (const v of flat) allVideos.push(v);
    allVideos.sort((a, b) => (b.frqncy_pick ? 1 : 0) - (a.frqncy_pick ? 1 : 0));
  };

  if (typeof INLINE_VIDEOS !== 'undefined' && INLINE_VIDEOS && INLINE_VIDEOS.length) {
    useData(INLINE_VIDEOS);
    // Rebuild topic index for filter tabs from inlined data
    const topicSet = {};
    for (const v of allVideos) { if (v.topicId) topicSet[v.topicId] = true; }
    buildFilters(topicSet);
    render();
  }

  // Attempt live fetch in the background (silently fails on file://)
  try {
    const res = await fetch('../../videos.json');
    if (!res.ok) return;
    const raw = await res.json();
    const fresh = [];
    for (const [topicId, videos] of Object.entries(raw)) {
      for (const v of videos) {
        const id = getVideoId(v);
        if (id && !id.startsWith('PLACEHOLDER')) {
          fresh.push({ ...v, topicId, topicLabel: TOPIC_LABELS[topicId] || topicId });
        }
      }
    }
    if (fresh.length !== allVideos.length) {
      useData(fresh);
      buildFilters(raw);
      render();
    }
  } catch(e) {
    // file:// or offline — inline data already rendered, nothing to do
    if (!allVideos.length) {
      document.getElementById('grid').innerHTML = '<div class="empty"><div class="empty-icon">⚠</div><p>Could not load videos.<br>Try refreshing the page.</p></div>';
    }
  }
}

function showSkeletons(n) {
  const grid = document.getElementById('grid');
  grid.innerHTML = Array.from({length: n}, () => `
    <div class="skeleton">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-body">
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
        <div class="skeleton-line xshort"></div>
      </div>
    </div>`).join('');
}

/* ── Filters ── */
function buildFilters(data) {
  const row = document.getElementById('filter-row');
  // Clear existing tabs first (handles re-render after live fetch)
  row.innerHTML = '<span class="filter-label">Filter</span>';

  const allBtn = makeFilter('all', 'All');
  allBtn.classList.add('active');
  row.appendChild(allBtn);

  const picksCount = allVideos.filter(v => v.frqncy_pick).length;
  if (picksCount > 0) {
    const picksBtn = makeFilter('picks', '✦ FRQNCY Picks');
    picksBtn.classList.add('picks-tab');
    row.appendChild(picksBtn);
  }

  // Provider filter tabs — only shown when more than one provider is present
  const providerIds = [...new Set(allVideos.map(v => v.provider || 'youtube'))];
  if (providerIds.length > 1) {
    for (const pid of providerIds) {
      const p = PROVIDERS[pid];
      if (!p) continue;
      const btn = makeFilter('provider:' + pid, p.name);
      btn.style.borderColor = p.color + '55';
      btn.style.color = p.color;
      btn.addEventListener('mouseenter', () => { if (!btn.classList.contains('active')) btn.style.borderColor = p.color; });
      btn.addEventListener('mouseleave', () => { if (!btn.classList.contains('active')) btn.style.borderColor = p.color + '55'; });
      row.appendChild(btn);
    }
  }

  // Topic tabs — data can be a raw videos.json object OR a flat {topicId:true} set
  const topicIds = Array.isArray(data)
    ? [...new Set(allVideos.map(v => v.topicId).filter(Boolean))]
    : Object.keys(data).filter(t => {
        if (typeof data[t] === 'boolean') return allVideos.some(v => v.topicId === t);
        return (data[t]||[]).some(v => { const id = getVideoId(v); return id && !id.startsWith('PLACEHOLDER'); });
      });
  for (const t of topicIds) {
    row.appendChild(makeFilter(t, TOPIC_LABELS[t] || t));
  }
}

function makeFilter(id, label) {
  const btn = document.createElement('button');
  btn.className = 'ftab';
  btn.textContent = label;
  btn.dataset.filter = id;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = id;
    render();
  });
  return btn;
}

/* ── Render ── */
function render() {
  const grid = document.getElementById('grid');
  const q    = searchQuery.toLowerCase().trim();

  const matchesFilter = v => {
    if (activeFilter === 'picks') return v.frqncy_pick;
    if (activeFilter.startsWith('provider:')) return (v.provider || 'youtube') === activeFilter.slice(9);
    if (activeFilter !== 'all')  return v.topicId === activeFilter;
    return true;
  };
  const matchesSearch = v => {
    if (!q) return true;
    return [v.title, v.channel, v.desc, v.topicLabel, getProvider(v).name].some(s => (s||'').toLowerCase().includes(q));
  };
  const filtered = allVideos.filter(v => matchesFilter(v) && matchesSearch(v));

  const countEl = document.getElementById('result-count');
  if (q || activeFilter !== 'all') {
    countEl.textContent = `${filtered.length} video${filtered.length !== 1 ? 's' : ''}`;
  } else {
    countEl.textContent = `${allVideos.length} videos`;
  }

  grid.innerHTML = '';

  if (!filtered.length) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">○</div><p>No videos match your search.<br><button onclick="clearSearch()" style="margin-top:0.75rem;background:none;border:1px solid rgba(255,255,255,0.15);color:var(--text-dim);padding:5px 14px;border-radius:2px;cursor:pointer;font-family:\'Jost\',sans-serif;font-size:0.72rem;letter-spacing:0.1em">Clear filters</button></p></div>';
    return;
  }

  const frag = document.createDocumentFragment();
  for (const v of filtered) frag.appendChild(makeCard(v));
  grid.appendChild(frag);
}

function clearSearch() {
  document.getElementById('search').value = '';
  searchQuery = '';
  activeFilter = 'all';
  document.querySelectorAll('.ftab').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  render();
}

function makeCard(v) {
  const card     = document.createElement('div');
  const provider = getProvider(v);
  const thumb    = getThumbUrl(v);
  const isExt    = !provider.embeddable;

  card.className = 'vcard';
  card.setAttribute('role', 'listitem');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', `${isExt ? 'Watch' : 'Play'} ${v.title}${isExt ? ' on '+provider.name : ''}`);

  const playBtnIcon = isExt
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="16" height="16"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`
    : `<svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>`;

  const provBadge = (v.provider || 'youtube') !== 'youtube'
    ? `<span class="vprov" style="background:${provider.color}22;color:${provider.color};border:1px solid ${provider.color}55">${esc(provider.name)}</span>`
    : '';

  card.innerHTML = `
    <div class="vthumb">
      ${thumb
        ? `<img src="${thumb}" alt="" loading="lazy" decoding="async">`
        : `<div class="vthumb-fallback" style="background:linear-gradient(135deg,${provider.color}18,rgba(196,151,58,0.06))"></div>`}
      <div class="vplay${isExt ? ' vplay-ext' : ''}">
        <div class="vplay-btn${isExt ? ' vplay-btn-ext' : ''}">${playBtnIcon}</div>
      </div>
      ${v.duration ? `<span class="vdur">${esc(v.duration)}</span>` : ''}
      ${v.frqncy_pick ? '<span class="vpick">FRQNCY Pick</span>' : ''}
      ${provBadge}
    </div>
    <div class="vinfo">
      ${v.topicLabel ? `<div class="vtopic">${esc(v.topicLabel)}</div>` : ''}
      <div class="vtitle">${esc(v.title)}</div>
      ${v.channel ? `<div class="vchannel">${esc(v.channel)}</div>` : ''}
      ${v.desc ? `<div class="vdesc-card">${esc(v.desc)}</div>` : ''}
    </div>`;

  const open = () => openModal(v);
  card.addEventListener('click', open);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }});
  return card;
}

/* ── Modal ── */
let _currentWatchUrl = '';

function showEmbedError() {
  // Hide the iframe, show the fallback error panel
  document.getElementById('modal-player').style.display = 'none';
  const err = document.getElementById('modal-embed-error');
  err.classList.add('visible');
  document.getElementById('modal-watch-link').href = _currentWatchUrl;
}

function openModal(v) {
  const embed    = getEmbedUrl(v);
  const watch    = getWatchUrl(v);
  const provider = getProvider(v);

  // Non-embeddable providers (e.g. Gaia) — always open in new tab
  // file:// — YouTube rejects all embeds with Error 153; open externally
  if (!provider.embeddable || !embed || location.protocol === 'file:') {
    window.open(watch, '_blank', 'noopener,noreferrer');
    return;
  }

  _currentWatchUrl = watch;

  // Reset error state
  document.getElementById('modal-player').style.display = '';
  document.getElementById('modal-embed-error').classList.remove('visible');

  document.getElementById('modal-topic-el').textContent   = v.topicLabel || '';
  document.getElementById('modal-title-el').textContent   = v.title;
  document.getElementById('modal-channel-el').textContent = v.channel ? `— ${v.channel}` : '';
  document.getElementById('modal-desc-el').textContent    = v.desc || '';
  // Append enablejsapi=1 so YouTube fires postMessage events we can detect
  document.getElementById('modal-iframe').src = embed + (embed.includes('?') ? '&' : '?') + 'enablejsapi=1';
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('modal-close').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
  document.body.style.overflow = '';
}

// YouTube fires postMessage errors when embedding is blocked (e.g. Error 150/151/153)
window.addEventListener('message', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  try {
    const data = JSON.parse(typeof e.data === 'string' ? e.data : '{}');
    // YouTube IFrame API error event format: {event:'infoDelivery', info:{error:N}}
    if (data.event === 'infoDelivery' && data.info && data.info.error != null) {
      showEmbedError();
    }
    // Alternative format used by some YouTube embed versions
    if (data.event === 'onError') {
      showEmbedError();
    }
  } catch { /* non-JSON postMessage from other iframes — ignore */ }
});

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Search ── */
let searchTimer;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchQuery = e.target.value;
    render();
  }, 120);
});

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
