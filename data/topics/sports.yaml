meta:
  slug: sports
  label: Sports
  domain: Play & Recreation
  domain_slug: play
  pillar: Builder
  pillar_slug: builder
  accent: "#E84A4A"

treatment:
  register: kinetic
  overrides:
    accent_warm: "#FF7A6E"

hero:
  variant: split
  eyebrow: "Play & Recreation · The body as instrument"
  title: Sports
  desc: |
    Sports do not build character. They reveal it. *— Heywood Hale Broun*
  quote:
    text: The opponent within one's own head is more formidable than the one across the net.
    cite: W. Timothy Gallwey — The Inner Game of Tennis
  media:
    poster_url: https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&q=85&w=2400

# No prelude — data first.
prelude: null

sections:

  - module: resources
    label: Books
    types: [book]
    auto: false
    inline:
      - type: book
        name: The Inner Game of Tennis — W. Timothy Gallwey
        desc: Tennis. 1974. The book that named the loudest opponent — the one inside the head.
        external: https://www.randomhousebooks.com/books/7412/
      - type: book
        name: Sacred Hoops — Phil Jackson
        desc: Basketball. Eleven NBA championships through zen practice and the triangle offence.
        external: https://www.hyperionbooks.com/book/9780786881680/sacred-hoops/
      - type: book
        name: Born to Run — Christopher McDougall
        desc: Running. The Tarahumara, ultrarunning, and what feet were before shoes.
        external: https://www.christophermcdougall.com/born-to-run

  - module: resources
    label: People
    types: [person]
    auto: false
    inline:
      - type: person
        name: John Wooden
        desc: Basketball coach. Ten NCAA titles in twelve years, taught mostly through character. The most decorated coach in collegiate sport.
        external: https://www.coachwooden.com
      - type: person
        name: Roger Federer
        desc: Tennis. Twenty Grand Slams. The standard for grace, longevity, and what playing for love of the game looks like at the top.
        external: https://www.rogerfederer.com
      - type: person
        name: Eliud Kipchoge
        desc: Marathon. Olympic champion, world record holder, sub-two breaker. *No human is limited.*
        external: https://eliudkipchoge.com

  - module: resources
    label: Institutions
    types: [org]
    auto: false
    inline:
      - type: org
        name: USOPC — Colorado Springs
        desc: The original American high-performance campus. Altitude, lab science, residency model for elite athletes.
        external: https://www.teamusa.com/usopc
      - type: org
        name: AIS — Australian Institute of Sport
        desc: The Canberra campus that produced a generation of Olympic medals through coordinated sports science.
        external: https://www.ais.gov.au
      - type: org
        name: INSEP — Paris
        desc: France's elite training centre. Where most of the country's Olympic team lives and trains.
        external: https://www.insep.fr

  - module: resources
    label: Places
    types: [place]
    auto: false
    inline:
      - type: place
        name: Wimbledon — All England Club
        desc: Tennis. Grass, white clothing, two weeks every July. Still the sport's most reliable temple.
        external: https://www.wimbledon.com
      - type: place
        name: Iten, Kenya
        desc: Running. 2,400m altitude village. More world-class distance runners per postcode than anywhere on Earth.
        external: https://en.wikipedia.org/wiki/Iten
      - type: place
        name: Yosemite — El Capitan
        desc: Climbing. The wall that taught American climbing what was possible.
        external: https://www.nps.gov/yose/

  - module: resources
    label: Tools & media
    types: [tool, media, app, platform]
    auto: false
    inline:
      - type: tool
        name: WHOOP
        desc: Continuous HRV and recovery tracking. Makes the calendar legible.
        external: https://www.whoop.com
      - type: tool
        name: Oura Ring
        desc: Sleep, HRV, and readiness from the finger. Cleaner than wrist wearables.
        external: https://ouraring.com
      - type: tool
        name: Strava
        desc: The training log and the social layer for athletes who train alone.
        external: https://www.strava.com

  # Scroll 1 of 2 — blue panel, sourced quotes
  - module: panel
    label: From the canon
    items:
      - title: It's not whether you get knocked down; it's whether you get up.
        body: Vince Lombardi
      - title: Failure is not fatal, but failure to change might be.
        body: John Wooden
      - title: I fear not the man who has practiced 10,000 kicks once, but I fear the man who has practiced one kick 10,000 times.
        body: Bruce Lee
      - title: The strength of the team is each individual member. The strength of each member is the team.
        body: Phil Jackson — Sacred Hoops
      - title: Becoming is better than being.
        body: Carol Dweck — Mindset

  # Scroll 2 of 2 — bleed image, sourced caption
  - module: bleed
    image_url: https://images.unsplash.com/photo-1502904550040-7534597429ae?auto=format&fit=crop&q=85&w=2400
    caption: |
      Pressure is a privilege. *— Billie Jean King*

# No picks block — covered by resources.
picks: null
# No closing — bleed is the closing.
closing: null

