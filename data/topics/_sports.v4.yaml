# No prelude — data first.
prelude: null

sections:

  - module: resources
    label: Books
    types: [book]
    auto: false
    inline:
      - type: book
        name: The Inner Game of Tennis — W. Timothy Gallwey
        desc: 1974. The book that named the loudest opponent — the one inside the head.
        external: https://www.randomhousebooks.com/books/7412/
      - type: book
        name: The Art of Learning — Josh Waitzkin
        desc: A chess prodigy turned martial artist, on how mastery actually works.
        external: https://www.joshwaitzkin.com/the-art-of-learning
      - type: book
        name: Peak — Anders Ericsson
        desc: The empirical foundation under every "10,000 hours" misquotation.
        external: https://www.hmhbooks.com/shop/books/peak/9780544456259
      - type: book
        name: Endure — Alex Hutchinson
        desc: The science of human limits. The brain, the body, and the line that collapses under fatigue.
        external: https://www.alexhutchinson.net/endure
      - type: book
        name: Born to Run — Christopher McDougall
        desc: The Tarahumara, ultrarunning, and what feet were before shoes.
        external: https://www.christophermcdougall.com/born-to-run
      - type: book
        name: Mindset — Carol Dweck
        desc: Growth vs. fixed. The framework underneath most modern coaching language.
        external: https://www.mindsetworks.com/Science/

  - module: resources
    label: People
    types: [person]
    auto: false
    inline:
      - type: person
        name: W. Timothy Gallwey
        desc: Coach who reframed performance as the dialogue between Self 1 and Self 2.
        external: https://theinnergame.com
      - type: person
        name: Josh Waitzkin
        desc: Chess prodigy turned martial artist turned performance coach.
        external: https://www.joshwaitzkin.com
      - type: person
        name: Andrew Huberman
        desc: Stanford neuroscientist whose work on focus and recovery reshaped how athletes train.
        external: https://www.hubermanlab.com
      - type: person
        name: Phil Jackson
        desc: Eleven-time NBA champion. Brought zen practice and triangle offence into the same building.
        external: https://www.philjackson.com
      - type: person
        name: John Wooden
        desc: Ten NCAA titles in twelve years, coaching mostly through character.
        external: https://www.coachwooden.com
      - type: person
        name: Pavel Tsatsouline
        desc: Soviet-trained strength coach. Strong is a skill, not a goal.
        external: https://www.strongfirst.com

  - module: resources
    label: Institutions
    types: [org]
    auto: false
    inline:
      - type: org
        name: USOPC — Colorado Springs
        desc: The original American high-performance campus. Altitude, lab science, residency.
        external: https://www.teamusa.com/usopc
      - type: org
        name: AIS — Australian Institute of Sport
        desc: Canberra. Produced a generation of Olympic medals through coordinated sports science.
        external: https://www.ais.gov.au
      - type: org
        name: INSEP — Paris
        desc: France's elite training centre. Where most of the country's Olympic team lives and trains.
        external: https://www.insep.fr
      - type: org
        name: Stanford Center for Sports Performance
        desc: Sports-science research with academic rigor. Where Huberman and a generation of researchers passed through.
        external: https://med.stanford.edu/sportsperformance.html

  - module: resources
    label: Places
    types: [place]
    auto: false
    inline:
      - type: place
        name: Boulder, Colorado
        desc: Endurance and climbing capital. Highest density of professional athletes per capita in the US.
        external: https://www.bouldercolorado.gov
      - type: place
        name: Iten, Kenya
        desc: 2,400m altitude village. More world-class distance runners per postcode than anywhere on Earth.
        external: https://en.wikipedia.org/wiki/Iten
      - type: place
        name: Chamonix, France
        desc: Birthplace of mountaineering. Spiritual home of alpinism and ultra-running.
        external: https://www.chamonix.com
      - type: place
        name: Yosemite — El Capitan
        desc: The wall that taught American climbing what was possible.
        external: https://www.nps.gov/yose/

  - module: resources
    label: Tools & media
    types: [tool, media, app, platform]
    auto: true
    inline:
      - type: tool
        name: WHOOP
        desc: Continuous HRV and recovery tracking. Makes the calendar legible.
        external: https://www.whoop.com
      - type: tool
        name: Oura Ring
        desc: Sleep, HRV, and readiness from the finger. Cleaner than wrist wearables.
        external: https://ouraring.com
      - type: tool
        name: Eight Sleep
        desc: The mattress that controls its own temperature. Sleep is the training.
        external: https://www.eightsleep.com

  # Scroll 1 of 2 — blue background panel, compact practice
  - module: panel
    label: A practice
    title: Five small things that *compound.*
    items:
      - title: Move every day.
        body: Even fifteen minutes. The body responds to the year-long average, not the calendar.
      - title: Train one skill slow.
        body: Five minutes of attention-full repetition of a basic movement, daily.
      - title: Sleep eight, before midnight.
        body: Hormonal recovery is non-negotiable for adaptation.
      - title: Lift something heavy weekly.
        body: Once is enough to keep the strength curve from declining.
      - title: Compete, gently, often.
        body: The shape under stakes only grows under stakes.
    quote:
      text: The opponent within one's own head is more formidable than the one across the net.
      cite: W. Timothy Gallwey

  # Scroll 2 of 2 — bleed image, single line
  - module: bleed
    image_url: https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&q=85&w=2400
    caption: |
      Show up anyway.

# No picks block — covered by resources.
picks: null
