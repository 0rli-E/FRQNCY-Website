hero:
  variant: split
  eyebrow: "Play & Recreation · The body as instrument"
  title: Sports
  desc: |
    The most honest mirror we have. *The body cannot lie about whether you trained.*
  quote:
    text: We do not rise to the level of our expectations. We fall to the level of our training.
    cite: Archilochus
  media:
