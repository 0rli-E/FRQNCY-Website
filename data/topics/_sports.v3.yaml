meta:
  slug: sports
  label: Sports
  domain: Play & Recreation
  domain_slug: play
  pillar: Builder
  pillar_slug: builder
  accent: "#E84A4A"

treatment:
  register: kinetic
  overrides:
    accent_warm: "#FF7A6E"

hero:
  variant: split
  eyebrow: "Play & Recreation · The body as instrument"
  title: Sports
  desc: |
    The most honest mirror we have. *The body cannot lie about whether you trained.*
  quote:
    text: We do not rise to the level of our expectations. We fall to the level of our training.
    cite: Archilochus — 7th century BC
  media:
    poster_url: https://images.unsplash.com/photo-1517649763962-0c623066013b?auto=format&fit=crop&q=85&w=2400

prelude:
  lede: |
    Sport is one of the few remaining places where the body has the final word. What looks like
    competition is really practice with stakes — a way to find out what is true under pressure.
  blockquote:
    text: The opponent within one's own head is more formidable than the one across the net.
    cite: W. Timothy Gallwey

sections:

  - module: prose
    label: The shape
    title: Three frames *most* athletes pass through.
    paragraphs:
      - |
        **Acquisition.** The first months and years. Awkward, over-thought. The body is being
        taught what it cannot yet do without supervision from the conscious mind.
      - |
        **Performance.** The shape is there in practice but disappears under stakes. The work
        shifts to managing the nervous system around movement.
      - |
        **Release.** The shape is automatic, the pressure is metabolised, and the player begins
        to enjoy the sport in a different way — less contest, more conversation.

  - module: bleed
    image_url: https://images.unsplash.com/photo-1530549387789-4c1017266635?auto=format&fit=crop&q=85&w=2400
    caption: |
      Flow finds the prepared.

  - module: resources
    label: Books
    title: The canon.
    types: [book]
    auto: false
    inline:
      - type: book
        name: The Inner Game of Tennis
        desc: Gallwey, 1974. The book that named the loudest opponent — the one inside the head.
        external: https://www.randomhousebooks.com/books/7412/
      - type: book
        name: The Art of Learning
        desc: Josh Waitzkin's account of becoming world-class twice. The clearest map of how mastery actually works.
        external: https://www.joshwaitzkin.com/the-art-of-learning
      - type: book
        name: Peak
        desc: Anders Ericsson on deliberate practice. The empirical foundation under every "10,000 hours" misquotation.
        external: https://www.hmhbooks.com/shop/books/peak/9780544456259
      - type: book
        name: Endure
        desc: Alex Hutchinson on the science of human limits. The brain, the body, and the line that collapses under fatigue.
        external: https://www.alexhutchinson.net/endure
      - type: book
        name: Born to Run
        desc: McDougall on the Tarahumara, ultrarunning, and what feet were before shoes.
        external: https://www.christophermcdougall.com/born-to-run
      - type: book
        name: Mindset
        desc: Carol Dweck on growth vs. fixed. The framework underneath most modern coaching language.
        external: https://www.mindsetworks.com/Science/

  - module: resources
    label: People
    title: The teachers.
    types: [person]
    auto: false
    inline:
      - type: person
        name: W. Timothy Gallwey
        desc: Coach who reframed performance as the dialogue between Self 1 and Self 2.
        external: https://theinnergame.com
      - type: person
        name: Josh Waitzkin
        desc: Chess prodigy turned martial artist turned performance coach.
        external: https://www.joshwaitzkin.com
      - type: person
        name: Andrew Huberman
        desc: Stanford neuroscientist whose work on focus and recovery reshaped how athletes train.
        external: https://www.hubermanlab.com
      - type: person
        name: Phil Jackson
        desc: Eleven-time NBA champion. Brought zen practice and triangle offence into the same building.
        external: https://www.philjackson.com
      - type: person
        name: John Wooden
        desc: Ten NCAA titles in twelve years, coaching mostly through character.
        external: https://www.coachwooden.com
      - type: person
        name: Pavel Tsatsouline
        desc: Soviet-trained strength coach. Strong is a skill, not a goal.
        external: https://www.strongfirst.com
      - type: person
        name: Steve Magness
        desc: Coach of Olympians and writer on the science of hard.
        external: https://www.stevemagness.com
      - type: person
        name: Wim Hof
        desc: Cold, breath, and what the autonomic nervous system can do when consciously trained.
        external: https://www.wimhofmethod.com

  - module: bleed
    image_url: https://images.unsplash.com/photo-1486218119243-13883505764c?auto=format&fit=crop&q=85&w=2400
    caption: |
      Discipline is *the only known way* of becoming free of distraction.

  - module: resources
    label: Institutions
    title: The houses.
    types: [org]
    auto: false
    inline:
      - type: org
        name: USOPC — Colorado Springs
        desc: The original American high-performance campus. Altitude, lab science, residency.
        external: https://www.teamusa.com/usopc
      - type: org
        name: AIS — Australian Institute of Sport
        desc: The Canberra campus that produced a generation of medals through coordinated sports science.
        external: https://www.ais.gov.au
      - type: org
        name: INSEP — Paris
        desc: France's elite training centre. Where most of the country's Olympic team lives, trains, and studies.
        external: https://www.insep.fr
      - type: org
        name: Stanford Center for Sports Performance
        desc: Sports-science research with academic rigor. Where Huberman and a generation of researchers passed through.
        external: https://med.stanford.edu/sportsperformance.html
      - type: org
        name: NSCA
        desc: The credentialing body for strength coaches in the US. Reads more like a journal than a certification.
        external: https://www.nsca.com

  - module: resources
    label: Places
    title: The grounds.
    types: [place]
    auto: false
    inline:
      - type: place
        name: Boulder, Colorado
        desc: Endurance and climbing capital. Highest density of professional athletes per capita in the US.
        external: https://www.bouldercolorado.gov
      - type: place
        name: Iten, Kenya
        desc: 2,400m altitude village. More world-class distance runners per postcode than anywhere on Earth.
        external: https://en.wikipedia.org/wiki/Iten
      - type: place
        name: Chamonix, France
        desc: Birthplace of mountaineering. Spiritual home of alpinism and ultra-running.
        external: https://www.chamonix.com
      - type: place
        name: Yosemite — El Capitan
        desc: The wall that taught American climbing what was possible.
        external: https://www.nps.gov/yose/
      - type: place
        name: Wimbledon — All England Club
        desc: Grass, white clothing, two weeks every July. Still the sport's most reliable temple.
        external: https://www.wimbledon.com

  - module: resources
    label: Tools & media
    title: The kit.
    types: [tool, media, app, platform]
    tight: true
    auto: true
    inline:
      - type: tool
        name: WHOOP
        desc: Continuous HRV and recovery tracking. Makes the calendar legible.
        external: https://www.whoop.com
      - type: tool
        name: Oura Ring
        desc: Sleep, HRV, and readiness from the finger. Cleaner than wrist wearables.
        external: https://ouraring.com
      - type: tool
        name: Eight Sleep
        desc: The mattress that controls its own temperature. Sleep is the training.
        external: https://www.eightsleep.com
      - type: media
        name: The Knowledge Project
        desc: Shane Parrish's interview show. How high performers actually think.
        external: https://fs.blog/knowledge-project-podcast/

  - module: practice
    label: A practice
    title: Five small things that compound.
    steps:
      - title: Move every day. Even fifteen minutes.
        body: The body responds to the year-long average, not the calendar.
      - title: Pick one skill, train it slow.
        body: Five minutes of attention-full repetition of one basic movement, daily.
      - title: Sleep eight, before midnight when you can.
        body: Hormonal recovery is non-negotiable for adaptation.
      - title: Lift something heavy each week.
        body: Once is enough to keep the strength curve from declining.
      - title: Compete, gently, often.
        body: The shape under stakes only grows under stakes.

