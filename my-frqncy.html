<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My FRQNCY · The trinity hub</title>
<meta name="description" content="The founding block of FRQNCY. Your constellation, your companion, your network — all written from one profile.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://frqncy.network/my-frqncy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e18;
    --bg-card:#10162a;
    --bg-elev:#161d35;
    --ink:#f5f0e6;
    --ink-soft:#b9b3a3;
    --ink-dim:#7d7866;
    --gold:#C4973A;
    --gold-soft:#dcb15a;
    --gold-dim:#7a5d22;
    --rule:#1f2942;
    --r-md:14px;
    --r-lg:24px;
    --t-fast:140ms ease;
    --t-slow:600ms cubic-bezier(.2,.6,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{min-height:100vh;display:flex;flex-direction:column;background-image:radial-gradient(ellipse at top, #0d1322 0%, var(--bg) 70%)}
  ::selection{background:var(--gold);color:var(--bg)}
  a{color:var(--gold);text-decoration:none}
  a:hover{color:var(--gold-soft)}

  .shell{flex:1;max-width:780px;margin:0 auto;padding:32px 24px 80px;width:100%}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .wordmark{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
  .topbar-nav{display:flex;gap:18px;font-size:12px;letter-spacing:.04em}
  .topbar-nav a{color:var(--ink-dim)}
  .topbar-nav a:hover{color:var(--gold)}

  .hero{text-align:center;padding:24px 0 36px}
  .hero .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:18px;opacity:0;animation:fadeIn 800ms ease 200ms forwards}
  .hero h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:44px;line-height:1.15;color:var(--ink);margin:0 0 18px 0;letter-spacing:-.005em;opacity:0;animation:fadeIn 800ms ease 400ms forwards}
  .hero .lede{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:19px;line-height:1.55;color:var(--gold-soft);margin:0 auto 24px;max-width:42ch;opacity:0;animation:fadeIn 800ms ease 600ms forwards}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .constellation{display:flex;justify-content:center;margin:20px 0 40px;opacity:0;animation:fadeIn 1200ms ease 800ms forwards}
  .constellation svg{max-width:100%;height:auto;width:520px}
  .star-line{stroke:var(--gold-dim);stroke-width:.8;opacity:.4}
  .star{fill:var(--gold-soft)}
  .star.center{fill:var(--gold)}
  .star.dim{fill:var(--gold-dim)}
  .star-label{font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.06em;fill:var(--ink-dim);text-transform:uppercase}
  .star-value{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;fill:var(--ink)}
  .star-value.gold{fill:var(--gold-soft)}
  .star-center-name{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.06em;fill:var(--gold);text-transform:uppercase}
  .star-center-val{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;font-weight:500;fill:var(--gold)}
  .pulse{transform-origin:center;animation:pulse 3.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
  .glow{filter:drop-shadow(0 0 8px rgba(196,151,58,.55))}

  .reading{background:var(--bg-card);border:1px solid var(--gold-dim);border-radius:var(--r-md);padding:24px;margin-bottom:48px;text-align:center}
  .reading .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
  .reading p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;line-height:1.55;color:var(--ink);margin:0 0 8px 0;max-width:48ch;margin-left:auto;margin-right:auto}
  .reading p:last-child{margin-bottom:0}

  .trinity{margin-bottom:48px}
  .trinity-label{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:24px}
  .trinity-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:14px}
  .trinity-card{background:var(--bg-card);border:1px solid var(--rule);border-radius:var(--r-md);padding:24px;text-decoration:none;color:var(--ink);transition:all var(--t-fast);display:flex;flex-direction:column}
  .trinity-card:hover{border-color:var(--gold);background:var(--bg-elev);transform:translateY(-2px)}
  .trinity-card .name{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:24px;color:var(--gold);margin-bottom:8px;letter-spacing:.04em}
  .trinity-card .what{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--ink-soft);margin-bottom:14px;flex:1;line-height:1.5}
  .trinity-card .cta{font-size:12px;color:var(--gold-soft);letter-spacing:.06em;margin-top:auto}
  .trinity-card .cta:after{content:" \2192";opacity:.6}

  .foundation{text-align:center;padding:24px;margin-bottom:36px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .foundation .label{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:11px;letter-spacing:.2em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:10px}
  .foundation p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;line-height:1.55;color:var(--ink-soft);margin:0;max-width:48ch;margin-left:auto;margin-right:auto}

  .actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:10px 20px;border-radius:999px;font-size:13px;letter-spacing:.04em;cursor:pointer;font-family:inherit;transition:all var(--t-fast);text-decoration:none;display:inline-block}
  .btn:hover{background:var(--gold);color:var(--bg)}
  .btn.primary{background:var(--gold);color:var(--bg)}
  .btn.primary:hover{background:var(--gold-soft)}
  .btn.ghost{border:none;color:var(--ink-dim)}
  .btn.ghost:hover{color:var(--gold);background:transparent}
  .btn.breathing{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(196,151,58,.0)}50%{box-shadow:0 0 0 6px rgba(196,151,58,.18)}}

  .empty .hero h1{font-size:48px}
  .empty .actions{margin-top:32px}

  .foot{text-align:center;padding:40px 24px 24px;font-size:11px;color:var(--ink-dim);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;letter-spacing:.04em}

  @media (max-width:640px){
    .hero h1{font-size:32px}
    .trinity-grid{grid-template-columns:1fr}
    .constellation svg{width:100%}
    .shell{padding:24px 18px 60px}
    .empty .hero h1{font-size:36px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition-duration:0.01ms !important;animation-duration:0.01ms !important}
  }
</style>
</head>
<body>
  <div class="shell" id="shell"></div>
  <footer class="foot">
    The profile lives on this device until you sign in. <a href="/my-frqncy/intake/" style="color:var(--gold-dim)">Intake</a> &middot; <a href="/my-frqncy/vbrtn/" style="color:var(--gold-dim)">VBRTN</a> &middot; <a href="/my-frqncy/dashboard/" style="color:var(--gold-dim)">Sanctuary</a>
  </footer>

<script>
(function(){
  'use strict';
  const STORE_KEY = 'frqncy:vbrtn:profile';

  function loadProfile(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function cap(s){ if(!s) return s; return s[0].toUpperCase() + s.slice(1); }
  function textureLabel(t){
    return {
      stride:'Hitting stride', building:'Slowly building', holding:'Holding it together',
      surviving:'Just getting through', 'catching-breath':'Catching breath',
      restart:'Starting over', searching:'Looking for what is next', returning:'Coming back'
    }[t] || t;
  }
  function truncate(s, n){
    if(!s) return '';
    return s.length > n ? s.substring(0, n).trim() + '…' : s;
  }

  const shell = document.getElementById('shell');

  function trinityHTML(){
    return `
      <section class="trinity">
        <div class="trinity-label">The trinity</div>
        <div class="trinity-grid">
          <a class="trinity-card" href="/social/">
            <div class="name">NRG</div>
            <div class="what">The network. A place to be seen, recognised, and joined by others walking the same shape.</div>
            <div class="cta">Enter the network</div>
          </a>
          <a class="trinity-card" href="/my-frqncy/vbrtn/">
            <div class="name">VBRTN</div>
            <div class="what">The companion. Reads your design, your state, and your language; meets you where you are.</div>
            <div class="cta">Open the companion</div>
          </a>
          <a class="trinity-card" href="/explore.html">
            <div class="name">FRQNCY</div>
            <div class="what">The map. One hundred and forty-six topics, seven hundred resources, ready to be routed to you.</div>
            <div class="cta">Walk the map</div>
          </a>
        </div>
      </section>
    `;
  }

  function constellationSVG(p){
    const cx = 300, cy = 300;
    const stars = buildStars(p);
    let nodes = '';
    stars.forEach(s => {
      nodes += `<line class="star-line" x1="${cx}" y1="${cy}" x2="${s.x}" y2="${s.y}" />`;
    });
    nodes += `
      <g class="pulse glow">
        <circle class="star center" cx="${cx}" cy="${cy}" r="10" />
      </g>
      <text class="star-center-name" x="${cx}" y="${cy - 30}" text-anchor="middle">Reaching for</text>
      <text class="star-center-val" x="${cx}" y="${cy + 50}" text-anchor="middle">${escapeHtml(cap(p.standing?.dominantDesire) || 'Direction')}</text>
    `;
    stars.forEach((s) => {
      const dim = s.dim ? 'dim' : '';
      const tAnchor = s.x < cx - 20 ? 'end' : s.x > cx + 20 ? 'start' : 'middle';
      const labelOffsetY = s.y < cy ? -22 : 28;
      const valueOffsetY = s.y < cy ? -8 : 44;
      nodes += `
        <circle class="star ${dim}" cx="${s.x}" cy="${s.y}" r="${s.dim ? 3.5 : 5}" />
        <text class="star-label" x="${s.x}" y="${s.y + labelOffsetY}" text-anchor="${tAnchor}">${escapeHtml(s.label)}</text>
        <text class="star-value gold" x="${s.x}" y="${s.y + valueOffsetY}" text-anchor="${tAnchor}">${escapeHtml(s.value)}</text>
      `;
    });
    let bg = '';
    const seed = p?.rememberOne ? p.rememberOne.length : 7;
    for(let i = 0; i < 60; i++){
      const x = ((seed * (i+1) * 73) % 580) + 10;
      const y = ((seed * (i+1) * 41) % 580) + 10;
      const r = (i % 3 === 0) ? 1.2 : 0.6;
      const op = 0.15 + ((i % 5) * 0.05);
      const dx = x - cx, dy = y - cy;
      if(Math.sqrt(dx*dx + dy*dy) < 60) continue;
      bg += `<circle cx="${x}" cy="${y}" r="${r}" fill="#f5f0e6" opacity="${op}" />`;
    }
    return `<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your constellation">${bg}${nodes}</svg>`;
  }

  function buildStars(p){
    const positions = 6;
    const cx = 300, cy = 300, r = 195;
    const angleOffset = -Math.PI / 2;
    const points = [];
    for(let i = 0; i < positions; i++){
      const angle = angleOffset + (i / positions) * Math.PI * 2;
      points.push({ x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) });
    }
    const stars = [];
    if(p.design?.hd?.type){
      stars.push({ ...points[0], label:'Design', value: p.design.hd.type, dim:false });
    } else {
      stars.push({ ...points[0], label:'Where you are', value: textureLabel(p.standing?.texture) || '—', dim:true });
    }
    stars.push({ ...points[1], label:'Recent state', value: cap(p.standing?.recentFeeling) || '—', dim:!p.standing?.recentFeeling });
    stars.push({ ...points[2], label:'Pulled toward', value: truncate(p.standing?.pull, 22) || '—', dim:!p.standing?.pull });
    const door = p.triggers?.positive?.[0];
    stars.push({ ...points[3], label:'Door back', value: truncate(door, 22) || '—', dim:!door });
    if(p.design?.hd?.type){
      stars.push({ ...points[4], label:'Strategy', value: p.design.hd.strategy || '—', dim:false });
    } else {
      stars.push({ ...points[4], label:'Reaching toward', value: cap(p.standing?.dominantDesire) || '—', dim:!p.standing?.dominantDesire });
    }
    stars.push({ ...points[5], label:'Remember', value: truncate(p.rememberOne, 22) || '—', dim:!p.rememberOne });
    return stars;
  }

  function generateReading(p){
    const lines = [];
    const hd = p.design?.hd;
    const feel = p.standing?.recentFeeling;
    const desire = p.standing?.dominantDesire;
    const texture = p.standing?.texture;
    const remember = p.rememberOne;
    if(hd?.type && desire){
      lines.push(`A ${hd.type} reaching toward more ${desire}.`);
    } else if(hd?.type){
      lines.push(`A ${hd.type} — designed to ${hd.strategy.toLowerCase()}.`);
    } else if(desire){
      lines.push(`Reaching toward more ${desire}.`);
    }
    if(texture && feel){
      lines.push(`${textureLabel(texture)}. Carrying ${feel}.`);
    } else if(feel){
      lines.push(`Carrying ${feel}.`);
    }
    if(remember){
      lines.push(`Asked to be remembered as: ${remember}`);
    }
    return lines.slice(0, 3);
  }

  function renderEmpty(){
    shell.innerHTML = `
      <div class="topbar">
        <div class="wordmark">My FRQNCY</div>
        <nav class="topbar-nav">
          <a href="/explore.html">Explore</a>
          <a href="/about.html">About</a>
        </nav>
      </div>

      <div class="empty">
        <section class="hero">
          <div class="label">The founding block</div>
          <h1>Begin to know yourself.</h1>
          <p class="lede">Twenty-five questions. About twelve minutes. The answers become the foundation every part of FRQNCY writes from — your constellation, your companion, your network. Nothing leaves this device until you sign in.</p>
          <div class="actions">
            <a class="btn primary breathing" href="/my-frqncy/intake/">Begin the intake →</a>
          </div>
        </section>

        <div class="foundation">
          <div class="label">What gets built from this</div>
          <p>One profile, three surfaces: VBRTN (your companion), NRG (your network), and the FRQNCY map (your route through the topics). Every recommendation, every reflection, every match is written from what you say here.</p>
        </div>

        ${trinityHTML()}
      </div>
    `;
  }

  function renderFull(p){
    const reading = generateReading(p);
    const readingHtml = reading.length > 0
      ? reading.map(l => `<p>${escapeHtml(l)}</p>`).join('')
      : '<p>The shape is forming. The companion will sharpen it.</p>';

    shell.innerHTML = `
      <div class="topbar">
        <div class="wordmark">My FRQNCY</div>
        <nav class="topbar-nav">
          <a href="/my-frqncy/intake/">Update intake</a>
          <a href="/my-frqncy/dashboard/">Sanctuary</a>
        </nav>
      </div>

      <section class="hero">
        <div class="label">Your constellation</div>
        <h1>${p.rememberOne ? escapeHtml(truncate(p.rememberOne, 60)) : 'The shape you brought in.'}</h1>
        <p class="lede">Drawn from what you said. The companion writes against it. The network recognises it. The map routes to it.</p>
      </section>

      <div class="constellation">
        ${constellationSVG(p)}
      </div>

      <section class="reading">
        <div class="label">What VBRTN sees</div>
        ${readingHtml}
      </section>

      <div class="foundation">
        <div class="label">The founding block</div>
        <p>This profile is the foundation. Every part of FRQNCY — companion, network, map — writes to it and reads from it. Re-take any session anytime; the trail follows.</p>
      </div>

      ${trinityHTML()}

      <div class="actions">
        <a class="btn primary" href="/my-frqncy/vbrtn/">Meet today's companion →</a>
        <a class="btn ghost" href="/my-frqncy/intake/">Update something</a>
      </div>
    `;
  }

  const profile = loadProfile();
  const hasData = profile && profile._intakeAnswers && Object.keys(profile._intakeAnswers).length > 0;
  if(hasData) renderFull(profile); else renderEmpty();
})();
</script>
</body>
</html>
