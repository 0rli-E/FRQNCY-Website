<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1C3D" />
    <title>FRQNCY · Wake</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0B1C3D;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #field {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 45%, rgba(196, 151, 58, 0.18) 0%, rgba(11, 28, 61, 0.98) 60%);
        opacity: 0;
        transition: opacity 90s linear;  /* 90s fade-in per spec */
        pointer-events: none;
      }
      #field.active { opacity: 1; }
      #ring {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        border: 1px solid rgba(245, 245, 245, 0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 2;
      }
      #ring::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        border: 1px solid rgba(196, 151, 58, 0.0);
        transition: border-color 400ms ease, transform 400ms ease;
        transform: scale(1);
      }
      #ring.holding::before {
        border-color: rgba(196, 151, 58, 0.9);
        animation: breath-pace 6s ease-in-out 1 forwards;
      }
      @keyframes breath-pace {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.12); }
        100% { transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ring.holding::before {
          animation: none;
          transform: scale(1.08);
        }
      }
      #progress {
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        pointer-events: none;
      }
      #progress circle {
        fill: none;
        stroke: rgba(196, 151, 58, 0.85);
        stroke-width: 1.5;
        transform: rotate(-90deg);
        transform-origin: center;
        stroke-dasharray: 832;
        stroke-dashoffset: 832;
        transition: stroke-dashoffset 6000ms linear;
      }
      #ring.holding #progress circle { stroke-dashoffset: 0; }
      #ring:focus-visible {
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: 8px;
      }
      .inner {
        text-align: center;
        font-weight: 200;
        letter-spacing: 2.4px;
        font-size: 13px;
        color: rgba(245, 245, 245, 0.64);
        line-height: 1.8;
      }
      .hint {
        position: fixed;
        bottom: calc(80px + env(safe-area-inset-bottom));
        left: 0; right: 0;
        text-align: center;
        font-size: 13px;
        font-weight: 200;
        letter-spacing: 1.2px;
        color: rgba(245, 245, 245, 0.35);
        opacity: 0;
        transition: opacity 1800ms ease 2000ms;  /* hint appears after 2s */
      }
      .hint.visible { opacity: 1; }
      .prompt-screen {
        position: fixed; inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B1C3D;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1200ms ease;
        padding: 32px 24px calc(48px + env(safe-area-inset-bottom));
      }
      .prompt-screen.visible { opacity: 1; pointer-events: auto; }
      .prompt-inner {
        width: 100%;
        max-width: 480px;
        text-align: center;
      }
      .prompt {
        font-size: 24px;
        font-weight: 200;
        letter-spacing: 0.4px;
        line-height: 1.5;
        color: rgba(245, 245, 245, 0.92);
        margin-bottom: 28px;
      }
      .reflection-field {
        width: 100%;
        min-height: 168px;
        background: rgba(255, 255, 255, 0.04);
        /* Faint pre-focus gold tint to read as "input, not card" (review #14). */
        border: 1px solid rgba(196, 151, 58, 0.16);
        border-radius: 14px;
        color: rgba(245, 245, 245, 0.92);
        font-family: inherit;
        font-size: 16px;
        font-weight: 300;
        letter-spacing: 0.1px;
        line-height: 1.6;
        padding: 18px;
        resize: none;
        outline: none;
        transition: border-color 200ms ease, background 200ms ease, box-shadow 200ms ease;
        text-align: left;
      }
      .reflection-field:focus,
      .reflection-field:focus-visible {
        border-color: rgba(196, 151, 58, 0.55);
        background: rgba(255, 255, 255, 0.06);
        /* Soft halo so keyboard users + low-contrast environments see focus
           unambiguously (review #15, WCAG 2.4.7). */
        box-shadow: 0 0 0 2px rgba(196, 151, 58, 0.18);
      }
      .reflection-field::placeholder {
        /* Drop italic (review #22 visual-brand); lift contrast (review #14). */
        color: rgba(245, 245, 245, 0.5);
        font-style: normal;
      }
      .reflection-field:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .reflection-note {
        margin-top: 10px;
        /* Raised from 11.5 / 0.4 to clear WCAG 1.4.3 (review a11y #4). */
        font-size: 12px;
        letter-spacing: 0.4px;
        color: rgba(245, 245, 245, 0.62);
      }
      .reflection-note.soft {
        margin-top: 4px;
        color: rgba(245, 245, 245, 0.42);
        font-style: normal;
      }
      .next {
        margin-top: 32px;
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .next button {
        background: none;
        border: 1px solid rgba(245, 245, 245, 0.18);
        color: rgba(245, 245, 245, 0.78);
        padding: 11px 20px;
        border-radius: 999px;
        font-size: 13px;
        letter-spacing: 0.6px;
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: color 180ms ease, border-color 180ms ease;
      }
      .next button:hover {
        color: rgba(196, 151, 58, 0.95);
        border-color: rgba(196, 151, 58, 0.5);
      }
      .next button:active {
        transform: scale(0.985);
        opacity: 0.85;
      }
      .next button:focus-visible {
        color: rgba(196, 151, 58, 0.95);
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: 2px;
      }
      .next button[aria-busy="true"] {
        opacity: 0.55;
        pointer-events: none;
      }
      .next button[disabled] {
        opacity: 0.35;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="field"></div>
      <div id="ring" aria-label="Hold to arrive">
        <svg id="progress" viewBox="0 0 268 268">
          <circle cx="134" cy="134" r="132"></circle>
        </svg>
        <div class="inner">
          arrive
        </div>
      </div>
      <div class="hint" id="hint">hold for one breath</div>
    </div>

    <div class="prompt-screen" id="prompt-screen" role="region" aria-label="Morning reflection" aria-hidden="true">
      <div class="prompt-inner">
        <h1 class="prompt" id="prompt-text">what wants your attention today?</h1>
        <textarea
          class="reflection-field"
          id="reflection-field"
          placeholder="anything, or nothing"
          aria-labelledby="prompt-text"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="sentences"
          spellcheck="false"
          enterkeyhint="done"
          rows="5"
          disabled
          aria-disabled="true"
        ></textarea>
        <div class="reflection-note">private. saved on this phone only. never shown back to you.</div>
        <div class="reflection-note soft">yours to keep, or let go.</div>
        <div class="next">
          <button id="movement" type="button">move with me · 3 min</button>
          <button id="close" type="button">carry on</button>
        </div>
      </div>
    </div>

    <script type="module">
      // wake.html — runs after the alarm has been dismissed (or as a standalone
      // morning practice from the launcher). The breath-hold here is the
      // "arrival" gesture; on completion we surface a reflection prompt and
      // optionally start a 3-minute movement session pulled from the
      // morning-tagged resources in resources.json.

      const field = document.getElementById('field');
      const ring = document.getElementById('ring');
      const hint = document.getElementById('hint');
      const promptScreen = document.getElementById('prompt-screen');
      const promptText = document.getElementById('prompt-text');
      const movementBtn = document.getElementById('movement');
      const closeBtn = document.getElementById('close');

      const REFLECTIONS = [
        'what wants your attention today?',
        'who might you become today?',
        'what quality are you bringing in?',
        'what are you grateful to meet again?',
        'where is your softness?',
      ];

      // Pick a reflection prompt, excluding the one shown last time so the
      // same prompt doesn't appear two mornings in a row. Stored locally; if
      // storage is unavailable we just fall back to a uniform random pick.
      const LAST_PROMPT_KEY = 'frqncy.wake.last_prompt_idx';
      function pickReflectionIndex() {
        let last = -1;
        try {
          const raw = localStorage.getItem(LAST_PROMPT_KEY);
          if (raw !== null) {
            const n = parseInt(raw, 10);
            if (Number.isFinite(n) && n >= 0 && n < REFLECTIONS.length) last = n;
          }
        } catch {}
        const pool = REFLECTIONS.length;
        if (pool <= 1) return 0;
        let idx = Math.floor(Math.random() * (pool - (last >= 0 ? 1 : 0)));
        if (last >= 0 && idx >= last) idx += 1;
        try { localStorage.setItem(LAST_PROMPT_KEY, String(idx)); } catch {}
        return idx;
      }
      // Pick on page load so the prompt is stable for this morning's session
      // (no surprise change between arrive-time and the user reading it). The
      // prompt-screen is invisible until arrive() so the user only sees it
      // once they've crossed the breath-hold.
      const chosenPromptIdx = pickReflectionIndex();
      const chosenPrompt = REFLECTIONS[chosenPromptIdx];

      // Accessibility: three dismiss modes per Stream 6.
      const DISMISS_MODE_KEY = 'frqncy.accessibility.dismiss_mode';
      const dismissMode = (() => {
        try { return localStorage.getItem(DISMISS_MODE_KEY) || 'breath'; }
        catch { return 'breath'; }
      })();
      const reducedMotion = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      ring.setAttribute('role', 'button');
      ring.setAttribute('tabindex', '0');
      const hintText = (() => {
        switch (dismissMode) {
          case 'long-press': return 'press and hold for 6 seconds';
          case 'triple-tap': return 'tap three times';
          default: return 'hold for one breath';
        }
      })();
      ring.setAttribute('aria-label', hintText);
      hint.textContent = hintText;

      // Video field toggle (bedside setting). Default ON; OFF means pure black
      // background with the dismiss ring only — for users who want minimal
      // visual stimulation on wake.
      const fieldEnabled = (() => {
        try { return localStorage.getItem('frqncy.bedside.video_field') !== '0'; }
        catch { return true; }
      })();
      if (!fieldEnabled) field.style.display = 'none';

      if (reducedMotion) field.style.transition = 'none';
      if (fieldEnabled) requestAnimationFrame(() => field.classList.add('active'));
      setTimeout(() => hint.classList.add('visible'), reducedMotion ? 200 : 2000);

      // Breath-hold / long-press dismiss
      let holdStart = null;
      let holdTimer = null;
      let activePointerId = null;
      function onStart(e) {
        // Honor only the first active pointer — a second finger landing
        // mid-hold otherwise orphans the first setTimeout (review #16).
        if (activePointerId !== null) return;
        e.preventDefault();
        activePointerId = e.pointerId != null ? e.pointerId : 'mouse';
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        holdStart = Date.now();
        ring.classList.add('holding');
        if (navigator.vibrate) navigator.vibrate(8);
        holdTimer = setTimeout(arrive, 6000);
      }
      function onEnd(e) {
        // Only the originally-tracked pointer releases the hold.
        if (e && e.pointerId != null && activePointerId !== null
            && activePointerId !== 'mouse' && e.pointerId !== activePointerId) return;
        if (!holdStart) { activePointerId = null; return; }
        ring.classList.remove('holding');
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        holdStart = null;
        activePointerId = null;
      }

      // Triple-tap dismiss
      let tapTimes = [];
      function onTap() {
        const now = Date.now();
        tapTimes = tapTimes.filter(t => now - t < 2000);
        tapTimes.push(now);
        if (tapTimes.length >= 3) {
          tapTimes = [];
          arrive();
        } else {
          ring.classList.add('holding');
          setTimeout(() => ring.classList.remove('holding'), 150);
          if (navigator.vibrate) navigator.vibrate(6);
        }
      }

      if (dismissMode === 'triple-tap') {
        ring.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
      } else {
        ring.addEventListener('pointerdown', onStart);
        ring.addEventListener('pointerup', onEnd);
        ring.addEventListener('pointercancel', onEnd);
        ring.addEventListener('pointerleave', onEnd);
      }
      ring.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          dismissMode === 'triple-tap' ? onTap() : arrive();
        }
      });

      const reflectionField = document.getElementById('reflection-field');
      const REFLECTION_LOG_KEY = 'frqncy.wake.reflections';

      function loadReflectionLog() {
        try { return JSON.parse(localStorage.getItem(REFLECTION_LOG_KEY) || '[]'); }
        catch { return []; }
      }
      function todayLocal() {
        // Use the user's LOCAL calendar day — toISOString() snaps to UTC and
        // overwrites the wrong day for users east of UTC reflecting late at
        // night (review edge-case #13).
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      function persistReflection(text) {
        const trimmed = (text || '').trim();
        if (!trimmed) return;
        const log = loadReflectionLog();
        const today = todayLocal();
        // One entry per day — overwrite if the user edits during the same morning.
        const idx = log.findIndex(e => e.date === today);
        const entry = { date: today, ts: Date.now(), text: trimmed };
        if (idx >= 0) log[idx] = entry; else log.push(entry);
        // Cap at 90 days so localStorage stays small.
        const trimmed90 = log.slice(-90);
        try { localStorage.setItem(REFLECTION_LOG_KEY, JSON.stringify(trimmed90)); } catch {}
      }

      // Debounced save while the user types.
      let saveTimer = null;
      reflectionField.addEventListener('input', () => {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(() => persistReflection(reflectionField.value), 800);
      });

      let arrived = false;
      function arrive() {
        if (arrived) return;
        arrived = true;
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        holdStart = null;
        activePointerId = null;
        ring.classList.remove('holding');
        if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
        // Prompt was picked at page-load (chosenPrompt) so the random choice
        // can't change underneath the user between gesture and reveal.
        promptText.textContent = chosenPrompt;
        promptScreen.classList.add('visible');
        promptScreen.setAttribute('aria-hidden', 'false');
        // Enable the textarea now that the user has crossed the breath-hold.
        // Until this point it's `disabled` so a stray touch during the hold
        // (e.g. resting fingers on the device while the prompt screen is
        // still invisible behind pointer-events:none) can't steal focus or
        // raise the keyboard mid-arrival.
        reflectionField.removeAttribute('disabled');
        reflectionField.removeAttribute('aria-disabled');
        // Don't autofocus — that yanks attention to a textarea before the user
        // has read the prompt. They'll tap when ready.
      }

      // --- Movement session ----------------------------------------------------
      // When user taps "move with me", we look for a morning-tagged resource in
      // the cached resources.json and either play its audio (if mediagrid is
      // installed) or open it in the in-app browser as a fallback.

      function getPlugin(name) {
        try { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name]; } catch { return null; }
      }
      const Filesystem = getPlugin('Filesystem');
      const NativeAudio = getPlugin('NativeAudio') || getPlugin('CapacitorMediaSession');
      const Browser = getPlugin('Browser');

      async function readResources() {
        // Try the offline cache written by SyncManager first.
        if (Filesystem) {
          try {
            const res = await Filesystem.readFile({
              path: 'content/resources.json',
              directory: 'DATA',
              encoding: 'utf8'
            });
            return JSON.parse(typeof res.data === 'string' ? res.data : await res.data.text());
          } catch {}
        }
        // Live fallback (web/dev).
        try {
          const r = await fetch('https://frqncy.network/resources.json');
          if (r.ok) return await r.json();
        } catch {}
        return null;
      }

      function pickMorning(resources) {
        const candidates = resources.filter(r =>
          Array.isArray(r.moment) && r.moment.includes('morning') &&
          (r.url || '').match(/\.(mp3|m4a|wav)(\?|$)/i)
        );
        if (candidates.length > 0) {
          return candidates[Math.floor(Math.random() * candidates.length)];
        }
        // No audio-typed resources — fall back to any morning entry with a URL.
        const fallback = resources.filter(r =>
          Array.isArray(r.moment) && r.moment.includes('morning') && r.url
        );
        return fallback.length > 0 ? fallback[Math.floor(Math.random() * fallback.length)] : null;
      }

      let activeMovementAssetId = null;

      async function stopMovement() {
        if (NativeAudio && activeMovementAssetId) {
          try { await NativeAudio.stop({ assetId: activeMovementAssetId }); } catch {}
          try { await NativeAudio.unload({ assetId: activeMovementAssetId }); } catch {}
        }
        activeMovementAssetId = null;
      }

      const movementDefaultLabel = movementBtn.textContent;
      function setMovementState(state, label) {
        // states: 'idle' | 'loading' | 'playing' | 'error'
        movementBtn.dataset.state = state;
        if (label !== undefined) movementBtn.textContent = label;
        if (state === 'loading') {
          movementBtn.setAttribute('aria-busy', 'true');
          movementBtn.disabled = true;
        } else {
          movementBtn.removeAttribute('aria-busy');
          movementBtn.disabled = false;
        }
      }

      async function playMovement() {
        setMovementState('loading', 'loading…');
        let resources = null;
        try { resources = await readResources(); } catch {}
        if (!resources) {
          setMovementState('error', 'no practice available · carry on');
          // Brief pause so the user reads the failure, then surface a retry
          // affordance by restoring the idle label.
          setTimeout(() => setMovementState('idle', movementDefaultLabel), 2400);
          return;
        }
        const pick = pickMorning(resources);
        if (!pick) {
          setMovementState('error', 'no practice available · carry on');
          setTimeout(() => setMovementState('idle', movementDefaultLabel), 2400);
          return;
        }

        const isDirectAudio = pick.url && /\.(mp3|m4a|wav)(\?|$)/i.test(pick.url);
        if (NativeAudio && isDirectAudio) {
          try {
            activeMovementAssetId = `frqncy.morning.${pick.id || Date.now()}`;
            await NativeAudio.preload({ assetId: activeMovementAssetId, assetPath: pick.url, audioChannelNum: 1, isUrl: true });
            await NativeAudio.play({ assetId: activeMovementAssetId });
            setMovementState('playing', `playing · ${pick.name || 'morning practice'}`);
            return;
          } catch (err) {
            console.warn('NativeAudio play failed, falling back to browser', err);
            activeMovementAssetId = null;
          }
        }

        if (Browser) {
          try {
            await Browser.open({ url: pick.url, presentationStyle: 'popover' });
            setMovementState('idle', movementDefaultLabel);
            return;
          } catch {}
        }
        try { window.open(pick.url, '_blank'); } catch {}
        setMovementState('idle', movementDefaultLabel);
      }

      movementBtn.addEventListener('click', () => {
        if (movementBtn.disabled) return;
        persistReflection(reflectionField.value);
        playMovement();
      });

      // "carry on" — route back via the standard in-app navigation. wake.html
      // is its own top-level Capacitor page (not iframed; the home iframe lives
      // in index.html and we are not inside it here), so location.href is the
      // correct navigation path back to the launcher. We guard against double-
      // taps so the cleanup-then-navigate sequence runs exactly once.
      let closing = false;
      closeBtn.addEventListener('click', async () => {
        if (closing) return;
        closing = true;
        closeBtn.disabled = true;
        persistReflection(reflectionField.value);
        try { await stopMovement(); } catch {}
        window.location.href = '../index.html';
      });
      // Page-hide also kills audio — covers system back gesture, app backgrounding,
      // and tab switches in dev preview.
      window.addEventListener('pagehide', () => { stopMovement(); });
    </script>
  </body>
</html>
