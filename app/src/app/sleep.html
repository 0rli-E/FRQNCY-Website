<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1C3D" />
    <title>FRQNCY · Sleep</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0B1C3D;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .chooser {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        transition: opacity 1200ms ease, transform 1200ms ease;
      }
      .chooser.hidden { opacity: 0; pointer-events: none; transform: scale(0.98); }

      .chooser-title {
        font-size: 15px;
        font-weight: 200;
        letter-spacing: 1.8px;
        color: rgba(245, 245, 245, 0.4);
        text-transform: lowercase;
        margin-bottom: 8px;
      }

      .option {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        background: rgba(245, 245, 245, 0.04);
        border: 1px solid rgba(245, 245, 245, 0.08);
        border-radius: 20px;
        text-align: center;
        cursor: pointer;
        transition: background 220ms ease, transform 220ms ease, border-color 220ms ease;
        -webkit-tap-highlight-color: transparent;
        color: inherit;
        font-family: inherit;
        display: block;
      }
      .option:active { background: rgba(245, 245, 245, 0.08); transform: scale(0.98); }
      .option:focus-visible {
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: 3px;
      }
      .option-name {
        font-size: 20px;
        font-weight: 200;
        letter-spacing: 1.4px;
        margin-bottom: 6px;
      }
      .option-desc {
        font-size: 12.5px;
        font-weight: 300;
        letter-spacing: 0.4px;
        color: rgba(245, 245, 245, 0.5);
        line-height: 1.55;
      }

      /* Session screen — dims over 4 min, color warms */
      .session {
        position: fixed;
        inset: 0;
        background: #0B1C3D;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1200ms ease 600ms, background 240s linear;
      }
      .session.visible { opacity: 1; pointer-events: auto; }
      .session.dimming {
        background: #060f24;  /* warm near-black, reached by minute 4 */
      }
      .session-content {
        text-align: center;
        padding: 24px;
        max-width: 400px;
      }
      .session-moment {
        font-size: 13px;
        letter-spacing: 2.2px;
        color: rgba(245, 245, 245, 0.38);
        text-transform: lowercase;
        margin-bottom: 18px;
      }
      .session-prompt {
        font-size: 24px;
        font-weight: 200;
        letter-spacing: 0.5px;
        line-height: 1.55;
        color: rgba(245, 245, 245, 0.88);
        min-height: 120px;
      }
      .session-timer {
        margin-top: 28px;
        font-size: 11px;
        letter-spacing: 1.6px;
        color: rgba(245, 245, 245, 0.26);
      }
      /* Wind-down gate */
      .settle {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060f24;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1000ms ease;
      }
      .settle.visible { opacity: 1; pointer-events: auto; }
      .settle-content {
        max-width: 360px;
        padding: 24px;
        text-align: center;
      }
      .settle-eyebrow {
        font-size: 11px;
        letter-spacing: 2.4px;
        text-transform: lowercase;
        color: rgba(196, 151, 58, 0.7);
        margin-bottom: 18px;
      }
      .settle-title {
        font-size: 32px;
        font-weight: 100;
        letter-spacing: 0.4px;
        margin-bottom: 14px;
        color: rgba(245, 245, 245, 0.92);
      }
      .settle-lede {
        font-size: 14px;
        font-weight: 300;
        line-height: 1.6;
        color: rgba(245, 245, 245, 0.6);
        margin-bottom: 36px;
      }
      .settle-cta {
        padding: 14px 36px;
        background: none;
        border: 1px solid rgba(196, 151, 58, 0.5);
        color: rgba(196, 151, 58, 0.9);
        border-radius: 999px;
        font-size: 13px;
        letter-spacing: 1.6px;
        text-transform: lowercase;
        font-family: inherit;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: background 280ms ease, color 280ms ease;
      }
      .settle-cta:hover, .settle-cta:active {
        background: rgba(196, 151, 58, 0.95);
        color: #0B1C3D;
      }
      .settle-close {
        background: none;
      }

      .close-dot {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        right: 16px;
        width: 44px; height: 44px;
        border-radius: 50%;
        background: none;
        border: 1px solid rgba(245, 245, 245, 0.12);
        color: rgba(245, 245, 245, 0.48);
        font-size: 16px;
        font-family: inherit;
        text-align: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .close-dot:focus-visible, .settle-cta:focus-visible {
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: 2px;
      }
      .pause-pill {
        position: fixed;
        bottom: calc(80px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%) scale(0.96);
        font-size: 13px;
        letter-spacing: 1.4px;
        color: rgba(245, 245, 245, 0.62);
        text-transform: lowercase;
        pointer-events: none;
        opacity: 0;
        transition: opacity 200ms ease, transform 200ms ease;
      }
      .pause-pill.visible {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
      .session-content {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 220ms ease;
      }
      .session-content:active { opacity: 0.6; transition: none; }
      /* Quiet farewell sentence before navigation home. */
      .session-farewell {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #060f24;
        color: rgba(245, 245, 245, 0.78);
        font-size: 22px;
        font-weight: 200;
        letter-spacing: 0.4px;
        text-align: center;
        padding: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 800ms ease;
        z-index: 10;
      }
      .session-farewell.visible { opacity: 1; pointer-events: auto; }
    </style>
  </head>
  <body>
    <div class="chooser" id="chooser" aria-hidden="false">
      <div class="chooser-title">tonight</div>

      <button type="button" class="option" data-moment="stillness" data-duration="20">
        <div class="option-name">stillness</div>
        <div class="option-desc">sit with what's here. silence with occasional breath.</div>
      </button>

      <button type="button" class="option" data-moment="release" data-duration="12">
        <div class="option-name">release</div>
        <div class="option-desc">let the day go. three prompts, long silences in between.</div>
      </button>

      <button type="button" class="option" data-moment="drift" data-duration="45">
        <div class="option-name">drift</div>
        <div class="option-desc">fall asleep without trying. ambience that fades over 45 min.</div>
      </button>
    </div>

    <!-- Wind-down gate: shown between picking a session and its actual start.
         Borrowed from Headspace sleepcasts — a moment to land before content. -->
    <div class="settle" id="settle" aria-hidden="true">
      <button class="close-dot settle-close" id="settle-close" aria-label="Back">×</button>
      <div class="settle-content">
        <div class="settle-eyebrow" id="settle-eyebrow"></div>
        <h2 class="settle-title">settle in.</h2>
        <p class="settle-lede">no rush. when you're ready, tap.</p>
        <button class="settle-cta" id="settle-cta">begin</button>
      </div>
    </div>

    <div class="session" id="session" aria-hidden="true">
      <button class="close-dot" id="close-dot" aria-label="End session">×</button>
      <div class="session-content" id="session-content" role="button" tabindex="0" aria-label="Tap to pause">
        <div class="session-moment" id="session-moment"></div>
        <div class="session-prompt" id="session-prompt" aria-live="polite" aria-atomic="true"></div>
        <div class="session-timer" id="session-timer" aria-hidden="true"></div>
      </div>
      <div class="pause-pill" id="pause-pill" role="status" aria-live="polite">paused &middot; tap to resume</div>
      <div class="session-farewell" id="session-farewell" role="status" aria-live="polite" aria-hidden="true">thanks for sitting.</div>
    </div>

    <script type="module">
      const chooser = document.getElementById('chooser');
      const session = document.getElementById('session');
      const closeDot = document.getElementById('close-dot');
      const sessionMoment = document.getElementById('session-moment');
      const sessionPrompt = document.getElementById('session-prompt');
      const sessionTimer = document.getElementById('session-timer');

      const RELEASE_PROMPTS = [
        { at:  0,  text: 'what are you carrying?' },
        { at: 180, text: 'where did you meet yourself today?' },
        { at: 420, text: 'what can rest now?' },
      ];
      const STILLNESS_PROMPTS = [
        { at: 0,  text: 'arrive where you are.' },
        { at: 60, text: '' },
      ];
      const DRIFT_PROMPTS = [{ at: 0, text: '' }];

      // Capacitor plugin lookup (may be missing in dev).
      function getPlugin(name) {
        try { return window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name]; } catch { return null; }
      }
      const Filesystem = getPlugin('Filesystem');
      const NativeAudio = getPlugin('NativeAudio') || getPlugin('CapacitorMediaSession');
      const FrqncyAlarm = getPlugin('FrqncyAlarm');

      let sessionStart = 0;
      let pausedAt = 0;          // ms timestamp when paused; 0 = playing
      let pausedAccum = 0;       // total ms spent paused (excluded from elapsed)
      let tickTimer = null;
      let volumeTimer = null;
      let activeAssetId = null;
      let htmlAudio = null;  // <audio> element fallback

      // Effective elapsed = wall-clock since start minus accumulated pauses.
      // While paused, "now" is frozen at pausedAt so volume/timer hold still.
      function elapsedMs() {
        const now = pausedAt > 0 ? pausedAt : Date.now();
        return now - sessionStart - pausedAccum;
      }

      // --- Resource selection --------------------------------------------------
      async function readResources() {
        if (Filesystem) {
          try {
            const res = await Filesystem.readFile({
              path: 'content/resources.json',
              directory: 'DATA',
              encoding: 'utf8'
            });
            return JSON.parse(typeof res.data === 'string' ? res.data : await res.data.text());
          } catch {}
        }
        try {
          const r = await fetch('https://frqncy.network/resources.json');
          if (r.ok) return await r.json();
        } catch {}
        return null;
      }

      // Last-picked memory: avoid repeating the same audio file two
      // sessions in a row for the same moment. With a small pool (e.g.,
      // only 2-3 release tracks) pure random often repeats — the user
      // hears "the same one again" and the variety promise breaks. We
      // store one slug per moment in localStorage and exclude it from
      // the candidate pool when picking. If a moment has only one file,
      // we fall through and play it anyway (something > nothing).
      const LAST_PICKED_KEY = 'frqncy.sleep.lastPicked';  // { [moment]: url }
      function readLastPicked() {
        try { return JSON.parse(localStorage.getItem(LAST_PICKED_KEY) || '{}'); }
        catch { return {}; }
      }
      function writeLastPicked(moment, url) {
        try {
          const all = readLastPicked();
          all[moment] = url;
          localStorage.setItem(LAST_PICKED_KEY, JSON.stringify(all));
        } catch {}
      }
      function pickResource(resources, moment) {
        const candidates = (resources || []).filter(r =>
          Array.isArray(r.moment) && r.moment.includes(moment) &&
          r.url && /\.(mp3|m4a|wav)(\?|$)/i.test(r.url)
        );
        if (candidates.length === 0) return null;
        const lastUrl = readLastPicked()[moment];
        const fresh = candidates.length > 1
          ? candidates.filter(r => r.url !== lastUrl)
          : candidates;
        const pool = fresh.length > 0 ? fresh : candidates;
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        if (chosen && chosen.url) writeLastPicked(moment, chosen.url);
        return chosen;
      }

      // Bundled fallback — when resources.json has no moment-tagged audio,
      // play the bundled tones from the web public dir. Vite copies
      // `app/public/audio/*.mp3` into `dist/audio/` and `cap sync` puts them
      // at `android/app/src/main/assets/public/audio/`, served at
      // `https://localhost/audio/` by Capacitor's bridge.
      function bundledFallback(moment) {
        const filename = moment === 'release' ? 'default_release'
                       : moment === 'stillness' ? 'default_stillness'
                       : 'default_evening';  // "drift" → evening tone
        return {
          id: `bundled-${moment}`,
          name: `bundled · ${moment}`,
          url: `../audio/${filename}.mp3`,
          moment: [moment],
        };
      }

      // --- Audio playback with volume curve -----------------------------------
      // Curve: 100% → 40% by min 22, → silence by min 45. Implemented via a 5s
      // tick that linearly interpolates volume targets. This is the JS-fallback
      // path; once @mediagrid/capacitor-native-audio is installed, replace the
      // interpolator with NativeAudio.setVolume(value, duration) which maps to
      // AVAudioPlayer's native fade on iOS and ExoPlayer ramping on Android.
      function volumeForElapsed(elapsedSec) {
        const min = elapsedSec / 60;
        if (min <= 22) {
          // 1.0 → 0.4 over 0–22 min
          return 1.0 - (0.6 * (min / 22));
        } else if (min <= 45) {
          // 0.4 → 0.0 over 22–45 min
          return 0.4 * (1 - ((min - 22) / 23));
        }
        return 0;
      }

      async function startPlayback(resource) {
        if (!resource || !resource.url) return false;

        // Path 1: native audio plugin (best — lock-screen controls + background-safe).
        if (NativeAudio) {
          try {
            activeAssetId = `frqncy.sleep.${resource.id || Date.now()}`;
            await NativeAudio.preload({
              assetId: activeAssetId,
              assetPath: resource.url,
              audioChannelNum: 1,
              isUrl: true,
              volume: 1.0
            });
            await NativeAudio.play({ assetId: activeAssetId });
            volumeTimer = setInterval(async () => {
              if (pausedAt > 0) return;
              const elapsed = Math.floor(elapsedMs() / 1000);
              const v = volumeForElapsed(elapsed);
              try { await NativeAudio.setVolume({ assetId: activeAssetId, volume: v }); } catch {}
            }, 5000);
            return true;
          } catch (err) {
            console.warn('NativeAudio failed, falling back to <audio>', err);
          }
        }

        // Path 2: HTML5 <audio> element (works without any plugin).
        // Tradeoff: foreground-only on iOS, but acceptable for a sleep flow
        // where the screen stays on. Loops by default.
        try {
          htmlAudio = new Audio(resource.url);
          htmlAudio.loop = true;
          htmlAudio.volume = 1.0;
          await htmlAudio.play();
          volumeTimer = setInterval(() => {
            if (pausedAt > 0) return;
            const elapsed = Math.floor(elapsedMs() / 1000);
            if (htmlAudio) htmlAudio.volume = volumeForElapsed(elapsed);
          }, 5000);
          return true;
        } catch (err) {
          console.warn('HTML audio failed too', err);
          return false;
        }
      }

      async function stopPlayback() {
        if (volumeTimer) { clearInterval(volumeTimer); volumeTimer = null; }
        if (NativeAudio && activeAssetId) {
          try { await NativeAudio.stop({ assetId: activeAssetId }); } catch {}
          try { await NativeAudio.unload({ assetId: activeAssetId }); } catch {}
        }
        activeAssetId = null;
        if (htmlAudio) {
          try { htmlAudio.pause(); htmlAudio.src = ''; } catch {}
          htmlAudio = null;
        }
      }

      // --- Wake-alarm linkage --------------------------------------------------
      // If user has armed a morning alarm, sleep mode should also call
      // armKeepAlive() on iOS so the alarm has a fighting chance of firing.
      // No-op on Android (foreground service handles keep-alive internally
      // when the alarm fires).
      async function armWakeKeepAlive() {
        if (!FrqncyAlarm) return;
        try { await FrqncyAlarm.armKeepAlive(); } catch {}
      }
      async function disarmWakeKeepAlive() {
        if (!FrqncyAlarm) return;
        try { await FrqncyAlarm.disarmKeepAlive(); } catch {}
      }

      // --- Session lifecycle ---------------------------------------------------
      async function startSession(moment, durationMin) {
        chooser.classList.add('hidden');
        chooser.setAttribute('aria-hidden', 'true');
        session.classList.add('visible');
        // aria-hidden lifecycle: session was hidden at load; flip on
        // when visible so the aria-live prompt rotations are actually
        // announced by VoiceOver/TalkBack. Without this, the live
        // region sits inside an aria-hidden subtree and is silent.
        session.setAttribute('aria-hidden', 'false');
        setTimeout(() => session.classList.add('dimming'), 100);

        sessionMoment.textContent = moment;
        sessionStart = Date.now();

        const prompts = moment === 'release' ? RELEASE_PROMPTS
                      : moment === 'stillness' ? STILLNESS_PROMPTS
                      : DRIFT_PROMPTS;
        // 'drift' (45-min ambience) maps to the 'evening' tag in
        // resources.json — set this once here so the rest of the
        // session logic stays consistent.
        const audioMoment = moment === 'drift' ? 'evening' : moment;
        prompts.forEach(p => setTimeout(() => fade(sessionPrompt, p.text), p.at * 1000));

        // Pick a resource matching the moment, fall back to bundled tone.
        const resources = await readResources();
        const picked = pickResource(resources, audioMoment) || bundledFallback(audioMoment);
        const playing = await startPlayback(picked);
        if (!playing) {
          // Even bundled audio failed (rare — disk corruption, blocked autoplay).
          // Silent session — still useful as a timer-based meditation surface.
          fade(sessionPrompt, sessionPrompt.textContent || 'rest in the quiet.');
        }

        // Arm iOS keep-alive so a morning alarm can ring through the night.
        armWakeKeepAlive();

        // Timer tick stays at 10s with minute-granular display the whole
        // way down. Considered: 1s tick for the final minute to give a
        // visible countdown. Rejected: digit-flipping is "watching the
        // clock" energy — the opposite of drift. Headspace sleepcasts,
        // Calm sessions, and Endel all hide or de-emphasize time as
        // the session approaches end. We keep low-stim. The timer is
        // also `aria-hidden="true"` on the element so screen readers
        // don't announce remaining-time changes.
        tickTimer = setInterval(() => {
          if (pausedAt > 0) return;
          const elapsed = Math.floor(elapsedMs() / 1000);
          const remainingMin = Math.max(0, durationMin - Math.floor(elapsed / 60));
          sessionTimer.textContent = remainingMin > 0
            ? `${remainingMin} min · fade to silence`
            : 'resting';
          if (remainingMin === 0 && elapsed > durationMin * 60 + 30) endSession();
        }, 10000);

        wirePauseToggle();
      }

      // Fade the prompt and swap text. Because `#session-prompt` is
      // `aria-live="polite" aria-atomic="true"`, mutating textContent
      // queues a single announcement of the new prompt — the screen-
      // reader user hears the rotation even though they don't see the
      // fade. The 1400ms hidden window between fade-out and text swap
      // is fine for AT: VoiceOver/TalkBack debounce live-region
      // updates anyway, and the new text becomes visible and read
      // together.
      function fade(el, text) {
        el.style.transition = 'opacity 1400ms ease';
        el.style.opacity = '0';
        setTimeout(() => {
          el.textContent = text;
          el.style.opacity = '1';
        }, 1400);
      }

      async function endSession() {
        clearInterval(tickTimer);
        await stopPlayback();
        await disarmWakeKeepAlive();
        // Quiet farewell: show "thanks for sitting." for 1.5s before
        // navigating home. Tested in mind: a hard cut back to the home
        // screen ends the practice on a UI event; this one sentence
        // ends it on a felt one. Headspace and Oak both close with a
        // sentence; Calm closes with a chime. Closer to Headspace.
        const farewell = document.getElementById('session-farewell');
        if (farewell) {
          farewell.classList.add('visible');
          farewell.setAttribute('aria-hidden', 'false');
        }
        // Hide the session content beneath the farewell so the prompt
        // doesn't bleed through during the 1.5s.
        session.classList.remove('visible');
        session.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
          chooser.classList.remove('hidden');
          chooser.setAttribute('aria-hidden', 'false');
          window.location.href = '../index.html';
        }, 1500);
      }

      const sessionContent = document.getElementById('session-content');
      const pausePill = document.getElementById('pause-pill');

      function setPaused(p) {
        if (p && pausedAt === 0) {
          pausedAt = Date.now();
          // Pause audio
          if (NativeAudio && activeAssetId) {
            try { NativeAudio.pause({ assetId: activeAssetId }); } catch {}
          }
          if (htmlAudio) { try { htmlAudio.pause(); } catch {} }
          // Copy reads as state-with-action rather than a lone
          // instruction. "tap to resume" alone parsed as a command;
          // "paused · tap to resume" parses as "where you are · what
          // you can do" — closer to how iOS Now Playing reads a
          // paused track ("Paused" + scrubber).
          pausePill.innerHTML = 'paused &middot; tap to resume';
          pausePill.classList.add('visible');
          sessionContent.setAttribute('aria-label', 'Paused. Tap to resume.');
        } else if (!p && pausedAt > 0) {
          pausedAccum += Date.now() - pausedAt;
          pausedAt = 0;
          if (NativeAudio && activeAssetId) {
            try { NativeAudio.play({ assetId: activeAssetId }); } catch {}
          }
          if (htmlAudio) { try { htmlAudio.play(); } catch {} }
          pausePill.classList.remove('visible');
          sessionContent.setAttribute('aria-label', 'Tap to pause');
        }
      }
      function wirePauseToggle() {
        sessionContent.addEventListener('click', () => setPaused(pausedAt === 0));
        sessionContent.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            setPaused(pausedAt === 0);
          }
        });
      }

      const settle = document.getElementById('settle');
      const settleEyebrow = document.getElementById('settle-eyebrow');
      const settleCta = document.getElementById('settle-cta');
      const settleClose = document.getElementById('settle-close');
      let pendingSession = null;  // { moment, duration } awaiting "begin"

      function openSettle(moment, duration) {
        pendingSession = { moment, duration };
        settleEyebrow.textContent = moment === 'release' ? 'release the day'
                                  : moment === 'stillness' ? 'stillness'
                                  : 'drift';
        chooser.classList.add('hidden');
        chooser.setAttribute('aria-hidden', 'true');
        settle.classList.add('visible');
        settle.setAttribute('aria-hidden', 'false');
      }
      function closeSettle() {
        pendingSession = null;
        settle.classList.remove('visible');
        settle.setAttribute('aria-hidden', 'true');
        chooser.classList.remove('hidden');
        chooser.setAttribute('aria-hidden', 'false');
      }
      // Settle gate: simple tap, not long-press.
      // Considered: 1.5s hold-to-begin (like Endel's hold-to-enter or
      // the Oura "tap and hold to start"). Decision: stay with tap.
      // Reasons:
      //   1. The Settle gate itself IS the wind-down pause — adding a
      //      gesture-on-top-of-a-gesture asks the user to wind down
      //      while performing input, which fights the calm.
      //   2. Long-press has invisible state. A drowsy user who lifts
      //      a fraction early gets nothing and assumes the app is
      //      broken. The Headspace pattern is also tap-to-begin.
      //   3. The screen is already low-stim — there's no urgency to
      //      slow the user down further.
      // If we ever do add a hold, it should be on the chooser cards
      // (one decision boundary), not here (a second one).
      settleCta.addEventListener('click', () => {
        if (!pendingSession) return;
        const { moment, duration } = pendingSession;
        settle.classList.remove('visible');
        settle.setAttribute('aria-hidden', 'true');
        pendingSession = null;
        startSession(moment, duration);
      });
      settleClose.addEventListener('click', closeSettle);

      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const moment = btn.dataset.moment;
          const duration = parseInt(btn.dataset.duration, 10);
          openSettle(moment, duration);
        });
      });

      closeDot.addEventListener('click', endSession);
    </script>
  </body>
</html>
