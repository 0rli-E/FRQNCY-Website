<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#000000" />
    <title>FRQNCY · Sleep</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%; height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .chooser {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        transition: opacity 1200ms ease, transform 1200ms ease;
      }
      .chooser.hidden { opacity: 0; pointer-events: none; transform: scale(0.98); }

      .chooser-title {
        font-size: 15px;
        font-weight: 200;
        letter-spacing: 1.8px;
        color: rgba(245, 245, 245, 0.4);
        text-transform: lowercase;
        margin-bottom: 8px;
      }

      .option {
        width: 100%;
        max-width: 360px;
        padding: 28px 24px;
        background: rgba(245, 245, 245, 0.04);
        border: 1px solid rgba(245, 245, 245, 0.08);
        border-radius: 20px;
        text-align: center;
        cursor: pointer;
        transition: background 220ms ease, transform 220ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .option:active { background: rgba(245, 245, 245, 0.08); transform: scale(0.98); }
      .option-name {
        font-size: 20px;
        font-weight: 200;
        letter-spacing: 1.4px;
        margin-bottom: 6px;
      }
      .option-desc {
        font-size: 12.5px;
        font-weight: 300;
        letter-spacing: 0.4px;
        color: rgba(245, 245, 245, 0.5);
        line-height: 1.55;
      }

      /* Session screen — dims over 4 min, color warms */
      .session {
        position: fixed;
        inset: 0;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1200ms ease 600ms, background 240s linear;
      }
      .session.visible { opacity: 1; pointer-events: auto; }
      .session.dimming {
        background: #050302;  /* warm near-black, reached by minute 4 */
      }
      .session-content {
        text-align: center;
        padding: 24px;
        max-width: 400px;
      }
      .session-moment {
        font-size: 13px;
        letter-spacing: 2.2px;
        color: rgba(245, 245, 245, 0.38);
        text-transform: lowercase;
        margin-bottom: 18px;
      }
      .session-prompt {
        font-size: 24px;
        font-weight: 200;
        letter-spacing: 0.5px;
        line-height: 1.55;
        color: rgba(245, 245, 245, 0.88);
        min-height: 120px;
      }
      .session-timer {
        margin-top: 28px;
        font-size: 11px;
        letter-spacing: 1.6px;
        color: rgba(245, 245, 245, 0.26);
      }
      .close-dot {
        position: fixed;
        top: calc(16px + env(safe-area-inset-top));
        right: 16px;
        width: 32px; height: 32px;
        border-radius: 50%;
        background: none;
        border: 1px solid rgba(245, 245, 245, 0.12);
        color: rgba(245, 245, 245, 0.48);
        font-size: 16px;
        line-height: 30px;
        text-align: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div class="chooser" id="chooser">
      <div class="chooser-title">tonight</div>

      <div class="option" data-moment="stillness" data-duration="20">
        <div class="option-name">stillness</div>
        <div class="option-desc">silence with occasional breath. nothing to follow.</div>
      </div>

      <div class="option" data-moment="release" data-duration="12">
        <div class="option-name">release the day</div>
        <div class="option-desc">three spoken prompts, long silences. nothing to answer.</div>
      </div>

      <div class="option" data-moment="evening" data-duration="45">
        <div class="option-name">let me drift</div>
        <div class="option-desc">ambient soundscape, fades to silence over 45 minutes.</div>
      </div>
    </div>

    <div class="session" id="session" aria-hidden="true">
      <button class="close-dot" id="close-dot" aria-label="End session">×</button>
      <div class="session-content">
        <div class="session-moment" id="session-moment"></div>
        <div class="session-prompt" id="session-prompt"></div>
        <div class="session-timer" id="session-timer"></div>
      </div>
    </div>

    <script type="module">
      const chooser = document.getElementById('chooser');
      const session = document.getElementById('session');
      const closeDot = document.getElementById('close-dot');
      const sessionMoment = document.getElementById('session-moment');
      const sessionPrompt = document.getElementById('session-prompt');
      const sessionTimer = document.getElementById('session-timer');

      const RELEASE_PROMPTS = [
        { at:  0,   text: 'what are you carrying?' },
        { at: 180,  text: 'where did you meet yourself today?' },
        { at: 420,  text: 'what can rest now?' },
      ];

      const STILLNESS_PROMPTS = [
        { at: 0,   text: 'arrive where you are.' },
        { at: 60,  text: '' },  // silence
      ];

      const DRIFT_PROMPTS = [
        { at: 0, text: '' },  // no text, only ambient
      ];

      let sessionStart = 0;
      let tickTimer = null;

      function startSession(moment, durationMin) {
        chooser.classList.add('hidden');
        session.classList.add('visible');
        setTimeout(() => session.classList.add('dimming'), 100); // triggers the 4min bg transition

        sessionMoment.textContent = moment;
        sessionStart = Date.now();

        const prompts = moment === 'release' ? RELEASE_PROMPTS
                       : moment === 'stillness' ? STILLNESS_PROMPTS
                       : DRIFT_PROMPTS;

        // Show prompts at their scheduled seconds.
        prompts.forEach(p => {
          setTimeout(() => fade(sessionPrompt, p.text), p.at * 1000);
        });

        // TODO: begin playback of a moment-tagged resource via @mediagrid/capacitor-native-audio
        // TODO: arm keep-alive + wake alarm via FrqncyAlarm plugin
        // TODO: volume curve — 100% → 40% by minute 22, silence by minute 45

        tickTimer = setInterval(() => {
          const elapsed = Math.floor((Date.now() - sessionStart) / 1000);
          const remainingMin = Math.max(0, durationMin - Math.floor(elapsed / 60));
          sessionTimer.textContent = remainingMin > 0
            ? `${remainingMin} min · fade to silence`
            : 'resting';
          if (remainingMin === 0 && elapsed > durationMin * 60 + 30) endSession();
        }, 10000);
      }

      function fade(el, text) {
        el.style.transition = 'opacity 1400ms ease';
        el.style.opacity = '0';
        setTimeout(() => {
          el.textContent = text;
          el.style.opacity = '1';
        }, 1400);
      }

      function endSession() {
        clearInterval(tickTimer);
        session.classList.remove('visible');
        setTimeout(() => {
          chooser.classList.remove('hidden');
          window.location.href = '../index.html';
        }, 1200);
      }

      document.querySelectorAll('.option').forEach(btn => {
        btn.addEventListener('click', () => {
          const moment = btn.dataset.moment;
          const duration = parseInt(btn.dataset.duration, 10);
          startSession(moment, duration);
        });
      });

      closeDot.addEventListener('click', endSession);
    </script>
  </body>
</html>
