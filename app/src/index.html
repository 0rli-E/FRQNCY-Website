<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1C3D" />
    <title>FRQNCY</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0B1C3D;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      /* Shared stage for native surfaces (home, explore) and the iframe shell
         used by local /app/* routes. Only one is visible at a time. Surfaces
         fade between states; the hidden state takes itself out of the layout
         and tab order via visibility/pointer-events. */
      .surface {
        position: fixed;
        top: env(safe-area-inset-top);
        right: 0;
        bottom: calc(60px + env(safe-area-inset-bottom));
        left: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 200ms ease, visibility 0s linear 200ms;
      }
      .surface.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 200ms ease;
      }

      #site-frame {
        position: fixed;
        top: env(safe-area-inset-top);
        right: 0;
        left: 0;
        width: 100%;
        /* Iframes don't auto-stretch via top+bottom like divs do — explicit
           height calc is required or they collapse to the HTML default 150px. */
        height: calc(100vh - 60px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border: 0;
        background: #0B1C3D;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 200ms ease, visibility 0s linear 200ms;
      }
      #site-frame.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition: opacity 200ms ease;
      }

      #tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(60px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(11, 28, 61, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 10;
      }
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: 0;
        color: rgba(245, 245, 245, 0.55);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.3px;
        height: 60px;
        cursor: pointer;
        transition: color 180ms ease;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
      }
      .tab.active { color: #C4973A; }
      .tab:focus-visible {
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: -4px;
        color: #C4973A;
      }
      .tab-icon { font-size: 20px; line-height: 1; }
      .cta-stack button:focus-visible, .cta-stack a:focus-visible,
      .home-card:focus-visible {
        outline: 2px solid rgba(196, 151, 58, 0.9);
        outline-offset: 3px;
      }
      #offline-banner {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        padding: 10px 16px;
        background: rgba(196, 151, 58, 0.12);
        color: #C4973A;
        font-size: 13px;
        text-align: center;
        transform: translateY(-100%);
        opacity: 0;
        pointer-events: none;
        transition: transform 240ms ease, opacity 240ms ease;
        z-index: 20;
      }
      #offline-banner.show {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      /* Iframe loading bar — slim gold progress strip that appears the moment
         a frqncy.network page begins loading and fades on load. The
         indeterminate animation runs while loading, then a 240ms fade-out
         clears it once the iframe load event fires. */
      #loading-bar {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        height: 2px;
        background: transparent;
        z-index: 30;
        opacity: 0;
        transition: opacity 240ms ease;
        pointer-events: none;
      }
      #loading-bar.loading { opacity: 1; }
      #loading-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, #C4973A, transparent);
        transform: translateX(-100%);
        animation: loading-slide 800ms ease-in-out infinite;
      }
      @keyframes loading-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #loading-bar::before { animation: none; background: #C4973A; transform: none; }
      }

      /* --- Native home surface ------------------------------------------- */
      .home-wrap {
        padding: 48px 24px 32px;
        max-width: 480px;
        margin: 0 auto;
        text-align: center;
      }
      .brand-mark {
        width: 88px; height: 88px;
        border-radius: 50%;
        border: 1px solid rgba(196, 151, 58, 0.6);
        margin: 0 auto 28px;
        position: relative;
        animation: brand-breathe 6s ease-in-out infinite;
      }
      .brand-mark::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 0.5px solid rgba(196, 151, 58, 0.18);
        animation: brand-halo 6s ease-in-out infinite;
      }
      .brand-mark::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 20%; right: 20%;
        height: 1px;
        background: rgba(196, 151, 58, 0.85);
        transform: translateY(-0.5px);
      }
      @keyframes brand-breathe {
        0%, 100% { opacity: 0.85; }
        50%      { opacity: 1; }
      }
      @keyframes brand-halo {
        0%, 100% { transform: scale(1);    opacity: 0.6; }
        50%      { transform: scale(1.06); opacity: 1;   }
      }
      @media (prefers-reduced-motion: reduce) {
        .brand-mark, .brand-mark::before { animation: none; }
      }
      .home-title {
        font-size: 22px;
        font-weight: 200;
        letter-spacing: 0.4px;
        line-height: 1.4;
        margin-bottom: 14px;
      }
      .home-lede {
        font-size: 14.5px;
        font-weight: 300;
        line-height: 1.65;
        color: rgba(245, 245, 245, 0.72);
        max-width: 340px;
        margin: 0 auto 32px;
      }
      .cta-stack {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 340px;
        margin: 0 auto;
      }
      .cta-stack button, .cta-stack a {
        background: rgba(196, 151, 58, 0.95);
        border: none;
        color: #0B1C3D;
        padding: 14px;
        border-radius: 14px;
        font-size: 14px;
        letter-spacing: 0.8px;
        text-transform: lowercase;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        text-decoration: none;
        text-align: center;
        cursor: pointer;
        transition: transform 140ms ease, background 180ms ease;
      }
      .cta-stack button:active, .cta-stack a:active { transform: scale(0.985); }
      .cta-stack .secondary {
        background: none;
        border: 1px solid rgba(245, 245, 245, 0.16);
        color: rgba(245, 245, 245, 0.78);
      }
      .cta-stack .secondary:active {
        background: rgba(196, 151, 58, 0.08);
        border-color: rgba(196, 151, 58, 0.45);
        color: rgba(196, 151, 58, 0.95);
      }

      .home-cards {
        margin-top: 36px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 380px;
        margin-left: auto;
        margin-right: auto;
      }
      .home-card {
        text-align: left;
        padding: 16px 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 14px;
        cursor: pointer;
        transition: background 180ms ease, border-color 180ms ease, transform 140ms ease;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
        width: 100%;
      }
      .home-card:hover {
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(196, 151, 58, 0.35);
      }
      .home-card:active {
        background: rgba(196, 151, 58, 0.08);
        border-color: rgba(196, 151, 58, 0.45);
        transform: scale(0.985);
      }
      .home-card .home-card-eyebrow {
        font-size: 10.5px;
        letter-spacing: 1.8px;
        color: rgba(196, 151, 58, 0.85);
        text-transform: lowercase;
        margin-bottom: 6px;
      }
      .home-card .home-card-title {
        font-size: 15px;
        font-weight: 400;
        color: rgba(245, 245, 245, 0.92);
        margin-bottom: 4px;
      }
      .home-card .home-card-desc {
        font-size: 12.5px;
        font-weight: 300;
        line-height: 1.5;
        color: rgba(245, 245, 245, 0.55);
      }

      /* --- Native explore surface ---------------------------------------- */
      .explore-wrap {
        padding: 48px 24px 32px;
        max-width: 520px;
        margin: 0 auto;
      }
      .explore-eyebrow {
        font-size: 11px;
        letter-spacing: 2.4px;
        color: rgba(245, 245, 245, 0.42);
        text-transform: lowercase;
        margin-bottom: 12px;
        text-align: center;
      }
      .explore-title {
        font-size: 22px;
        font-weight: 200;
        letter-spacing: 0.4px;
        line-height: 1.4;
        margin-bottom: 14px;
        text-align: center;
      }
      .explore-lede {
        font-size: 14px;
        font-weight: 300;
        line-height: 1.65;
        color: rgba(245, 245, 245, 0.68);
        text-align: center;
        margin-bottom: 32px;
      }
      .section-label {
        font-size: 11px;
        letter-spacing: 2.4px;
        text-transform: lowercase;
        color: rgba(196, 151, 58, 0.7);
        margin-top: 32px;
        margin-bottom: 6px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      }
      .section-label:first-of-type { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="offline-banner">Offline — showing cached content</div>
    <div id="loading-bar" aria-hidden="true"></div>

    <!-- Native home surface -->
    <main id="home-screen" class="surface" role="region" aria-label="Home" data-tab-context="/">
      <div class="home-wrap">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1 class="home-title">welcome to FRQNCY</h1>
        <p class="home-lede">
          a network of people building their dream life. start with how you wake.
        </p>
        <div class="cta-stack">
          <button data-route="/app/bedside.html">set up my wake-up</button>
        </div>

        <div class="home-cards">
          <button class="home-card" data-route="/app/bedside.html">
            <div class="home-card-eyebrow">tonight</div>
            <div class="home-card-title">tomorrow's wake</div>
            <div class="home-card-desc">set a time. the alarm fades in over 90 seconds. dismissing is one breath, held.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/my-frqncy/dashboard/">
            <div class="home-card-eyebrow">sanctuary</div>
            <div class="home-card-title">your private dashboard</div>
            <div class="home-card-desc">practice log, mood charts, daily path. local-first, only visible to you.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/social/">
            <div class="home-card-eyebrow">nrg</div>
            <div class="home-card-title">the social layer</div>
            <div class="home-card-desc">posts, replies, federated bluesky timeline. no rankings, no streaks.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/explore.html">
            <div class="home-card-eyebrow">explore</div>
            <div class="home-card-title">the topic graph</div>
            <div class="home-card-desc">146 topics across consciousness, money, wellbeing, decentralisation, and more.</div>
          </button>
        </div>
      </div>
    </main>

    <!-- Native explore surface -->
    <main id="explore-screen" class="surface" role="region" aria-label="Explore" data-tab-context="/explore">
      <div class="explore-wrap">
        <div class="explore-eyebrow">browse</div>
        <h1 class="explore-title">the FRQNCY network.</h1>
        <p class="explore-lede">
          everything FRQNCY publishes — the library, the people, the sanctuary, the social layer.
        </p>

        <div class="section-label">your space</div>
        <div class="home-cards" style="margin-top: 8px;">
          <button class="home-card" data-external="https://frqncy.network/my-frqncy/dashboard/">
            <div class="home-card-eyebrow">sanctuary</div>
            <div class="home-card-title">your private dashboard</div>
            <div class="home-card-desc">practice log, mood charts, your daily path. local-first, only visible to you.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/my-frqncy">
            <div class="home-card-eyebrow">my frqncy</div>
            <div class="home-card-title">birth data + your design</div>
            <div class="home-card-desc">human design chart, gates, alignment with FRQNCY's topic graph.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/membership/">
            <div class="home-card-eyebrow">membership</div>
            <div class="home-card-title">network access</div>
            <div class="home-card-desc">support FRQNCY, unlock the deeper layers, your referral code.</div>
          </button>
        </div>

        <div class="section-label">the network</div>
        <div class="home-cards" style="margin-top: 8px;">
          <button class="home-card" data-external="https://frqncy.network/social/">
            <div class="home-card-eyebrow">nrg</div>
            <div class="home-card-title">the social layer</div>
            <div class="home-card-desc">FRQNCY's federated social network. posts, replies, bluesky timeline. no leaderboards.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/explore.html">
            <div class="home-card-eyebrow">topic graph</div>
            <div class="home-card-title">all 146 topics</div>
            <div class="home-card-desc">the FRQNCY constellation — every topic, every domain, every pillar.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/watch/">
            <div class="home-card-eyebrow">watch</div>
            <div class="home-card-title">video + audio library</div>
            <div class="home-card-desc">curated talks, films, conversations across the FRQNCY field.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/courses/">
            <div class="home-card-eyebrow">courses</div>
            <div class="home-card-title">learn deeper</div>
            <div class="home-card-desc">structured paths through the canon. multi-week, self-paced.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/music/">
            <div class="home-card-eyebrow">music</div>
            <div class="home-card-title">frequency-aligned listening</div>
            <div class="home-card-desc">432Hz, perfect-fifth, sound-bath. for sleep, focus, presence.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/aligned/">
            <div class="home-card-eyebrow">aligned goods</div>
            <div class="home-card-title">the best of everything, curated</div>
            <div class="home-card-desc">tools, books, gear, supplements — what's actually worth using.</div>
          </button>
          <button class="home-card" data-external="https://frqncy.network/people/">
            <div class="home-card-eyebrow">people</div>
            <div class="home-card-title">the FRQNCY field</div>
            <div class="home-card-desc">teachers, builders, founders — who actually moved the needle.</div>
          </button>
        </div>
      </div>
    </main>

    <!-- Iframe shell — used ONLY for local /app/* routes (same-origin, no CSP). -->
    <iframe
      id="site-frame"
      src="about:blank"
      allow="autoplay; fullscreen; picture-in-picture; camera; microphone"
      allowfullscreen
    ></iframe>

    <nav id="tab-bar" role="tablist">
      <button class="tab active" data-route="/" role="tab" aria-label="Home">
        <span class="tab-icon" aria-hidden="true">◎</span>
        <span>home</span>
      </button>
      <button class="tab" data-route="/explore" role="tab" aria-label="Explore">
        <span class="tab-icon" aria-hidden="true">◈</span>
        <span>explore</span>
      </button>
      <button class="tab" data-route="/app/bedside.html" role="tab" aria-label="Bedside">
        <span class="tab-icon" aria-hidden="true">☾</span>
        <span>bedside</span>
      </button>
      <button class="tab" data-route="/app/settings.html" role="tab" aria-label="You">
        <span class="tab-icon" aria-hidden="true">◇</span>
        <span>you</span>
      </button>
    </nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
