<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>FRQNCY</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #site-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #0a0a0a;
      }
      /* Safe areas for notch / home indicator */
      #site-frame {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(60px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(10, 10, 10, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 10;
      }
      #site-frame { bottom: calc(60px + env(safe-area-inset-bottom)); }
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: 0;
        color: rgba(245, 245, 245, 0.55);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.3px;
        height: 60px;
        cursor: pointer;
        transition: color 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tab.active { color: #e8c547; }
      .tab-icon { font-size: 20px; line-height: 1; }
      #offline-banner {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        padding: 10px 16px;
        background: rgba(232, 197, 71, 0.12);
        color: #e8c547;
        font-size: 13px;
        text-align: center;
        transform: translateY(-100%);
        transition: transform 240ms ease;
        z-index: 20;
      }
      #offline-banner.show { transform: translateY(0); }

      /* First-launch welcome on the home tab */
      #home-welcome {
        position: fixed;
        inset: 0;
        background: #0a0a0a;
        z-index: 100;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
        text-align: center;
      }
      #home-welcome.visible { display: flex; }
      #home-welcome .mark {
        width: 96px; height: 96px;
        border-radius: 50%;
        border: 1px solid rgba(232, 197, 71, 0.6);
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      #home-welcome .mark::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 50%;
        border: 0.5px solid rgba(232, 197, 71, 0.18);
      }
      #home-welcome .mark::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 20%; right: 20%;
        height: 1px;
        background: rgba(232, 197, 71, 0.85);
        transform: translateY(-0.5px);
      }
      #home-welcome h1 {
        font-size: 22px;
        font-weight: 200;
        letter-spacing: 0.4px;
        line-height: 1.4;
        max-width: 320px;
        margin-bottom: 18px;
      }
      #home-welcome p {
        font-size: 14.5px;
        font-weight: 300;
        line-height: 1.6;
        color: rgba(245, 245, 245, 0.7);
        max-width: 320px;
        margin-bottom: 32px;
      }
      #home-welcome .cta-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 320px;
      }
      #home-welcome button {
        background: rgba(232, 197, 71, 0.95);
        border: none;
        color: #0a0a0a;
        padding: 14px;
        border-radius: 14px;
        font-size: 14px;
        letter-spacing: 0.8px;
        text-transform: lowercase;
        -webkit-tap-highlight-color: transparent;
        font-family: inherit;
      }
      #home-welcome button.secondary {
        background: none;
        border: 1px solid rgba(245, 245, 245, 0.16);
        color: rgba(245, 245, 245, 0.7);
      }
    </style>
  </head>
  <body>
    <!-- First-launch welcome on the home tab -->
    <div id="home-welcome" role="dialog" aria-modal="true" aria-labelledby="home-welcome-title">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="home-welcome-title">welcome to FRQNCY</h1>
      <p>
        a network of people building their dream life. start with how you wake.
      </p>
      <div class="cta-row">
        <button id="home-welcome-bedside">set up my wake-up</button>
        <button class="secondary" id="home-welcome-explore">just explore for now</button>
      </div>
    </div>

    <div id="offline-banner">Offline — showing cached content</div>
    <iframe
      id="site-frame"
      src="about:blank"
      allow="autoplay; fullscreen; picture-in-picture; camera; microphone"
      allowfullscreen
    ></iframe>
    <nav id="tab-bar" role="tablist">
      <button class="tab active" data-route="/" role="tab">
        <span class="tab-icon">◎</span>
        <span>Home</span>
      </button>
      <button class="tab" data-route="/v2/explore.html" role="tab">
        <span class="tab-icon">◈</span>
        <span>Explore</span>
      </button>
      <button class="tab" data-route="/app/bedside.html" role="tab">
        <span class="tab-icon">☾</span>
        <span>Bedside</span>
      </button>
      <button class="tab" data-route="/app/settings.html" role="tab">
        <span class="tab-icon">◇</span>
        <span>You</span>
      </button>
    </nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
