<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>FRQNCY</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }
      #site-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #0a0a0a;
      }
      /* Safe areas for notch / home indicator */
      #site-frame {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #tab-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: calc(60px + env(safe-area-inset-bottom));
        padding-bottom: env(safe-area-inset-bottom);
        background: rgba(10, 10, 10, 0.92);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 0.5px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-around;
        z-index: 10;
      }
      #site-frame { bottom: calc(60px + env(safe-area-inset-bottom)); }
      .tab {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        background: none;
        border: 0;
        color: rgba(245, 245, 245, 0.55);
        font-size: 10.5px;
        font-weight: 500;
        letter-spacing: 0.3px;
        height: 60px;
        cursor: pointer;
        transition: color 180ms ease;
        -webkit-tap-highlight-color: transparent;
      }
      .tab.active { color: #e8c547; }
      .tab-icon { font-size: 20px; line-height: 1; }
      #offline-banner {
        position: fixed;
        top: env(safe-area-inset-top);
        left: 0;
        right: 0;
        padding: 10px 16px;
        background: rgba(232, 197, 71, 0.12);
        color: #e8c547;
        font-size: 13px;
        text-align: center;
        transform: translateY(-100%);
        transition: transform 240ms ease;
        z-index: 20;
      }
      #offline-banner.show { transform: translateY(0); }
    </style>
  </head>
  <body>
    <div id="offline-banner">Offline — showing cached content</div>
    <iframe
      id="site-frame"
      src="about:blank"
      allow="autoplay; fullscreen; picture-in-picture; camera; microphone"
      allowfullscreen
    ></iframe>
    <nav id="tab-bar" role="tablist">
      <button class="tab active" data-route="/" role="tab">
        <span class="tab-icon">◎</span>
        <span>Home</span>
      </button>
      <button class="tab" data-route="/v2/explore.html" role="tab">
        <span class="tab-icon">◈</span>
        <span>Explore</span>
      </button>
      <button class="tab" data-route="/app/bedside.html" role="tab">
        <span class="tab-icon">☾</span>
        <span>Bedside</span>
      </button>
      <button class="tab" data-route="/app/settings.html" role="tab">
        <span class="tab-icon">◇</span>
        <span>You</span>
      </button>
    </nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
